# Schéma du service library (schéma SQL « library »), appliqué par Liquibase
# avec le rôle library_owner.
# Un fichier par changement, jamais modifié une fois fusionné : on en ajoute un nouveau.
databaseChangeLog:
  - include: { file: changes/0001-backgrounds.sql, relativeToChangelogFile: true }
  - include: { file: changes/0002-background-kind.sql, relativeToChangelogFile: true }
  # Toujours en dernier : protège le journal de Liquibase contre le rôle du service
  - include: { file: changes/9999-liquibase-journal.sql, relativeToChangelogFile: true }
