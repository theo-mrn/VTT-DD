# Schéma du service character (schéma SQL « characters », CHARACTER étant un mot
# réservé), appliqué par Liquibase avec le rôle characters_owner.
# Un fichier par changement, jamais modifié une fois fusionné : on en ajoute un nouveau.
databaseChangeLog:
  - include: { file: changes/0001-personnages.sql, relativeToChangelogFile: true }
  - include: { file: changes/0002-outbox.sql, relativeToChangelogFile: true }
  - include: { file: changes/0003-templates.sql, relativeToChangelogFile: true }
  # Concept, apparence et histoire d'un personnage
  - include: { file: changes/0004-character-details.sql, relativeToChangelogFile: true }
  # Tirage de création en attente de répartition (attribution libre)
  - include: { file: changes/0005-pending-roll.sql, relativeToChangelogFile: true }
  # Joueur ou PNJ ; « mes personnages » ne liste que les joueurs
  - include: { file: changes/0006-character-kind.sql, relativeToChangelogFile: true }
  # Mise en page de la fiche (blocs et positions), NULL : disposition par défaut
  - include: { file: changes/0007-character-sheet-layout.sql, relativeToChangelogFile: true }
  # Toujours en dernier : protège le journal de Liquibase contre le rôle du service
  - include: { file: changes/9999-droits.sql, relativeToChangelogFile: true }
