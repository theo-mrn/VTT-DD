# Schéma du service campaign (schéma SQL « campaign »), appliqué par Liquibase
# avec le rôle campaign_owner.
# Un fichier par changement, jamais modifié une fois fusionné : on en ajoute un nouveau.
databaseChangeLog:
  - include: { file: changes/0001-salles.sql, relativeToChangelogFile: true }
  - include: { file: changes/0002-combat.sql, relativeToChangelogFile: true }
  - include: { file: changes/0003-outbox.sql, relativeToChangelogFile: true }
  - include: { file: changes/0004-parite-salles.sql, relativeToChangelogFile: true }
  # Les salles deviennent des campagnes, schéma entièrement en anglais
  - include: { file: changes/0005-campaigns.sql, relativeToChangelogFile: true }
  # Plus de limite de joueurs par campagne
  - include: { file: changes/0006-drop-max-players.sql, relativeToChangelogFile: true }
  # Carte : scènes et couches en PostGIS (docs/map.md)
  - include: { file: changes/0008-maps.sql, relativeToChangelogFile: true }
  # Toujours en dernier : protège le journal de Liquibase contre le rôle du service
  - include: { file: changes/9999-droits.sql, relativeToChangelogFile: true }
