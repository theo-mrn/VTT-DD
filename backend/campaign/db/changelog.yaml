  - include: { file: changes/0005-campaigns.sql, relativeToChangelogFile: true }
  # Plus de limite de joueurs par campagne
  - include: { file: changes/0006-drop-max-players.sql, relativeToChangelogFile: true }
  # Carte : scènes et couches en PostGIS (docs/map.md)
  - include: { file: changes/0008-maps.sql, relativeToChangelogFile: true }
  # Notes privées et partagées (docs/api-notes.md)
  - include: { file: changes/0009-notes.sql, relativeToChangelogFile: true }
  # Présentation : accroche, couleur d'accent et genres
  - include: { file: changes/0010-campaign-presentation.sql, relativeToChangelogFile: true }
  # Invitations nominatives (un ami invité rejoint sans code)
