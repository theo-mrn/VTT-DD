# Schéma du service marketplace (schéma SQL « marketplace »), appliqué par Liquibase
# avec le rôle marketplace_owner. Conception : docs/marketplace.md § 3.3.
# Un fichier par changement, jamais modifié une fois fusionné : on en ajoute un nouveau.
databaseChangeLog:
  - include: { file: changes/0001-catalog.sql, relativeToChangelogFile: true }
  - include: { file: changes/0002-community.sql, relativeToChangelogFile: true }
  - include: { file: changes/0003-outbox.sql, relativeToChangelogFile: true }
  # Toujours en dernier : protège le journal de Liquibase contre le rôle du service
  - include: { file: changes/9999-liquibase-journal.sql, relativeToChangelogFile: true }
