# Schéma du service dice (schéma SQL « dice »), appliqué par Liquibase
# avec le rôle dice_owner.
# Un fichier par changement, jamais modifié une fois fusionné : on en ajoute un nouveau.
databaseChangeLog:
  - include: { file: changes/0001-rolls.sql, relativeToChangelogFile: true }
  - include: { file: changes/0002-preferences.sql, relativeToChangelogFile: true }
  - include: { file: changes/0003-outbox.sql, relativeToChangelogFile: true }
  - include: { file: changes/0004-all-skins.sql, relativeToChangelogFile: true }
  - include: { file: changes/0005-physical-rolls.sql, relativeToChangelogFile: true }
  - include: { file: changes/0006-personal-rolls.sql, relativeToChangelogFile: true }
  - include: { file: changes/0007-billing-rights.sql, relativeToChangelogFile: true }
  # Toujours en dernier : protège le journal de Liquibase contre le rôle du service
  - include: { file: changes/9999-liquibase-journal.sql, relativeToChangelogFile: true }
