# Schéma du service archive (schéma SQL « archive »), appliqué par Liquibase avec le rôle
# archive_owner. Conception : docs/export-campagne.md § 5.
# Un fichier par changement, jamais modifié une fois fusionné : on en ajoute un nouveau.
databaseChangeLog:
  - include: { file: changes/0001-jobs.sql, relativeToChangelogFile: true }
  - include: { file: changes/0002-outbox.sql, relativeToChangelogFile: true }
  # Toujours en dernier : protège le journal de Liquibase contre le rôle du service
  - include: { file: changes/9999-liquibase-journal.sql, relativeToChangelogFile: true }
