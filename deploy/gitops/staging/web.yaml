image:
  repository: ghcr.io/theo-mrn/vtt-web
  digest: ''
  tag: 'main'
replicaCount: 2
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 768Mi }
env:
  NODE_ENV: production
envFromSecrets:
  - name: web-secrets # SOPS : clés Firebase/Stripe/Resend tant que la migration n'est pas finie
probes:
  liveness: /api/healthz
  readiness: /api/healthz
writablePaths:
  - /app/apps/web/.next/cache
ingress:
  enabled: true
  host: staging.yner.fr
