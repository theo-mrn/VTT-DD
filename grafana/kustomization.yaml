# Tableaux de bord chargés automatiquement par Grafana (sidecar du chart kube-prometheus-stack :
# toute ConfigMap étiquetée grafana_dashboard=1, dossier donné par l'annotation grafana_folder).
# Déployé par l'application Argo vtt-observability (infra/argocd/observability.yaml).
namespace: vtt-staging
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: VTT
configMapGenerator:
  # Une ConfigMap par tableau de bord : le tableau officiel de CloudNativePG pèse près de 250 Ko
  - name: vtt-grafana-dashboard-logs
    files:
      - vtt-logs.json
  - name: vtt-grafana-dashboard-postgres
    files:
      - vtt-postgres.json
