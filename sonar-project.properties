# Analyse SonarQube de la CI (job « sonar » de .github/workflows/ci.yml) : sources des services,
# des paquets partagés et du front. L'ancienne app (legacy/) et les outils (tools/) ne sont pas
# analysés.
sonar.projectKey=vtt
sonar.projectName=Yner
sonar.sourceEncoding=UTF-8

sonar.sources=backend,packages,frontend/src
sonar.tests=backend,packages,frontend/src,frontend/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,frontend/e2e/**,**/src/test/**,**/src/testing/**
sonar.exclusions=legacy/**,tools/**,**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,\
  backend/*/db/**,backend/*/scripts/**,packages/systemes/systemes/**
# Pas de couverture attendue : points d'entrée, câblage de l'observabilité, scripts et CLI
# d'import de l'ancienne app (exécutés une fois, vérifiés à la main)
sonar.coverage.exclusions=**/src/main.ts,**/src/worker.ts,**/src/instrumentation.ts,\
  **/src/import/**/cli.ts,frontend/src/app/**/layout.tsx
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,frontend/e2e/**

# Couverture lcov de vitest, une par paquet (chemins ramenés à la racine par la CI)
sonar.javascript.lcov.reportPaths=\
  backend/audio/coverage/lcov.info,\
  backend/billing/coverage/lcov.info,\
  backend/campaign/coverage/lcov.info,\
  backend/character/coverage/lcov.info,\
  backend/dice/coverage/lcov.info,\
  backend/gateway/coverage/lcov.info,\
  backend/history/coverage/lcov.info,\
  backend/identity/coverage/lcov.info,\
  backend/platform/coverage/lcov.info,\
  backend/realtime/coverage/lcov.info,\
  packages/contracts/coverage/lcov.info,\
  packages/rules/coverage/lcov.info,\
  packages/systemes/coverage/lcov.info,\
  packages/vision/coverage/lcov.info,\
  frontend/coverage/lcov.info

# Exceptions justifiées, règle par règle (ces cas ne relèvent pas de la sécurité) :
#  e1-e4 Math.random sans enjeu : animations et sons des dés, face affichée d'un dé qui roule,
#        émoji tiré au hasard, gigue des expirations du cache (le tirage d'un jet n'en dépend pas)
#  e5    SHA-1 des imports : dérive des identifiants déterministes depuis les clés de l'ancienne
#        app (comme un UUID v5, qui repose sur SHA-1 par définition), rien de secret
#  e6    URL SMTP : elle vient de la configuration (smtps:// ou STARTTLS en production)
# Conventions du projet que des règles contredisent :
#  e7    `void promesse` marque une promesse volontairement non attendue (au lieu de la laisser
#        flotter sans le dire)
#  e8    propriétés three.js dans le JSX de React Three Fiber (onBeforeCompile…), attribut cmdk
#  e9    `Db | Tx` : Tx est dérivé de Db['transaction'] ; tsc le résout, l'analyseur de Sonar le
#        voit comme never
#  e10   plages d'adresses privées listées exprès : c'est la protection contre la SSRF
#  e11   nom du paramètre d'un catch : les noms français (erreur, echec) sont la règle ici
#  e13-15 arguments dans un autre ordre que les paramètres, exprès : orientation de segments
#        (intersection), opération inverse d'une annulation, ordre du tas de balayage
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=frontend/src/components/dice/three/**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=frontend/src/components/des/de-visuel.tsx
