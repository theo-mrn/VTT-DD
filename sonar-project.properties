sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.e5.resourceKey=backend/*/src/import/**/*
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S5332
