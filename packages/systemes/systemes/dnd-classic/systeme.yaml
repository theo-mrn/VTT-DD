# D&D classique : port en données du module legacy `dnd-classic`
# (legacy/src/modules/builtin/dnd-classic) et des règles codées en dur dans
# l'ancienne interface (création, montée de niveau, voies, combat, initiative).
format: 1
id: dnd-classic
version: 1.0.0
nom: D&D classique
description: >-
  Système par défaut du VTT : six caractéristiques (FOR, DEX, CON, SAG, INT, CHA)
  à modificateur floor((valeur − 10) / 2), Défense, attaques au Contact, à Distance
  et Magiques, points de vie tirés au dé de vie du profil, voies de capacités à
  5 rangs achetées avec 2 points par niveau.

# Modificateur commun des caractéristiques
modificateur: floor((valeur - 10) / 2)

entites:
  - id: personnage
    nom: Personnage
    groupes:
      - { id: caracteristiques, nom: Caractéristiques }
      - { id: combat, nom: Combat }
      - { id: vitalite, nom: Vitalité }
      - { id: progression, nom: Progression }
      - { id: equipement, nom: Équipement }
    attributs:
      # ─── Caractéristiques (tirées à 3d6, bonus raciaux en effets de la race) ───
      - {
          cle: FOR,
          nom: Force,
          abrege: FOR,
          nature: base,
          defaut: 10,
          min: 1,
          modificateur: true,
          groupe: caracteristiques,
        }
      - {
          cle: DEX,
          nom: Dextérité,
          abrege: DEX,
          nature: base,
          defaut: 10,
          min: 1,
          modificateur: true,
          groupe: caracteristiques,
        }
      - {
          cle: CON,
          nom: Constitution,
          abrege: CON,
          nature: base,
          defaut: 10,
          min: 1,
          modificateur: true,
          groupe: caracteristiques,
        }
      - {
          cle: SAG,
          nom: Sagesse,
          abrege: SAG,
          nature: base,
          defaut: 10,
          min: 1,
          modificateur: true,
          groupe: caracteristiques,
        }
      - {
          cle: INT,
          nom: Intelligence,
          abrege: INT,
          nature: base,
          defaut: 10,
          min: 1,
          modificateur: true,
          groupe: caracteristiques,
        }
      - {
          cle: CHA,
          nom: Charisme,
          abrege: CHA,
          nature: base,
          defaut: 10,
          min: 1,
          modificateur: true,
          groupe: caracteristiques,
        }

      # ─── Progression ───
      - cle: niveau
        nom: Niveau
        nature: base
        defaut: 1
        min: 1
        groupe: progression
      - cle: deVie
        nom: Dé de vie
        description: Nombre de faces du dé de vie du profil (d8 sans profil).
        nature: derivee
        formule: 'si(compte("profil") > 0, somme("profil", "deVie"), 8)'
        groupe: progression
      - cle: jetsDeVie
        nom: Jets de dés de vie
        description: >-
          Somme des dés de vie tirés : un à la création, puis un à chaque passage de niveau.
        nature: base
        defaut: 0
        min: 0
        groupe: progression

      # ─── Combat ───
      - cle: Defense
        nom: Défense
        abrege: DEF
        nature: derivee
        formule: 10 + mod(@DEX)
        groupe: combat
      - cle: Contact
        nom: Contact
        abrege: Ctt
        description: Attaque au corps à corps (1 de base + mod. FOR + niveau − 1).
        nature: derivee
        formule: mod(@FOR) + @niveau
        groupe: combat
      - cle: Distance
        nom: Distance
        abrege: Dst
        description: Attaque à distance (1 de base + mod. DEX + niveau − 1).
        nature: derivee
        formule: mod(@DEX) + @niveau
        groupe: combat
      - cle: Magie
        nom: Magie
        abrege: Mag
        description: Attaque magique, avec la meilleure des caractéristiques mentales (INT, SAG ou CHA).
        nature: derivee
        formule: max(mod(@INT), mod(@SAG), mod(@CHA)) + @niveau
        groupe: combat
      - cle: INIT
        nom: Initiative
        abrege: INIT
        description: Valeur brute de DEX (sans modificateur), ajoutée au d20 d'initiative.
        nature: derivee
        formule: '@DEX'
        groupe: combat
      - cle: Critique
        nom: Critique
        abrege: Crit
        description: >-
          Résultat naturel du d20 à partir duquel une attaque d'arme est un coup
          critique (19 avec Science du critique ou un écuyer).
        nature: derivee
        formule: 20
        groupe: combat
      - cle: RD
        nom: Réduction des DM
        abrege: RD
        description: >-
          Retranchée des dégâts de chaque attaque subie (au moins 1 DM par attaque
          qui touche). Les réductions de plusieurs capacités se cumulent.
        nature: derivee
        formule: 0
        groupe: combat

      # ─── Vitalité ───
      - cle: PV_Max
        nom: PV max
        description: >-
          1 + mod. CON + dé de vie à la création, puis dé de vie + mod. CON à chaque niveau.
        nature: derivee
        formule: 1 + @niveau * mod(@CON) + @jetsDeVie
        groupe: vitalite
      - cle: PV
        nom: Points de vie
        abrege: PV
        nature: ressource
        max: '@PV_Max'
        min: 0
        initiale: max
        recuperation: max
        groupe: vitalite

      # ─── Équipement ───
      - cle: bourse
        nom: Pièces reçues (pa)
        description: >-
          Total des pièces d'argent reçues depuis la création. Les achats
          d'équipement sont décomptés au journal : le reste est la monnaie « pa ».
        nature: base
        defaut: 0
        min: 0
        groupe: equipement

sortes:
  - id: race
    nom: Race
    pour: [personnage]
    maximum: 1
    champs:
      - { id: voie, nom: Voie raciale, type: entree, sorte: voie }
      - { id: tailleMoyenne, nom: Taille moyenne (cm), type: nombre }
      - { id: poidsMoyen, nom: Poids moyen (kg), type: nombre }
  - id: profil
    nom: Profil
    pour: [personnage]
    maximum: 1
    champs:
      - { id: deVie, nom: Dé de vie (faces), type: nombre }
      - { id: voies, nom: Voies du profil, type: entrees, sorte: voie }
  - id: voie
    nom: Voie
    description: >-
      Cinq capacités, une par rang : chaque voie accorde sa capacité de rang N
      dès qu'elle atteint le rang N.
    pour: [personnage]
    rangs: { max: 5 }
  - id: capacite
    nom: Capacité
    description: >-
      Capacité d'une voie ou capacité raciale, accordée par un rang gratuit.
      Les capacités chiffrées portent leurs effets ; les capacités actives
      ouvrent une action (condition « possede »).
    pour: [personnage]
    rangs: { max: 1 }
    champs:
      - { id: voie, nom: Voie, type: entree, sorte: voie }
      - { id: rangVoie, nom: Rang dans la voie, type: nombre }
      - { id: activation, nom: Activation, type: texte }
  - id: arme
    nom: Arme
    pour: [personnage]
    activable: true
    champs:
      - { id: attaque, nom: Attaque utilisée, type: attribut, entite: personnage }
      - { id: nbDes, nom: Nombre de dés de dégâts, type: nombre, defaut: 1 }
      - { id: faces, nom: Faces des dés de dégâts, type: nombre, defaut: 4 }
      - { id: bonusDegats, nom: Bonus aux dégâts, type: formule, defaut: 0 }
      - { id: portee, nom: Portée, type: texte }
      - { id: prix, nom: Prix (pa), type: nombre }
  - id: armure
    nom: Armure ou bouclier
    description: Les armures ne se cumulent pas entre elles, les boucliers non plus ; un bouclier s'ajoute à l'armure.
    pour: [personnage]
    activable: true
    champs:
      - { id: def, nom: Bonus de DEF, type: nombre, defaut: 0 }
      - { id: bouclier, nom: Bouclier (1) ou armure (0), type: nombre, defaut: 0 }
      - { id: prix, nom: Prix (pa), type: nombre }
  - id: bonus
    nom: Bonus
    nomPluriel: Bonus
    description: Bonus libres saisis sur la fiche (ancienne collection « Bonus »), actifs ou non.
    pour: [personnage]
    activable: true
    champs:
      - { id: FOR, nom: FOR, type: nombre, defaut: 0 }
      - { id: DEX, nom: DEX, type: nombre, defaut: 0 }
      - { id: CON, nom: CON, type: nombre, defaut: 0 }
      - { id: SAG, nom: SAG, type: nombre, defaut: 0 }
      - { id: INT, nom: INT, type: nombre, defaut: 0 }
      - { id: CHA, nom: CHA, type: nombre, defaut: 0 }
      - { id: Defense, nom: Défense, type: nombre, defaut: 0 }
      - { id: Contact, nom: Contact, type: nombre, defaut: 0 }
      - { id: Distance, nom: Distance, type: nombre, defaut: 0 }
      - { id: Magie, nom: Magie, type: nombre, defaut: 0 }
      - { id: INIT, nom: Initiative, type: nombre, defaut: 0 }
      - { id: PV_Max, nom: PV max, type: nombre, defaut: 0 }
  - id: etat
    nom: État
    pour: [personnage]

# ─── Progression : voies et équipement ──────────────────────────────────────
monnaies:
  - id: pointsCapacite
    nom: Points de capacité
    total: 2 * @niveau
    pour: [personnage]
  - id: pa
    nom: Pièces d'argent
    total: '@bourse'
    pour: [personnage]

achats:
  - id: rang-voie
    nom: Rang de voie
    description: Rangs 1 et 2 à 1 point, rangs 3 à 5 à 2 points (1, 2, 4, 6, 8 points cumulés).
    obtient: { type: rang, sorte: voie }
    monnaie: pointsCapacite
    cout: si(cible <= 2, 1, 2)
  - id: acheter-arme
    nom: Acheter une arme
    description: Au prix de l'arme, en pièces d'argent.
    obtient: { type: entree, sorte: arme }
    monnaie: pa
    cout: entree.prix
  - id: acheter-armure
    nom: Acheter une armure ou un bouclier
    description: Au prix de la protection, en pièces d'argent.
    obtient: { type: entree, sorte: armure }
    monnaie: pa
    cout: entree.prix

creation:
  - entite: personnage
    etapes:
      - id: race
        nom: Race
        type: choisir
        sorte: race
      - id: profil
        nom: Profil
        type: choisir
        sorte: profil
      - id: voies
        nom: Voies
        description: >-
          Par défaut les 5 voies du profil et la voie raciale ; chacune peut être
          remplacée par une autre voie (profil, race ou prestige). Rangs à 0.
        type: choisir
        sorte: voie
        min: 1
        max: 10
      - id: caracteristiques
        nom: Caractéristiques
        description: >-
          3d6 par caractéristique, dans l'ordre, relancés tant qu'il n'y a pas
          exactement 3 valeurs paires et une somme des modificateurs de +6.
        type: tirer
        groupe: caracteristiques
        formule: 3d6
        attribution: ordre
        contrainte: pairs == 3 et somme_modificateurs == 6
        relancer: true
      - id: de-de-vie
        nom: Dé de vie
        description: PV max de départ = 1 + mod. CON + ce jet.
        type: tirer
        attributs: [jetsDeVie]
        formule: des(1, @deVie)

# ─── Jets et actions ────────────────────────────────────────────────────────
# Avantage : 2d20 garder le meilleur ; désavantage : le pire ; les deux s'annulent.
# Une attaque qui touche inflige ses dégâts (`apres`), moins la RD de la cible
# (au moins 1 DM), retirés des PV de la cible.
actions:
  - id: attaque
    nom: Attaque avec une arme
    description: >-
      1d20 + score d'attaque de l'arme (Contact ou Distance) contre la Défense de
      la cible. Critique à partir de « Critique » (20 naturel par défaut) : touche
      toujours et double les dés de l'arme ; un 1 naturel rate toujours.
    pour: [personnage]
    cible: personnage
    parametres:
      - &arme { id: arme, nom: Arme, type: entree, sorte: arme }
      - &avantage { id: avantage, nom: Avantage, type: booleen }
      - &desavantage { id: desavantage, nom: Désavantage, type: booleen }
    jet:
      type: numerique
      formule: si(avantage et non desavantage, 2d20k1, si(desavantage et non avantage, 2d20kl1, 1d20)) + valeur(arme.attaque)
      reussite: &touche-arme naturel >= @Critique ou (naturel != 1 et total >= @cible.Defense)
      critique: &critique-arme naturel >= @Critique
      fumble: &fumble naturel == 1
    apres:
      - {
          cle: degats,
          formule: 'si(reussi, max(0, des(si(critique, 2, 1) * arme.nbDes, arme.faces) + arme.bonusDegats), 0)',
        }
      - &subis { cle: subis, formule: 'si(degats > 0, max(1, degats - @cible.RD), 0)' }
    consequences:
      - &retirer-pv {
          condition: 'subis > 0',
          entite: cible,
          attribut: PV,
          operation: retirer,
          valeur: subis,
        }

  - id: attaque-libre
    nom: Attaque libre
    description: >-
      Attaque sans arme du catalogue (mains nues, sort, arme improvisée) : 1d20 +
      Contact, Distance ou Magie contre la Défense ; dégâts saisis, dés doublés
      au critique (20 naturel).
    pour: [personnage]
    cible: personnage
    parametres:
      - { id: score, nom: Attaque, type: attribut, attributs: [Contact, Distance, Magie] }
      - *avantage
      - *desavantage
      - { id: nbDes, nom: Nombre de dés, type: nombre, defaut: 1 }
      - { id: faces, nom: Faces, type: nombre, defaut: 6 }
      - { id: bonus, nom: Bonus aux DM, type: nombre, defaut: 0 }
    jet:
      type: numerique
      formule: si(avantage et non desavantage, 2d20k1, si(desavantage et non avantage, 2d20kl1, 1d20)) + valeur(score)
      reussite: &touche naturel == 20 ou (naturel != 1 et total >= @cible.Defense)
      critique: &critique naturel == 20
      fumble: *fumble
    apres:
      - {
          cle: degats,
          formule: 'si(reussi, max(0, des(si(critique, 2, 1) * nbDes, faces) + bonus), 0)',
        }
      - *subis
    consequences:
      - *retirer-pv

  - id: degats-libres
    nom: Dégâts automatiques
    description: Dégâts sans test d'attaque (zone, piège, chute), moins la RD de la cible.
    pour: [personnage]
    cible: personnage
    parametres:
      - { id: nbDes, nom: Nombre de dés, type: nombre, defaut: 1 }
      - { id: faces, nom: Faces, type: nombre, defaut: 6 }
      - { id: bonus, nom: Bonus, type: nombre, defaut: 0 }
    jet:
      type: numerique
      formule: des(nbDes, faces) + bonus
    apres:
      - &degats-total { cle: degats, formule: 'max(0, total)' }
      - *subis
    consequences:
      - *retirer-pv

  # Tests de caractéristique (et jets de sauvegarde) : 1d20 + modificateur
  - id: test
    nom: Test de caractéristique
    description: 1d20 + modificateur de la caractéristique contre la difficulté.
    pour: [personnage]
    parametres:
      - { id: caracteristique, nom: Caractéristique, type: attribut, groupe: caracteristiques }
      - { id: difficulte, nom: Difficulté, type: nombre, defaut: 10 }
      - *avantage
      - *desavantage
    jet:
      type: numerique
      formule: si(avantage et non desavantage, 2d20k1, si(desavantage et non avantage, 2d20kl1, 1d20)) + modificateur(caracteristique)
      reussite: total >= difficulte

  - id: initiative
    nom: Initiative
    description: 1d20 + Initiative (valeur de DEX).
    pour: [personnage]
    jet:
      type: numerique
      formule: 1d20 + @INIT

  - id: monter-niveau
    nom: Passage de niveau
    description: >-
      Lance le dé de vie : le niveau augmente de 1, les PV max du jet + mod. CON,
      et les PV remontent au nouveau maximum.
    pour: [personnage]
    jet:
      type: numerique
      formule: des(1, @deVie)
    consequences:
      - { entite: acteur, attribut: niveau, operation: ajouter, valeur: 1 }
      - { entite: acteur, attribut: jetsDeVie, operation: ajouter, valeur: total }
      - { entite: acteur, attribut: PV, operation: fixer, valeur: '@PV_Max + total + mod(@CON)' }

  # ─── Actions des capacités ─────────────────────────────────────────────────
  # Réservées aux porteurs de la capacité (`exige`). Les capacités sans jet
  # propre restent décrites sur leur entrée.

  # ── Attaques d’arme des capacités ──

  - id: charge
    nom: Charge
    description: 'Déplacement en ligne droite (5 à 20 m) puis attaque au contact : +2 en attaque, +1d6 DM.'
    pour: [personnage]
    exige: 'possede("barbare-pourfendeur-charge") ou possede("barde-saltimbanque-grace-feline") ou possede("race-minotaure-charge")'
    cible: personnage
    parametres:
      - *arme
      - *avantage
      - *desavantage
    jet:
      type: numerique
      formule: 'si(avantage et non desavantage, 2d20k1, si(desavantage et non avantage, 2d20kl1, 1d20)) + valeur(arme.attaque) + 2'
      reussite: *touche-arme
      critique: *critique-arme
      fumble: *fumble
    apres:
      - {
          cle: degats,
          formule: 'si(reussi, max(0, des(si(critique, 2, 1) * arme.nbDes, arme.faces) + arme.bonusDegats + 1d6), 0)',
        }
      - *subis
    consequences:
      - *retirer-pv

  - id: attaque-brutale
    nom: Attaque brutale
    description: Attaque au contact à −2 pour +1d6 DM ; au rang 5 de la voie, −5 pour +2d6 DM.
    pour: [personnage]
    exige: 'possede("barbare-brute-attaque-brutale")'
    cible: personnage
    parametres:
      - *arme
      - *avantage
      - *desavantage
      - { id: puissante, nom: 'Pénalité de −5 pour +2d6 DM (rang 5)', type: booleen }
    jet:
      type: numerique
      formule: 'si(avantage et non desavantage, 2d20k1, si(desavantage et non avantage, 2d20kl1, 1d20)) + valeur(arme.attaque) + si(puissante et rang("barbare-brute") >= 5, -5, -2)'
      reussite: *touche-arme
      critique: *critique-arme
      fumble: *fumble
    apres:
      - {
          cle: degats,
          formule: 'si(reussi, max(0, des(si(critique, 2, 1) * arme.nbDes, arme.faces) + arme.bonusDegats + si(puissante et rang("barbare-brute") >= 5, 2d6, 1d6)), 0)',
        }
      - *subis
    consequences:
      - *retirer-pv

  - id: attaque-apres-feinte
    nom: Attaque après une feinte
    description: 'Au tour qui suit une Feinte contre le même adversaire : +5 en attaque, et +2d6 DM si la feinte a réussi.'
    pour: [personnage]
    exige: 'possede("barde-escrime-feinte")'
    cible: personnage
    parametres:
      - *arme
      - *avantage
      - *desavantage
      - { id: feinteReussie, nom: La feinte a réussi, type: booleen }
    jet:
      type: numerique
      formule: 'si(avantage et non desavantage, 2d20k1, si(desavantage et non avantage, 2d20kl1, 1d20)) + valeur(arme.attaque) + 5'
      reussite: *touche-arme
      critique: *critique-arme
      fumble: *fumble
    apres:
      - {
          cle: degats,
          formule: 'si(reussi, max(0, des(si(critique, 2, 1) * arme.nbDes, arme.faces) + arme.bonusDegats + si(feinteReussie, 2d6, 0)), 0)',
        }
      - *subis
    consequences:
      - *retirer-pv

  - id: attaque-flamboyante
    nom: Attaque flamboyante
    description: Attaque au contact avec un bonus en attaque et aux DM égal au mod. de CHA.
    pour: [personnage]
    exige: 'possede("barde-escrime-attaque-flamboyante")'
    cible: personnage
    parametres:
      - *arme
      - *avantage
      - *desavantage
    jet:
      type: numerique
      formule: 'si(avantage et non desavantage, 2d20k1, si(desavantage et non avantage, 2d20kl1, 1d20)) + valeur(arme.attaque) + mod(@CHA)'
      reussite: *touche-arme
      critique: *critique-arme
      fumble: *fumble
    apres:
      - {
          cle: degats,
          formule: 'si(reussi, max(0, des(si(critique, 2, 1) * arme.nbDes, arme.faces) + arme.bonusDegats + mod(@CHA)), 0)',
        }
      - *subis
    consequences:
      - *retirer-pv

  - id: chatiment-divin
    nom: Châtiment divin
    description: Attaque au contact avec un bonus en attaque et aux DM égal au mod. de SAG.
    pour: [personnage]
    exige: 'possede("pretre-guerre-sainte-chatiment-divin")'
    cible: personnage
    parametres:
      - *arme
      - *avantage
      - *desavantage
    jet:
      type: numerique
      formule: 'si(avantage et non desavantage, 2d20k1, si(desavantage et non avantage, 2d20kl1, 1d20)) + valeur(arme.attaque) + mod(@SAG)'
      reussite: *touche-arme
      critique: *critique-arme
      fumble: *fumble
    apres:
      - {
          cle: degats,
          formule: 'si(reussi, max(0, des(si(critique, 2, 1) * arme.nbDes, arme.faces) + arme.bonusDegats + mod(@SAG)), 0)',
        }
      - *subis
    consequences:
      - *retirer-pv

  - id: frappe-lourde
    nom: Frappe lourde
    description: Attaque au contact avec 1d12 au lieu du d20, +2d6 DM, en ignorant la moitié de la RD de la cible.
    pour: [personnage]
    exige: 'possede("chevalier-guerre-frappe-lourde")'
    cible: personnage
    parametres:
      - *arme
    jet:
      type: numerique
      formule: '1d12 + valeur(arme.attaque)'
      reussite: *touche-arme
      critique: *critique-arme
      fumble: *fumble
    apres:
      - {
          cle: degats,
          formule: 'si(reussi, max(0, des(si(critique, 2, 1) * arme.nbDes, arme.faces) + arme.bonusDegats + 2d6), 0)',
        }
      - { cle: subis, formule: 'si(degats > 0, max(1, degats - floor(@cible.RD / 2)), 0)' }
    consequences:
      - *retirer-pv

  - id: attaque-puissante
    nom: Attaque au d12
    description: Attaque avec 1d12 au lieu du d20 (score d’attaque ajouté normalement), +2d6 DM si elle réussit.
    pour: [personnage]
    exige: 'possede("guerrier-combat-attaque-puissante") ou possede("samourai-ki-puissance-du-ki") ou possede("moine-poing-puissance-du-ki")'
    cible: personnage
    parametres:
      - *arme
    jet:
      type: numerique
      formule: '1d12 + valeur(arme.attaque)'
      reussite: *touche-arme
      critique: *critique-arme
      fumble: *fumble
