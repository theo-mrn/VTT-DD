        formule: 'des(si(rang("psionique-telekinesie") >= 5, 3, 2), 6) + mod(@CHA)',
      }
    apres:
      - *degats-total
      - *subis
    consequences:
      - *retirer-pv

  - id: souffle
    nom: Souffle
    description: 'Cône de 10 m : 2d6 DM par rang dans la voie (test de DEX 12 pour la moitié).'
    pour: [personnage]
    exige: 'possede("race-drakonide-souffle")'
    cible: personnage
    jet: { type: numerique, formule: 'des(2 * rang("race-drakonide"), 6)' }
    apres:
      - *degats-total
      - *subis
    consequences:
      - *retirer-pv

  # ── Soins ──

  - id: soins-legers
    nom: Soins légers
    description: La cible (ou le prêtre) récupère [1d8 + niveau] PV.
    pour: [personnage]
    exige: 'possede("pretre-soins-soins-legers")'
    cible: personnage
    jet: { type: numerique, formule: 1d8 + @niveau }
    consequences:
      - { entite: cible, attribut: PV, operation: ajouter, valeur: 'max(0, total)' }

  - id: soins-moderes
    nom: Soins modérés
    description: La cible (ou le prêtre) récupère [2d8 + niveau] PV.
    pour: [personnage]
    exige: 'possede("pretre-soins-soins-moderes")'
    cible: personnage
    jet: { type: numerique, formule: 2d8 + @niveau }
    consequences:
      - { entite: cible, attribut: PV, operation: ajouter, valeur: 'max(0, total)' }

  - id: soins-de-groupe
    nom: Soins de groupe
    description: 'Une fois par combat : chaque compagnon en vue récupère [1d8 + niveau] PV (un jet par cible).'
    pour: [personnage]
    exige: 'possede("pretre-soins-soins-de-groupe")'
    cible: personnage
    jet: { type: numerique, formule: 1d8 + @niveau }
    consequences:
      - { entite: cible, attribut: PV, operation: ajouter, valeur: 'max(0, total)' }

  - id: baies-magiques
    nom: Baie magique
    description: Un fruit rend [1d6 + niveau du druide] PV à celui qui le mange (une fois par jour).
    pour: [personnage]
    exige: 'possede("druide-protecteur-baies-magiques")'
    cible: personnage
    jet: { type: numerique, formule: 1d6 + @niveau }
    consequences:
      - { entite: cible, attribut: PV, operation: ajouter, valeur: 'max(0, total)' }

  - id: elixir-de-guerison
    nom: Élixir de guérison
    description: L’élixir soigne [3d6 + mod. INT] PV.
    pour: [personnage]
    exige: 'possede("forgesort-elixirs-elixir-de-guerison")'
    cible: personnage
    jet: { type: numerique, formule: '3d6 + mod(@INT)' }
    consequences:
      - { entite: cible, attribut: PV, operation: ajouter, valeur: 'max(0, total)' }

  - id: fortifiant
    nom: Fortifiant
    description: Le breuvage guérit [1d4 + rang] PV.
    pour: [personnage]
    exige: 'possede("forgesort-elixirs-fortifiant")'
    cible: personnage
    jet: { type: numerique, formule: '1d4 + rang("forgesort-elixirs")' }
    consequences:
      - { entite: cible, attribut: PV, operation: ajouter, valeur: 'max(0, total)' }

  - id: second-souffle
    nom: Second souffle
    description: 'Une fois par combat, sans attaquer : le guerrier récupère [1d10 + niveau + mod. CON] PV.'
    pour: [personnage]
    exige: 'possede("guerrier-resistance-second-souffle")'
    jet: { type: numerique, formule: '1d10 + @niveau + mod(@CON)' }
    consequences:
      - { entite: acteur, attribut: PV, operation: ajouter, valeur: 'max(0, total)' }

  - id: transe-de-guerison
    nom: Transe de guérison
    description: 'Après un combat, 10 minutes de méditation : le moine récupère [niveau + mod. SAG] PV.'
    pour: [personnage]
    exige: 'possede("moine-meditation-transe-de-guerison")'
    jet: { type: numerique, formule: '@niveau + mod(@SAG)' }
    consequences:
      - { entite: acteur, attribut: PV, operation: ajouter, valeur: 'max(0, total)' }

initiative:
  action: initiative
  tri: [total]
