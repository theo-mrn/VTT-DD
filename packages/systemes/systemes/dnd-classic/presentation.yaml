# Présentation D&D classique : ce que le front affiche sans que ce soit une
# règle. Les illustrations sont celles de l'ancienne app (stockage R2).

format: 1
systeme: dnd-classic

theme:
  couleurs:
    accent: '#c9a965'
  fond:
    type: image
    source: 'https://assets.yner.fr/Map/Chateau/Illustration/Cragwind Castle_Day02_static.webp'

