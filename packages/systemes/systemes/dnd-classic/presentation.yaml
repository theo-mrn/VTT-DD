# PV : jauge pleine au départ, qui descend
ressources:
  PV: { sens: descendant, couleur: '#10b981' }

# Fiche du personnage : le front l'affiche bloc par bloc, sans connaître le jeu.
# Le premier bloc « details » sert aussi de résumé (cartes, listes).
fiches:
  personnage:
    widgets:
      - { type: details, titre: Profil, sortes: [race, profil], attributs: [niveau] }
      - { type: attributs, titre: Caractéristiques, groupe: caracteristiques, colonnes: 6 }
      - { type: ressources, titre: Vitalité, attributs: [PV] }
      - {
          type: attributs,
          titre: Combat,
          attributs: [Defense, Contact, Distance, Magie, INIT, Critique],
          colonnes: 6,
        }
      - { type: possessions, titre: Voies, sorte: voie }
      - { type: possessions, titre: Capacités, sorte: capacite }
      - { type: possessions, titre: Capacités à activer, sorte: capacite_active }
      - { type: possessions, titre: Armes, sorte: arme }
      - { type: possessions, titre: Armures et boucliers, sorte: armure }
      - { type: possessions, titre: États, sorte: etat }
      - { type: monnaies, titre: Points et bourse }
      - { type: actions, titre: Actions }
