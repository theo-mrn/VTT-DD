# Présentation D&D classique
#
# Reprise du thème par défaut de l'ancienne app (legacy/src/modules/builtin/
# dnd-classic/theme.ts : bruns très sombres, accent ambre/pêche) et de sa
# fiche (caractéristiques, combat, vitalité, voies, inventaire).

format: 1
systeme: dnd-classic

theme:
  couleurs:
    fond: '#141110'
    fondProfond: '#0a0807'
    carte: '#1c1614'
    canevas: '#0c0908'
    bordure: '#28211c'
    texte: '#e3dad4'
    texteSecondaire: '#7a706a'
    accent: '#c2956a'
    accentSurvol: '#d0ad8b'
  fond:
    type: image
    source: 'https://assets.yner.fr/Map/Chateau/Illustration/Cragwind Castle_Day02_static.webp'

# Illustrations des races et des profils (assistant de création, fiches)
images:
  ame_forgee: https://assets.yner.fr/images/races/Ame-forgee.webp
  elfe: https://assets.yner.fr/images/races/Elfe.webp
  elfe_noir: https://assets.yner.fr/images/races/Elfenoir.jpg
  elfe_sylvain: https://assets.yner.fr/images/races/Elfesylvain.webp
  humain: https://assets.yner.fr/images/races/Humain.webp
  nain: https://assets.yner.fr/images/races/Nain.webp
  minotaure: https://assets.yner.fr/images/races/Minotaure.webp
  halfelin: https://assets.yner.fr/images/races/Halfelin.webp
  orque: https://assets.yner.fr/images/races/Orc.webp
  drakonide: https://assets.yner.fr/images/races/Drakonide.webp
  barbare: https://assets.yner.fr/images/profiles/barbare.jpg
  barde: https://assets.yner.fr/images/profiles/Barde.jpg
  chevalier: https://assets.yner.fr/images/profiles/chevalier.jpg
  druide: https://assets.yner.fr/images/profiles/druide.webp
  ensorceleur: https://assets.yner.fr/images/profiles/ensorceleur.jpg
  forgesort: https://assets.yner.fr/images/profiles/forgesort.webp
  guerrier: https://assets.yner.fr/images/profiles/guerrier.webp
  invocateur: https://assets.yner.fr/images/profiles/invocateur.jpg
  magicien: https://assets.yner.fr/images/profiles/magicien.webp
  moine: https://assets.yner.fr/images/profiles/moine.jpg
  necromancien: https://assets.yner.fr/images/profiles/necromancien.webp
  pretre: https://assets.yner.fr/images/profiles/pretre.jpg
  psionique: https://assets.yner.fr/images/profiles/psionique.jpg
  rodeur: https://assets.yner.fr/images/profiles/rodeur.webp
  samourai: https://assets.yner.fr/images/profiles/samourai.jpg
  voleur: https://assets.yner.fr/images/profiles/voleur.webp

des:
  sortes:
    d4: { couleur: '#c2956a', forme: d4 }
    d6: { couleur: '#c2956a', forme: d6 }
    d8: { couleur: '#c2956a', forme: d8 }
    d10: { couleur: '#c2956a', forme: d10 }
    d12: { couleur: '#c2956a', forme: d12 }
    d20: { couleur: '#d0ad8b', forme: d20 }
  # Lanceur de dés : ordre et groupes des attributs qui déclarent `jet` dans les règles
  jets:
    - { titre: Caractéristiques, attributs: [FOR, DEX, CON, SAG, INT, CHA] }
    - { titre: Attaques et initiative, attributs: [Contact, Distance, Magie, INIT] }

# Marques posées par les règles
marques:
  predilection: { nom: Arme de prédilection, icone: sword }

# Les PV partent du maximum et descendent
ressources:
  PV: { sens: descendant, couleur: '#dc2626' }

fiches:
  personnage:
    widgets:
      - { type: details, titre: Profil, sortes: [race, profil], attributs: [] }
      - { type: attributs, titre: Caractéristiques, groupe: caracteristiques, colonnes: 6 }
      # PV en chiffres (« PV / PV max »), puis la Défense
      - { type: ressources, titre: Vitalité, attributs: [PV, Defense], affichage: valeur }
      - { type: attributs, titre: Combat, attributs: [Contact, Distance, Magie], colonnes: 3 }
      - {
          type: attributs,
          titre: Progression,
          attributs: [niveau, deVie, jetsDeVie, INIT],
          colonnes: 4,
        }
      - { type: possessions, titre: Voies, sorte: voie }
      - { type: monnaies, titre: Points de capacité }
      - { type: possessions, titre: Capacités, sorte: capacite }
      - { type: possessions, titre: Capacités à activer, sorte: capacite_active }
      # Source unique de l'équipement : armes (contact, distance), protections, objets
      # (potions, nourriture, bourse, autre)
      - {
          type: inventaire,
          titre: Inventaire,
          sortes: [arme, armure, objet],
          groupeChamp: [attaque, categorie],
        }
      - { type: bonus, titre: Bonus }
      - { type: possessions, titre: États, sorte: etat }
      - { type: actions, titre: Actions }
