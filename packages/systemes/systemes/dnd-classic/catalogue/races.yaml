- id: humain
  sorte: race
  nom: Humain
  description: |-
    Les humains sont des êtres polyvalents et adaptables, présents dans le monde entier. Leur diversité culturelle et leur capacité à s'adapter en font des individus remarquables.

    **Capacités raciales**

    - Instinct de survie : Lorsqu’une attaque devrait amener le personnage à 0 PV, les DM qu’elle inflige sont divisés par 2 (minimum 1).
  champs:
