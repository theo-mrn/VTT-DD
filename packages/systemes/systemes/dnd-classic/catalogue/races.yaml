- id: drakonide
  sorte: race
  nom: Drakonide
  champs: { voie: race-drakonide, tailleMoyenne: 195, poidsMoyen: 110 }
  description: |-
    Les drakonides possèdent des traits reptiliens et des ailes puissantes. Ils sont souvent vus comme des gardiens des anciennes connaissances des dragons.
  effets:
    - {
        sur: attribut,
        attribut: FOR,
