# Races (contenu D&D classique de l'ancienne app, legacy/public/tabs).
# Modificateurs de caractéristiques en effets ; les capacités raciales sont des
# entrées accordées par un rang gratuit.

- id: ame_forgee
  sorte: race
  nom: Âme forgée
  champs: { voie: race-ame-forgee, tailleMoyenne: 185, poidsMoyen: 120 }
  description: |-
    Les âmes forgées sont des êtres artificiels créés par des artisans habiles dans l'art de la magie et de la mécanique. Ils sont souvent vus comme des gardiens imperturbables et stoïques, dotés d'une force surhumaine et d'une résistance inébranlable.
  effets:
    - {
        sur: attribut,
        attribut: CON,
        operation: ajouter,
        valeur: 2,
        description: 'Modificateur racial (Âme forgée)',
      }
    - {
        sur: attribut,
        attribut: CHA,
        operation: ajouter,
        valeur: -2,
        description: 'Modificateur racial (Âme forgée)',
      }
    - { sur: rang, entree: ame_forgee-creature-artificielle, valeur: 1 }
    - { sur: rang, entree: ame_forgee-creature-de-metal, valeur: 1 }

- id: ame_forgee-creature-artificielle
  sorte: capacite
  nom: Créature artificielle
  description: |-
    Une âme-forgée n’a pas besoin de boire ni de se nourrir, ni même de respirer ! Elle a toutefois besoin de rêver quatre heures par jour (sans quoi elle subit un malus de -2 à ses tests de SAG, ce malus est cumulatif). Elle est naturellement immunisée aux poisons et aux maladies. Les âmes-forgées sont incapables de nager mais elles peuvent marcher au fond de l’eau (considéré comme un terrain difficile).

- id: ame_forgee-creature-de-metal
  sorte: capacite
  nom: Créature de métal
  description: |-
    Les parties métalliques d’une âme-forgée lui offrent une protection naturelle qui lui accorde un bonus de +1 en DEF. De plus, l’âme-forgée retranche 5 points (RD 5) à tous les DM de feu, de froid et aux drains de vie (pouvoir de vampire par exemple). Enfin, elle est immunisée aux effets de saignement.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 1 }

- id: elfe
  sorte: race
  nom: Elfe
  champs: { voie: race-haut-elfe, tailleMoyenne: 175, poidsMoyen: 60 }
  description: |-
    Les elfes sont des créatures élégantes et gracieuses, vivant en harmonie avec la nature. Ils sont connus pour leur agilité et leur maîtrise de la magie, ainsi que pour leur longévité et leur sagesse.
  effets:
    - {
        sur: attribut,
        attribut: FOR,
        operation: ajouter,
        valeur: -2,
        description: 'Modificateur racial (Elfe)',
      }
    - {
        sur: attribut,
        attribut: CHA,
        operation: ajouter,
        valeur: 2,
        description: 'Modificateur racial (Elfe)',
      }
    - { sur: rang, entree: elfe-lumiere-des-etoiles, valeur: 1 }

- id: elfe-lumiere-des-etoiles
  sorte: capacite
  nom: Lumière des étoiles
  description: |-
    Pour un haut elfe, l’obscurité de la nuit sous la lumière des étoiles n’est que de la pénombre, où seuls les petits détails lui échappent.

- id: elfe_noir
  sorte: race
  nom: Elfe noir
  champs: { voie: race-elfe-noir, tailleMoyenne: 170, poidsMoyen: 55 }
  description: |-
    Les elfes noirs, ou drows, vivent dans les profondeurs souterraines et sont souvent associés à la magie noire et à la cruauté.
  effets:
    - {
        sur: attribut,
        attribut: FOR,
        operation: ajouter,
        valeur: -2,
        description: 'Modificateur racial (Elfe noir)',
      }
    - {
        sur: attribut,
        attribut: DEX,
        operation: ajouter,
        valeur: 2,
        description: 'Modificateur racial (Elfe noir)',
      }
    - { sur: rang, entree: elfe_noir-vision-dans-le-noir, valeur: 1 }

- id: elfe_noir-vision-dans-le-noir
  sorte: capacite
  nom: Vision dans le noir
  description: |-
    Dans le noir total, l’elfe noir voit comme dans la pénombre jusqu’à 30 m.

- id: elfe_sylvain
  sorte: race
  nom: Elfe sylvain
  champs: { voie: race-elfe-sylvain, tailleMoyenne: 170, poidsMoyen: 58 }
  description: |-
    Les elfes sylvains sont des habitants des forêts, en harmonie avec la nature. Ils sont agiles et se déplacent silencieusement dans les bois.
  effets:
    - {
        sur: attribut,
