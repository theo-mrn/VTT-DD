# Races — généré depuis legacy/public/tabs (contenu D&D classique de l'ancienne app).
- id: ame_forgee
  sorte: race
  nom: Âme forgée
  description: |-
    Les âmes forgées sont des êtres artificiels créés par des artisans habiles dans l'art de la magie et de la mécanique. Ils sont souvent vus comme des gardiens imperturbables et stoïques, dotés d'une force surhumaine et d'une résistance inébranlable.

    **Capacités raciales**

    - Créature artificielle : Une âme-forgée n’a pas besoin de boire ni de se nourrir, ni même de respirer ! Elle a toutefois besoin de rêver quatre heures par jour (sans quoi elle subit un malus de -2 à ses tests de SAG, ce malus est cumulatif). Elle est naturellement immunisée aux poisons et aux maladies. Les âmes-forgées sont incapables de nager mais elles peuvent marcher au fond de l’eau (considéré comme un terrain difficile).
    - Créature de métal : Les parties métalliques d’une âme-forgée lui offrent une protection naturelle qui lui accorde un bonus de +1 en DEF. De plus, l’âme-forgée retranche 5 points (RD 5) à tous les DM de feu, de froid et aux drains de vie (pouvoir de vampire par exemple). Enfin, elle est immunisée aux effets de saignement.
  champs:
    voie: race-ame-forgee
    tailleMoyenne: 185
    poidsMoyen: 120
  effets:
    - sur: attribut
      attribut: CON
      operation: ajouter
      valeur: 2
      description: Modificateur racial (Âme forgée)
    - sur: attribut
      attribut: CHA
      operation: ajouter
      valeur: -2
      description: Modificateur racial (Âme forgée)
- id: elfe
  sorte: race
  nom: Elfe
  description: |-
    Les elfes sont des créatures élégantes et gracieuses, vivant en harmonie avec la nature. Ils sont connus pour leur agilité et leur maîtrise de la magie, ainsi que pour leur longévité et leur sagesse.

    **Capacités raciales**

    - Lumière des étoiles : pour un haut elfe, l’obscurité de la nuit sous la lumière des étoiles n’est que de la pénombre, où seuls les petits détails lui échappent.
