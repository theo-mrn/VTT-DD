- id: minotaure
  sorte: race
  nom: Minotaure
  description: |-
    Le minotaure est une créature mi-homme mi-taureau. Il est connu pour son sens de l’orientation et ses explosions de rage. Les minotaures, les mâles en particuliers, sont des solitaires. Ils chassent dans les grandes plaines désertiques et vivent dans des grottes ou des souterrains.

    **Capacités raciales**

    - Coup de corne : Un minotaure peut réaliser une attaque de corne qui inflige [1d6 + Mod. de FOR] DM à la place d’une attaque normale. Au prix d’une action limitée, il peut faire une attaque normale avec une arme de contact plus une attaque de corne.
    - Sens de l’orientation : Le minotaure reçoit un test de +5 à tous les tests d’orientation.
    - Vision dans le noir : dans le noir total, le minotaure voit comme dans la pénombre jusqu’à 30 m.
  champs:
    voie: race-minotaure
    tailleMoyenne: 210
    poidsMoyen: 150
  effets:
