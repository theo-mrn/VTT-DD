      attribut: FOR
      operation: ajouter
      valeur: 4
      description: Modificateur racial (Minotaure)
    - sur: attribut
      attribut: INT
      operation: ajouter
      valeur: -4
      description: Modificateur racial (Minotaure)
    - sur: attribut
      attribut: CHA
      operation: ajouter
