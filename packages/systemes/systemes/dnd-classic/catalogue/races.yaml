        valeur: 2,
        description: 'Modificateur racial (Elfe sylvain)',
      }
    - { sur: rang, entree: elfe_sylvain-lumiere-des-etoiles, valeur: 1 }

- id: elfe_sylvain-lumiere-des-etoiles
  sorte: capacite
  nom: Lumière des étoiles
  description: |-
    Pour un elfe sylvain, l’obscurité de la nuit sous la lumière des étoiles n’est que de la pénombre, où seuls les petits détails lui échappent.

- id: humain
  sorte: race
  nom: Humain
  champs: { voie: race-humain, tailleMoyenne: 175, poidsMoyen: 75 }
  description: |-
    Les humains sont des êtres polyvalents et adaptables, présents dans le monde entier. Leur diversité culturelle et leur capacité à s'adapter en font des individus remarquables.
  effets:
    - { sur: rang, entree: humain-instinct-de-survie, valeur: 1 }

- id: humain-instinct-de-survie
  sorte: capacite
  nom: Instinct de survie
  description: |-
    Lorsqu’une attaque devrait amener le personnage à 0 PV, les DM qu’elle inflige sont divisés par 2 (minimum 1).

- id: nain
  sorte: race
  nom: Nain
  champs: { voie: race-nain, tailleMoyenne: 135, poidsMoyen: 70 }
  description: |-
    Les nains sont des mineurs et forgerons habiles, vivant dans des citadelles souterraines. Ils sont robustes et endurants.
  effets:
    - {
        sur: attribut,
        attribut: DEX,
        operation: ajouter,
        valeur: -2,
        description: 'Modificateur racial (Nain)',
      }
    - {
        sur: attribut,
        attribut: CON,
        operation: ajouter,
        valeur: 2,
        description: 'Modificateur racial (Nain)',
      }
    - { sur: rang, entree: nain-vision-dans-le-noir, valeur: 1 }

- id: nain-vision-dans-le-noir
  sorte: capacite
  nom: Vision dans le noir
  description: |-
    Dans le noir total, le nain voit comme dans la pénombre jusqu’à 30 m.

- id: minotaure
  sorte: race
  nom: Minotaure
  champs: { voie: race-minotaure, tailleMoyenne: 210, poidsMoyen: 150 }
  description: |-
    Le minotaure est une créature mi-homme mi-taureau. Il est connu pour son sens de l’orientation et ses explosions de rage. Les minotaures, les mâles en particuliers, sont des solitaires. Ils chassent dans les grandes plaines désertiques et vivent dans des grottes ou des souterrains.
  effets:
    - {
        sur: attribut,
        attribut: FOR,
        operation: ajouter,
        valeur: 4,
        description: 'Modificateur racial (Minotaure)',
      }
    - {
        sur: attribut,
        attribut: INT,
        operation: ajouter,
        valeur: -4,
        description: 'Modificateur racial (Minotaure)',
      }
    - {
        sur: attribut,
        attribut: CHA,
        operation: ajouter,
        valeur: -2,
        description: 'Modificateur racial (Minotaure)',
      }
    - { sur: rang, entree: minotaure-coup-de-corne, valeur: 1 }
    - { sur: rang, entree: minotaure-sens-de-l-orientation, valeur: 1 }
    - { sur: rang, entree: minotaure-vision-dans-le-noir, valeur: 1 }

- id: minotaure-coup-de-corne
  sorte: capacite
  nom: Coup de corne
  description: |-
    Un minotaure peut réaliser une attaque de corne qui inflige [1d6 + Mod. de FOR] DM à la place d’une attaque normale. Au prix d’une action limitée, il peut faire une attaque normale avec une arme de contact plus une attaque de corne.

- id: minotaure-sens-de-l-orientation
  sorte: capacite
  nom: Sens de l’orientation
  description: |-
    Le minotaure reçoit un test de +5 à tous les tests d’orientation.

- id: minotaure-vision-dans-le-noir
  sorte: capacite
  nom: Vision dans le noir
  description: |-
    Dans le noir total, le minotaure voit comme dans la pénombre jusqu’à 30 m.

- id: halfelin
  sorte: race
  nom: Halfelin
  champs: { voie: race-halfelin, tailleMoyenne: 90, poidsMoyen: 15 }
  description: |-
    Les halfelins sont une race de petite taille, souvent joyeux et farceurs. Ce sont des individus curieux et sociables.
  effets:
    - {
        sur: attribut,
        attribut: FOR,
        operation: ajouter,
        valeur: -2,
        description: 'Modificateur racial (Halfelin)',
      }
    - {
        sur: attribut,
        attribut: DEX,
        operation: ajouter,
        valeur: 2,
        description: 'Modificateur racial (Halfelin)',
      }
    - { sur: rang, entree: halfelin-petite-taille, valeur: 1 }

- id: halfelin-petite-taille
  sorte: capacite
  nom: Petite taille
  description: |-
    Le halfelin obtient un bonus de +1 en DEF et de +2 à tous les tests de discrétion. En revanche, un halfelin peut seulement utiliser à une main une arme dont les DM sont au maximum égaux à 1d6 (épée courte, masse, etc.). Il lui faut utiliser les 2 mains pour les armes qui infligent 1d8 à 1d10 de DM (épée longue). Enfin il lui est interdit d’utiliser les armes qui infligent plus de 1d10 DM.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 1 }

