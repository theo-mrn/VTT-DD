# Voies des profils (contenu D&D classique de l'ancienne app, legacy/public/tabs).
# Chaque voie accorde sa capacité de rang N quand elle atteint le rang N
# (effet « rang » conditionné) ; la capacité porte le texte et la mécanique.

- id: barbare-brute
  sorte: voie
  nom: Voie de la brute
  etiquettes: [profil, barbare]
  description: |-
    1. Argument de taille
    2. Tour de force
    3. Attaque brutale
    4. Briseur d'os
    5. Force héroïque
  effets:
    - { sur: rang, entree: barbare-brute-argument-de-taille, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: barbare-brute-tour-de-force, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: barbare-brute-attaque-brutale, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: barbare-brute-briseur-d-os, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: barbare-brute-force-heroique, valeur: 1, condition: 'rang >= 5' }

- id: barbare-brute-argument-de-taille
  sorte: capacite
  nom: Argument de taille
  etiquettes: [test]
  champs: { voie: barbare-brute, rangVoie: 1, activation: Capacité passive, bonusTest: 'mod(@FOR)' }
  description: |-
    Effet : [+ mod. FOR] PV max et aux tests de CHA pour intimidation et persuasion.

    Le barbare ajoute son mod. de FOR à son score de PV maximum ainsi qu'à ses tests de CHA et à ceux de ses alliés au contact pour des actions de négociation, de persuasion ou d'intimidation. Allez savoir pourquoi, sa simple présence donne de la force aux arguments de ses alliés.
  effets:
    - { sur: attribut, attribut: PV_Max, operation: ajouter, valeur: 'mod(@FOR)' }

- id: barbare-brute-tour-de-force
  sorte: capacite
  nom: Tour de force
  champs: { voie: barbare-brute, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : +10 aux tests de FOR, -1d4 PV.

    Le barbare peut temporairement décupler ses ressources physiques pour faire usage d'une force prodigieuse. Il peut ainsi soulever une charge incroyable, briser une épée, tordre des barreaux ou défoncer une porte d'un seul coup de poing. Il obtient un bonus de +10 à son test de FOR, mais cela lui coûte 1d4 PV.

- id: barbare-brute-attaque-brutale
  sorte: capacite
  nom: Attaque brutale
  champs: { voie: barbare-brute, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : -2 Contact, +1d6 DM, -5 DEF, +2d6 DM.

    Le barbare réalise une attaque au contact avec une pénalité de -2 en attaque et inflige +1d6 DM. Au Rang 5 de la voie, il peut choisir une pénalité de -5 pour obtenir +2d6 aux DM.

- id: barbare-brute-briseur-d-os
  sorte: capacite
  nom: Briseur d'os
  champs: { voie: barbare-brute, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet :2ᵉ critique sur 19 ou 20, inflige à la cible -2 FOR, -2 DEX, -2 CHA.

    Les coups critiques du barbare sont terribles et provoquent des handicaps durables. Lorsqu’il obtient un critique sur 19 ou 20, il inflige à sa cible une pénalité de -2 en FOR, DEX et CHA jusqu’à ce qu’elle soit complètement guérie.
  effets:
    - { sur: attribut, attribut: Critique, operation: maximum, valeur: 19 }

- id: barbare-brute-force-heroique
  sorte: capacite
  nom: Force héroïque
  champs: { voie: barbare-brute, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 FOR, 2d20 au test de FOR.

    Le barbare augmente sa valeur de FOR de +2 et il peut désormais lancer deux d20 à chaque fois qu’un test de FOR lui est demandé et garder le meilleur résultat.
  effets:
    - { sur: attribut, attribut: FOR, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "FOR"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: barbare-rage
  sorte: voie
  nom: Voie de la rage
  etiquettes: [profil, barbare]
  description: |-
    1. Cri de guerre
    2. Défier la mort
    3. Rage du berserk
    4. Même pas mal
    5. Furie du berserk
  effets:
    - { sur: rang, entree: barbare-rage-cri-de-guerre, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: barbare-rage-defier-la-mort, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: barbare-rage-rage-du-berserk, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: barbare-rage-meme-pas-mal, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: barbare-rage-furie-du-berserk, valeur: 1, condition: 'rang >= 5' }

- id: barbare-rage-cri-de-guerre
  sorte: capacite_active
  nom: Cri de guerre
  champs: { voie: barbare-rage, rangVoie: 1, activation: Action limitée }
  description: |-
    Effet : effraie les adversaires, -2 contact sur le barbare.

    Une fois par combat, le barbare pousse un hurlement qui effraie ses adversaires. Tout ennemi dont la FOR et les PV maximum sont inférieurs à ceux du barbare subit un malus de -2 à ses tests d'attaque au contact contre le personnage pour le reste du combat. Cette capacité ne nécessite plus d'action de mouvement à partir du rang 4.
  effets:
    - {
        sur: jet,
        cote: cible,
        si: 'arme.attaque == "Contact" ou score == "Contact"',
        ajout: { bonus: '-2' },
      }

- id: barbare-rage-defier-la-mort
  sorte: capacite
  nom: Défier la mort
  champs: { voie: barbare-rage, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : survit à la mort sur test de CON avec 1 PV.

    Lorsque le barbare subit des DM d'une attaque qui devrait l'amener à 0 PV, il peut réaliser un test de CON difficulté 10. En cas de réussite, il conserve 1 PV. La difficulté augmente de 10 à chaque blessure supplémentaire reçue par la suite. S'il est enragé, il obtient un bonus de +10 à ces tests.

- id: barbare-rage-rage-du-berserk
  sorte: capacite_active
  nom: Rage du berserk
  champs: { voie: barbare-rage, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : +2 contact, +1d6 DM, -4 Contact.
    Dure : tant qu'il reste des ennemis.

    Le barbare entre dans une rage berserk pour le reste du combat, ce qui le rend particulièrement dangereux. Il obtient un bonus de +2 en attaque et +1d6 aux DM pour ses attaques au contact, mais perd 4 en DEF et ne peut plus utiliser de sort ou de bouclier.
  effets:
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: '2', famille: rage }
    - {
        sur: jet,
        si: 'arme.attaque == "Contact" ou score == "Contact" ou action == "coup-de-corne" ou action == "coup-de-bouclier" ou action == "griffes" ou action == "choc-electrique" ou action == "mains-d-energie" ou action == "mains-nues" ou action == "arme-d-argent" ou action == "baton-de-mage"',
        ajout: { variable: desDM, ajouter: '1' },
      }
    - {
        sur: attribut,
        attribut: Defense,
        operation: ajouter,
        valeur: '-4',
        condition: 'non possede("prestige-barbare-glaces-rage-froide")',
      }

- id: barbare-rage-meme-pas-mal
  sorte: capacite_active
  nom: Même pas mal
  champs: { voie: barbare-rage, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : +1d6 DM et rage ou furie gratuite.
    Dure : 3 prochains tours.

    Lorsqu'il subit un coup critique, cela a pour effet de décupler la rage du barbare. Il peut immédiatement entrer en Rage ou en Furie (action gratuite), et gagne un bonus de +1d6 aux DM pour ses attaques au contact pour les 3 prochains tours. Le joueur peut choisir de reporter l'attaque critique sur le barbare à la fin de la rage ou de la furie.
  effets:
    - {
        sur: jet,
        si: 'arme.attaque == "Contact" ou score == "Contact" ou action == "coup-de-corne" ou action == "coup-de-bouclier" ou action == "griffes" ou action == "choc-electrique" ou action == "mains-d-energie" ou action == "mains-nues" ou action == "arme-d-argent" ou action == "baton-de-mage"',
        ajout: { variable: desDM, ajouter: '1' },
      }

- id: barbare-rage-furie-du-berserk
  sorte: capacite_active
  nom: Furie du berserk
  champs: { voie: barbare-rage, rangVoie: 5, activation: Action limitée }
  description: |-
    Effet : +3 contact, +2d6 DM, -6 DEF.
    Dure : 3 prochains tours.

    Au lieu de la Rage du berserk, le barbare peut entrer s'il le souhaite en Furie du berserk, qui lui donne +3 en attaque et +2d6 aux DM pour une pénalité de DEF de -6. La difficulté du test de SAG pour sortir prématurément de cet état passe à 16.
  effets:
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: '3', famille: rage }
    - {
        sur: jet,
        si: 'arme.attaque == "Contact" ou score == "Contact" ou action == "coup-de-corne" ou action == "coup-de-bouclier" ou action == "griffes" ou action == "choc-electrique" ou action == "mains-d-energie" ou action == "mains-nues" ou action == "arme-d-argent" ou action == "baton-de-mage"',
        ajout: { variable: desDM, ajouter: '2' },
      }
    - {
        sur: attribut,
        attribut: Defense,
        operation: ajouter,
        valeur: '-6',
        condition: 'non possede("prestige-barbare-glaces-rage-froide")',
      }

- id: barbare-pagne
  sorte: voie
  nom: Voie du pagne
  etiquettes: [profil, barbare]
  description: |-
    1. Vigueur
    2. Peau de pierre
    3. Tatouages
    4. Peau d'acier
    5. Constitution héroïque
  effets:
    - { sur: rang, entree: barbare-pagne-vigueur, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: barbare-pagne-peau-de-pierre, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: barbare-pagne-tatouages, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: barbare-pagne-peau-d-acier, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: barbare-pagne-constitution-heroique, valeur: 1, condition: 'rang >= 5' }

- id: barbare-pagne-vigueur
  sorte: capacite
  nom: Vigueur
  etiquettes: [test]
  champs:
    {
      voie: barbare-pagne,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '2 * rang("barbare-pagne")',
    }
  description: |-
    Effet : +2 par rang aux tests de course, saut, escalade.

    Le barbare est un athlète capable de prouesses physiques extraordinaires, il obtient un bonus de +2 par Rang dans la voie aux tests de course, de saut ou d'escalade.

- id: barbare-pagne-peau-de-pierre
  sorte: capacite
  nom: Peau de pierre
  champs: { voie: barbare-pagne, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : + mod. CON en Défense.

    Le barbare est particulièrement endurci, il reçoit un bonus de Défense égal à son Mod. de CON.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 'mod(@CON)' }

- id: barbare-pagne-tatouages
  sorte: capacite
  nom: Tatouages
  champs: { voie: barbare-pagne, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : +5 au choix : FOR, CON, DEX ou SAG.

    Le barbare possède un tatouage magique qui améliore ses performances physiques. Au choix : taureau (+5 aux tests de FOR), ours (+5 aux tests de CON), panthère (+5 aux tests de DEX) ou chouette (+5 aux tests de SAG).
  effets:
    - { sur: jet, si: 'caracteristique == source.carac', ajout: { bonus: '5' } }

- id: barbare-pagne-peau-d-acier
  sorte: capacite
  nom: Peau d'acier
  champs: { voie: barbare-pagne, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : -3 DM reçus.

    Le barbare ne sent plus la douleur et ignore les égratignures, il réduit tous les DM subis de 3 points. Il subit toujours au moins 1 point de DM de chaque attaque reçue.
  effets:
    - { sur: attribut, attribut: RD, operation: ajouter, valeur: 3 }

- id: barbare-pagne-constitution-heroique
  sorte: capacite
  nom: Constitution héroïque
  champs: { voie: barbare-pagne, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 CON, 2d20 aux tests de CON.

    Le barbare augmente sa valeur de CON de +2 et il peut désormais lancer deux d20 à chaque fois qu'un test de CON lui est demandé et garder le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CON, operation: ajouter, valeur: 2 }
    - {
        sur: jet,
        si: 'caracteristique == "CON" ou action == "defier-la-mort"',
        ajout: { variable: avantagesTest, ajouter: '1' },
      }

- id: barbare-pourfendeur
  sorte: voie
  nom: Voie du pourfendeur
  etiquettes: [profil, barbare]
  description: |-
    1. Réflexes félins
    2. Charge
    3. Enchaînement
    4. Déchaînement d'acier
    5. Attaque tourbillon
  effets:
    - { sur: rang, entree: barbare-pourfendeur-reflexes-felins, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: barbare-pourfendeur-charge, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: barbare-pourfendeur-enchainement, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: barbare-pourfendeur-dechainement-d-acier,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: barbare-pourfendeur-attaque-tourbillon,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: barbare-pourfendeur-reflexes-felins
  sorte: capacite
  nom: Réflexes félins
  etiquettes: [test]
  champs:
    {
      voie: barbare-pourfendeur,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: 'rang("barbare-pourfendeur")',
    }
  description: |-
    Effet : +1 par rang aux tests de DEX d'esquive.

    Le barbare obtient un bonus de +1 par Rang dans cette voie à son score d'initiative et à tous les tests de DEX destinés à esquiver (boule de feu, souffle, pièges, etc.).
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 'rang("barbare-pourfendeur")' }

- id: barbare-pourfendeur-charge
  sorte: capacite
  nom: Charge
  champs: { voie: barbare-pourfendeur, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet : +2 contact, +1d6 DM.

    Le barbare se déplace en ligne droite d'au moins 5 mètres (20 mètres au maximum) et effectue une attaque au contact avec un bonus de +2 en attaque et +1d6 aux DM.

- id: barbare-pourfendeur-enchainement
  sorte: capacite
  nom: Enchaînement
  champs: { voie: barbare-pourfendeur, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : attaque gratuite sur mort de la cible.

    Chaque fois que le barbare réduit un adversaire à 0 PV avec une attaque de contact, il bénéficie d'une action d'attaque gratuite sur un autre adversaire au contact.

- id: barbare-pourfendeur-dechainement-d-acier
  sorte: capacite
  nom: Déchaînement d'acier
  champs: { voie: barbare-pourfendeur, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : contact sur toutes les cibles sur 10 mètres en ligne droite.

    Le barbare parcourt 10 mètres en ligne droite en dépassant autant d'ennemis qu'il le souhaite. Il porte une attaque à chaque adversaire sur son passage. Il ne peut terminer son déplacement en étant encore occupé par un ennemi.

- id: barbare-pourfendeur-attaque-tourbillon
  sorte: capacite
  nom: Attaque tourbillon
  champs: { voie: barbare-pourfendeur, rangVoie: 5, activation: Action limitée }
  description: |-
    Effet : contact sur 5 mètres autour du barbare.

    Une fois par combat, le barbare tourne sur lui-même en assénant des attaques à toutes les cibles au contact. Il inflige automatiquement des DM correspondant à l'arme utilisée (plus tous les bonus habituels) à toutes les cibles dans un rayon de 5 m autour de lui.

- id: barbare-primitif
  sorte: voie
  nom: Voie du primitif
  etiquettes: [profil, barbare]
  description: |-
    1. Proche de la nature
    2. Armure de vent
    3. Vigilance
    4. Résistance à la magie
    5. Vitalité débordante
  effets:
    - { sur: rang, entree: barbare-primitif-proche-de-la-nature, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: barbare-primitif-armure-de-vent, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: barbare-primitif-vigilance, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: barbare-primitif-resistance-a-la-magie,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - { sur: rang, entree: barbare-primitif-vitalite-debordante, valeur: 1, condition: 'rang >= 5' }

- id: barbare-primitif-proche-de-la-nature
  sorte: capacite
  nom: Proche de la nature
  etiquettes: [test]
  champs:
    {
      voie: barbare-primitif,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: 'rang("barbare-primitif")',
    }
  description: |-
    Effet : +1 par rang aux tests de survie ou discrétion en milieu naturel.

    Le barbare obtient un bonus de +1 par Rang dans la voie aux tests de survie, de discrétion ou d'observation en milieu naturel.

- id: barbare-primitif-armure-de-vent
  sorte: capacite
  nom: Armure de vent
  champs: { voie: barbare-primitif, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : + rang Défense si pas d'armure.

    Le barbare obtient un bonus en Défense égal à son Rang dans la voie lorsqu'il ne porte aucune armure.
  effets:
    - {
        sur: attribut,
        attribut: Defense,
        operation: ajouter,
        valeur: 'rang("barbare-primitif")',
        condition: 'compte_actifs("armure") == somme_actifs("armure", "bouclier")',
      }

- id: barbare-primitif-vigilance
  sorte: capacite
  nom: Vigilance
  etiquettes: [test]
  champs: { voie: barbare-primitif, rangVoie: 3, activation: Capacité passive, bonusTest: '5' }
  description: |-
    Effet : +5 aux tests de détection des pièges ou embuscades, immunité aux attaques surprises.

    Le barbare possède des sens très affûtés, il est difficile de le surprendre, il gagne un bonus de +5 à tous les tests pour détecter les pièges (mécaniques ou magiques) ou les embuscades. Il devient immunisé aux Attaques sournoises d'un voleur, à l'Embuscade d'un rôdeur ou à toute capacité similaire d'une créature.

- id: barbare-primitif-resistance-a-la-magie
  sorte: capacite
  nom: Résistance à la magie
  champs: { voie: barbare-primitif, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : résiste à la magie sur test de magie opposé au lanceur de sort une fois par tour.

    Le barbare devient capable de résister à la magie. Lorsqu'il est la cible d'un sort, une fois par tour, il peut faire un test d'attaque magique (Mod. de SAG) opposé à celui du sort. En cas de réussite, il n'en subit pas les effets.

- id: barbare-primitif-vitalite-debordante
  sorte: capacite
  nom: Vitalité débordante
  champs: { voie: barbare-primitif, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : récupère 1d6 PV par heure.

    Le barbare guérit à une vitesse presque surnaturelle. Tant qu'il lui reste au moins 1 PV, il récupère 1d6 PV par heure, de nuit comme de jour.

- id: barde-seduction
  sorte: voie
  nom: Voie de la séduction
  etiquettes: [profil, barde]
  description: |-
    1. Charmant
    2. Dentelles et rapière
    3. Arme secrète
    4. Suggestion
    5. Charisme héroïque
  effets:
    - { sur: rang, entree: barde-seduction-charmant, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: barde-seduction-dentelles-et-rapiere, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: barde-seduction-arme-secrete, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: barde-seduction-suggestion, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: barde-seduction-charisme-heroique, valeur: 1, condition: 'rang >= 5' }

- id: barde-seduction-charmant
  sorte: capacite
  nom: Charmant
  etiquettes: [test]
  champs:
    {
      voie: barde-seduction,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '2 * rang("barde-seduction")',
    }
  description: |-
    Effet : +2 par rang test de CHA

    Le barde obtient un bonus de +2 par rang atteint dans cette voie pour tous ses tests de CHA visant à séduire, baratiner ou mentir.

- id: barde-seduction-dentelles-et-rapiere
  sorte: capacite
  nom: Dentelles et rapière
  champs: { voie: barde-seduction, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: +1 DEF par rang contre les attaques contact

    Le barde ne met pas d'armure, cela ne sied point en société. Sa seule armure est la dentelle, sa seule défense, la rapière. Lorsqu'il ne porte aucune armure et combat avec une rapière ou une épée, le barde obtient un bonus de +1 en DEF contre les attaques au contact par Rang possédé dans cette Voie.
  effets:
    - {
        sur: attribut,
        attribut: DefContact,
        operation: ajouter,
        valeur: 'rang("barde-seduction")',
        condition: '@ArmurePortee == 0',
      }

- id: barde-seduction-arme-secrete
  sorte: capacite
  nom: Arme secrète
  champs: { voie: barde-seduction, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : subterfuge, la cible subit -10 contact, distance, magie, defense:
    Durée : 1 tour Une fois par combat,

    le barde peut utiliser un subterfuge de séducteur pour surprendre et déstabiliser un adversaire du sexe opposé. Ce peut être un baiser fougueux soudainement délivré au coeurd'une mêlée, un sein qui s'échappe d'un bustier par mégarde, une main qui s'égare par le plus grand des hasards... Il doit réussir un test de CHA de difficulté égale à l'INT de son adversaire. En cas de succès celui-ci subit un malus de -10 en attaque et en DEF pendant 1 tour.

- id: barde-seduction-suggestion
  sorte: capacite
  nom: Suggestion
  etiquettes: [sort]
  champs:
    {
      voie: barde-seduction,
      rangVoie: 4,
      activation: 'Action limitée, sortilège',
      nbDes: 0,
      contre: PV_Max,
    }
  description: |-
    Effet : la cible devient larbin personnel
    Durée : 24 heures Une fois par jour,

    le barde peut suggérer une action à une créature en réussissant un test d'attaque magique avec pour difficulté les PV maximum de celle-ci. En cas de réussite la créature fera tout son possible pour satisfaire sa demande pendant 24 heures. Elle évitera les actions suicidaires (ce qui lui donnerait immédiatement un test d'INT difficulté 10 pour échapper au sort).

- id: barde-seduction-charisme-heroique
  sorte: capacite
  nom: Charisme héroïque
  champs: { voie: barde-seduction, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 CHA, 2d20 sur test de CHA

    Le barde augmente sa valeur de CHA de +2. Il peut de plus lancerdeux d20 à chaque fois qu'un test de CHA lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CHA, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "CHA"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: barde-escrime
  sorte: voie
  nom: Voie de l’escrime
  etiquettes: [profil, barde]
  description: |-
    1. Précision
    2. Intelligence du combat
    3. Feinte
    4. Attaque flamboyante
    5. Botte mortelle
  effets:
    - { sur: rang, entree: barde-escrime-precision, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: barde-escrime-intelligence-du-combat, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: barde-escrime-feinte, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: barde-escrime-attaque-flamboyante, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: barde-escrime-botte-mortelle, valeur: 1, condition: 'rang >= 5' }

- id: barde-escrime-precision
  sorte: capacite
  nom: Précision
  champs: { voie: barde-escrime, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: utilise Distance au contact à la place de Contact.

    Le barde peut utiliser son score d'attaque à distance pour combattre au contact lorsqu'il emploie une arme à une main légère comme une dague, une épée courte ou une rapière.
  effets:
    - {
        sur: jet,
        si: 'arme.attaque == "Contact" et a_etiquette(arme, "legere")',
        ajout: { bonus: 'max(0, @Distance - @Contact)' },
      }
- id: barde-escrime-intelligence-du-combat
  sorte: capacite
  nom: Intelligence du combat
  champs: { voie: barde-escrime, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : + mod. d'INT en Init et en Défense

    Le barde ajoute son Mod. d'INT en Initiative et en DEF en plus de son Mod. de DEX.
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 'mod(@INT)' }
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 'mod(@INT)' }

- id: barde-escrime-feinte
  sorte: capacite
  nom: Feinte
  champs: { voie: barde-escrime, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : au tour suivant +5 Contact, +2d6 DM

    Le barde effectue une attaque fictive pour déséquilibrer son adversaire et réaliser ensuite une attaque mortelle. Faites un test d'attaque normal à ce tour mais n'infligez aucun dégât. Au tour suivant, si vous attaquez le même adversaire,vous profiterez d'un bonus de +5 en attaque et, si votre feinte était réussie, de +2d6 aux DM.

- id: barde-escrime-attaque-flamboyante
  sorte: capacite
  nom: Attaque flamboyante
  champs: { voie: barde-escrime, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : + mod. CHA en Contact et DM

    Le style de combat du barde est flamboyant et surprenant : avec cette Capacité, il effectue une attaque de contact avec un bonus d'attaque et de DM égal à son Mod. de CHA (en plus du Mod. de FOR ou de DEX).

- id: barde-escrime-botte-mortelle
  sorte: capacite
  nom: Botte mortelle
  champs: { voie: barde-escrime, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2d6 DM si Contact >=Def+10 de la cible

    Lors d'une attaque au contact, s'il obtient un score total d'attaque supérieur ou égal à la DEF de son adversaire +10 points, le barde obtient un bonus de +2d6 aux DM de son attaque.

- id: barde-musicien
  sorte: voie
  nom: Voie du musicien
  etiquettes: [profil, barde]
  description: |-
    1. Chant des héros
    2. Attaque sonore
    3. Zone de silence
    4. Danse irrésistible
    5. Musique fascinante
  effets:
    - { sur: rang, entree: barde-musicien-chant-des-heros, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: barde-musicien-attaque-sonore, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: barde-musicien-zone-de-silence, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: barde-musicien-danse-irresistible, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: barde-musicien-musique-fascinante, valeur: 1, condition: 'rang >= 5' }

- id: barde-musicien-chant-des-heros
  sorte: capacite
  nom: Chant des héros
  champs: { voie: barde-musicien, rangVoie: 1, activation: Action limitée }
  description: |-
    Effet: +1 à tous les tests si à portée de voix
    Durée : [5 mod. CHA] tours

    Le barde chante et inspire ses compagnons : tous les alliés à portée de voix obtiennent un bonus de +1 à tous leurs tests pendant [5+ Mod. de CHA] tours.

- id: barde-musicien-attaque-sonore
  sorte: capacite
  nom: Attaque sonore
  champs: { voie: barde-musicien, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: [1d6 + mod. CHA] DM sur 10 mètres de face

    Le barde pousse un cri dont les effets sont dévastateurs ou produit un son avec un instrument à cette même fin). Sur un test d'attaque magique réussi, il inflige [1d6 + Mod. de CHA] DM à toutes les cibles lui faisant face sur une portée de 10 m.

- id: barde-musicien-zone-de-silence
  sorte: capacite
  nom: Zone de silence
  champs: { voie: barde-musicien, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: -2 aux tests Contact sur 5-30 mètres
    Durée : [1d6 + mod. CHA] tours

    Le barde crée une zone de silence fixe de 5 mètres de diamètre, jusqu'à une portée de 30 mètres, pendant [1d6+ Mod. de CHA] tours. Tous les sons émis dans cette sphère sont annulés. La zone n'empêche pas le lancement des sorts mais inflige un malus de -2 à tous les tests d'attaque magique.

- id: barde-musicien-danse-irresistible
  sorte: capacite
  nom: Danse irrésistible
  etiquettes: [sort]
  champs: { voie: barde-musicien, rangVoie: 4, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : la cible danse et subit -4 Contact, Distance, Magie, Défense.
    Durée : [1d4 + mod. CHA] tours

    Le barde joue une gigue endiablée aux effets magiques. S'il réussit un test d'attaque magique contre la créature qu'il cible, celle-ci se met à danser pendant [1d4+ Mod. de CHA] tours et subit un malus de -4 aux tests d'attaque et en DEF.

- id: barde-musicien-musique-fascinante
  sorte: capacite
  nom: Musique fascinante
  champs: { voie: barde-musicien, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : contrôle toutes les cibles dans les 30 mètre dont les PV < ou = [5 + mod. CHA] du barde

    Le barde joue de la musique pour fasciner et « contrôler » toutes les créatures de son choix (rats, gobelins, humains, etc.) dans un rayon de 30 m. Seules les créatures dont les PV sont inférieurs ou égaux à [5 + Mod. de CHA] du barde répondent. Les créatures sortent de leur cachette et se dirigent vers le barde, elles le suivent tant qu'il continue à jouer. Quand il utilise cette capacité le barde peut également se déplacer de 10 m par tour.

- id: barde-saltimbanque
  sorte: voie
  nom: Voie du saltimbanque
  etiquettes: [profil, barde]
  description: |-
    1. Acrobate
    2. Grâce féline
    3. Lanceur de couteau
    4. Esquive acrobatique
    5. Liberté d’action
  effets:
    - { sur: rang, entree: barde-saltimbanque-acrobate, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: barde-saltimbanque-grace-feline, valeur: 1, condition: 'rang >= 2' }
    - {
        sur: rang,
        entree: barde-saltimbanque-lanceur-de-couteau,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: barde-saltimbanque-esquive-acrobatique,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - { sur: rang, entree: barde-saltimbanque-liberte-d-action, valeur: 1, condition: 'rang >= 5' }

- id: barde-saltimbanque-acrobate
  sorte: capacite
  nom: Acrobate
  etiquettes: [test]
  champs:
    {
      voie: barde-saltimbanque,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: 'rang("barde-saltimbanque")',
    }
  description: |-
    Effet : +1 par rang aux tests de DEX d'esquive

    Le barde obtient un bonus de +1 par Rang dans cette voie à son score d'initiative et à tous les tests de DEX destinés à esquiver (boule de feu, souffle, pièges, etc.).
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 'rang("barde-saltimbanque")' }

- id: barde-saltimbanque-grace-feline
  sorte: capacite
  nom: Grâce féline
  champs: { voie: barde-saltimbanque, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet : +2 contact, + 1d6 DM

    Le barde se déplace en ligne droite d'au moins 5 mètres (20 mètres au maximum) et effectue une attaque au contact avec un bonus de +2 en attaque et + 1d6 DM.

- id: barde-saltimbanque-lanceur-de-couteau
  sorte: capacite
  nom: Lanceur de couteau
  champs: { voie: barde-saltimbanque, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : action gratuite : esquive une attaque sur test de Distance.

    Une fois par tour, le barde peut réaliser une esquive en réussissant un test d'Attaque à Distance contre une Difficulté égale au score obtenu par son adversaire lors de son attaque. En cas de réussite, le barde ne subit aucun DM. Si cette attaque était un critique, il subit tout de même des DM normaux (et annule donc l'effet critique « dégâts doublés »).

- id: barde-saltimbanque-esquive-acrobatique
  sorte: capacite
  nom: Esquive acrobatique
  champs: { voie: barde-saltimbanque, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : action gratuite : esquive une attaque sur test de Contact.

    Une fois par tour, le barde peut réaliser une esquive en réussissant un test d'Attaque à Distance contre une Difficulté égale au score obtenu par son adversaire lors de son attaque. En cas de réussite, le barde ne subit aucun DM. Si cette attaque était un critique, il subit tout de même des DM normaux (et annule donc l'effet critique « dégâts doublés »).

- id: barde-saltimbanque-liberte-d-action
  sorte: capacite
  nom: Liberté d’action
  champs: { voie: barde-saltimbanque, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : immunisé aux formes de contrôle.

    Le barde est immunisé à la peur et à tous les sorts ou effets magiques qui asservissent l'esprit ou le corps (possession, charme, paralysie, ralentissement, etc.).

- id: barde-vagabond
  sorte: voie
  nom: Voie du vagabond
  etiquettes: [profil, barde]
  description: |-
    1. Rumeurs et légendes
    2. Compréhension des langues
    3. Débrouillard
    4. Déguisement
    5. Touche à tout
  effets:
    - { sur: rang, entree: barde-vagabond-rumeurs-et-legendes, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: barde-vagabond-comprehension-des-langues,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: barde-vagabond-debrouillard, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: barde-vagabond-deguisement, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: barde-vagabond-touche-a-tout, valeur: 1, condition: 'rang >= 5' }

- id: barde-vagabond-rumeurs-et-legendes
  sorte: capacite
  nom: Rumeurs et légendes
  etiquettes: [test]
  champs:
    {
      voie: barde-vagabond,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '2 * rang("barde-vagabond")',
    }
  description: |-
    Effet : +2 INT par rang à force de voyager,

    le barde a appris toutes sortes de choses, il obtient un bonus de +2 par Rang dans cette voie aux tests d'INT pour se « souvenir » d'une information historique, politique, géographique ou occulte quipourrait lui être utile.

- id: barde-vagabond-comprehension-des-langues
  sorte: capacite
  nom: Compréhension des langues
  champs: { voie: barde-vagabond, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : maîtrise n'importe quelle langue.
    Durée : [1d6 + mod. CHA] minutes.

    Ce sort permet au barde de lire, écrire et parler n'importe quelle langue ancienne ou vivante pendant [1d6 + Mod. de CHA] minutes.

- id: barde-vagabond-debrouillard
  sorte: capacite
  nom: Débrouillard
  etiquettes: [test]
  champs: { voie: barde-vagabond, rangVoie: 3, activation: Capacité passive, bonusTest: '5' }
  description: |-
    Effet: +5 aux tests de profession, artisanats, ...

    Le barde obtient un bonus de +5 à tous ses tests de survie en nature et aux tests de profession et d'artisanat (forge, charpentier, etc.).

- id: barde-vagabond-deguisement
  sorte: capacite
  nom: Déguisement
  champs: { voie: barde-vagabond, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : prend l'apparence d'une créature
    Durée : 10 minutes

    Ce sort permet au barde de prendre l'apparence de n'importe quelle créature de taille à peu près équivalente (avec une marge d'environ 50 cm). S'il veut imiter une personne en particulier, il lui faudra réussir un test de CHA difficulté 1 (20 s'il ne la connaît pas mais l'a seulement vue, 10 s'il la connaît très bien). Le sort a une durée de 10 minutes.

- id: barde-vagabond-touche-a-tout
  sorte: capacite
  nom: Touche à tout
  champs: { voie: barde-vagabond, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: choisit une capacité de rang 1 à 3.

    Le barde peut choisir n'importe quelle capacité de Rang 1 à 3 de son choix au sein d'un autre profil de Chroniques.

- id: chevalier-guerre
  sorte: voie
  nom: Voie de la guerre
  etiquettes: [profil, chevalier]
  description: |-
    1. Armure sur mesure
    2. Encaisser un coup
    3. Coup de bouclier
    4. Frappe lourde
    5. Force héroïque
  effets:
    - { sur: rang, entree: chevalier-guerre-armure-sur-mesure, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: chevalier-guerre-encaisser-un-coup, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: chevalier-guerre-coup-de-bouclier, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: chevalier-guerre-frappe-lourde, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: chevalier-guerre-force-heroique, valeur: 1, condition: 'rang >= 5' }

- id: chevalier-guerre-armure-sur-mesure
  sorte: capacite
  nom: Armure sur mesure
  champs: { voie: chevalier-guerre, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: 1/2 pénalité d'armure ou DEF+1.

    L'armure du chevalier est parfaitement ajustée, aussi il n'ajoute que la moitié de sa DEF à la difficulté des tests pour lesquels l'armure inflige une pénalité (de même pour les casques). Si vous n'utiliser pas la règle de pénalité des armures, le chevalier obtient un bonus de +1 en DEF lorsqu'il porte une armure métallique.
  effets:
    - {
        sur: attribut,
        attribut: Defense,
        operation: ajouter,
        valeur: '1',
        condition: 'somme_actifs("armure", "metallique") > 0',
      }

- id: chevalier-guerre-encaisser-un-coup
  sorte: capacite_active
  nom: Encaisser un coup
  champs: { voie: chevalier-guerre, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet : DM subits réduit de mod. de DEF, l'armure au prix d'une action.

    Le chevalier se place de façon à dévier un coup sur son armure. A son tour, il fait seulement une action d'attaque ou une action de mouvement. Par la suite, à tout moment avant son prochain tour, il peut retrancher aux dégâts subits suite à une attaque au contact un total égal au Mod. de DEF de son armure (plus d'éventuels bonus de magie et de bouclier).
  effets:
    - {
        sur: jet,
        cote: cible,
        si: 'arme.attaque == "Contact" ou score == "Contact"',
        ajout: { variable: reduction, ajouter: 'somme_actifs("armure", "def")' },
      }

- id: chevalier-guerre-coup-de-bouclier
  sorte: capacite
  nom: Coup de bouclier
  champs: { voie: chevalier-guerre, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : action gratuite : attaque de bouclier Contact 1d12, [1d4 + mod. FOR] DM.

    Le chevalier peut effectuer à chaque tour une attaque au bouclier avec un d12 au lieu du d20 (action gratuite) qui inflige [1d4 + Mod. de FOR] DM.

- id: chevalier-guerre-frappe-lourde
  sorte: capacite
  nom: Frappe lourde
  champs: { voie: chevalier-guerre, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : Contact 1d12, +2d6 DM. Ignore 1/2 RD de la créature.

    Le chevalier effectue une attaque au contact avec 1d12 au lieu du d20 (en ajoutant normalement son score d'attaque). Si l'attaque est réussie, il ajoute +2d6 aux DM. Il ignore la moitié de la réduction des DM de la créature(RD), si elle possède cette capacité.

- id: chevalier-guerre-force-heroique
  sorte: capacite
  nom: Force héroïque
  champs: { voie: chevalier-guerre, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 FOR, 2d20 aux tests de FOR.

    Le chevalier augmente sa valeur de FOR de +2. Il peut désormais lancer deux d20 à chaque fois qu'un test de FOR lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: FOR, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "FOR"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: chevalier-noblesse
  sorte: voie
  nom: Voie de la noblesse
  etiquettes: [profil, chevalier]
  description: |-
    1. Eduqué
    2. Autorité naturelle
    3. Ecuyer
    4. Massacrer la piétaille
    5. Formation d’élite
  effets:
    - { sur: rang, entree: chevalier-noblesse-eduque, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: chevalier-noblesse-autorite-naturelle,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: chevalier-noblesse-ecuyer, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: chevalier-noblesse-massacrer-la-pietaille,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - { sur: rang, entree: chevalier-noblesse-formation-d-elite, valeur: 1, condition: 'rang >= 5' }

- id: chevalier-noblesse-eduque
  sorte: capacite
  nom: Eduqué
  champs: { voie: chevalier-noblesse, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +rang INT, +rang CHA.

    Le chevalier sait lire et écrire, il gagne +1 par rang dans la voie à tous les tests d'INT et de CHA.
  effets:
    - {
        sur: jet,
        si: 'caracteristique == "INT" ou caracteristique == "CHA"',
        ajout: { bonus: 'rang("chevalier-noblesse")' },
      }

- id: chevalier-noblesse-autorite-naturelle
  sorte: capacite
  nom: Autorité naturelle
  etiquettes: [test]
  champs: { voie: chevalier-noblesse, rangVoie: 2, activation: Capacité passive, bonusTest: '5' }
  description: |-
    Effet: [1 + mod. CHA] Init et DEF, +5 aux tests de CHA pour intimider.

    Le chevalier obtient un bonus égal à [1 + Mod. de CHA] en Initiative et en DEF. De plus, il bénéficie d'un bonus de +5 aux tests de CHA réalisés pour donner des ordres ou intimider.
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: '1 + mod(@CHA)' }
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: '1 + mod(@CHA)' }

- id: chevalier-noblesse-ecuyer
  sorte: capacite
  nom: Ecuyer
  champs: { voie: chevalier-noblesse, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet: critique sur 19-20, Ecuyer : Init 14, DEF 14, PV 13,Contact 2 + 3, DM 1d8+1.

    Le chevalier dispose d'un écuyer à son service (Initiative 14, Défense 14, PV 13, Att +3, DM 1d8+1). Il est absolument loyal à son maître et lui sert de serviteur, il s'occupe de sa monture et de son équipement, prépare le campement, panse. les blessures, etc. Grâce à l'écuyer, les armes du chevalier sont parfaitement affûtées et infligent des critiques sur 19 ou 20. De plus, le chevalier, sa monture et jusqu'à [1 + Mod. de CHA] alliés récupèrent 2d6 PV supplémentaires chaque nuit s'ils profitent des services de l'écuyer. Tous les frais sont pris en charge par la capacité. Si l'écuyer vient à mourir, le chevalier en prendra un autre à son service au niveau suivant.
  effets:
    - { sur: attribut, attribut: Critique, operation: maximum, valeur: 19 }

- id: chevalier-noblesse-massacrer-la-pietaille
  sorte: capacite
  nom: Massacrer la piétaille
  champs: { voie: chevalier-noblesse, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet: +1d6 DM contre la pietaille.

    Le chevalier ajoute + 1d6 aux DM contre la piétaille. S'il y a au moins 4 créatures aux statistiques semblables impliquées dans le combat, elles sont assimilées à de la piétaille (même si leur nombre est par la suite réduit à moins de 4 au cours du combat). Les grandes créatures et les cavaliers ne sont jamais considérés comme de la piétaille.

- id: chevalier-noblesse-formation-d-elite
  sorte: capacite
  nom: Formation d’élite
  champs: { voie: chevalier-noblesse, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: choisit une capacité de rang 1 à 3 des familles de combattants ou voyageurs.

    Le chevalier possède les moyens et la culture nécessaire pour obtenir une formation dans n'importe quel domaine qui lui sied. Choisissez une capacité de rang 1 à 3 dans n'importe quel profil issu de la famille (voir page 82, Voies de prestige) des combattants ou des voyageurs.

- id: chevalier-cavalier
  sorte: voie
  nom: Voie du cavalier
  etiquettes: [profil, chevalier]
  description: |-
    1. Fidèle monture
    2. Cavalier émérite
    3. Monture magique
    4. Charge
    5. Monture fantastique
  effets:
    - { sur: rang, entree: chevalier-cavalier-fidele-monture, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: chevalier-cavalier-cavalier-emerite, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: chevalier-cavalier-monture-magique, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: chevalier-cavalier-charge, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: chevalier-cavalier-monture-fantastique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: chevalier-cavalier-fidele-monture
  sorte: capacite
  nom: Fidèle monture
  champs: { voie: chevalier-cavalier, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : fidèle monture: FOR+4, DEX+0, CON+4, INT-2, SAG+O, CHA+0, Init 10, DEF 1, PV 15, Contact+5 (Ruade), DM 1d6+4.

    Le chevalier possède un puissant destrier (voir marge cicontre), c'est un cheval de guerre bien dressé quicomprend les ordres simples. Acheval, il peut ajouter un déplacement de 10 m avant ou après une action normale (par exemple faire 10 m et une action limitée). La monture n'attaque que si elle est elle-même attaquée au contact par une créature.

- id: chevalier-cavalier-cavalier-emerite
  sorte: capacite_active
  nom: Cavalier émérite
  champs: { voie: chevalier-cavalier, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: +2 Conatct en selle,DEF destrier = DEF chevalier.

    Lorsqu'il est en selle, le chevalier gagne un bonus de +2 en attaque au contact, et sa monture obtient une DEF égale à celle du chevalier. Monter ou descendrede cheval est désormais uneaction gratuite.
  effets:
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: '2' }

- id: chevalier-cavalier-monture-magique
  sorte: capacite
  nom: Monture magique
  champs: { voie: chevalier-cavalier, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : invoque ou renvoi la monture

    Le chevalier obtient une monture magique, qui peut apparaître et disparaître depuis un autre plan à volonté. Il peut l'invoquer à tout moment (c'est une action limitée) et elle apparaît alors pour semettre à son service. Lorsqu'il la laisse au moins une heure dans son plan d'origine, elle guérit l'ensemble de ses PV.

- id: chevalier-cavalier-charge
  sorte: capacite
  nom: Charge
  champs: { voie: chevalier-cavalier, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : charge sur 40 mètres, 2d20 Contact +1 d6 DM à cheval,

    le chevalier peut effectuer un déplacement de 40 m en ligne droite, et une attaque de contact placée au moment son choix. Il doit parcourir au moins 10 m avant d'attaquer, mais peut réaliser le reste du déplacement à sa guise. Le joueur lance deux d20 à son test d'attaque et garde le meilleur résultat, tout en ajoutant + 1d6 aux DM. Une créature située sur la trajectoire de la charge doit réussir un test de FOR difficulté 18 ou être contrainte de céder le passage en subissant 1d6 DM. Si elle réussit ce test, la Charge est bloquée et le tour du chevalier se termine.

- id: chevalier-cavalier-monture-fantastique
  sorte: capacite
  nom: Monture fantastique
  champs: { voie: chevalier-cavalier, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : Pégase : Init 15, DEF 16,PV [5* niveau], Contact+8, DM 1d6+4.

    Le chevalier obtient une monture volante (pégase, griffon, hippogriffe, drake, etc.). Init 15, DEF 16, PV [5 x niveau], Att +8, DM 1d6+4. Lorsqu'il est en selle, le chevalier peut faire attaquer sa monture une fois par tour (action gratuite), à la même Initiative que lui, avec un score d'attaque égal à son niveau +3. En vol, la monture couvre une distance de 30 m par action de mouvement. Les capacités de la Monture magique s'appliquent également.

- id: chevalier-heros
  sorte: voie
  nom: Voie du héros
  etiquettes: [profil, chevalier]
  description: |-
    1. Ignorer la douleur
    2. Piqures d’insecte
    3. Laissez-le-moi !
    4. Seul contre tous
    5. Charisme héroïque
  effets:
    - { sur: rang, entree: chevalier-heros-ignorer-la-douleur, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: chevalier-heros-piqures-d-insecte, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: chevalier-heros-laissez-le-moi, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: chevalier-heros-seul-contre-tous, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: chevalier-heros-charisme-heroique, valeur: 1, condition: 'rang >= 5' }

- id: chevalier-heros-ignorer-la-douleur
  sorte: capacite
  nom: Ignorer la douleur
  champs: { voie: chevalier-heros, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : applique les DM en fin de combat.

    Une fois par combat, le chevalier peut noter à part les DM subit par une attaque. Il n'en subira les effets que lorsque le combat sera terminé.

- id: chevalier-heros-piqures-d-insecte
  sorte: capacite
  nom: Piqures d’insecte
  champs: { voie: chevalier-heros, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : -rang DM subits par Distance.

    Lorsqu'il porte une armure lourde (demiplaques ou plus), le chevalier réduit les DM subits par les attaques à distances d'un montant égal au rang atteint dans cette voie.
  effets:
    - {
        sur: jet,
        cote: cible,
        condition: 'somme_actifs("armure", "lourde") > 0',
        si: 'arme.attaque == "Distance" ou score == "Distance"',
        ajout: { variable: reduction, ajouter: 'rang("chevalier-heros")' },
      }

- id: chevalier-heros-laissez-le-moi
  sorte: capacite
  nom: Laissez-le-moi !
  champs: { voie: chevalier-heros, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : +1d6 DM sur le leader.

    Le chevalier met un point d'honneur à combattre le leader ennemi. Lorsqu'il peut aisément être identifié dans un groupe d'au moins 4 créatures, le chevalier lui inflige +1d6 DM par attaque.

- id: chevalier-heros-seul-contre-tous
  sorte: capacite
  nom: Seul contre tous
  champs: { voie: chevalier-heros, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : contre attaque immédiate.

    Le chevalier sait faire face à de nombreux adversaires, en tentant de profiter d'une éventuelle faille dans leur garde. Chaque fois qu'un des adversaires l'attaque, il bénéficie d'une action d'attaque immédiate contre celui-ci (valablemême si la créature l'attaque plusieurs fois).

- id: chevalier-heros-charisme-heroique
  sorte: capacite
  nom: Charisme héroïque
  champs: { voie: chevalier-heros, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: +2 CHA, 2d20 sur tests de CHA.

    Le chevalier augmente sa valeur de CHA de +2. Il peut désormais lancer deux d20 à chaque fois qu'un test de CHA lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CHA, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "CHA"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: chevalier-meneur-d-homme
  sorte: voie
  nom: Voie du meneur d’homme
  etiquettes: [profil, chevalier]
  description: |-
    1. Sans peur
    2. Intercepter
    3. Exemplaire
    4. Ordre de bataille
    5. Charge fantastique
  effets:
    - { sur: rang, entree: chevalier-meneur-d-homme-sans-peur, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: chevalier-meneur-d-homme-intercepter, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: chevalier-meneur-d-homme-exemplaire, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: chevalier-meneur-d-homme-ordre-de-bataille,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: chevalier-meneur-d-homme-charge-fantastique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: chevalier-meneur-d-homme-sans-peur
  sorte: capacite
  nom: Sans peur
  champs: { voie: chevalier-meneur-d-homme, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : immunisé contre la peur.

    Le chevalier est immunisé aux attaques de peur et il offre un bonus de [2 + Mod. de CHA] à tous ses alliés contre ce type d'effet.

- id: chevalier-meneur-d-homme-intercepter
  sorte: capacite
  nom: Intercepter
  champs: { voie: chevalier-meneur-d-homme, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: encaisse un coup à la place d'un allié, -rang DM subit

    Une fois par tour, le chevalier peut encaisser un coup à la place d'un allié à ses cotés. Il utilise sa DEF plutôt que celle de la cible initiale et retranche aux DM son rang dans la voie.

- id: chevalier-meneur-d-homme-exemplaire
  sorte: capacite
  nom: Exemplaire
  champs: { voie: chevalier-meneur-d-homme, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : relance le test d'attaque raté d'un allié.

    Une fois par tour, le chevalier permet à un allié qui combat le même adversaire que lui de relancer le d20 d'un test d'attaque, s'il s'agissait d'un d'échec.

- id: chevalier-meneur-d-homme-ordre-de-bataille
  sorte: capacite
  nom: Ordre de bataille
  champs: { voie: chevalier-meneur-d-homme, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : un allié gagne une action gratuite (mouvement ou attaque).

    Le chevalier donne des ordres tactiques pertinents au coeur de la bataille. Une fois par tour, il octroie une action supplémentaire gratuite à un allié en vue (une action de mouvement ou une action d'attaque, mais pasune action limitée).

- id: chevalier-meneur-d-homme-charge-fantastique
  sorte: capacite
  nom: Charge fantastique
  champs: { voie: chevalier-meneur-d-homme, rangVoie: 5, activation: Action limitée }
  description: |-
    Effet: +3 Contact,Disatnce,Magie, +1d6 DM à tous le groupe.

    Une fois par combat, à l'initiative du chevalier, lui-même et tous ses alliés en vue bénéficient immédiatement d'un déplacement d'un maximum de 20 m en ligne droite, suivi d'une action d'attaque avec un bonus de +3 au testde réussite et +1d6 aux dégâts. Résolvez d'abord tous les déplacements en commençant par le chevalier, puis par ordre d'initiative. Ensuite effectuez xtoutes les attaques dans le même ordre.

- id: druide-nature
  sorte: voie
  nom: Voie de la nature
  etiquettes: [profil, druide]
  description: |-
    1. Maître de la survie
    2. Marche sylvestre
    3. Résistant
    4. Bâton de druide
    5. Constitution héroïque
  effets:
    - { sur: rang, entree: druide-nature-maitre-de-la-survie, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: druide-nature-marche-sylvestre, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: druide-nature-resistant, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: druide-nature-baton-de-druide, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: druide-nature-constitution-heroique, valeur: 1, condition: 'rang >= 5' }

- id: druide-nature-maitre-de-la-survie
  sorte: capacite
  nom: Maître de la survie
  etiquettes: [test]
  champs:
    {
      voie: druide-nature,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '2 * rang("druide-nature")',
    }
  description: |-
    Effet: +2 par rang à tous les tests de survie.

    Le druide obtient un bonus de +2 par rang dans la voie à tous les tests basés sur la survie en milieu naturel (survie, vigilance, discrétion, etc.).

- id: druide-nature-marche-sylvestre
  sorte: capacite_active
  nom: Marche sylvestre
  champs: { voie: druide-nature, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: en terrain difficile, pas de pénalité de déplacement, +2 en Contact, DEF.

    Non seulement le druide ne subit aucune pénalité de déplacement en terrain difficile (neige, boue, broussailles, pente abrupte, etc.) mais en plus, il obtient un bonus de +2 en attaque et en DEF lors d'un combat dans ces conditions.
  effets:
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: '2' }
    - { sur: attribut, attribut: Distance, operation: ajouter, valeur: '2' }
    - { sur: attribut, attribut: Magie, operation: ajouter, valeur: '2' }
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: '2' }

- id: druide-nature-resistant
  sorte: capacite
  nom: Résistant
  champs: { voie: druide-nature, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : réduction de [2 x rang] DM.

    Le druide obtient une réduction de DM égal à son [Rang x 2] contre toutes les sources de dégâts « naturels » : froid, chaleur, chutes, poisons... mais aussi aux DM provoqués par les animaux ou les insectes (même géants).

- id: druide-nature-baton-de-druide
  sorte: capacite
  nom: Bâton de druide
  champs: { voie: druide-nature, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : 2 attaques Contact, [1d6 + mod. FOR ou DEX].

    Le druide combat avec les deux extrémités de son bâton de bois noueux. Lorsqu'il utilise cette capacité, il effectue deux attaques de contact infligeant [1d6 DM + Mod. de FOR ou de DEX] (au choix) par attaque.

- id: druide-nature-constitution-heroique
  sorte: capacite
  nom: Constitution héroïque
  champs: { voie: druide-nature, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: +2 CON, 2d20 aux tests de CON.

    Le druide augmente sa valeur de CON de +2. Il peut désormais lancer deux d20 à chaque fois qu'un test de CON lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CON, operation: ajouter, valeur: 2 }
    - {
        sur: jet,
        si: 'caracteristique == "CON" ou action == "defier-la-mort"',
        ajout: { variable: avantagesTest, ajouter: '1' },
      }

- id: druide-animaux
  sorte: voie
  nom: Voie des animaux
  etiquettes: [profil, druide]
  description: |-
    1. Langage des animaux
    2. Nuée d’insectes
    3. Le guetteur
    4. Masque du prédateur
    5. Forme animale
  effets:
    - { sur: rang, entree: druide-animaux-langage-des-animaux, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: druide-animaux-nuee-d-insectes, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: druide-animaux-le-guetteur, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: druide-animaux-masque-du-predateur, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: druide-animaux-forme-animale, valeur: 1, condition: 'rang >= 5' }

- id: druide-animaux-langage-des-animaux
  sorte: capacite
  nom: Langage des animaux
  etiquettes: [test]
  champs:
    {
      voie: druide-animaux,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '2 * rang("druide-animaux")',
    }
  description: |-
    Effet: +2 par rang aux tests d'influence animal.

    Le druide peut communiquer avec les animaux qui, en général, se comportent avec lui de manière amicale. Il gagne un bonus de +2 par rang à tous les tests destinés à influencer un animal. La communication reste primitive et limitée à l'intelligence de l'animal et à son point de vue (prédateur, proie, etc.).

- id: druide-animaux-nuee-d-insectes
  sorte: capacite
  nom: Nuée d’insectes
  etiquettes: [sort]
  champs:
    {
      voie: druide-animaux,
      rangVoie: 2,
      activation: 'Action limitée, sortilège',
      nbDes: 0,
      bonusDegats: '1',
    }
  description: |-
    Effet: +1 DM par tour, -2 toutes actions
    Durée : [5 + mod. SAG] tours.

    En réussissant un test d'attaque magique (portée 20 m), le druide libère sur sa cible une nuée d'insectes volants qui piquent, aveuglent et la suivent pendant [5 + Mod. de SAG] tours. La victime subit 1 point de DM par tour et un malus de -2 à toutes ses actions. Les DM de zone détruisent la nuée.

- id: druide-animaux-le-guetteur
  sorte: capacite
  nom: Le guetteur
  etiquettes: [test]
  champs: { voie: druide-animaux, rangVoie: 3, activation: Capacité passive, bonusTest: '5' }
  description: |-
    Effet : Aigles : DEF 15,Magie 1d4 DM, +5 perception.

    Le druide reçoit un oiseau de proie comme compagnon animal. Il possède un lien télépathique avec lui et peut percevoir par ses sens avec un bonus de +5 aux tests basés sur la perception. Aigle : DEF 15, PV [il les partage avec ceux de son maître]. Attaque de contact = [attaque magique du druide], DM 1d4.

- id: druide-animaux-masque-du-predateur
  sorte: capacite_active
  nom: Masque du prédateur
  champs: { voie: druide-animaux, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: + mod. SAG en Init, Contact,Distance, Magie.
    Durée : [5 + mod. SAG].

    Lorsqu'il est sous l'effet de ce sort, le druide prend les traits d'un fauve ou d'un loup. Il gagne son Mod. de SAG en Initiative, en attaque et aux DM et peut voir dans la nuit (comme un elfe) pendant [5 + Mod. de SAG] tours.
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 'mod(@SAG)' }
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: 'mod(@SAG)' }
    - { sur: attribut, attribut: Distance, operation: ajouter, valeur: 'mod(@SAG)' }
    - { sur: attribut, attribut: Magie, operation: ajouter, valeur: 'mod(@SAG)' }
    - {
        sur: jet,
        si: 'arme != "" ou score == "Contact" ou score == "Distance" ou action == "coup-de-corne" ou action == "coup-de-bouclier" ou action == "griffes" ou action == "choc-electrique" ou action == "mains-d-energie" ou action == "mains-nues" ou action == "arme-d-argent" ou action == "baton-de-mage"',
        ajout: { variable: bonusDM, ajouter: 'mod(@SAG)' },
      }

- id: druide-animaux-forme-animale
  sorte: capacite
  nom: Forme animale
  champs: { voie: druide-animaux, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : forme animale souhaitée.

    Le druide peut prendre la forme d'un animal d'une taille inférieure ou égale à la sienne. Il conserve sa DEF et ses PV, il acquiert les Carac. et les capacités naturelles de la forme choisie (le vol pour un oiseau, la respiration aquatiquepour le poisson, etc.). Le druide peut reprendre sa forme humaine lorsqu'il le désire (L).

- id: druide-fauve
  sorte: voie
  nom: Voie du fauve
  etiquettes: [profil, druide]
  description: |-
    1. Vitesse du félin
    2. Panthère
    3. Attaque bondissante
    4. Grand félin
    5. Les sept vies du chat
  effets:
    - { sur: rang, entree: druide-fauve-vitesse-du-felin, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: druide-fauve-panthere, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: druide-fauve-attaque-bondissante, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: druide-fauve-grand-felin, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: druide-fauve-les-sept-vies-du-chat, valeur: 1, condition: 'rang >= 5' }

- id: druide-fauve-vitesse-du-felin
  sorte: capacite
  nom: Vitesse du félin
  etiquettes: [test]
  champs:
    {
      voie: druide-fauve,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: 'rang("druide-fauve")',
    }
  description: |-
    Effet: +1 par rang en Init, course, saut ou escalade.

    Le druide gagne + 1 par rang dans la voie en Initiative et aux tests de course, d'escalade ou de saut.
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 'rang("druide-fauve")' }

- id: druide-fauve-panthere
  sorte: capacite
  nom: Panthère
  champs: { voie: druide-fauve, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : Panthère : FOR+2, DEX+4, CON+2, INT-3 SAG+2, CHA-2, Init 18,DEF 16, PV [niveau x 4], Contact [niveau], DM 1d6+2.

    Le druide apprivoise une panthère (ou un puma) qui lui obéit au doigt et à l'oeil (voir marge).

- id: druide-fauve-attaque-bondissante
  sorte: capacite
  nom: Attaque bondissante
  champs: { voie: druide-fauve, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : Contact+5, DM + 1d6.
    Durée : premier tour de combat, nécessite 5 à 30 mètres en lignes droite.

    Le druide parcourt jusqu'à 30 m et bénéficie d'un bonus de +5 au test d'attaque et de +1d6 aux DM contre sa cible. Il doit se déplacer d'au minimum 5 m en ligne droite pour faire cette attaque, qui ne peut par ailleurs être réalisée qu'à son premier tour du combat.

- id: druide-fauve-grand-felin
  sorte: capacite
  nom: Grand félin
  champs: { voie: druide-fauve, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : Animal fabuleux : FOR+5, DEX+4, CON+5, INT-3, SAG+2, CHA-2, DEF 18, DM 1d6+5.

    La panthère devient un animal fabuleux (voir marge), ou est remplacée par un félin plus grand (tigre, lion). Lorsque le druide atteint le niveau 8, les DM passent à 2d6+5. Au niveau 12, le félin peut utiliser Attaque bondissante. Le druide peut également communiquer avec son félin par télépathie, et le guérir à distance en dépensant ses propres PV (-1 PV au druide par PV octroyé aufélin).

- id: druide-fauve-les-sept-vies-du-chat
  sorte: capacite
  nom: Les sept vies du chat
  champs: { voie: druide-fauve, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : ignore la mort 7 fois.

    Cette capacité ne peut être utilisée que sept fois, et pas plus d'une fois par niveau. Lorsque que les PV du druide tombent à 0 ou qu'il meurt, le druide peut choisir d'ignorer ce qui a provoqué la mort ! Le MJ et le joueur doivent se mettre d'accord et trouver une raison plausible (ou pas !) pour expliquer la survie du personnage, et le faire réapparaître immédiatement ou un peu plus tard dans l'aventure si nécessaire.

- id: druide-vegetaux
  sorte: voie
  nom: Voie des végétaux
  etiquettes: [profil, druide]
  description: |-
    1. Peau d’écorce
    2. Prison végétale
    3. Animation d’un arbre
    4. Gland de pouvoir
    5. Porte végétale
  effets:
    - { sur: rang, entree: druide-vegetaux-peau-d-ecorce, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: druide-vegetaux-prison-vegetale, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: druide-vegetaux-animation-d-un-arbre, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: druide-vegetaux-gland-de-pouvoir, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: druide-vegetaux-porte-vegetale, valeur: 1, condition: 'rang >= 5' }

- id: druide-vegetaux-peau-d-ecorce
  sorte: capacite_active
  nom: Peau d’écorce
  champs: { voie: druide-vegetaux, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : +1 DEF par rang:
    Durée : [5 + mod. SAG] tours.

    La peau du druide prend la consistance de l'écorce. Il gagne +1 en DEF par rang dans la voie pendant [5 + Mod. de SAG] tours.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 'rang("druide-vegetaux")' }

- id: druide-vegetaux-prison-vegetale
  sorte: capacite
  nom: Prison végétale
  champs: { voie: druide-vegetaux, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : entrave : -2 Contact, Distance, Magie, DEF,
    Durée : [5 + mod. SAG] tours.

    Le druide peut commander à la végétationde pousser et bloquer ses ennemis (mais pas ses alliés) dans une zone de 10 m de diamètre (portée 20 m) pendant [5 + Mod. de SAG] tours. Entravées, les cibles subissent un malus de -2 en attaque et en DEF, et ne peuvent pas se déplacer. Chaque tour, une créature peut se libérer avec un test de FOR difficulté [10 + Mod. de SAG].

- id: druide-vegetaux-animation-d-un-arbre
  sorte: capacite
  nom: Animation d’un arbre
  champs: { voie: druide-vegetaux, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : Arbre animé : Init 7,DEF 13, [rang x 10] PV, Contact 1d6+3 DMdéplacement 10 mètres, RD 10 DM sauf feu et Contact.
    Durée : [niveau] tours.

    Une fois par combat, le druide peut animer un arbre en le touchant. Il combat pendant [niveau du druide] tours. Arbre animé : Init 7, DEF 13, PV [rang x 10], attaque de contact = [niveau du druide], DM 1d6+3, Déplacement 10 m par action de mouvement. Réduction de DM de 10 sauf contre les armes tranchantes et le feu.

- id: druide-vegetaux-gland-de-pouvoir
  sorte: capacite
  nom: Gland de pouvoir
  etiquettes: [sort]
  champs: { voie: druide-vegetaux, rangVoie: 4, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : statue de bois : $ 10, DM réduit (-10).
    Durée : [2d6 + mod. SAG] tours ou perte de plus de 10 PV.

    Une fois par combat, le druide peut lancer un gland sur une cible (portée 10 m). En cas d'attaque magique réussie, la victime se transforme en statue de bois pendant [2d6 + Mod. de SAG] tours. Sous cette forme elle ne peut agir et ne ressent rien. Sa DEF passe à 10 mais elle gagne une réduction des DM de 10. Le sort s'achève dès que la cible perd plus de 10 PV.

- id: druide-vegetaux-porte-vegetale
  sorte: capacite
  nom: Porte végétale
  champs: { voie: druide-vegetaux, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : en forêt, téléporte à [mod. SAG] x 10 Km.

    Une fois par jour, le druide peut pénétrer dans le tronc d'un gros arbre et sortir de celui d'un autre arbre appartenant à la même forêt et situé à une distance maximum de [Mod. de SAG] x 10 km.

- id: druide-protecteur
  sorte: voie
  nom: Voie du protecteur
  etiquettes: [profil, druide]
  description: |-
    1. Baies magiques
    2. Forêt vivante
    3. Régénération
    4. Forme d’arbre
    5. Sagesse héroïque
  effets:
    - { sur: rang, entree: druide-protecteur-baies-magiques, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: druide-protecteur-foret-vivante, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: druide-protecteur-regeneration, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: druide-protecteur-forme-d-arbre, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: druide-protecteur-sagesse-heroique, valeur: 1, condition: 'rang >= 5' }

- id: druide-protecteur-baies-magiques
  sorte: capacite
  nom: Baies magiques
  champs: { voie: druide-protecteur, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : fait pousser [1d6 + mod. SAG] fruits, rend [1d6 + niveau du druide] PV.

    Le druide doit se trouver devant un buisson ou un arbre vivant. Son incantation fait pousser [1 d6 + Mod. de SAG] fruits qu'il peut cueillir. Chaque fruit offre l'équivalent d'un repas et rend [1d6+ niveau du druide] PV à celui qui le consomme. Les effets de ces fruits ne fonctionnent qu'une fois par jour et par personnage.

- id: druide-protecteur-foret-vivante
  sorte: capacite
  nom: Forêt vivante
  champs: { voie: druide-protecteur, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: éveil de la forêt sur 1 Km par rang.
    Durée : 12 heures.

    La forêt s'éveille dans un rayon d'1 km par rang et devient une alliée du druide pendant les 12 prochaines heures. Dans ce périmètre, les ennemis du druide sont désorientés et gênés par les branches etles racines. Ils divisent leur déplacement par deux et subissent une pénalité de -5 en Initiative et à tous les tests de survie, d'orientation, de perception ou de discrétion. Si deux druides essayent d'influencer la forêt, c'est celui dont le niveau est le plus élevé qui l'emporte.

- id: druide-protecteur-regeneration
  sorte: capacite
  nom: Régénération
  champs: { voie: druide-protecteur, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : guérit 3 PV par tour.
    Durée : [niveau druide + mod. SAG] tours

    La cible touchée par le druide guérit 3 PV par tour pendant [niveau du druide + Mod. de SAG] tours. Ce sort ne peut pas affecter une créature plus d'une fois par jour.

- id: druide-protecteur-forme-d-arbre
  sorte: capacite
  nom: Forme d’arbre
  champs: { voie: druide-protecteur, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : transformation Arbdre animé : Init 7, DEF 13, [rang x 10] PV, Contact 1d6+3 DMdéplacement 10 mètres, RD 10 DM sauf feu et Contact
    Durée : [5 + mod. SAG] tours.

    Une fois par combat, le druide peut se transformer en arbre de petite taille (environ 4 m de hauteur)pendant [5 + Mod. de SAG] tours. Il prend les mêmes caractéristiques que l'arbre animé (voir plus loin), mais conserve ses propres PV. Sous cette forme, il ne peut pas parler mais peut utiliser les sorts des voies du protecteur et des végétaux.

- id: druide-protecteur-sagesse-heroique
  sorte: capacite
  nom: Sagesse héroïque
  champs: { voie: druide-protecteur, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 SAG, 2d20 aux tests de SAG.

    Le druide augmente sa valeur de SAG de +2. Il peut désormais lancer deux d20 à chaque fois qu'un test de SAG lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: SAG, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "SAG"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: ensorceleur-divination
  sorte: voie
  nom: Voie de la divination
  etiquettes: [profil, ensorceleur]
  description: |-
    1. 6ème sens
    2. Détection de l'invisible
    3. Clairvoyance
    4. Prescience
    5. Hyperconscience
  effets:
    - { sur: rang, entree: ensorceleur-divination-6eme-sens, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: ensorceleur-divination-detection-de-l-invisible,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: ensorceleur-divination-clairvoyance, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: ensorceleur-divination-prescience, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: ensorceleur-divination-hyperconscience,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: ensorceleur-divination-6eme-sens
  sorte: capacite
  nom: 6ème sens
  champs: { voie: ensorceleur-divination, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +1 Init, +1 🛡️.

    L'ensorceleur sait toujours légèrement en avance ce qui va arriver. Il gagne un bonus de +1 par Rang dans la voie en Initiative et en DEF, ainsi qu’un bonus de +2 par Rang à tous les tests pour éviter d’être surpris.
  effets:
    - {
        sur: attribut,
        attribut: INIT,
        operation: ajouter,
        valeur: 'rang("ensorceleur-divination")',
      }
    - {
        sur: attribut,
        attribut: Defense,
        operation: ajouter,
        valeur: 'rang("ensorceleur-divination")',
      }

- id: ensorceleur-divination-detection-de-l-invisible
  sorte: capacite
  nom: Détection de l'invisible
  champs: { voie: ensorceleur-divination, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : détection des créatures sur 30 mètres
    Durée : [5 + mod. CHA] tours.

    Pendant [5 + Mod. de CHA] tours, l’ensorceleur détecte les créatures invisibles ou cachées à moins de 30 mètres et détecter si un sort de Clairvoyance affecte l’endroit. Aveuglé, ce sort lui permet de voir normalement.

- id: ensorceleur-divination-clairvoyance
  sorte: capacite
  nom: Clairvoyance
  champs: { voie: ensorceleur-divination, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : voit et entend à distance.

    L’ensorceleur peut voir et entendre à distance ce qui se passe dans un lieu qu’il connaît, tant qu’il reste concentré (action limitée à chaque tour). Les créatures présentes ont droit à un test de SAG difficulté [12 + Mod. de CHA] : en cas de réussite, elles se sentent observées.

- id: ensorceleur-divination-prescience
  sorte: capacite
  nom: Prescience
  champs: { voie: ensorceleur-divination, rangVoie: 4, activation: 'Capacité passive, sortilège' }
  description: |-
    Effet : rejoue le dernier tour, +10 🛡️, +10 Init.

    Une fois par combat, à la fin d’un tour, le joueur peut décider que tout ce qui s’est passé durant ce tour n’était que la vision d’un futur possible. On rejoue alors tout depuis le début : les autres personnages ne peuvent pas changer leurs actions, contrairement à l’ensorceleur qui bénéficie d’un bonus de +10 en Initiative et en DEF.

- id: ensorceleur-divination-hyperconscience
  sorte: capacite
  nom: Hyperconscience
  champs: { voie: ensorceleur-divination, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 SAG, +2 INT, 2d20 aux tests de SAG ou INT.

    L'ensorceleur augmente ses valeurs de SAG et d'INT de +2. Il peut désormais lancer deux d20 à chaque fois qu’un test de SAG ou d'INT lui est demandé et garder le meilleur résultat.
  effets:
    - { sur: attribut, attribut: SAG, operation: ajouter, valeur: 2 }
    - { sur: attribut, attribut: INT, operation: ajouter, valeur: 2 }
    - {
        sur: jet,
        si: 'caracteristique == "SAG" ou caracteristique == "INT"',
        ajout: { variable: avantagesTest, ajouter: '1' },
      }

- id: ensorceleur-air
  sorte: voie
  nom: Voie de l’air
  etiquettes: [profil, ensorceleur]
  description: |-
    1. Murmures dans le vent
    2. Sous tension
    3. Télékinésie
    4. Foudre
    5. Forme éthérée
  effets:
    - {
        sur: rang,
        entree: ensorceleur-air-murmures-dans-le-vent,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - { sur: rang, entree: ensorceleur-air-sous-tension, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: ensorceleur-air-telekinesie, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: ensorceleur-air-foudre, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: ensorceleur-air-forme-etheree, valeur: 1, condition: 'rang >= 5' }

- id: ensorceleur-air-murmures-dans-le-vent
  sorte: capacite
  nom: Murmures dans le vent
  champs: { voie: ensorceleur-air, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : message chuchoté sur 100 mètres.

    L’ensorceleur chuchote un message d’une dizaine de mots qui voyage jusqu’à son destinataire. Il peut entendre sa réponse immédiatement. La portée est de 100 m par Rang dans la voie et le personnage doit connaître la cible ou la voir.

- id: ensorceleur-air-sous-tension
  sorte: capacite
  nom: Sous tension
  etiquettes: [sort]
  champs:
    {
      voie: ensorceleur-air,
      rangVoie: 2,
      activation: 'Action limitée, sortilège',
      nbDes: 1,
      bonusDegats: 'mod(@CHA)',
    }
  description: |-
    Effet : dégat à l’attaquant de 1d6 DM, décharge magique [1d6 + Mod. CHA] DM
    Durée : [5 + mod. CHA] tours.

    L’ensorceleur se charge d’énergie électrique pour [5 + Mod. de CHA] tours. Toute créature qui le touche reçoit une décharge infligeant 1d6 DM. Il peut également délivrer une décharge électrique (attaque magique, portée 10 m) infligeant [1d6 + Mod. de CHA] DM.

- id: ensorceleur-air-telekinesie
  sorte: capacite
  nom: Télékinésie
  champs: { voie: ensorceleur-air, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : soulève un objet n’excédant pas 50 Kg
    Durée : [5 + mod. CHA] tours.

    L’ensorceleur peut déplacer dans les airs un objet inerte ou une cible volontaire (par exemple lumière) dont le poids n’excède pas 50 kg par Rang, à une portée de 20 m pendant [5 + Mod. de CHA] tours. L’objet peut être déplacé de 10 m par tour au prix d’une action de mouvement. Il est possible de faire tomber un objet sur une cible surprise (DM 1d6 tous les 50 kg).

- id: ensorceleur-air-foudre
  sorte: capacite
  nom: Foudre
  champs: { voie: ensorceleur-air, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : éclair [4d6 + mod. CHA] DM.

    L’ensorceleur produit un éclair sur une ligne de 10 mètres. Toutes les créatures sur la trajectoire sont soumises à un test d’attaque magique et subissent [4d6 + Mod. de CHA] DM en cas de réussite. Les victimes peuvent tenter un test de DEX difficulté [12 + Mod. de DEX] pour ne subir que la moitié des DM.

- id: ensorceleur-air-forme-etheree
  sorte: capacite
  nom: Forme éthérée
  champs: { voie: ensorceleur-air, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : intangible
    Durée : [5 + mod. CHA] tours.

    L’ensorceleur et tout son équipement deviennent translucides et intangibles pendant [5 + Mod. de CHA] tours. Sous cette forme, il peut passer à travers murs et obstacles, et ne peut subir aucun DM physiques, ni en infliger, ni lancer des sorts.

- id: ensorceleur-envouteur
  sorte: voie
  nom: Voie de l’envoûteur
  etiquettes: [profil, ensorceleur]
  description: |-
    1. Injonction
    2. Sommeil
    3. Confusion
    4. Amitié
    5. Domination
  effets:
    - { sur: rang, entree: ensorceleur-envouteur-injonction, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: ensorceleur-envouteur-sommeil, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: ensorceleur-envouteur-confusion, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: ensorceleur-envouteur-amitie, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: ensorceleur-envouteur-domination, valeur: 1, condition: 'rang >= 5' }

- id: ensorceleur-envouteur-injonction
  sorte: capacite
  nom: Injonction
  champs: { voie: ensorceleur-envouteur, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : donne un ordre à la cible
    Durée : cible immunisée 24h en cas d’échec.

    L’ensorceleur donne un ordre simple (mais pas dangereux pour elle) que la victime doit pouvoir comprendre. Il doit réussir un test d’attaque magique opposé avec la cible (contre attaque au contact si la créature n’en a pas) à une portée de 20 mètres. En cas d’échec, la cible doit exécuter l’ordre pendant son prochain tour.

- id: ensorceleur-envouteur-sommeil
  sorte: capacite
  nom: Sommeil
  champs: { voie: ensorceleur-envouteur, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [1d6 + mod. CHA] cibles tombent de sommeil.
    Réveil sur 💥 Durée : [5 + mod. CHA] minutes.

    Cible immunisée 24h en cas d’échec. [1d6 + Mod. de CHA] cibles vivantes désignées de 10 m de diamètre (portée 20 m) et dont le score max de PV ne dépasse pas l’attaque magique de l’ensorceleur sombrent dans l’inconscience pendant [5 + Mod. de CHA] minutes. Il est possible de les réveiller en les giflant (action d’attaque).

- id: ensorceleur-envouteur-confusion
  sorte: capacite
  nom: Confusion
  etiquettes: [sort]
  champs:
    { voie: ensorceleur-envouteur, rangVoie: 3, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : désoriente la cible
    Durée : [3 + mod. CHA] tours.

    Cible immunisée 24h en cas d’échec. En réussissant un test d’attaque magique (portée 20 m), l’ensorceleur désoriente sa cible pendant [3 + Mod. de CHA] tours. Chaque tour, lancez 1d6 : 1-3 la victime n’agit pas, 4-6 elle attaque la créature la plus proche (au hasard). Chaque fin de tour, elle fait un test de SAG difficulté [10 + Mod. de CHA] pour mettre fin au sort.

- id: ensorceleur-envouteur-amitie
  sorte: capacite
  nom: Amitié
  etiquettes: [sort]
  champs:
    {
      voie: ensorceleur-envouteur,
      rangVoie: 4,
      activation: 'Action limitée, sortilège',
      nbDes: 0,
      contre: PV_Max,
    }
  description: |-
    Effet : la cible devient un allié
    Durée : renouvelable une fois par jour.

    Cible immunisée 24h en cas d’échec. Si l’ensorceleur réussit un test d’attaque magique (portée 10 m) contre le score max de PV d’une cible humanoïde, celle-ci se comporte comme un ami de longue date tant qu’elle n’est pas attaquée. Elle peut résister au sort avec un test de SAG difficulté [12 + Mod. de CHA], renouvelable une fois par jour.

- id: ensorceleur-envouteur-domination
  sorte: capacite
  nom: Domination
  champs: { voie: ensorceleur-envouteur, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : prend le contrôle de la cible
    Durée : [1d4 + mod. CHA] minutes.

    Cible immunisée 24h en cas d’échec. En réussissant un test d’attaque magique (portée 20 m) en opposition contre un test d’attaque magique de la cible (ou d’attaque au contact si la créature n’en a pas), l’ensorceleur prend contrôle de son esprit pendant [1d4 + Mod. CHA] minutes. Son corps est totalement inactif. Il résiste chaque minute avec un test de SAG difficulté [10 + Mod. de CHA] à chaque fois plus difficile. Si la créature meurt pendant la domination, l’ensorceleur subit un contrecoup et 1d6 DM.

- id: ensorceleur-illusions
  sorte: voie
  nom: Voie des illusions
  etiquettes: [profil, ensorceleur]
  description: |-
    1. Image décalée
    2. Mirage
    3. Imitation
    4. Dédoublement
    5. Tueur fantasmagorique
  effets:
    - { sur: rang, entree: ensorceleur-illusions-image-decalee, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: ensorceleur-illusions-mirage, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: ensorceleur-illusions-imitation, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: ensorceleur-illusions-dedoublement, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: ensorceleur-illusions-tueur-fantasmagorique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: ensorceleur-illusions-image-decalee
  sorte: capacite
  nom: Image décalée
  champs: { voie: ensorceleur-illusions, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : lance 1d6 : sur 5-6, pas de DM subits
    Durée : [5 + mod. CHA] tours.

    Pendant [5 + Mod. de CHA] tours, lorsqu’une attaque le touche, l’ensorceleur lance 1d6 : sur 5-6, il ne subit pas les DM.

- id: ensorceleur-illusions-mirage
  sorte: capacite
  nom: Mirage
  champs: { voie: ensorceleur-illusions, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : crée une illusion
    Durée : [5 + mod. CHA] minutes si immobile ou tours si animée.

    L’ensorceleur crée une illusion visuelle et sonore immobile d’une durée de [5 + Mod. de CHA] minutes (ou tours si l’illusion est animée). Le volume maximum de l’illusion est de 10 m de côté par rang dans la voie (portée 500 m). Divisez ces paramètres par 10 si l’illusion est animée. Interagir avec l’illusion la fait disparaître.

- id: ensorceleur-illusions-imitation
  sorte: capacite
  nom: Imitation
  champs: { voie: ensorceleur-illusions, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : prend l’apparence d’une créature visible
    Durée : [5 + mod. CHA] minutes.

    L’ensorceleur peut prendre l’apparence d’une créature de taille proche (+ ou - 50 cm) qu’il voit au moment de l’incantation. Durée [5 + Mod. de CHA] minutes. Toucher l’ensorceleur (une attaque ou non) met fin au sort.

- id: ensorceleur-illusions-dedoublement
  sorte: capacite
  nom: Dédoublement
  etiquettes: [sort]
  champs:
    { voie: ensorceleur-illusions, rangVoie: 4, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : crée un double de la cible
    Durée : [5 + mod. CHA] tours.

    Sur une attaque magique réussie (portée 20 m), l’ensorceleur crée un double translucide de la cible pendant [5 + Mod. de CHA] tours. Le double est sous le contrôle de l’ensorceleur. Il possède les PV de la cible et agit en dernier chaque tour. Il disparaît si ses PV tombent à 0. Une créature ne peut être dédoublée qu’une fois par combat.

- id: ensorceleur-illusions-tueur-fantasmagorique
  sorte: capacite
  nom: Tueur fantasmagorique
  champs: { voie: ensorceleur-illusions, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : mort de la cible sur test Magie en opposition si test de SAG [10 + mod. CHA] de la cible raté, sinon renversée.

    Ce sort invoque les pires terreurs d’une créature vivante et lui fait croire à sa propre mort. L’ensorceleur doit réussir un test d’attaque magique (portée 20 m) en opposition à un test d’attaque magique de la cible (ou attaque au contact si la créature n’en a pas). La victime fait un test de SAG difficulté [10 + Mod. de CHA] pour résister. En cas d’échec, elle tombe à 0 PV, terrorisée, croyant être au bord de la mort. Si elle réussit, elle est renversée et subit 2d6 DM. Une créature ne peut être la cible de ce sort qu’une fois par jour, et l’ensorceleur ne peut plus l’utiliser sur un personnage d’une créature de niveau supérieur au sien.

- id: ensorceleur-invocation
  sorte: voie
  nom: Voie de l’invocation
  etiquettes: [profil, ensorceleur]
  description: |-
    1. Familier
    2. Serviteur invisible
    3. Mur de force
    4. Arme dansante
    5. Charisme héroïque
  effets:
    - { sur: rang, entree: ensorceleur-invocation-familier, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: ensorceleur-invocation-serviteur-invisible,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: ensorceleur-invocation-mur-de-force, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: ensorceleur-invocation-arme-dansante, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: ensorceleur-invocation-charisme-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: ensorceleur-invocation-familier
  sorte: capacite
  nom: Familier
  champs: { voie: ensorceleur-invocation, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : petit animal : FOR -4, DEX +3, CON 0, 🛡️ [ensorceleur], INT -2, SAG +1, CHA -2, Init [ensorceleur], PV [partagé].

    L’ensorceleur choisit un petit animal (corbeau, chat, furet, serpent...). Il peut utiliser les sens de son familier et communiquer via lui à distance illimitée. Il gagne de plus +2 en Initiative lorsque son familier est en vue. Familier : DEF [ensorceleur], Init [ensorceleur], PV partagés, les familiers forment une cible unique pour les attaques de zone. FOR -4, DEX +3, CON 0, INT -2, SAG +1, CHA -2.

- id: ensorceleur-invocation-serviteur-invisible
  sorte: capacite
  nom: Serviteur invisible
  champs: { voie: ensorceleur-invocation, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : force invisible, test simple < 10
    Durée : [5 + mod. CHA] minutes.

    Ce sort crée une force invisible pendant [5 + Mod. de CHA] minutes. Le serviteur peut effectuer à distance des tâches simples ne nécessitant pas de test de réussite et aucun score de caractéristique supérieur à 10 (portée 20 m).

- id: ensorceleur-invocation-mur-de-force
  sorte: capacite
  nom: Mur de force
  champs: { voie: ensorceleur-invocation, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : mur de force indestructible

    Durée : [5 + mod. CHA] tours. L’ensorceleur crée un mur de force indestructible (portée 10 m, maximum 5 m de haut et 10 m de long), ou bien un hémisphère de 3 m de rayon centré sur lui-même. Le sort dure pendant [5 + Mod. de CHA] tours.

- id: ensorceleur-invocation-arme-dansante
  sorte: capacite
  nom: Arme dansante
  champs: { voie: ensorceleur-invocation, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [1d8 + mod. CHA] DM
    Durée : [5 + mod. CHA] tours.

    Le sort crée une lame d’énergie lumineuse pendant [5 + Mod. de CHA] tours. Dès le premier tour, l’ensorceleur peut lui ordonner d’attaquer une cible de son choix (action gratuite, portée 20 m). L’attaque magique de la lame = attaque magique de l’ensorceleur, [1d8 + Mod de CHA] DM.

- id: ensorceleur-invocation-charisme-heroique
  sorte: capacite
  nom: Charisme héroïque
  champs: { voie: ensorceleur-invocation, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 CHA, 2d20 aux tests de CHA.

    L’ensorceleur augmente sa valeur de CHA de +2. Il peut désormais lancer deux d20 à chaque fois qu’un test de CHA lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CHA, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "CHA"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: forgesort-elixirs
  sorte: voie
  nom: Voie des élixirs
  etiquettes: [profil, forgesort]
  description: |-
    1. Fortifiant
    2. Feu grégeois
    3. Elixir de guérison
    4. Potion magique
    5. Elixirs magique
  effets:
    - { sur: rang, entree: forgesort-elixirs-fortifiant, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: forgesort-elixirs-feu-gregeois, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: forgesort-elixirs-elixir-de-guerison, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: forgesort-elixirs-potion-magique, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: forgesort-elixirs-elixirs-magique, valeur: 1, condition: 'rang >= 5' }

- id: forgesort-elixirs-fortifiant
  sorte: capacite
  nom: Fortifiant
  champs: { voie: forgesort-elixirs, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : guérit [1d4 + rang] PV, +3 les [rang+1] prochains tests
    Durée : 12 heures.

    Un breuvage étrange qui guérit [1d4 + rang] PV et permet de gagner un bonus de +3 aux [rang +1] prochains tests de réussites effectués (dans une limite de temps de 12 heures).

- id: forgesort-elixirs-feu-gregeois
  sorte: capacite
  nom: Feu grégeois
  champs: { voie: forgesort-elixirs, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : [1d6 x rang] DM sur 3 mètres.

    Le forgesort lance la fiole à une distance maximum de 10 m, grâce à une action d’attaque (réussite automatique). Le contenu explose dans un rayon de 3 m en infligeant 1d6 DM par rang dans la voie. Un test de DEX difficulté [10 + Mod. d’INT] réussi permet aux victimes de diviser les DM par 2.

- id: forgesort-elixirs-elixir-de-guerison
  sorte: capacite
  nom: Elixir de guérison
  champs: { voie: forgesort-elixirs, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : soigne [3d6 + mod. d'INT] PV ou poison.

    Le forgesort peut préparer un élixir qui soigne [3d6 + Mod. d'INT] PV ou un empoisonnement.

- id: forgesort-elixirs-potion-magique
  sorte: capacite
  nom: Potion magique
  champs: { voie: forgesort-elixirs, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : potion à effet de capacité de magicien.

    Le forgesort peut préparer une potion d’Agrandissement, de Forme gazeuse, de Protection contre les éléments, d’Armure de mage ou de Chute ralentie (voir les voies de magicien).

- id: forgesort-elixirs-elixirs-magique
  sorte: capacite
  nom: Elixirs magique
  champs: { voie: forgesort-elixirs, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : potion à effet de capacité de magicien.

    Le forgesort peut préparer une potion d’Invisibilité, de Vol, de Respiration aquatique, de Flou ou de Hâte.

- id: forgesort-artefacts
  sorte: voie
  nom: Voie des artefacts
  etiquettes: [profil, forgesort]
  description: |-
    1. Bâton de mage
    2. Blocage
    3. Sac sans fond
    4. Frappe des arcanes
    5. Artefact majeur
  effets:
    - { sur: rang, entree: forgesort-artefacts-baton-de-mage, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: forgesort-artefacts-blocage, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: forgesort-artefacts-sac-sans-fond, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: forgesort-artefacts-frappe-des-arcanes,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - { sur: rang, entree: forgesort-artefacts-artefact-majeur, valeur: 1, condition: 'rang >= 5' }

- id: forgesort-artefacts-baton-de-mage
  sorte: capacite
  nom: Bâton de mage
  champs: { voie: forgesort-artefacts, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +1 🗡️ [1d6 + mod. d'INT] DM.
    Rang 3 : Action limitée, utilis Magie pour Contact [2d6 Mod. d'INT] DM.

    Le forgesort crée un grand bâton magique. Avec cette arme à deux mains, il gagne un bonus de +1 aux tests d’attaque au contact et inflige [1d6 + Mod. d'INT] DM magiques. À partir du rang 3, sur action limitée, il peut utiliser son score d’attaque magique pour une attaque au contact et infliger [2d6 + Mod. d'INT] DM dans un éclair d’énergie !

- id: forgesort-artefacts-blocage
  sorte: capacite
  nom: Blocage
  champs: { voie: forgesort-artefacts, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : scelle un objet, +5 solidité et RD
    Durée : INT minutes.

    Le forgesort scelle une porte ou un coffre pour une durée en minutes égale à sa valeur d’INT. Seul un mot de commande qu’il choisit permet d’ouvrir l’objet. Celui-ci peut toujours être brisé par la force, mais il bénéficie d’un bonus de +5 en solidité et en RD (réduction des DM) pour toute la durée du sort.

- id: forgesort-artefacts-sac-sans-fond
  sorte: capacite
  nom: Sac sans fond
  champs: { voie: forgesort-artefacts, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : sac magique 50 Kg par rang.
    Le forgesort possède un sac dans lequel il peut entreposer 50 kg de matériel par rang dans la voie, tandis que le sac ne semble pas peser plus de 1 m3. Les objets stockés dans le sac ne fournissent pas de contrainte en termes de volume ou de taille. Le sac est résistant à l’eau et aux attaques physiques et magiques. Un objet vivant ne peut pas respirer, une fois mis dans le sac. Il peut en retirer ou ranger un objet en 1 action. Si un objet n’est pas récupéré dans un délai de 3 heures, il se perd définitivement.

- id: forgesort-artefacts-frappe-des-arcanes
  sorte: capacite
  nom: Frappe des arcanes
  champs: { voie: forgesort-artefacts, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : sort de zone, [2d6 + mod. d'INT] DM.

    Le forgesort frappe le sol de son bâton et provoque une onde dévastatrice dans un rayon de 10 m autour de lui. Toutes les créatures dans la zone subissent automatiquement [2d6 + Mod. d'INT] DM et doivent réussir un test de FOR difficulté [10 + Mod. d'INT] pour ne pas tomber au sol.

- id: forgesort-artefacts-artefact-majeur
  sorte: capacite
  nom: Artefact majeur
  champs: { voie: forgesort-artefacts, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : enchantement d’objet.

    Le forgesort peut enchanter des objets. Il peut créer une arme ou une armure qui donne un bonus de +1 aux tests d’attaque ou à la DEF et bénéficie d’améliorations élémentaires (lame de feu, etc.). L’objet enchanté gagne également un bonus de +1 en solidité et en RD pour toute la durée de l’effet magique.

- id: forgesort-runes
  sorte: voie
  nom: Voie des runes
  etiquettes: [profil, forgesort]
  description: |-
    1. Runes de défense
    2. Rune d’énergie
    3. Rune de protection
    4. Rune de puissance
    5. Rune de pouvoir
  effets:
    - { sur: rang, entree: forgesort-runes-runes-de-defense, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: forgesort-runes-rune-d-energie, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: forgesort-runes-rune-de-protection, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: forgesort-runes-rune-de-puissance, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: forgesort-runes-rune-de-pouvoir, valeur: 1, condition: 'rang >= 5' }

- id: forgesort-runes-runes-de-defense
  sorte: capacite
  nom: Runes de défense
  champs: { voie: forgesort-runes, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +1 🛡️ par rang.

    Le forgesort inscrit des runes de protection sur l’ensemble de son équipement et parfois jusque sur sa peau. Il obtient un bonus de +1 en DEF par rang dans la voie.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 'rang("forgesort-runes")' }

- id: forgesort-runes-rune-d-energie
  sorte: capacite
  nom: Rune d’énergie
  champs: { voie: forgesort-runes, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : enchante un bijoux permettant la relance de 🗡️ FOR, DEX ou CON.

    En réalisant un rituel de 5 minutes, le forgesort enchante un bijou pour 24 h. Celui-ci permet de relancer un d20 une fois par combat sur un test d’attaque, de FOR, DEX ou CON. Un seul bijou de ce type peut être porté.

- id: forgesort-runes-rune-de-protection
  sorte: capacite
  nom: Rune de protection
  champs: { voie: forgesort-runes, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : enchante une armure qui ignore les DM une fois par combat.

    En réalisant un rituel de 5 minutes, le forgesort enchante une armure pour 24 h. Celle-ci permet d’ignorer les DM d’une attaque une fois par combat.

- id: forgesort-runes-rune-de-puissance
  sorte: capacite
  nom: Rune de puissance
  champs: { voie: forgesort-runes, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : enchante une arme qui inflige DM max une fois par combat.

    En réalisant un rituel de 5 minutes, le forgesort enchante une arme pour 24 h. Celle-ci permet d’infliger les DM maximum une fois par combat.

- id: forgesort-runes-rune-de-pouvoir
  sorte: capacite
  nom: Rune de pouvoir
  champs: { voie: forgesort-runes, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : lie un sort à un objet.

    Le forgesort peut lier un sort à un objet par une inscription runique. S’il ne connaît pas lui-même le sort, il doit se faire aider par un personnage qui le lance. Le sort ainsi lié peut être utilisé trois fois par jour. Le processus est le même que pour fabriquer une arme ou une armure magique, il requiert de passer un jour de travail par niveau du sort lié (les sorts de potions à la potion). Après ce délai, en se rendant dans un rang de 10, la potion d’alimentation a été utilisée pour payer.

- id: forgesort-golem
  sorte: voie
  nom: Voie du golem
  etiquettes: [profil, forgesort]
  description: |-
    1. Grosse tête
    2. Golem
    3. Protecteur
    4. Golem supérieur
    5. Intelligence héroïque
  effets:
    - { sur: rang, entree: forgesort-golem-grosse-tete, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: forgesort-golem-golem, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: forgesort-golem-protecteur, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: forgesort-golem-golem-superieur, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: forgesort-golem-intelligence-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: forgesort-golem-grosse-tete
  sorte: capacite
  nom: Grosse tête
  etiquettes: [test]
  champs:
    {
      voie: forgesort-golem,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '2 * rang("forgesort-golem")',
    }
  description: |-
    Effet : test d’INT à la place de FOR. +2 par rang aux tests de bricolage ou science.

    Le forgesort remplace la force brutale par un peu de réflexion. Il peut effectuer un test d’INT au lieu d’un test de FOR (exemple : il utilise un levier pour déplacer une charge élevée). Il obtient un bonus de +2 par rang dans la voie à tous les tests de bricolage ou de science.

- id: forgesort-golem-golem
  sorte: capacite
  nom: Golem
  champs: { voie: forgesort-golem, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : Golem :
    Init [forgesort], 🛡️14, INT-4, SAG-3, CHA-4, 🗡️niveau + mod. FOR], FOR 1, FOR 1, DEX-1, CON+10, DM 1d8+1, PV [4 x niveau].

    Le golem est une créature humanoïde fabriquée par le forgesort pour lui servir de serviteur et de garde du corps. Créature non-vivante, Init [forgesort], DEF 14, PV [4 x niveau]. Attaque [niveau + Mod. de FOR], DM 1d8+1. FOR +1, DEX -1, CON +10, INT -4, SAG -3, CHA -4. Le forgesort peut réparer le golem au rythme de [1d6 par rang + Mod. d’INT] PV par heure.

- id: forgesort-golem-protecteur
  sorte: capacite
  nom: Protecteur
  champs: { voie: forgesort-golem, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : le golem prend les DM d’un autre
    Durée : une fois par tour.

    Une fois par tour, s’il est au contact d’un personnage, le golem peut s’interposer et subir les DM d’une attaque à sa place.

- id: forgesort-golem-golem-superieur
  sorte: capacite
  nom: Golem supérieur
  champs: { voie: forgesort-golem, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : amélioration du golem :
    Armure : +5 en 🛡️
    Félin : +3 mod. de DEX
    Balliste : portée 20m, 2d6 DM
    Taille : +10 PV et +1 mod de FOR
    Vol : des > de 40m en action limitée
    Cerveau amélioré : doué de parole, +2 mod. d’INT, SAG, CHA
    Puissant : +2 mod FOR
    Arme à 2 mains : Contact+8 DM.

    Le forgesort peut améliorer son golem en choisissant une option. Le joueur peut choisir une option de plus lorsque son personnage atteint les niveaux 9, 13 et 17. Les options peuvent êtres choisies plusieurs fois et cumulées.

- id: forgesort-golem-intelligence-heroique
  sorte: capacite
  nom: Intelligence héroïque
  champs: { voie: forgesort-golem, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 INT, 2d20 aux tests d’INT.

    Le forgesort augmente sa valeur d’INT de +2. Il peut désormais lancer deux d20 à chaque fois qu’un test d’INT lui est demandé et garder le meilleur résultat.
  effets:
    - { sur: attribut, attribut: INT, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "INT"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: forgesort-metal
  sorte: voie
  nom: Voie du métal
  etiquettes: [profil, forgesort]
  description: |-
    1. Forgeron
    2. Métal brillant
    3. Magnétisme
    4. Métal hurlant
    5. Endurer
  effets:
    - { sur: rang, entree: forgesort-metal-forgeron, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: forgesort-metal-metal-brillant, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: forgesort-metal-magnetisme, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: forgesort-metal-metal-hurlant, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: forgesort-metal-endurer, valeur: 1, condition: 'rang >= 5' }

- id: forgesort-metal-forgeron
  sorte: capacite_active
  nom: Forgeron
  champs: { voie: forgesort-metal, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : enflamme son arme, +1 par rang DM
    Durée : [5 + mod. d'INT] tours.

    Le forgesort obtient un bonus de +2 par rang dans la voie aux tests d’orfèvrerie ou de forge. Au prix d’une action de mouvement, il peut enflammer son marteau ou son bâton pour une durée de [5 + Mod. d’INT] tours et gagne alors un bonus aux DM de +1 par rang dans la voie avec cette arme (DM de feu).
  effets:
    - {
        sur: jet,
        si: 'arme != ""',
        ajout: { variable: bonusDM, ajouter: 'rang("forgesort-metal")' },
      }

- id: forgesort-metal-metal-brillant
  sorte: capacite
  nom: Métal brillant
  etiquettes: [sort]
  champs: { voie: forgesort-metal, rangVoie: 2, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : chauffe une pièce métallique de la cible
    Durée : [5 + mod. d'INT] tours.
    vLe forgesort doit réussir un test d’attaque magique (portée 20 m) pour faire chauffer un objet métallique que sa cible transporte pendant [5 + Mod. d’INT] tours. S’il s’agit d’une arme, elle inflige un malus de -2 aux tests d’attaque. S’il s’agit d’une armure, elle inflige 1d4 DM par tour à son porteur. La victime peut se débarrasser précipitamment de son armure au prix d’une action limitée.

- id: forgesort-metal-magnetisme
  sorte: capacite_active
  nom: Magnétisme
  champs: { voie: forgesort-metal, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : +5 🛡️, 1/2 DM reçus
    Durée : [3 + mod. d'INT] tours.

    Le forgesort contrôle le magnétisme autour de lui pendant [3 + Mod. d’INT] tours. Il gagne un bonus de +5 en DEF et divise par 2 les DM de toutes les armes ou projectiles métalliques.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: '5' }
    - { sur: jet, cote: cible, si: 'arme != ""', ajout: { variable: demiDM, ajouter: '1' } }

- id: forgesort-metal-metal-hurlant
  sorte: capacite
  nom: Métal hurlant
  etiquettes: [sort]
  champs: { voie: forgesort-metal, rangVoie: 4, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : déforme une pièce d’équipement métallique de la cible.

    Sur un test d’attaque magique réussi, le forgesort déforme une pièce d’équipement métallique infligeant de lourds malus à son utilisateur pendant [5 + Mod. d’INT] tours. Une arme devient inutilisable de bonne foi et réduit son DM de 1d8 pour chaque attaque. Si l’armure est touchée, elle perd 2 points de RD (réduction des DM).

- id: forgesort-metal-endurer
  sorte: capacite
  nom: Endurer
  champs: { voie: forgesort-metal, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 CON, 2d20 aux tests de CON, -5 DM de feu subit.

    Le forgesort est habitué aux travaux et à la chaleur de la forge. Il réduit tous les DM de feu subits de 5 points et augmente sa valeur de CON de +2. Il peut désormais lancer deux d20 à chaque fois qu’un test de CON lui est demandé, en gardant le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CON, operation: ajouter, valeur: 2 }
    - {
        sur: jet,
        si: 'caracteristique == "CON" ou action == "defier-la-mort"',
        ajout: { variable: avantagesTest, ajouter: '1' },
      }

- id: guerrier-resistance
  sorte: voie
  nom: Voie de la résistance
  etiquettes: [profil, guerrier]
  description: |-
    1. Robustesse
    2. Armure naturelle
    3. Second souffle
    4. Dur à cuire
    5. Constitution héroïque
  effets:
    - { sur: rang, entree: guerrier-resistance-robustesse, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: guerrier-resistance-armure-naturelle, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: guerrier-resistance-second-souffle, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: guerrier-resistance-dur-a-cuire, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: guerrier-resistance-constitution-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: guerrier-resistance-robustesse
  sorte: capacite
  nom: Robustesse
  champs: { voie: guerrier-resistance, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +3 PV rang 1,
    +6 PV rang 3,
    +9 PV rang 5.

    En prenant cette capacité, le guerrier gagne 3 PV supplémentaires au rang 1, puis 3 PV de plus au rang 3 de cette Voie et enfin 3 PV au rang 5.
  effets:
    - {
        sur: attribut,
        attribut: PV_Max,
        operation: ajouter,
        valeur: '3 * floor((rang("guerrier-resistance") + 1) / 2)',
      }

- id: guerrier-resistance-armure-naturelle
  sorte: capacite
  nom: Armure naturelle
  champs: { voie: guerrier-resistance, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : +2 🛡️, +4 au rang 4.

    Le guerrier a endurci son corps. Il bénéficie d’un bonus de +2 à la DEF. Ce bonus passe à +4 lorsqu’il atteint le rang 4 de la voie.
  effets:
    - {
        sur: attribut,
        attribut: Defense,
        operation: ajouter,
        valeur: 'si(rang("guerrier-resistance") >= 4, 4, 2)',
      }

- id: guerrier-resistance-second-souffle
  sorte: capacite
  nom: Second souffle
  champs: { voie: guerrier-resistance, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : [1d10 + niveau + mod. CON] PV récupéré 1 fois par combat.

    Le guerrier peut décider de ne pas attaquer lors du tour de combat pour reprendre son souffle. Il récupère alors [1d10 + niveau + Mod. de CON] PV. Attention : cette capacité ne peut être utilisée qu’une fois par combat.

- id: guerrier-resistance-dur-a-cuire
  sorte: capacite
  nom: Dur à cuire
  champs: { voie: guerrier-resistance, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : +5 CON, ultime tour à la mort.

    Le guerrier reçoit un bonus de +5 à tous ses tests de CON. De plus, lorsqu’il tombe à 0 PV, il peut continuer à agir pendant un ultime tour avant de tomber inconscient.
  effets:
    - {
        sur: jet,
        si: 'caracteristique == "CON" ou action == "defier-la-mort"',
        ajout: { bonus: '5' },
      }

- id: guerrier-resistance-constitution-heroique
  sorte: capacite
  nom: Constitution héroïque
  champs: { voie: guerrier-resistance, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 CON, 2d20 aux tests de CON.

    Le guerrier augmente sa valeur de CON de +2 et il peut désormais lancer deux d20 à chaque fois qu’un test de CON lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CON, operation: ajouter, valeur: 2 }
    - {
        sur: jet,
        si: 'caracteristique == "CON" ou action == "defier-la-mort"',
        ajout: { variable: avantagesTest, ajouter: '1' },
      }

- id: guerrier-bouclier
  sorte: voie
  nom: Voie du bouclier
  etiquettes: [profil, guerrier]
  description: |-
    1. Protéger un allié
    2. Absorber un coup
    3. Absorber un sort
    4. Armure lourde
    5. Renvoi de sort
  effets:
    - { sur: rang, entree: guerrier-bouclier-proteger-un-allie, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: guerrier-bouclier-absorber-un-coup, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: guerrier-bouclier-absorber-un-sort, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: guerrier-bouclier-armure-lourde, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: guerrier-bouclier-renvoi-de-sort, valeur: 1, condition: 'rang >= 5' }

- id: guerrier-bouclier-proteger-un-allie
  sorte: capacite
  nom: Protéger un allié
  champs: { voie: guerrier-bouclier, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : donne la 🛡️ de son bouclier à un allié.

    Le guerrier accorde le Mod. de DEF de son bouclier à un compagnon de son choix qui se trouve juste à côté de lui (il conserve ce bonus pour lui-même aussi). Il peut changer de compagnon à chaque tour durant sa phase d’initiative. C’est une action gratuite.

- id: guerrier-bouclier-absorber-un-coup
  sorte: capacite
  nom: Absorber un coup
  champs: { voie: guerrier-bouclier, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet : bloque l’attaque adverse sur test en opposition réussi, au prix d’une action.

    À son tour, le guerrier fait seulement une action d’attaque ou de déplacement. Par la suite, à tout moment avant son prochain tour, le guerrier peut effectuer un test d’attaque au contact en opposition à un test réussi d’attaque au contact ou à distance d’un adversaire. En cas de réussite, l’attaque adverse est bloquée par le bouclier.

- id: guerrier-bouclier-absorber-un-sort
  sorte: capacite
  nom: Absorber un sort
  champs: { voie: guerrier-bouclier, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : absorbe les dégâts magiques sur test 🗡️ en opposition au prix d’une action.

    À son tour, le guerrier fait seulement une action d’attaque ou de déplacement. Par la suite, à tout moment avant son prochain tour, le guerrier peut effectuer un test d’attaque magique (Mod. de SAG) en opposition à un test d’attaque magique qui le visait. En cas de réussite, le sort est absorbé par le bouclier et n’a aucun effet sur le guerrier.

- id: guerrier-bouclier-armure-lourde
  sorte: capacite
  nom: Armure lourde
  champs: { voie: guerrier-bouclier, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : peut porter une armure de plaque +8 🛡️.

    Le guerrier peut porter une Armure de Plaque complète. Celle-ci lui confère une DEF de +8 et le protège des attaques critiques (vous subissez des DM normaux au lieu des DM doublés).

- id: guerrier-bouclier-renvoi-de-sort
  sorte: capacite
  nom: Renvoi de sort
  champs: { voie: guerrier-bouclier, rangVoie: 5, activation: Action limitée }
  description: |-
    Effet : renvoi le sort absorbé par la capacité.

    Le guerrier peut décider de renvoyer un sort qu’il vient d’absorber grâce à sa capacité Absorber un Sort. Au lieu d’être annulé, le sort absorbé lui est renvoyé et retourné contre son expéditeur : le lanceur du sort subit alors les effets de sa propre attaque !

- id: guerrier-combat
  sorte: voie
  nom: Voie du combat
  etiquettes: [profil, guerrier]
  description: |-
    1. Vivacité
    2. Désarmer
    3. Double attaque
    4. Attaque circulaire
    5. Attaque puissante
  effets:
    - { sur: rang, entree: guerrier-combat-vivacite, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: guerrier-combat-desarmer, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: guerrier-combat-double-attaque, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: guerrier-combat-attaque-circulaire, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: guerrier-combat-attaque-puissante, valeur: 1, condition: 'rang >= 5' }

- id: guerrier-combat-vivacite
  sorte: capacite
  nom: Vivacité
  champs: { voie: guerrier-combat, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +3 Init. Le guerrier gagne +3 en Initiative.
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 3 }

- id: guerrier-combat-desarmer
  sorte: capacite
  nom: Désarmer
  champs: { voie: guerrier-combat, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet : désarme son adversaire si opposition 🗡️.

    Le guerrier réalise une attaque au contact et sa victime doit faire un test d’attaque opposé. Si le guerrier obtient le plus haut score, l’arme de son adversaire tombe au sol (une action de mouvement doit être employée pour la ramasser). Si le guerrier réussit son test avec au moins 10 points de plus que son adversaire, il empêche celui-ci de récupérer son arme en posant le pied dessus (n’envoyant hors de portée, etc.). Cette capacité est évidemment sans effet sur les armes naturelles (griffes, crocs, épine dorsale, etc.). Les adversaires qui utilisent des armes à 2 mains sont plus difficiles à désarmer, infligeant un malus de -5 au test.

- id: guerrier-combat-double-attaque
  sorte: capacite
  nom: Double attaque
  champs: { voie: guerrier-combat, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : deux attaques 🗡️ dans le tour, malus -2.

    Le guerrier peut tenter deux attaques au contact durant ce tour avec un malus de -2.

- id: guerrier-combat-attaque-circulaire
  sorte: capacite
  nom: Attaque circulaire
  champs: { voie: guerrier-combat, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : attaque 🗡️ contre chaque adversaire au contact.

    Le guerrier peut tenter une attaque au contact contre chaque adversaire engagé au contact avec lui.

- id: guerrier-combat-attaque-puissante
  sorte: capacite
  nom: Attaque puissante
  champs: { voie: guerrier-combat, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : d12 remplace d20 🗡️, +2d6 DM.

    Le guerrier peut choisir d’utiliser 1d12 en attaque au contact au lieu du d20 habituel (il ajoute normalement son score d’attaque). Si une telle attaque est réussie, il ajoute +2d6 aux DM. Cette capacité peut être utilisée avec Attaque Double, Attaque Circulaire ou Attaque parfaite par exemple.

- id: guerrier-maitre-d-armes
  sorte: voie
  nom: Voie du maître d’armes
  etiquettes: [profil, guerrier]
  description: |-
    1. Arme de prédilection
    2. Science du critique
    3. Spécialisation
    4. Attaque parfaite
    5. Riposte
  choix:
    - {
        id: predilection,
        nom: Arme de prédilection,
        nombre: 1,
        parmi: { sorte: arme },
        donne: { type: marque, marque: predilection },
      }
  effets:
    - {
        sur: rang,
        entree: guerrier-maitre-d-armes-arme-de-predilection,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - {
        sur: rang,
        entree: guerrier-maitre-d-armes-science-du-critique,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: guerrier-maitre-d-armes-specialisation,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: guerrier-maitre-d-armes-attaque-parfaite,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - { sur: rang, entree: guerrier-maitre-d-armes-riposte, valeur: 1, condition: 'rang >= 5' }

- id: guerrier-maitre-d-armes-arme-de-predilection
  sorte: capacite
  nom: Arme de prédilection
  champs: { voie: guerrier-maitre-d-armes, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +1 🗡️ avec arme de prédilection.

    Le guerrier choisit une arme de prédilection (par exemple épée longue ou hache à 1 main, arc court, etc.), et gagne +1 en attaque lorsqu’il l’utilise.
  effets:
    - { sur: jet, si: 'marquee(arme, "predilection")', ajout: { bonus: 1 } }

- id: guerrier-maitre-d-armes-science-du-critique
  sorte: capacite
  nom: Science du critique
  champs: { voie: guerrier-maitre-d-armes, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : critique sur 19-20.

    Le guerrier inflige des critiques sur 19-20 (18-20 lorsqu’il emploie une rapière ou une Vivelame).
  effets:
    - { sur: attribut, attribut: Critique, operation: maximum, valeur: 19 }

- id: guerrier-maitre-d-armes-specialisation
  sorte: capacite
  nom: Spécialisation
  champs: { voie: guerrier-maitre-d-armes, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : +2 DM avec arme de prédilection.

    Lorsque le guerrier emploie son arme de prédilection, il gagne un bonus de +2 aux DM.
  effets:
    - { sur: jet, si: 'marquee(arme, "predilection")', ajout: { variable: bonusDM, ajouter: '2' } }

- id: guerrier-maitre-d-armes-attaque-parfaite
  sorte: capacite
  nom: Attaque parfaite
  champs: { voie: guerrier-maitre-d-armes, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : 2d20 🗡️, +1d6 DM.

    Lancez deux d20 en attaque au contact et gardez le meilleur résultat, ajoutez +1d6 aux DM.

- id: guerrier-maitre-d-armes-riposte
  sorte: capacite
  nom: Riposte
  champs: { voie: guerrier-maitre-d-armes, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +1 attaque 🗡️ si l’adversaire rate son attaque.

    En plus de ses actions normales, une fois par tour, lorsqu’un adversaire rate une attaque de contact contre le guerrier, le joueur obtient une attaque supplémentaire contre cet adversaire.

- id: guerrier-soldat
  sorte: voie
  nom: Voie du soldat
  etiquettes: [profil, guerrier]
  description: |-
    1. Posture de combat
    2. Combat en phalange
    3. Prouesse
    4. Dernier rempart
    5. Force héroïque
  effets:
    - { sur: rang, entree: guerrier-soldat-posture-de-combat, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: guerrier-soldat-combat-en-phalange, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: guerrier-soldat-prouesse, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: guerrier-soldat-dernier-rempart, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: guerrier-soldat-force-heroique, valeur: 1, condition: 'rang >= 5' }

- id: guerrier-soldat-posture-de-combat
  sorte: capacite
  nom: Posture de combat
  champs: { voie: guerrier-soldat, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : malus en début de tour convertis en bonus jusqu’au tour suivant.

    Au début de votre tour, choisissez d’appliquer jusqu’à -1 par rang en attaque, en DEF ou aux DM et obtenez l’équivalent en bonus au choix en attaque, en DEF ou aux DM jusqu’à votre prochain tour.

- id: guerrier-soldat-combat-en-phalange
  sorte: capacite
  nom: Combat en phalange
  champs: { voie: guerrier-soldat, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : +1 🗡️🛡️ par allié au contact avec vous.

    Lorsque vous combattez la même créature qu’un allié, vous gagnez +1 en attaque et en DEF par allié au contact avec vous et avec la créature.

- id: guerrier-soldat-prouesse
  sorte: capacite
  nom: Prouesse
  champs: { voie: guerrier-soldat, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : sacrifie -1d4 PV contre +5 FOR ou +5 DEX.

    Le guerrier réussit souvent des exploits physiques hors-norme. Une fois par tour, vous pouvez sacrifier 1d4 PV pour obtenir +5 sur un test de FOR ou de DEX. Vous pouvez annoncer l’utilisation de cette capacité après avoir pris connaissance du résultat du test de caractéristique.

- id: guerrier-soldat-dernier-rempart
  sorte: capacite
  nom: Dernier rempart
  champs: { voie: guerrier-soldat, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : +1 attaque 🗡️ contre tout attaquant si aucun déplacement.

    Le guerrier effectue uniquement une attaque au contact durant ce tour. En contrepartie, il bénéficie d’une attaque supplémentaire contre tout ennemi qui se déplace à son contact. Un adversaire blessé par cette attaque voit son déplacement stoppé.

- id: guerrier-soldat-force-heroique
  sorte: capacite
  nom: Force héroïque
  champs: { voie: guerrier-soldat, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 FOR, 2d20 aux tests de FOR.

    Le guerrier augmente sa valeur de Force de +2 et il peut désormais lancer deux d20 à chaque fois qu’un test de FOR lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: FOR, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "FOR"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: invocateur-conjuration
  sorte: voie
  nom: Voie de la conjuration
  etiquettes: [profil, invocateur]
  description: |-
    1. Conjuration de prédateur
    2. Conjuration renforcée
    3. Conjuration d'armée
    4. Conjuration de prédateur étrange
    5. Meute de prédateurs
  effets:
    - {
        sur: rang,
        entree: invocateur-conjuration-conjuration-de-predateur,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - {
        sur: rang,
        entree: invocateur-conjuration-conjuration-renforcee,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: invocateur-conjuration-conjuration-d-armee,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: invocateur-conjuration-conjuration-de-predateur-etrange,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: invocateur-conjuration-meute-de-predateurs,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: invocateur-conjuration-conjuration-de-predateur
  sorte: capacite
  nom: Conjuration de prédateur
  champs: { voie: invocateur-conjuration, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : prédateur:
    Niveau 1 à 4: Loup NC 1 (p259)
    Niveau 5 à 8 : Loup alpha NC 2 (p259)
    Niveau 9 à 11 : Loup géant NC 3 (p260)
    Niveau 12 à 14 : Lion NC 4 (p259)
    Niveau 15 à 17 : Lion, grand mâle NC 5 (p259)
    Niveau 18 à 20 : Ours polaire NC 6 (p268)
    Niveau 21 à 22 : Tigre à dents de sabre NC 7 (p259)
    Niveau 23 et + : Ours préhistorique NC 8 (p268)
    Durée : [5 + mod. CHA] tours.

    Une fois par combat, l'invocateur peut conjurer un animal qui combat pour lui pendant [5 + Mod. de CHA] tours. Le type d'animal conjuré dépend du niveau de l'invocateur (voir marge p. 25). L'animal apparait au contact de l'invocateur et peut s'éloigner jusqu'à une distance de 50 mètres.

- id: invocateur-conjuration-conjuration-renforcee
  sorte: capacite
  nom: Conjuration renforcée
  champs: { voie: invocateur-conjuration, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : conjure un animal de niveau [rang + niveau de l'invocateur] L'invocateur ajoute à son niveau le rang atteint dans la Voie pour déterminer le niveau des prédateurs conjurés.

    Exemple : un invocateur de niveau 3 avec 2 rangs dans la Voie conjure un loup alpha NC 2, comme s'il était de niveau 5 (3+2)

- id: invocateur-conjuration-conjuration-d-armee
  sorte: capacite
  nom: Conjuration d'armée
  champs: { voie: invocateur-conjuration, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: armée 1d6 DM par tour à chaque cible, 1d10 DM au rang 4, 2D6 DM au rang 5
    Durée : [5 mod. CHA] heures.

    Une fois par jour, l'invocateur peut conjurer une petite armée pour une durée maximum de [5 + Mod. de CHA] heures. Le sort ne peut être utilisé qu'en rase campagne ou dans un espace clos d'au minimum 20 x 20 mètres. Les créatures apparaissent dans une zone carrée de 20 mètres de coté, centrée sur l'invocateur. Elles peuvent ensuite se déplacer en formation, en occupant la même surface (elles n'entrent pas dans des couloirs ou des bâtiments exigus), jusqu'à une portée de 200 mètres. Les créatures attaquent les adversaires que l'invocateur leur désigne (déplacement de 20 mètres par tour, 3 km/h). L'armée inflige automatiquement 1d6 DM par tour (1d10 DM au rang 4 et 2d6 DM au rang 5) à chaque cible dans la zone. Une cible peut choisir de combattre l'armée par une action limitée : cela lui permet de ne subir que la moitié des DM prévus et d'infliger à son tour à l'armée des DM égaux à son niveau plus 1 (NC + 1, pour une créature). Lorsque l'armée a subi un montant total de DM égal au niveau de l'invocateur multiplié par 10, le sort prend fin.

- id: invocateur-conjuration-conjuration-de-predateur-etrange
  sorte: capacite
  nom: Conjuration de prédateur étrange
  champs: { voie: invocateur-conjuration, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : améliore la conjuration du prédateur Lorsqu'il convoque un prédateur (rang 1 de cette Voie).

    L'invocateur peut, au choix, ajouter à la créature une mutation protectrice ou une adaptation motrice issue de la Voie des mutations (il n'a pas besoin d'avoir accès à ces capacités). Si l'invocateur opte pour Cuirasse, cela apporte un bonus de +3 en DEF à la créature.

- id: invocateur-conjuration-meute-de-predateurs
  sorte: capacite
  nom: Meute de prédateurs
  champs: { voie: invocateur-conjuration, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: 1d4 invocations de catégorie inférieure ou 2d6 invocations de deux catégories inférieures.

    Lorsqu'il utilise le sort de conjuration de prédateur, l'invocateur peut invoquer 1d4 prédateurs d'une catégorie en-dessous de son niveau maximum ou 2d6 prédateurs de deux catégories en-dessous.

- id: invocateur-entite
  sorte: voie
  nom: Voie de l’entité
  etiquettes: [profil, invocateur]
  description: |-
    1. Invocation d'une entité
    2. Lien magique
    3. Amélioration
    4. Protecteur
    5. Lien magique amélioré
  effets:
    - {
        sur: rang,
        entree: invocateur-entite-invocation-d-une-entite,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - { sur: rang, entree: invocateur-entite-lien-magique, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: invocateur-entite-amelioration, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: invocateur-entite-protecteur, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: invocateur-entite-lien-magique-ameliore,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: invocateur-entite-invocation-d-une-entite
  sorte: capacite
  nom: Invocation d'une entité
  champs: { voie: invocateur-entite, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : entité : répartir 4 pts entre FOR et DEX, 2 pts entre INT, SAG et CHA (mini +0), +2 CON, Défense [12 + DEX], Contact [niveau de l'invocateur (+ FOR ou DEX de l'entité)], [1d6 + FOR] DM, [niveau invocateur x 5] PV.

    L'invocateur appelle une créature d'un autre plan qui entre alors à son service. Personne d'autre que l'invocateur ne peut renvoyer l'entité sur son plan d'origine. Lors que l'entité est réduite à 0 PV, elle disparait immédiatement. Dans ce cas, ou si l'invocateur la renvoie (par une action de mouvement), l'invocateur devra attendre 12 heures avant de pouvoir la convoquer de nouveau. L'entité revient en jeu avec ses PV au maximum et débarrassée de tout effet préjudiciable dont elle pouvait être victime au moment de sa disparition. En dehors de son plan, l'entité ne guérit pas naturellement, mais elle peut bénéficier de sorts de soins. L'entité est totalement dévouée à son invocateur, elle agit au mieux pour respecter les ordres qui lui sont donnés, en fonction de son Mod. d'INT. Elle parle la langue de l'invocateur. L'apparence physique de l'entité est déterminée lors de sa première invocation (un animal, une créature fantastique ou une créature humanoïde), mais elle doit s'inspirer des Mod. de Carac. choisis par le joueur. Elle ne peut pas imiter précisément l'apparence d'un personnage ou d'une créature en particulier. Une fois que le joueur a déterminé son apparence, la créature la conserve pour toujours. L'entité arbore quelque part sur son corps une rune lumineuse qui la maintient sur le plan de l'invocateur. Créer son entité: Le joueur doit répartir 4 points entre les Mod. de FOR et de DEX, puis 2 points entre INT, SAG et CHA (minimum +0). Enfin, le Mod. de CON est égal à +2. La Défense de l'entité est égale à 12 (+ Mod. de DEX), son score d'attaque est égal au niveau de l'invocateur (+ Mod. de FOR ou de DEX de l'entité) et ses DM sont égaux à [1d6 + Mod. de FOR]. Ses PV sont égaux à cinq fois le niveau de l'invocateur.

- id: invocateur-entite-lien-magique
  sorte: capacite
  nom: Lien magique
  champs: { voie: invocateur-entite, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : télépathie, transfert des DM entre l'entité et l'invocateur et vice versa (entité subit 2x DM transférés)

    L'invocateur peut communiquer par télépathie avec son entité, quelle que soit la distance qui les sépare. Lorsque l'entité subit des DM, l'invocateur peut choisir de sacrifier ses propres PV pour protéger son entité. Inversement, si l'invocateur subit des DM, il peut les transférer à son entité, mais dans ce cas, les DM subis par celle-ci sont doublés. Enfin, grâce au lien avec l'invocateur, la créature peut toucher et attaquer des cibles protégées normalement du contact des créatures invoquées.

- id: invocateur-entite-amelioration
  sorte: capacite
  nom: Amélioration
  champs: { voie: invocateur-entite, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet: choix d'amélioration d'entité :
    Armes puissantes : Contact + 1d6 aux DM
    Armure: +4 Défense
    Grande taille: +10 PV et +1 mod. FOR
    Pouvoir : portée 20m
    Magie [niveau invocateur + DEX entité], 2d6 DM
    Puissant: +2 mod. FOR
    Résistant: +2 mod. CON, + 10 PV et 1/2 DM élem. au choix
    Supériorité : +2 mod d'INT, SAG et CHA
    Vif : +2 mod. DEX
    Vol: l'entité peut se déplacer dans les airs

- id: invocateur-entite-protecteur
  sorte: capacite
  nom: Protecteur
  champs: { voie: invocateur-entite, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : au contact de l'entité, +2 Défense si allié, +4 Défense si l'invocateur.

    Quand un allié se trouve au contact de l'entité, il obtient un bonus de +2 en Défense. Si l'allié est l'invocateur, ce bonus passe à +4. De plus, une fois par tour, l'entité peut subir une attaque à la place d'un allié à son contact.

- id: invocateur-entite-lien-magique-ameliore
  sorte: capacite
  nom: Lien magique amélioré
  champs: { voie: invocateur-entite, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : téléporte au contact ou échange de place l'invocateur et l'entité Le lien entre l'invocateur et l'entité est tel qu'ils peuvent se téléporter ou échanger leurs places.

    Au prix d'une action de mouvement, l'invocateur peut utiliser une action de son choix : téléporter son entité à son contact, se téléporter au contact de son entité ou enfin, échanger sa place avec son entité.

- id: invocateur-mutations
  sorte: voie
  nom: Voie des mutations
  etiquettes: [profil, invocateur]
  description: |-
    1. Mutation offensive
    2. Mutation protectrice
    3. Surpuissance physique
    4. Adaptation motrice
    5. Mutation régénératrice
  effets:
    - {
        sur: rang,
        entree: invocateur-mutations-mutation-offensive,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - {
        sur: rang,
        entree: invocateur-mutations-mutation-protectrice,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: invocateur-mutations-surpuissance-physique,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: invocateur-mutations-adaptation-motrice,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: invocateur-mutations-mutation-regeneratrice,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: invocateur-mutations-mutation-offensive
  sorte: capacite
  nom: Mutation offensive
  champs: { voie: invocateur-mutations, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : appendice monstrueux, +3 FOR, Contact+3 [1d6 + mod. FOR] DM Durée : [5 + mod. CHA] tours

    L'invocateur échange une partie de son corps avec celle d'une créature monstrueuse d'un autre plan pendant [5 + mod. CHA] tours. Il obtient ainsi un appendice monstrueux de son choix : une gueule d'ours, une branche monstrueuse dotée d'une griffe, etc. Pour pouvoir l'utiliser, il doit se déplacer d'abord. Il ne lui faut en effet qu'un tour de mouvement pour attaquer ensuite avec ce bonus de +3 au Mod. de FOR sur cette attaque. L'attaque inflige [1d6 + Mod. de FOR] DM (2d6 au niveau 10). À partir du rang 4, l'invocateur apprend à mieux maîtriser le membre étranger et il lui suffit d'une action d'attaque pour attaquer.

- id: invocateur-mutations-mutation-protectrice
  sorte: capacite
  nom: Mutation protectrice
  champs: { voie: invocateur-mutations, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : protection d'outre-monde :
    Cuirasse : +1 Défense rang
    Écailles rugueuses : 1/2 DM de feu ou de froid
    Fourrure violette : 1/2 DM de froid ou de coup d'aiguille
    Pouvoir : respiration aquatique
    Sang noir : immunisé au poison ou aux maladies Durée : [5 + mod. CHA] minutes .

    L'invocateur obtient les caractéristiques d'une créature démoniaque, ajoutant à sa défense des éléments surnaturels. Il gagne ainsi un appendice ou des attributs sur son corps : fourrure, écailles, etc. Il est impossible de bénéficier de deux mutations protectrices en même temps. Cuirasse : +1 en DEF par écailles rugueuses : 1/2 DM de feu ou d'acide divisés par 2 Pouvoir : DM de froid ou de feu divisés par 2 Fourrure violette Sang noir : immunisé au poison ou aux maladies.

- id: invocateur-mutations-surpuissance-physique
  sorte: capacite
  nom: Surpuissance physique
  champs: { voie: invocateur-mutations, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: mutation surpuissante :
    Muscles hypertrophiés: +2 au mod. de FOR
    Silhouette gliforme : +4 au mod. de DEX
    Silhouette massive: +5 aux tests de CON, -3 DM subits
    Durée : [5 + mod. CHA] minutes

- id: invocateur-mutations-adaptation-motrice
  sorte: capacite
  nom: Adaptation motrice
  champs: { voie: invocateur-mutations, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : transformation motrice :
    Ailes : vol à sa vitesse normale de déplacement
    Pattes démesurées : déplacement 30 mètres
    Queue de poisson : nage normale 30 mètres Durée : [5 + mod. CHA] minutes

    L'invocateur obtient une des mutations suivantes pendant [5 + mod. CHA] minutes. Il est impossible de bénéficier de plusieurs mutations motrices en même temps. Ailes : vol à vitesse normale Pattes démesurées : déplacement de 30 mètres Queue de poisson : nage de 30 mètres (ou plus si extension).

- id: invocateur-mutations-mutation-regeneratrice
  sorte: capacite
  nom: Mutation régénératrice
  champs: { voie: invocateur-mutations, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : 2d20 aux tests de CON, regen 1d6 PV à la fin d'une mutation

    À chaque fois qu'il retrouve sa forme normale après avoir utilisé un sort de la Voie des mutations, l'invocateur récupère 1d6 PV. Désormais, lorsqu'il danse, il lance deux dés à volonté, ainsi que d'autres extraits utiles sur ces deux résultats. Si vous utilisez plus de sorts d'amélioration, vous n'avez plus besoin de points de Mana, les PV sont régénérés seulement s'ils sont prolongés pendant la durée du sort.
  effets:
    - { sur: jet, si: 'caracteristique == "CON"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: invocateur-portes
  sorte: voie
  nom: Voie des portes
  etiquettes: [profil, invocateur]
  description: |-
    1. Raccourci
    2. Porte artificielle
    3. Manoir d'outre-monde
    4. Engloutissement lointain
    5. Porte dimensionnelle
  effets:
    - { sur: rang, entree: invocateur-portes-raccourci, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: invocateur-portes-porte-artificielle, valeur: 1, condition: 'rang >= 2' }
    - {
        sur: rang,
        entree: invocateur-portes-manoir-d-outre-monde,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: invocateur-portes-engloutissement-lointain,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: invocateur-portes-porte-dimensionnelle,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: invocateur-portes-raccourci
  sorte: capacite
  nom: Raccourci
  champs: { voie: invocateur-portes, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : portail, max 10 mètres

    L'invocateur emprunte une porte magique qui apparaît à son contact et il ressort par une autre en vue à moins de 10 mètres de distance par rang atteint dans la Voie. Les deux portes disparaissent immédiatement après son passage.

- id: invocateur-portes-porte-artificielle
  sorte: capacite
  nom: Porte artificielle
  champs: { voie: invocateur-portes, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : porte passe muraille Durée : [5 + mod. CHA] tours

    L'invocateur invoque une porte venant d'un autre monde dans une surface maçonnée non magique de moins d'un mètre d'épaisseur (par exemple le mur d'une maison). Pendant [5 + Mod. de CHA] tours, cette porte peut être ouverte et refermée normalement et elle donne de l'autre côté du mur, de façon tout à fait ordinaire.

- id: invocateur-portes-manoir-d-outre-monde
  sorte: capacite
  nom: Manoir d'outre-monde
  champs: { voie: invocateur-portes, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : salle sur demande
    Durée : 1 heure par niveau L'invocateur entre par une porte ordinaire existante dans une porte artificielle, et pendant jusqu'à 1 heure par niveau, il la camoufle magiquement dans le monde réel.

    Une fois que la porte est bloquée par magie, le manoir se substitue à la pièce où l'invocateur se trouve. Le manoir dispose de toute une salle, spacieuse, entourée de décorations spirituelles magnifiques et protectrices. Il peut également désorienter les ennemis et offrir aux alliés une protection optimale. Le manoir dispose d'une capacité d'ouverture, et l'invocateur peut la refermer en rentrant ou en sortant à volonté. Toutes les portes de sortie donnent de nouveau sur le monde réel lorsque l'invocateur les ferme. À tout moment, s'il se rend compte de son intrusion, l'invocateur peut la refermer immédiatement. S'il se trouve encore à l'intérieur, il ne subira aucune perturbation, mais toute personne qui tenterait de revenir en dehors serait prise au piège. Les ennemis situés devant la porte et subissant cette porte spéciale sont éjectés devant la porte et subissent 1d6 DM.

- id: invocateur-portes-engloutissement-lointain
  sorte: capacite
  nom: Engloutissement lointain
  champs: { voie: invocateur-portes, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : téléporte la cible Une fois par combat

    l'invocateur désigne d'un mouvement de la main une cible à moins de 20 mètres, et un tourbillon de lumière multicolore emporte la victime en lieu lointain. En cas de succès de l'attaque (opposée par la SAG adverse), la cible est immédiatement téléportée en direction d'un point fixe sur le terrain, ou tout autre espace d'une portée maximale de [5 + Mod. de CHA] tours. Si vous utilisez ce sort sur un allié, il lui confère un avantage, et s'il rate son action, il échouera, même à 10 ou 20 kilomètres, il peut alors se rattraper si besoin ou plus loin pour ne pas jouer.

- id: invocateur-portes-porte-dimensionnelle
  sorte: capacite
  nom: Porte dimensionnelle
  champs: { voie: invocateur-portes, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : portail de téléportation, max 200 mètres
    Durée : [5 + mod. CHA] minutes

    L'invocateur fait apparaître une porte lumineuse pour une durée maximum de [5 + Mod. de CHA] minutes, bien qu'il puisse permettre de l'ouvrir à tout moment. Cette porte apparaît en prenant place dans un autre lieu choisi par l'invocateur, soit à portée de vue, soit à un endroit parfaitement connu de l'invocateur, même si celui-ci n'y est jamais venu en personne. Si la porte donne vers un autre endroit, le niveau de difficulté est de trois fois la distance réelle de la sortie par rapport à l'entrée. Si l'endroit dépasse la valeur limite, il perdra progressivement de la puissance et les deux portes se refermeront automatiquement à la fin de l'usage, à la première apparition du sort.

- id: invocateur-familier
  sorte: voie
  nom: Voie du familier
  etiquettes: [profil, invocateur]
  description: |-
    1. Familier
    2. Résistance
    3. Sens développés
    4. Rappel
    5. Lilliputien
  effets:
    - { sur: rang, entree: invocateur-familier-familier, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: invocateur-familier-resistance, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: invocateur-familier-sens-developpes, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: invocateur-familier-rappel, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: invocateur-familier-lilliputien, valeur: 1, condition: 'rang >= 5' }

- id: invocateur-familier-familier
  sorte: capacite
  nom: Familier
  champs: { voie: invocateur-familier, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : petit animal :
    FOR+4, DEX+3, CON+0, Défense [personnage], INT-2, SAG+1, CHA-2, Init [personnage], PV partage

    L'invocateur choisit un petit animal (corbeau, chat, furet, serpent…). Il peut utiliser les sens de son familier et communiquer avec lui à distance illimitée. Il gagne +1 en initiative lorsque son familier est présent. Familier : Défense [= invocateur], Init [= invocateur], PV [= invocateur] Si le familier meurt ou est détruit par un sort ennemi, ils forment un cible unique pour les attaques de son créateur. FOR +4, DEX +3, CON 0, INT -2, SAG +1, CHA -2. Lorsque le familier subit des DM, l'invocateur peut choisir de ne pas les subir, dans ce cas, le familier est détruit et il ne pourra pas à nouveau être convoqué avant 24 heures.

- id: invocateur-familier-resistance
  sorte: capacite
  nom: Résistance
  champs: { voie: invocateur-familier, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : +1 rang RD pour le familier

    Le familier obtient une réduction des DM (RD) de 1 point par rang atteint dans la Voie face à tous les types de DM.

- id: invocateur-familier-sens-developpes
  sorte: capacite
  nom: Sens développés
  etiquettes: [test]
  champs: { voie: invocateur-familier, rangVoie: 3, activation: Capacité passive, bonusTest: '5' }
  description: |-
    Effet : +5 SAG aux tests de perception, vision nocturne améliorée Capable de percevoir avec les sens de son familier.

    L'invocateur améliore grandement sa vigilance. Il obtient un bonus de +5 à tous les tests de perception (SAG) et peut voir dans le noir comme s'il était dans la pénombre jusqu'à une distance de 20 m. S'il possède déjà cette capacité, la distance est doublée.

- id: invocateur-familier-rappel
  sorte: capacite
  nom: Rappel
  champs: { voie: invocateur-familier, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : téléporte le familier sur son maître L'invocateur peut rappeler son familier à son contact par magie.

    Le familier est téléporté sur son maître au prix d'une action de mouvement s'il est en vue ou par d'autres moyens dans tous les autres cas.

- id: invocateur-familier-lilliputien
  sorte: capacite_active
  nom: Lilliputien
  champs: { voie: invocateur-familier, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : devient minuscule, DM 1, RD 5 L'invocateur rapetisse jusqu'à devenir plus petit que son familier (entre 10 et 30 cm, minuscule ou très petit).

    La transformation en génie sur les sens (ou dans l'autre domaine) dure 1 tour complet. Sa durée est illimitée. Sous cette forme, l'invocateur obtient la même réduction au DM que le familier (RD 5), bien que les bonus de +10 aux tests de déplacement soient des espaces très réduits. En revanche, ses DM sont réduits à 1 point par attaque dans ses différentes régions. Ses déplacements sont réduits d'environ 30 cm par segment, et s'il échappe au combat, sa réduction sera supérieure à 5 km par heure pendant son déplacement. Si vous invoquez un nouveau familier, il le réduira à nouveau (au bout d'un tour) et il se limitera à 1 RD. La transformation est annulée si votre familier est déjà une créature volante (100 km/j).
  effets:
    - { sur: attribut, attribut: RD, operation: ajouter, valeur: '5' }

- id: magicien-magie-des-arcanes
  sorte: voie
  nom: Voie de la magie des arcanes
  etiquettes: [profil, magicien]
  description: |-
    1. Agrandissement
    2. Forme gazeuse
    3. Hâte
    4. Téléportation
    5. Désintégration
  effets:
    - {
        sur: rang,
        entree: magicien-magie-des-arcanes-agrandissement,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - {
        sur: rang,
        entree: magicien-magie-des-arcanes-forme-gazeuse,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: magicien-magie-des-arcanes-hate, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: magicien-magie-des-arcanes-teleportation,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: magicien-magie-des-arcanes-desintegration,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: magicien-magie-des-arcanes-agrandissement
  sorte: capacite_active
  nom: Agrandissement
  champs: { voie: magicien-magie-des-arcanes, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : +2 DM 🗡️, +2 tests de FOR, -2 tests de DEX
    Durée : [5 + Mod. d'INT] tours.

    Le magicien ou une cible volontaire (au contact) voit sa taille augmenter de 50% pendant [5 + Mod. d'INT] tours. Il gagne +2 aux DM au contact et aux tests de FOR. Pataud, il subit un malus de -2 aux tests de DEX.
  effets:
    - {
        sur: jet,
        si: 'arme.attaque == "Contact" ou score == "Contact" ou action == "coup-de-corne" ou action == "coup-de-bouclier" ou action == "griffes" ou action == "choc-electrique" ou action == "mains-d-energie" ou action == "mains-nues" ou action == "arme-d-argent" ou action == "baton-de-mage"',
        ajout: { variable: bonusDM, ajouter: '2' },
      }
    - { sur: jet, si: 'caracteristique == "FOR"', ajout: { bonus: '2' } }
    - { sur: jet, si: 'caracteristique == "DEX"', ajout: { bonus: '-2' } }

- id: magicien-magie-des-arcanes-forme-gazeuse
  sorte: capacite
  nom: Forme gazeuse
  champs: { voie: magicien-magie-des-arcanes, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : Transformation en gaz, insensible aux DM excepté ceux de zone Durée : [1d4 + Mod. d'INT] tours.

    Le magicien prend la consistance d’un gaz. Il se déplace au ras du sol (s’il chute, il se fait ralenti) avec une vitesse de 10 m par tour. Il peut s’introduire par les plus petits interstices et les conduits d’aération. Le magicien est insensible aux capacités physiques mais vulnérable aux sorts de zone DM, à l’exception des sorts de zone occasionnant des DM (comme Boule de feu). Le sort a une durée de [1d4 + Mod. d'INT] tours.

- id: magicien-magie-des-arcanes-hate
  sorte: capacite
  nom: Hâte
  champs: { voie: magicien-magie-des-arcanes, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : +1 action d'attaque ou mouvement
    Durée : [1d6 + Mod. d'INT] tours.

    Pendant [1d6 + Mod. d'INT] tours, le magicien voit son métabolisme s’accélérer. À partir du tour suivant, il obtient une action supplémentaire par tour : soit une action normale, soit une action de mouvement. En revanche, il ne peut toujours accomplir qu’une seule action limitée par tour.

- id: magicien-magie-des-arcanes-teleportation
  sorte: capacite
  nom: Téléportation
  champs: { voie: magicien-magie-des-arcanes, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : téléportation sur [INT x 10] mètres.

    Le magicien disparaît et réapparaît à un autre endroit situé à moins de [INT x 10] mètres. Le lieu d’arrivée doit être soit en ligne de vue, soit parfaitement connu du magicien.

- id: magicien-magie-des-arcanes-desintegration
  sorte: capacite
  nom: Désintégration
  champs: { voie: magicien-magie-des-arcanes, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [5d6 + Mod. d'INT] DM sur la cible.

    Le magicien projette un rayon mortel dont la portée est de 20 mètres et qui annule la cohésion de la matière, en la laissant derrière lui qu’en amas poussiéreux. Un test d’attaque magique doit être réussi pour que la créature ciblée inflige [5d6 + Mod. d'INT] DM. Si l’objet est plus gros qu’un être humain (par exemple, il s’agit d’un mur ou d’une porte massive), il jette un dé par point de structure. Si les objets magiques sont visés, ils doivent réussir un test d’opposition pour ne pas être détruits. Au contact des êtres vivants, ce sort peut désintégrer un membre du corps (par exemple une pierre dans un bras).

- id: magicien-magie-destructrice
  sorte: voie
  nom: Voie de la magie destructrice
  etiquettes: [profil, magicien]
  description: |-
    1. Projectile magique
    2. Rayon affaiblissant
    3. Flèche enflammée
    4. Boule de feu
    5. Rituel de puissance
  effets:
    - {
        sur: rang,
        entree: magicien-magie-destructrice-projectile-magique,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - {
        sur: rang,
        entree: magicien-magie-destructrice-rayon-affaiblissant,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: magicien-magie-destructrice-fleche-enflammee,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: magicien-magie-destructrice-boule-de-feu,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: magicien-magie-destructrice-rituel-de-puissance,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: magicien-magie-destructrice-projectile-magique
  sorte: capacite
  nom: Projectile magique
  champs:
    { voie: magicien-magie-destructrice, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : dégâts automatiques : 1d4 DM,
    rang 4 : 1d6 DM.

    Le magicien choisit une cible visible située à moins de 50 mètres. Elle encaisse automatiquement 1d4 points de dégâts (pas de test d’attaque nécessaire). À partir du Rang 4 dans cette Voie, les DM passent à 1d6.

- id: magicien-magie-destructrice-rayon-affaiblissant
  sorte: capacite
  nom: Rayon affaiblissant
  etiquettes: [sort]
  champs:
    {
      voie: magicien-magie-destructrice,
      rangVoie: 2,
      activation: 'Action limitée, sortilège',
      nbDes: 0,
    }
  description: |-
    Effet : la cible subit -2 🗡️, -2 FOR, -2 DM
    Durée : [1d6 + Mod. d'INT] tours.

    Le magicien choisit une cible située à moins de 10 mètres. Si son attaque magique réussit, le rayon affecte la cible qui subit un malus de -2 à ses tests de FOR, d’attaque au contact et de dégâts pendant [1d6 + Mod. d'INT] tours.

- id: magicien-magie-destructrice-fleche-enflammee
  sorte: capacite
  nom: Flèche enflammée
  champs:
    { voie: magicien-magie-destructrice, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [1d6 + Mod. d'INT] DM plus 1d6 chaque tour
    Durée : s’arrête sur 1-2.

    Le magicien choisit une cible située à moins de 30 mètres. Si son attaque magique réussit, la cible encaisse [1d6 + Mod. d'INT] DM et la flèche enflamme ses vêtements. Chaque tour de combat suivant, le feu inflige 1d6 dégâts supplémentaires. Sur un résultat de 1 à 2, les flammes s’éteignent et le sort prend fin.

- id: magicien-magie-destructrice-boule-de-feu
  sorte: capacite
  nom: Boule de feu
  champs:
    { voie: magicien-magie-destructrice, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [4d6 + Mod. d'INT] DM de zone sur 6 mètres.

    Le magicien choisit une cible située à moins de 30 mètres. Il fait un test d’attaque magique et le compare à la DEF de tous les personnages compris dans un rayon de 6 mètres autour du point d’impact. Chaque victime pour laquelle le test est réussi subit [4d6 + Mod. d'INT] DM et doit réussir un test de DEX difficulté 10 + [Mod. d’INT du magicien] pour ne subir que la moitié des DM. Un échec total au test de DEX inflige la totalité des DM (pas besoin de faire le test de DEX).

- id: magicien-magie-destructrice-rituel-de-puissance
  sorte: capacite
  nom: Rituel de puissance
  champs: { voie: magicien-magie-destructrice, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : 🗡️d12 remplace d20, +2d6 DM.

    Sur une attaque magique, le magicien peut utiliser un d12 en attaque au lieu du d20 habituel. Si l’attaque est réussie, il ajoute 2d6 aux DM. Cette capacité s’utilise uniquement avec les sorts nécessitant un test d’attaque et infligeant des DM. Si les DM sont répartis sur plusieurs tours, seuls les DM initiaux sont modifiés.

- id: magicien-magie-elementaire
  sorte: voie
  nom: Voie de la magie élémentaire
  etiquettes: [profil, magicien]
  description: |-
    1. Asphyxie
    2. Protection contre les éléments
    3. Arme enflammée
    4. Respiration aquatique
    5. Peau de pierre
  effets:
    - { sur: rang, entree: magicien-magie-elementaire-asphyxie, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: magicien-magie-elementaire-protection-contre-les-elements,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: magicien-magie-elementaire-arme-enflammee,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: magicien-magie-elementaire-respiration-aquatique,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: magicien-magie-elementaire-peau-de-pierre,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: magicien-magie-elementaire-asphyxie
  sorte: capacite
  nom: Asphyxie
  etiquettes: [sort]
  champs:
    {
      voie: magicien-magie-elementaire,
      rangVoie: 1,
      activation: 'Action limitée, sortilège',
      nbDes: 1,
    }
  description: |-
    Effet : 1d6 DM par tour
    Durée : [1 + Mod. d'INT] tours.

    Si le magicien réussit son test d’attaque magique (avec une portée de 20 m), la créature ciblée est privée d’air. La victime étouffe progressivement et subit 1d6 DM par tour pendant [1 + Mod. d'INT] tours.

- id: magicien-magie-elementaire-protection-contre-les-elements
  sorte: capacite
  nom: Protection contre les éléments
  champs: { voie: magicien-magie-elementaire, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [2 x rang] RD dégâts élémentaires
    Durée : [5 + Mod. d'INT] tours.

    Pendant [5 + Mod. d'INT] tours, le magicien retranche à tous les DM de feu, de froid, d’électricité ou d’acide subis un montant égal à 2 fois son Rang dans cette Voie.

- id: magicien-magie-elementaire-arme-enflammee
  sorte: capacite_active
  nom: Arme enflammée
  champs: { voie: magicien-magie-elementaire, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : Enchantement +1d6 DM de feu sur arme
    Durée : [5 + Mod. d'INT] tours.

    Le magicien peut enflammer une arme pour [5 + Mod. d'INT] tours. Celle-ci inflige +1d6 DM de feu.
  effets:
    - { sur: jet, si: 'arme != ""', ajout: { variable: desDM, ajouter: '1' } }

- id: magicien-magie-elementaire-respiration-aquatique
  sorte: capacite
  nom: Respiration aquatique
  champs: { voie: magicien-magie-elementaire, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : Respire sous l’eau
    Durée : 10 minutes.

    Le magicien peut respirer sous l’eau pendant 10 minutes. Cette capacité peut être étendue à un compagnon par point de Mod. d'INT.

- id: magicien-magie-elementaire-peau-de-pierre
  sorte: capacite_active
  nom: Peau de pierre
  champs: { voie: magicien-magie-elementaire, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [5 + Mod. d'INT] RD
    Durée : [5 + Mod. d'INT] tours ou 40 DM absorbés.

    Le magicien obtient une réduction des DM égale à [5 + Mod. d'INT] pendant [5 + Mod. d'INT] tours ou jusqu’à ce que le sort ait absorbé 40 points de dégâts.
  effets:
    - { sur: attribut, attribut: RD, operation: ajouter, valeur: '5 + mod(@INT)' }

- id: magicien-magie-protectrice
  sorte: voie
  nom: Voie de la magie protectrice
  etiquettes: [profil, magicien]
  description: |-
    1. Armure du mage
    2. Chute ralentie
    3. Flou
    4. Cercle de protection
    5. Arrêt du temps
  effets:
    - {
        sur: rang,
        entree: magicien-magie-protectrice-armure-du-mage,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - {
        sur: rang,
        entree: magicien-magie-protectrice-chute-ralentie,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: magicien-magie-protectrice-flou, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: magicien-magie-protectrice-cercle-de-protection,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: magicien-magie-protectrice-arret-du-temps,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: magicien-magie-protectrice-armure-du-mage
  sorte: capacite_active
  nom: Armure du mage
  champs: { voie: magicien-magie-protectrice, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : +4 🛡️ Durée : Combat.

    Le magicien fait apparaître un nuage magique argenté qui le protège contre les attaques adverses. Il bénéficie d’un bonus de +4 à la DEF pour le reste du combat.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: '4' }

- id: magicien-magie-protectrice-chute-ralentie
  sorte: capacite
  nom: Chute ralentie
  champs: { voie: magicien-magie-protectrice, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : Tombe de 6 mètres sans dégât.

    Le magicien affecte une cible à moins de 10 mètres avec ce sort. La cible peut chuter de 6 mètres par rang dans la Voie sans subir de dégâts. Si la chute est supérieure à cette hauteur, elle est réduite d’autant.

- id: magicien-magie-protectrice-flou
  sorte: capacite_active
  nom: Flou
  champs: { voie: magicien-magie-protectrice, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : subit 1/2 DM Contact et Distance
    Durée : [1d4 + Mod. d'INT] tours.

    Pendant [1d4 + Mod. d'INT] tours, le corps du magicien devient flou et les DM des attaques de contact ou à distance qu’il encaisse sont divisés par 2.
  effets:
    - {
        sur: jet,
        cote: cible,
        si: 'arme != "" ou score == "Contact" ou score == "Distance" ou action == "coup-de-corne" ou action == "coup-de-bouclier" ou action == "griffes" ou action == "choc-electrique" ou action == "mains-d-energie" ou action == "mains-nues" ou action == "arme-d-argent" ou action == "baton-de-mage"',
        ajout: { variable: demiDM, ajouter: '1' },
      }

- id: magicien-magie-protectrice-cercle-de-protection
  sorte: capacite
  nom: Cercle de protection
  champs: { voie: magicien-magie-protectrice, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : Annule le sort adverse
    Durée : le combat.

    Le magicien peut tracer un cercle sur le sol pouvant contenir 3 personnes. Une fois par tour, lorsqu’un sort prend pour cible un personnage situé dans le cercle (par un test d’attaque magique), le magicien fait un test d’attaque magique en opposition à celui de l’adversaire. Si ce test est réussi, le sort adverse est annulé et n’a aucun effet.

- id: magicien-magie-protectrice-arret-du-temps
  sorte: capacite
  nom: Arrêt du temps
  champs: { voie: magicien-magie-protectrice, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : Stoppe le temps
    Durée : [1d6 + Mod. d'INT] tours.

    Le magicien arrête le temps pendant [1d6 + Mod. d'INT] tours. Seul le magicien peut agir à sa guise pendant cette période, lancer des sorts sur lui-même, se déplacer et déplacer des objets, tant qu’il ne touche pas un être vivant ou n’interagit pas avec lui (en lui lançant un sort par exemple). Dans le cas d’un contact (même magique), le temps reprend instantanément son cours normal.

- id: magicien-magie-universelle
  sorte: voie
  nom: Voie de la magie universelle
  etiquettes: [profil, magicien]
  description: |-
    1. Lumière
    2. Détection de la magie
    3. Invisibilité
    4. Vol
    5. Intelligence héroïque
  effets:
    - { sur: rang, entree: magicien-magie-universelle-lumiere, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: magicien-magie-universelle-detection-de-la-magie,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: magicien-magie-universelle-invisibilite,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - { sur: rang, entree: magicien-magie-universelle-vol, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: magicien-magie-universelle-intelligence-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: magicien-magie-universelle-lumiere
  sorte: capacite
  nom: Lumière
  etiquettes: [test]
  champs:
    {
      voie: magicien-magie-universelle,
      rangVoie: 1,
      activation: 'Action limitée, sortilège',
      bonusTest: '2 * rang("magicien-magie-universelle")',
    }
  description: |-
    Effet : éclaire sur 20 mètres, +2 par rang aux tests d'INT en connaissance et érudition
    Durée : 10 minutes.

    Le magicien désigne un objet, lequel produit des lors de la lumière dans un rayon de 20 mètres. Cette source de lumière n’émet pas de chaleur et s’éteint après 10 minutes ou lorsque le magicien le décide. Ce sort permet d’annuler un sort de Ténèbres lancé par un nécromancien de niveau inférieur.

- id: magicien-magie-universelle-detection-de-la-magie
  sorte: capacite
  nom: Détection de la magie
  champs: { voie: magicien-magie-universelle, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : détecte la présence de magie, +2 par rang aux tests d'INT en connaissance et érudition.

    Le magicien se concentre et détecte la présence de toute inscription et de tout objet magique situé dans la pièce où il se trouve (ou dans les 15 mètres autour de lui). Ce sort permet aussi d’analyser les propriétés d’un objet magique au prix de 2 heures d’étude et de 100 pa de poudre d’argent.

- id: magicien-magie-universelle-invisibilite
  sorte: capacite
  nom: Invisibilité
  champs: { voie: magicien-magie-universelle, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : devient invisible, +2 par rang aux tests d'INT en connaissance et érudition
    Durée : [1d6 + Mod. d'INT] minutes.

    Le magicien se rend invisible pendant [1d6 + Mod. d'INT] minutes. Une fois invisible, personne ne peut détecter sa présence ni l'attaquer. Si le magicien attaque ou utilise une capacité limitée, il redevient visible.

- id: magicien-magie-universelle-vol
  sorte: capacite
  nom: Vol
  champs: { voie: magicien-magie-universelle, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : peut voler, +2 par rang aux tests d'INT en connaissance et érudition
    Durée : [1d6 + Mod. d'INT] minutes.

    Le magicien peut voler pendant [1d6 + Mod. d'INT] minutes. Sa vitesse de déplacement est la même qu’au sol.

- id: magicien-magie-universelle-intelligence-heroique
  sorte: capacite
  nom: Intelligence héroïque
  champs: { voie: magicien-magie-universelle, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 INT, 2d20 aux tests d'INT, +2 par rang aux tests d'INT en connaissance et érudition.

    Le magicien augmente sa valeur d'INT de +2 et il peut désormais lancer deux d20 à chaque fois qu'un test d'INT lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: INT, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "INT"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: moine-maitrise
  sorte: voie
  nom: Voie de la maitrise
  etiquettes: [profil, moine]
  description: |-
    1. Esquive du singe
    2. Morsure du serpent
    3. Griffes du tigre
    4. Fureur du dragon
    5. Moment de perfection
  effets:
    - { sur: rang, entree: moine-maitrise-esquive-du-singe, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: moine-maitrise-morsure-du-serpent, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: moine-maitrise-griffes-du-tigre, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: moine-maitrise-fureur-du-dragon, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: moine-maitrise-moment-de-perfection, valeur: 1, condition: 'rang >= 5' }

- id: moine-maitrise-esquive-du-singe
  sorte: capacite
  nom: Esquive du singe
  champs: { voie: moine-maitrise, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: +1 par rang DEF et aux tests de DEX

    Pour chaque Rang dans cette Voie, le moine gagne +1 en DEF et à tous ses tests de DEX pour effectuer des acrobaties.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 'rang("moine-maitrise")' }
    - { sur: jet, si: 'caracteristique == "DEX"', ajout: { bonus: 'rang("moine-maitrise")' } }

- id: moine-maitrise-morsure-du-serpent
  sorte: capacite
  nom: Morsure du serpent
  champs: { voie: moine-maitrise, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: DM x 2 sur 19 ou 20 contact , 18 - 20 avec une rapière ou vivelame

    Le moine obtient des DM critiques (multipliés par 2) sur un résultat de 19 à 20 au d20 du test d'attaque à mains nues ou avec une arme de contact, et sur des résultats de 18 et 20 avec une rapière ou une Vivelame.
  effets:
    - {
        sur: jet,
        si: 'arme.attaque == "Contact" ou score == "Contact" ou action == "coup-de-corne" ou action == "coup-de-bouclier" ou action == "griffes" ou action == "choc-electrique" ou action == "mains-d-energie" ou action == "mains-nues" ou action == "arme-d-argent" ou action == "baton-de-mage"',
        ajout: { variable: seuilCritique, ajouter: 'min(0, 19 - @Critique)' },
      }

- id: moine-maitrise-griffes-du-tigre
  sorte: capacite
  nom: Griffes du tigre
  champs: { voie: moine-maitrise, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet: +1d DM pour chaque valeur max

    Les DM des attaques à mains nues du moine sont désormais des jets sans limite : s'il obtient les DM maximum sur son dé, le joueur le relance et ajoute le nouveau résultat à ses DM. Tant que le dé donne le meilleur résultat possible, il est relancé et son score comptabilisé. Les dés en bonus (Puissance du Ki par exemple) ne sont jamais relancés, seulement ceux des DM à mains nues.

- id: moine-maitrise-fureur-du-dragon
  sorte: capacite
  nom: Fureur du dragon
  champs: { voie: moine-maitrise, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : [2d6 + mod. FOR] DM

    Une fois par combat, le moine peut effectuer une attaque tournoyante qui inflige automatiquement [2d6+ Mod. de FORI de DM à tous les adversaires au contact et oblige ceux-ci à réussir un test de FOR difficulté 10 pour ne pas tomber au sol.

- id: moine-maitrise-moment-de-perfection
  sorte: capacite
  nom: Moment de perfection
  champs: { voie: moine-maitrise, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : réussite automatique d'attaques et esquives pendant le tour

    Une fois par combat, le moine peut choisir de réussir toutes ses attaques automatiquement et d'esquiver toutes celles qui le prennent pour cible pendant un tour. Tout semble aller au ralenti autour de lui...

- id: moine-meditation
  sorte: voie
  nom: Voie de la méditation
  etiquettes: [profil, moine]
  description: |-
    1. Pacifisme
    2. Transe de guérison
    3. Maîtrise du ki
    4. Projection mentale
    5. Sagesse héroïque
  effets:
    - { sur: rang, entree: moine-meditation-pacifisme, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: moine-meditation-transe-de-guerison, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: moine-meditation-maitrise-du-ki, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: moine-meditation-projection-mentale, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: moine-meditation-sagesse-heroique, valeur: 1, condition: 'rang >= 5' }

- id: moine-meditation-pacifisme
  sorte: capacite_active
  nom: Pacifisme
  champs: { voie: moine-meditation, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: +5 DEF tant que n'attaque pas

    Tant que le moine n'a réalisé aucune action offensive dans un combat, il bénéficie d'un bonus en DEF de +5.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: '5' }

- id: moine-meditation-transe-de-guerison
  sorte: capacite
  nom: Transe de guérison
  champs: { voie: moine-meditation, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : récupère [niveau + mod. SAG] PV
    Durée : 10 minutes

    Une fois après chaque combat, le moine peut méditer pendant 10 minutes et ré- cupérer ainsi [niveau + Mod de SAG] PV.

- id: moine-meditation-maitrise-du-ki
  sorte: capacite
  nom: Maîtrise du ki
  champs: { voie: moine-meditation, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : ajoute son mod. SAG à Init et DEF

    Le moine utilise son intuition et son empathie avec le monde pour augmenter son efficacité en combat. Il ajoute son Mod. de SAG à son Initiative et sa DEF.
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 'mod(@SAG)' }
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 'mod(@SAG)' }

- id: moine-meditation-projection-mentale
  sorte: capacite
  nom: Projection mentale
  champs: { voie: moine-meditation, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : projette son esprit hors du corps
    Durée : [valeur de SAG] tours

    Le moine entre en méditation et projette son esprit hors de son corps. Celui-ci ressemble à un ectoplasme de couleur blanche qui se déplace en volant à la vitesse de 10 m par tour. Il peut passer au traversdes murs, mais pas des êtres vivants, et il reste relié à son corps d'origine par un long filin argenté. La durée maximum de la projection est de [valeur de SAG] tours. Le moine ne perçoit le monde que via sa projection mentale mais ressent si des DM sont infligés à son corps.

- id: moine-meditation-sagesse-heroique
  sorte: capacite
  nom: Sagesse héroïque
  champs: { voie: moine-meditation, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: +2 SAG, 2d20 aux tests de SAG

    Le moine augmente sa valeur de SAG de +2. Il peut désormais lancer deux d20 à chaque fois qu'un test de SAG lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: SAG, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "SAG"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: moine-poing
  sorte: voie
  nom: Voie du Poing
  etiquettes: [profil, moine]
  description: |-
    1. Poings de fer
    2. Parade de projectiles
    3. Peau de fer
    4. Déluge de coups
    5. Puissance du ki
  effets:
    - { sur: rang, entree: moine-poing-poings-de-fer, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: moine-poing-parade-de-projectiles, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: moine-poing-peau-de-fer, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: moine-poing-deluge-de-coups, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: moine-poing-puissance-du-ki, valeur: 1, condition: 'rang >= 5' }

- id: moine-poing-poings-de-fer
  sorte: capacite
  nom: Poings de fer
  champs: { voie: moine-poing, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : remplace contact par distance FOR
    rang1 [1d6 +FOR]
    rang 3 : [1d8 + md. FOR] DM
    rang 5 : [1d10 + md. FOR] DM :

    Lorsqu'il combat à mains nues, le moine peut (s'il le souhaite) utiliser son score d'attaque à distance au lieu de celui d'attaque au contact. Au rang 1 de cette voie, il inflige [1d6 + Mod. de FOR] DM létaux (cf. DM temporaires page 72). Ces DM passent à 1d8 au Rang 3 et à 1d10 au rang 5.

- id: moine-poing-parade-de-projectiles
  sorte: capacite
  nom: Parade de projectiles
  champs: { voie: moine-poing, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : dévit un projectile une fois par tour

    Le moine peut dévier un projectile (flèche, javelot,...) une fois par tour de combat (sauf si le test d'attaque est un critique ou si l'attaque vient d'une arme à poudre)...

- id: moine-poing-peau-de-fer
  sorte: capacite
  nom: Peau de fer
  champs: { voie: moine-poing, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : +2 DEF

    Le moine gagne un bonus de +2 en DEF.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 2 }

- id: moine-poing-deluge-de-coups
  sorte: capacite
  nom: Déluge de coups
  champs: { voie: moine-poing, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : 2 attaques d20 ou 3 attaques d12

    à son tour, le moine peut effectuer 2 attaques à mains nues sur des cibles de son choix ou 2 attaques avec une arme. Alternativement, il peut choisir de faire 3 attaques en utilisant un d12 en attaquepour chacune d'elle (au lieu d'un d20).

- id: moine-poing-puissance-du-ki
  sorte: capacite
  nom: Puissance du ki
  champs: { voie: moine-poing, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : d12 remplace d20, +2d6 DM

    Le moine peut choisir d'utiliser 1d12 en attaque au lieu du d20 habituel (et il ajoute normalement son score d'attaque). Si l'attaque est réussie, il ajoute 2d6 aux DM. Cette capacité peut être utilisée avec « Déluge de coups » ou « Projectiondu ki » par exemple.

- id: moine-vent
  sorte: voie
  nom: Voie du vent
  etiquettes: [profil, moine]
  description: |-
    1. Pas du vent
    2. Course du vent
    3. Course des airs
    4. Lévitation
    5. Passe-muraille
  effets:
    - { sur: rang, entree: moine-vent-pas-du-vent, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: moine-vent-course-du-vent, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: moine-vent-course-des-airs, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: moine-vent-levitation, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: moine-vent-passe-muraille, valeur: 1, condition: 'rang >= 5' }

- id: moine-vent-pas-du-vent
  sorte: capacite
  nom: Pas du vent
  champs: { voie: moine-vent, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: +1 par rang en Init, + 1 déplacement si non consécutif

    Le moine peut se déplacer avant et après avoir attaqué (mais il couvre toujours une distance normale). De plus, il gagne +1 par rang dans la Voie en Initiative.
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 'rang("moine-vent")' }

- id: moine-vent-course-du-vent
  sorte: capacite
  nom: Course du vent
  champs: { voie: moine-vent, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : distance de déplacement x 2 Le moine se déplace à une vitesse surhumaine.

    Il couvre une distance de 40 mètres par action de mouvement (la distance normale est de 20 mètres) et se relever est pour lui une actiongratuite.

- id: moine-vent-course-des-airs
  sorte: capacite
  nom: Course des airs
  champs: { voie: moine-vent, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : déplacement anti gravité

    Le moine défie les lois de la pesanteur et peut se déplacer sur des surfaces qui ne devraient pas supporter son poids. Il peut se déplacer surl'eau, la neige, le feuillage des arbres ou courir sur un mur vertical. Il doit commencer et terminer sondéplacement sur une surface normale.

- id: moine-vent-levitation
  sorte: capacite
  nom: Lévitation
  champs: { voie: moine-vent, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : lévite sur 10 mètres

    En se concentrant, le moine peut « léviter » à une vitesse de 10 m par tour.

- id: moine-vent-passe-muraille
  sorte: capacite
  nom: Passe-muraille
  champs: { voie: moine-vent, rangVoie: 5, activation: Action limitée }
  description: |-
    Effet : traverse un mur de [mod. SAG] mètres

    Le moine peut rendre son corps intangible le temps de passer au travers d'un mur d'une épaisseur maximum de [Mod. de SAG] mètres. Il ne peut rester immatériel qu'un court instant et reprend corps dès qu'il émerge du mur. Il est insensible aux attaques tant qu'il est entièrement dans le mur, sauf si le mur est détruit.

- id: moine-energie-vitale
  sorte: voie
  nom: Voie de l'énergie vitale
  etiquettes: [profil, moine]
  description: |-
    1. Mains d'énergie
    2. Pression mortelle
    3. Invulnérable
    4. Projection du ki
    5. Ascétisme
  effets:
    - { sur: rang, entree: moine-energie-vitale-mains-d-energie, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: moine-energie-vitale-pression-mortelle,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: moine-energie-vitale-invulnerable, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: moine-energie-vitale-projection-du-ki,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - { sur: rang, entree: moine-energie-vitale-ascetisme, valeur: 1, condition: 'rang >= 5' }

- id: moine-energie-vitale-mains-d-energie
  sorte: capacite
  nom: Mains d'énergie
  champs: { voie: moine-energie-vitale, rangVoie: 1, activation: Action limitée }
  description: |-
    Effet : +2 contact, +5 si la cible porte une armure.

    Par un effort de concentration, le moine peut rendre ses mains intangibles, à ce titre, il peut faire une attaque simple avec un bonus de +2 en attaque, +5 si la cible porte une armure. De plus, toutes les attaques à mains nues du moine sont considérées comme magiques (même lorsqu’il n’utilise pas Mains d’énergie).

- id: moine-energie-vitale-pression-mortelle
  sorte: capacite
  nom: Pression mortelle
  champs: { voie: moine-energie-vitale, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet : libère les DM accumulés +1d6 DM.

    Le moine frappe les points par lesquels circule l’énergie vitale d’une créature vivante. En touchant un point précis, il libère ensuite des effets dévastateurs. Lorsqu’il combat à mains nues, le joueur peut choisir de ne pas infliger immédiatement les DM de ses attaques. À tout moment dans l’heure qui suit, il peut annoncer une « Pression Mortelle ». Il doit alors réussir un test d’attaque contre la cible, ce qui libère instantanément la totalité des DM infligés jusqu’alors +1d6 DM supplémentaires.

- id: moine-energie-vitale-invulnerable
  sorte: capacite
  nom: Invulnérable
  champs: { voie: moine-energie-vitale, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : subit 1/2 DM élémentaires, immunisé contre poison et maladie.

    Le Moine ne reçoit que la moitié des DM de toutes les sources « élémentaires » : feu, froid, foudre, acide… Il ne subit aucun DM des poisons ou des maladies.

- id: moine-energie-vitale-projection-du-ki
  sorte: capacite
  nom: Projection du ki
  champs: { voie: moine-energie-vitale, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : [2d6 + mod. SAG] DM.

    Le moine projette une vague de force avec son corps et son esprit à une distance maximum de 20 mètres. Un test d’attaque magique réussi (Mod. de SAG) lui permet d’infliger [2d6 + Mod. de SAG] de DM.

- id: moine-energie-vitale-ascetisme
  sorte: capacite
  nom: Ascétisme
  champs: { voie: moine-energie-vitale, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : 2d20 aux tests de CON.

    Le moine peut subsister sans nourriture, sans eau et sans sommeil pendant [5 + Mod. SAG] jours. Il ne subit aucune pénalité durant cette période. De plus, il peut désormais lancer deux d20 à chaque fois qu’un test de CON lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: jet, si: 'caracteristique == "CON"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: necromancien-mort
  sorte: voie
  nom: Voie de la mort
  etiquettes: [profil, necromancien]
  description: |-
    1. Siphon des âmes
    2. Masque mortuaire
    3. Baiser du vampire
    4. Briser les cœurs
    5. Mot de mort
  effets:
    - { sur: rang, entree: necromancien-mort-siphon-des-ames, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: necromancien-mort-masque-mortuaire, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: necromancien-mort-baiser-du-vampire, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: necromancien-mort-briser-les-c-urs, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: necromancien-mort-mot-de-mort, valeur: 1, condition: 'rang >= 5' }

- id: necromancien-mort-siphon-des-ames
  sorte: capacite
  nom: Siphon des âmes
  champs: { voie: necromancien-mort, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : récupère 1d6 PV à la mort d'une créature proche.

    Chaque fois qu’une créature meurt à moins de 20 m du nécromancien, il récupère 1d6 PV.

- id: necromancien-mort-masque-mortuaire
  sorte: capacite_active
  nom: Masque mortuaire
  champs: { voie: necromancien-mort, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : -2 DM physique subit, 1/2 DM de froid subit
    Durée : [5 + Mod. d'INT] tours.

    Pendant [5 + Mod. d'INT] tours, le nécromancien prend l’apparence de la mort. Il est immunisé aux attaques qui n’affectent que les vivants et à la plupart des pouvoirs des morts-vivants (de plus, ceux-ci le prennent pour l’un des leurs). Il retranche 2 points à tous les DM physiques subits et divise par deux tous les DM de froid.
  effets:
    - { sur: attribut, attribut: RDArmes, operation: ajouter, valeur: '2' }

- id: necromancien-mort-baiser-du-vampire
  sorte: capacite
  nom: Baiser du vampire
  champs: { voie: necromancien-mort, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : -2 DM physique subit, 1/2 DM de froid subit
    Durée : [5 + Mod. d'INT] tours.

    Ce sort nécessite la réussite d’un test d’attaque magique (portée 50 m). La cible subit [1d8 + Mod. d'INT] DM et le nécromancien récupère autant de PV (sans dépasser son score max de PV).

- id: necromancien-mort-briser-les-c-urs
  sorte: capacite
  nom: Briser les cœurs
  champs: { voie: necromancien-mort, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : 🗡️ [5d6 + mod. d'INT] DM.

    Le nécromancien fait mine de broyer le cœur de sa victime. Il doit réussir une attaque magique (portée 20 m) et inflige [5d6 + Mod. d'INT] DM. La victime divise les DM par deux si elle réussit un test de CON difficulté [10 + Mod. d'INT].

- id: necromancien-mort-mot-de-mort
  sorte: capacite
  nom: Mot de mort
  etiquettes: [sort]
  champs:
    {
      voie: necromancien-mort,
      rangVoie: 5,
      activation: 'Action limitée, sortilège',
      nbDes: 0,
      contre: PV,
    }
  description: |-
    Effet : tue la cible sur un test de PV.

    Le nécromancien doit réussir un test d’attaque magique contre le score de PV actuel de sa cible (portée 10 m). La victime doit réussir un test de CON difficulté [10 + Mod. d'INT] ou tomber à 0 PV.

- id: necromancien-sombre-magie
  sorte: voie
  nom: Voie de la sombre magie
  etiquettes: [profil, necromancien]
  description: |-
    1. Ténèbres
    2. Pattes d'araignée
    3. Strangulation
    4. Ombre mortelle
    5. Intelligence héroïque
  effets:
    - { sur: rang, entree: necromancien-sombre-magie-tenebres, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: necromancien-sombre-magie-pattes-d-araignee,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: necromancien-sombre-magie-strangulation,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: necromancien-sombre-magie-ombre-mortelle,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: necromancien-sombre-magie-intelligence-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: necromancien-sombre-magie-tenebres
  sorte: capacite
  nom: Ténèbres
  champs: { voie: necromancien-sombre-magie, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : aveugle tout le monde sur 10 mètres Durée : [5 + Mod. d'INT] tours.

    Le nécromancien invoque une zone fixe de ténèbres magiques, de 10 m de diamètre, pour une durée [5 + Mod. d'INT] tours. Même les créatures capables de voir dans le noir sont aveuglées dans cette zone.

- id: necromancien-sombre-magie-pattes-d-araignee
  sorte: capacite
  nom: Pattes d'araignée
  champs: { voie: necromancien-sombre-magie, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : se déplace sur les murs et plafonds
    Durée : [5 + Mod. d'INT] tours.

    Le nécromancien peut se déplacer de 10 m par action de mouvement sur les murs et les plafonds pendant [5 + Mod. d'INT] tours. S’il reste immobile, il peut lancer des sorts.

- id: necromancien-sombre-magie-strangulation
  sorte: capacite
  nom: Strangulation
  champs: { voie: necromancien-sombre-magie, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [1d6 + mod. d'INT] DM par tour
    Durée : [rang] tours.

    En réussissant un test d’attaque magique (portée 20 m), le nécromancien étouffe une créature vivante et lui inflige [1d6 + Mod. d'INT] DM par tour pendant [rang] tours, pourvu qu’il maintienne la concentration par une action limitée. La victime subit un malus égal au nombre de tours d’effet de la Strangulation (-1 au premier tour, -2 au second, etc.) à tous ses tests. Si la victime sort du champ de vision du nécromancien, le sort prend fin.

- id: necromancien-sombre-magie-ombre-mortelle
  sorte: capacite
  nom: Ombre mortelle
  champs: { voie: necromancien-sombre-magie, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : Ombre : 1 attaque par tour, att = DM de la cible, DM = 1/2 DM de la cible
    Durée : [3 + mod. d'INT] tours.

    L’Ombre de la cible du nécromancien attaque son propriétaire pendant [3 + Mod. d'INT] tours (portée 20 m). L’ombre se réduit de moitié. L’Ombre poursuit sa cible : Ombre : 1 attaque par tour, att = att de la cible, DM = DM de la cible divisés par 2.

- id: necromancien-sombre-magie-intelligence-heroique
  sorte: capacite
  nom: Intelligence héroïque
  champs: { voie: necromancien-sombre-magie, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 INT, 2d20 aux tests d'INT.

    Le nécromancien augmente sa valeur d'INT de +2. Il peut désormais lancer deux d20 à chaque fois qu’un test d'INT lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: INT, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "INT"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: necromancien-demon
  sorte: voie
  nom: Voie du démon
  etiquettes: [profil, necromancien]
  description: |-
    1. Malédiction
    2. Aspect de la succube
    3. Pacte sanglant
    4. Aspect du démon
    5. Invocation d’un démon
  effets:
    - { sur: rang, entree: necromancien-demon-malediction, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: necromancien-demon-aspect-de-la-succube,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: necromancien-demon-pacte-sanglant, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: necromancien-demon-aspect-du-demon, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: necromancien-demon-invocation-d-un-demon,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: necromancien-demon-malediction
  sorte: capacite
  nom: Malédiction
  etiquettes: [sort]
  champs:
    { voie: necromancien-demon, rangVoie: 1, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : 2d20, résultat le plus faible
    Durée : 3 tests ratés.

    Effectuez un test d’attaque magique contre une cible à moins de 20 mètres. En cas de succès, la victime réalise tous ses tests sous l’effet du malus de prendre le résultat le plus faible. Le sort prend fin dès qu’elle aura raté trois tests (il n’y a sinon aucune limite de temps). Si la cible possède une capacité lui permettant de lancer deux dés et de garder le meilleur, elle ne lance plus qu’un seul dé.

- id: necromancien-demon-aspect-de-la-succube
  sorte: capacite
  nom: Aspect de la succube
  champs: { voie: necromancien-demon, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : +5 tests de CHA, 🗡️1d4 + mod. CHA] DM qui soigne d'autant le nécromancien
    Durée : [5 + Mod. d'INT] tours.

    Le nécromancien acquiert une beauté fascinante pour [5 + Mod. d'INT] tours. Il gagne un bonus de +5 aux tests de CHA ainsi qu’à toute attaque de contact nécessitant un test d’attaque magique et qui inflige [1d4 + Mod. de CHA] DM. Ces DM sont transformés en PV, au bénéfice du nécromancien (sans dépasser son score max de PV).

- id: necromancien-demon-pacte-sanglant
  sorte: capacite
  nom: Pacte sanglant
  champs: { voie: necromancien-demon, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : sacrifie 1d4 PV, +3 🗡️ ou résultat d20
    rang 5 : sacrifie 2d4 PV, +5 🗡️ ou résultat d20.

    Par une action gratuite, le nécromancien sacrifie 1d4 PV et gagne immédiatement +3 sur un jet de d20 de son choix ou en DEF contre une attaque. À partir du Rang 5 dans la voie, il peut sacrifier 2d4 PV pour faire passer ce bonus à +5.

- id: necromancien-demon-aspect-du-demon
  sorte: capacite_active
  nom: Aspect du démon
  champs: { voie: necromancien-demon, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : +2 🗡️, +2 FOR, +2 DEX, +2 CON
    Durée : [5 + Mod. d'INT] tours.

    Le nécromancien prend l’apparence d’un démon pendant [5 + Mod. d'INT] tours. Il gagne +2 en attaque au contact et +2 à tous les tests physiques (FOR, DEX, CON). Il peut aussi attaquer avec sa griffe à [1d6 + Mod. d'ATT] DM à chaque tour, en action limitée (une seule en action d’attaque). Cette capacité remplace l’aspect de la succube.
  effets:
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: '2' }
    - {
        sur: jet,
        si: 'caracteristique == "FOR" ou caracteristique == "DEX" ou caracteristique == "CON"',
        ajout: { bonus: '2' },
      }

- id: necromancien-demon-invocation-d-un-demon
  sorte: capacite
  nom: Invocation d’un démon
  champs: { voie: necromancien-demon, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : sacrifie 1d6 PV, invoque un démon : FOR +5, DEX +2, CON +4, INT -2, SAG +2, CHA 0 Init 16, Defdense 7, PV [niveau x 15], Contact [Niveau du nécro], DM 1d8+5
    Durée : [5 + mod d'INT] tours.

    Une fois par combat, en sacrifiant 1d6 PV, le nécromancien invoque un démon à son service pendant [5 + Mod. d'INT] tours. Ce démon d’apparence humaine (ou elfe) peut être invoqué dans un rayon de 20 m. Le démon voyage sur ses deux jambes, attaque chaque tour avec ses deux griffes infligeant des DM normaux. Il peut encaisser une masse de vies équivalente à [niveau du nécromancien x 15]. Lorsque le sort prend fin, le démon s’évanouit en une traînée de fumée, à moins d’avoir encaissé deux fois trop de DM et d’avoir été éliminé.

- id: necromancien-outre-tombe
  sorte: voie
  nom: Voie de l'outre-tombe
  etiquettes: [profil, necromancien]
  description: |-
    1. Peur
    2. Animation des morts
    3. Putréfaction
    4. Ensevelissement
    5. Armée des morts
  effets:
    - { sur: rang, entree: necromancien-outre-tombe-peur, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: necromancien-outre-tombe-animation-des-morts,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: necromancien-outre-tombe-putrefaction,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: necromancien-outre-tombe-ensevelissement,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: necromancien-outre-tombe-armee-des-morts,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: necromancien-outre-tombe-peur
  sorte: capacite
  nom: Peur
  etiquettes: [sort]
  champs:
    {
      voie: necromancien-outre-tombe,
      rangVoie: 1,
      activation: 'Action limitée, sortilège',
      nbDes: 0,
    }
  description: |-
    Effet : fait fuir la cible.

    Le nécromancien effectue un test d’attaque magique contre une cible (portée 20 m). Celle-ci doit réussir un test de FOR ou de SAG (au choix) difficulté [10 + Mod. d'INT] ou fuir pendant [1d4 + rang] tours (le MJ peut garder cette durée secrète). Une créature ne peut subir les effets de ce sort qu’une fois par combat.

- id: necromancien-outre-tombe-animation-des-morts
  sorte: capacite
  nom: Animation des morts
  champs: { voie: necromancien-outre-tombe, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : anime 1 zombi (max 1 par rang) Init 🛡️10, 🗡️12, 🛡️4, DM 1d6+1, se déplace à 50%, perd 1 PV par minute.

    Le nécromancien anime le cadavre d’un humanoïde de taille moyenne, décédé il y a moins de 24 heures. Le zombi comprend les ordres « Attaquer », « Défendre », « Garder » et « Pas bouger ». Zombi : Init 8, DEF 10, PV 12, Att 3, DM 1d6+1. Il se déplace à 50% de la vitesse normale. Le zombi se dégrade et perd 1 PV par minute. Le nécromancien ne peut contrôler qu’un zombi par rang. Un zombi détruit tombe en poussière.

- id: necromancien-outre-tombe-putrefaction
  sorte: capacite
  nom: Putréfaction
  champs: { voie: necromancien-outre-tombe, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [1d6 + mod. d'INT] DM, -2 tous tests.

    En réussissant un test d’attaque magique (portée 10 m), le nécromancien fait pourrir les chairs de sa victime, infligeant [1d6 + Mod. d'INT] DM. La victime subit un malus de -2 à tous ses tests pour le reste du combat, à moins de réussir un test de CON difficulté [12 + Mod. d'INT].

- id: necromancien-outre-tombe-ensevelissement
  sorte: capacite
  nom: Ensevelissement
  etiquettes: [sort]
  champs:
    {
      voie: necromancien-outre-tombe,
      rangVoie: 4,
      activation: 'Action limitée, sortilège',
      nbDes: 2,
    }
  description: |-
    Effet : enterre la cible, 2d6 DM par tour.

    Une fois par combat, si le nécromancien réussit un test d’attaque magique (portée 20 m), le sol s’ouvre sous les pieds de la cible et elle est ensevelie, subit 2d6 DM par tour et ne peut effectuer que des actions extérieures. À son tour, elle peut tenter de s’extraire en réussissant un test de FOR ou un test de SAG difficulté [13 + Mod. d'INT]. Si elle continue de s’enfoncer, elle prend encore 2d6 DM au suivant. Chaque personne se trouvant à 6 m du nécromancien gagne un bonus de +2 sur son test.

- id: necromancien-outre-tombe-armee-des-morts
  sorte: capacite
  nom: Armée des morts
  champs: { voie: necromancien-outre-tombe, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : 3d6 DM par tour par cible dans la zone.

    Une fois par jour, le nécromancien peut invoquer d’innombrables squelettes émergeant du sol pour attaquer ses ennemis pendant [niveau du nécromancien] tours. Les cibles situées dans un rayon de 20 m autour de lui subissent automatiquement 3d6 DM par tour, à moins qu’elles n’utilisent des armes lourdes pour se dégager, ce qui réduit les DM à 1d6 par attaque. Les squelettes et leurs ossements ne peuvent pas être détruits, ils continuent d’attaquer toutes les cibles dans une zone de 20 m de rayon. Tous les alliés du nécromancien (même ceux des cibles) sont divisés par deux.

- id: necromancien-sang
  sorte: voie
  nom: Voie du sang
  etiquettes: [profil, necromancien]
  description: |-
    1. Saignements
    2. Sang mordant
    3. Exsangue
    4. Hémorragie
    5. Lien de sang
  effets:
    - { sur: rang, entree: necromancien-sang-saignements, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: necromancien-sang-sang-mordant, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: necromancien-sang-exsangue, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: necromancien-sang-hemorragie, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: necromancien-sang-lien-de-sang, valeur: 1, condition: 'rang >= 5' }

- id: necromancien-sang-saignements
  sorte: capacite
  nom: Saignements
  etiquettes: [sort]
  champs:
    { voie: necromancien-sang, rangVoie: 1, activation: 'Action limitée, sortilège', nbDes: 1 }
  description: |-
    Effet : 1d6 DM par tour
    Durée : [rang] tours.
    Le nécromancien doit réussir un test d’attaque magique (portée 10 m). Du sang s’écoule de la bouche, du nez, des oreilles et même des yeux de la victime, qui subit 1d6 DM par tour pendant [rang] tours.

- id: necromancien-sang-sang-mordant
  sorte: capacite
  nom: Sang mordant
  champs: { voie: necromancien-sang, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : 1d6 DM d’acide à l’ennemi qui le blesse
    Durée : [5 + mod. d'INT] tours.

    Pendant [5 + Mod. d'INT] tours, le sang du nécromancien se transforme en un acide qui gicle lorsqu’il subit une blessure. Chaque fois qu’un ennemi au contact le blesse, ce dernier subit 1d6 DM d’acide.

- id: necromancien-sang-exsangue
  sorte: capacite
  nom: Exsangue
  champs: { voie: necromancien-sang, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : résiste à la mort, -2 à tous les tests.

    Lorsque le nécromant tombe à 0 PV, il peut continuer à agir mais avec un malus de -2 à tous ses tests. Une nouvelle attaque réussie infligeant au moins 1 point de DM n’aura par l’achever !
  effets:
    - {
        sur: jet,
        actions: [test, exploit, defier-la-mort, blagues-et-cabrioles],
        condition: '@PV <= 0',
        ajout: { bonus: '-2' },
      }
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: '-2', condition: '@PV <= 0' }
    - { sur: attribut, attribut: Distance, operation: ajouter, valeur: '-2', condition: '@PV <= 0' }
    - { sur: attribut, attribut: Magie, operation: ajouter, valeur: '-2', condition: '@PV <= 0' }

- id: necromancien-sang-hemorragie
  sorte: capacite
  nom: Hémorragie
  etiquettes: [sort]
  champs:
    { voie: necromancien-sang, rangVoie: 4, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : +1d6 DM
    Durée : [5 + mod. d'INT] tours.

    Si le nécromancien réussit un test d’attaque magique (portée 10 m), la victime saigne à la moindre coupure. Tous les DM des armes blanches infligés à la cible sont augmentés de 1d6 pendant [5 + Mod. d'INT] tours.

- id: necromancien-sang-lien-de-sang
  sorte: capacite
  nom: Lien de sang
  etiquettes: [sort]
  champs:
    { voie: necromancien-sang, rangVoie: 5, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : 1/2 DM subit sont transmis à la cible Durée : [5 + mod. d'INT] tours.

    En réussissant un test d’attaque magique (portée 20 m), le nécromancien tisse un lien avec sa victime. Pendant [5 + Mod. d'INT] tours, la moitié des DM reçus par le nécromancien sont également subis par la cible et le nécromancien peut lui lancer un sort sans la voir.

- id: pretre-foi
  sorte: voie
  nom: Voie de la foi
  etiquettes: [profil, pretre]
  description: |-
    1. Parole divine
    2. Arme d’argent
    3. Ailes célestes
    4. Foudres divines
    5. Charisme héroïque
  effets:
    - { sur: rang, entree: pretre-foi-parole-divine, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: pretre-foi-arme-d-argent, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: pretre-foi-ailes-celestes, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: pretre-foi-foudres-divines, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: pretre-foi-charisme-heroique, valeur: 1, condition: 'rang >= 5' }

- id: pretre-foi-parole-divine
  sorte: capacite
  nom: Parole divine
  etiquettes: [test]
  champs:
    {
      voie: pretre-foi,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '2 * rang("pretre-foi")',
    }
  description: |-
    Effet : +2 aux tests de CHA Pour chaque rang dans cette Voie,

    le prêtre obtient un bonus de +2 aux tests de CHA visant à convaincre ou convertir son auditoire.

- id: pretre-foi-arme-d-argent
  sorte: capacite
  nom: Arme d’argent
  champs: { voie: pretre-foi, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: arme d'argent, [1d6 + mod. SAG) DM démons et les mort-vivants : +2 Contact, + 1d6 DM

    Ce miracle crée pour la durée du combat une arme d'argent et de lumière que seul le Prêtre peut utiliser. Cette arme inflige [1d6 + Mod. de SAG] de DM. Contre les démons et les mort-vivants, elle offre un bonus de +2 en attaque et ajoute +1d6 aux DM.

- id: pretre-foi-ailes-celestes
  sorte: capacite
  nom: Ailes célestes
  champs: { voie: pretre-foi, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : voler
    Durée : [5 + mod. SAG] tours

    Des ailes divines poussent dans le dos du prêtre, qui peut voler à une vitesse équivalente à deux fois son déplacement normal pendant [5 + Mod. de SAG] tours. Rester en vol stationnaire avec les ailes céleste est une action de mouvement.

- id: pretre-foi-foudres-divines
  sorte: capacite
  nom: Foudres divines
  champs: { voie: pretre-foi, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [1d6 + mod. SAG] DM sur 10 mètres

    La foudre frappe toutes les créatures désignées dans un rayon de 10 mètres autour du prêtre et leur inflige [1d6 + Mod. de SAGI de DM. Le prêtre compare son test d'attaque magique à la DEF de chaque cible.

- id: pretre-foi-charisme-heroique
  sorte: capacite
  nom: Charisme héroïque
  champs: { voie: pretre-foi, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 CHA, 2d20 aux tests de CHA

    Le prêtre augmente sa valeur de CHA de +2 et il peut désormais lancer deux d20 à chaque fois qu'un test de CHA lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CHA, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "CHA"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: pretre-guerre-sainte
  sorte: voie
  nom: Voie de la guerre sainte
  etiquettes: [profil, pretre]
  description: |-
    1. Arme bénie
    2. Bouclier de la foi
    3. Marteau spirituel
    4. Châtiment divin
    5. Mot de pouvoir
  effets:
    - { sur: rang, entree: pretre-guerre-sainte-arme-benie, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: pretre-guerre-sainte-bouclier-de-la-foi,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: pretre-guerre-sainte-marteau-spirituel,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - { sur: rang, entree: pretre-guerre-sainte-chatiment-divin, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: pretre-guerre-sainte-mot-de-pouvoir, valeur: 1, condition: 'rang >= 5' }

- id: pretre-guerre-sainte-arme-benie
  sorte: capacite
  nom: Arme bénie
  champs: { voie: pretre-guerre-sainte, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : relance si DM de 1 Le prêtre bénit son arme sacrée.

    S'il obtient un résultat de « 1 » sur son dé de DM, il relance le dé et garde le second résultat. Les DM de l'arme sont considérés comme magiques.

- id: pretre-guerre-sainte-bouclier-de-la-foi
  sorte: capacite
  nom: Bouclier de la foi
  champs: { voie: pretre-guerre-sainte, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: +1 DEF, rang 4: +2 DEF

    Le prêtre porte le symbole de sa foi sur son bouclier, ce qui lui confère un bonus supplémentaire de +1 en DEF. Ce bonus passe à +2 au Rang 4 de la Voie.
  effets:
    - {
        sur: attribut,
        attribut: Defense,
        operation: ajouter,
        valeur: 'si(rang("pretre-guerre-sainte") >= 4, 2, 1)',
        condition: 'somme_actifs("armure", "bouclier") > 0',
      }

- id: pretre-guerre-sainte-marteau-spirituel
  sorte: capacite
  nom: Marteau spirituel
  champs: { voie: pretre-guerre-sainte, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [1d8 + mod. SAG] DM

    Le prêtre effectue une attaque magique avec une portée de 30 mètres. Un projectile d'énergie prenant la forme de l'arme du prêtre va percuter la cible, lui infligeant [1d8 + Mod. de SAG] de DM.

- id: pretre-guerre-sainte-chatiment-divin
  sorte: capacite
  nom: Châtiment divin
  champs: { voie: pretre-guerre-sainte, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : [+ mod SAG] en Contact et DM

    Le prêtre effectue une attaque de contact avec un bonus en attaque et aux dégâts égal à son Mod. de SAG.

- id: pretre-guerre-sainte-mot-de-pouvoir
  sorte: capacite
  nom: Mot de pouvoir
  champs: { voie: pretre-guerre-sainte, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : alliés +5 Contact, Distance, Magie, paralysie ennemies
    Durée : 1 tour Une fois par combat,

    le prêtre peut prononcer un mot avec la voix de son dieu. Cela dépasse l'entendement des mortels et ses ennemis à portée de vue sont paralysés de terreur pendant 1 tour tandis que tous ses alliés en vue bénéficient d'un bonus de +5 en attaque pendant cette période.

- id: pretre-priere
  sorte: voie
  nom: Voie de la prière
  etiquettes: [profil, pretre]
  description: |-
    1. Bénédiction
    2. Destruction des morts-vivants
    3. Sanctuaire
    4. Intervention divine
    5. Sagesse héroïque
  effets:
    - { sur: rang, entree: pretre-priere-benediction, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: pretre-priere-destruction-des-morts-vivants,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: pretre-priere-sanctuaire, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: pretre-priere-intervention-divine, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: pretre-priere-sagesse-heroique, valeur: 1, condition: 'rang >= 5' }

- id: pretre-priere-benediction
  sorte: capacite_active
  nom: Bénédiction
  champs: { voie: pretre-priere, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: +1 Contact, Distance, Magie, +1 tous tests
    Durée : [3 + mod. SAG] tour

    Le prêtre entonne un chant pour encourager ses compagnons en vue. Lui et ses alliés bénéficient d'un bonus de +1 à tous leurs tests de caractéristique et d'attaque pendant [3 + Mod. de SAG] tours.
  effets:
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: '1' }
    - { sur: attribut, attribut: Distance, operation: ajouter, valeur: '1' }
    - { sur: attribut, attribut: Magie, operation: ajouter, valeur: '1' }
    - {
        sur: jet,
        actions: [test, exploit, defier-la-mort, blagues-et-cabrioles],
        ajout: { bonus: '1' },
      }

- id: pretre-priere-destruction-des-morts-vivants
  sorte: capacite
  nom: Destruction des morts-vivants
  champs: { voie: pretre-priere, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: 2d6 DM à tous les morts-vivants.
    Rang 4 : 3d6 DM

    Le prêtre peut faire un test de SAG difficulté 1. S'il réussit, tous les morts-vivants en vue subissent 2d6 points de DM. Ces DM passent à 3d6 au rang 4 de la Voie.

- id: pretre-priere-sanctuaire
  sorte: capacite
  nom: Sanctuaire
  champs: { voie: pretre-priere, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: protection contre les attaques
    Durée : [5 + mod. SAG] tours

    Quand le prêtre lance ce sort, tous les adversaires qui veulent l'attaquer doivent d'abord réussir un test de SAG difficulté 15. S'ils échouent, ils ne peuvent pas l'attaquer. Les effets de ce sort durent [5 + Mod de SAG] tours, mais s'il tente la moindre attaque, le sort prend fin immédiatement.

- id: pretre-priere-intervention-divine
  sorte: capacite
  nom: Intervention divine
  champs: { voie: pretre-priere, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet: décide de la réussite ou de l'échec Le prêtre fait appel à son dieu pour changer le cours des événements.

    Une fois par combat, il peut décider qu'un test du MJ ou des joueurs est une réussite ou un échec, même après que les dés aient révélé leur résultat.

- id: pretre-priere-sagesse-heroique
  sorte: capacite
  nom: Sagesse héroïque
  champs: { voie: pretre-priere, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: +2 SAG, 2d20 aux tests de SAG

    Le prêtre augmente sa valeur de SAG de +2 et il peut désormais lancer deux d20 à chaque fois qu'un test de SAG lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: SAG, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "SAG"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: pretre-spiritualite
  sorte: voie
  nom: Voie de la spiritualité
  etiquettes: [profil, pretre]
  description: |-
    1. Vêtements sacrés
    2. Protection contre le mal
    3. Délivrance
    4. Marche des plans
    5. Messie
  effets:
    - { sur: rang, entree: pretre-spiritualite-vetements-sacres, valeur: 1, condition: 'rang >= 1' }
    - {
        sur: rang,
        entree: pretre-spiritualite-protection-contre-le-mal,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: pretre-spiritualite-delivrance, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: pretre-spiritualite-marche-des-plans, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: pretre-spiritualite-messie, valeur: 1, condition: 'rang >= 5' }

- id: pretre-spiritualite-vetements-sacres
  sorte: capacite
  nom: Vêtements sacrés
  champs: { voie: pretre-spiritualite, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: +1 DEF par rang si pas d'armure

    La tenue religieuse traditionnelle du prêtre remplace une armure et a été bénie à cet effet: il obtient un bonus en DEF égal à +1 pour chaque Rang dans cette Voie (lorsqu'il ne porte aucune armure).
  effets:
    - {
        sur: attribut,
        attribut: Defense,
        operation: ajouter,
        valeur: 'rang("pretre-spiritualite")',
        condition: 'compte_actifs("armure") == somme_actifs("armure", "bouclier")',
      }

- id: pretre-spiritualite-protection-contre-le-mal
  sorte: capacite_active
  nom: Protection contre le mal
  champs: { voie: pretre-spiritualite, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: la cible (prêtre ou allié) gagne +2 DEF.

    Le prêtre peut lancer ce sort sur lui ou sur tout allié (portée : contact) pour la durée d'un combat. La cible obtient alors un bonus de +2 en DEF et pour tous les tests de résistance contre les attaques des mort-vivants, des démons, des élémentaires et des créatures conjurées (appelées d'un autre plan par magie).
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: '2' }

- id: pretre-spiritualite-delivrance
  sorte: capacite
  nom: Délivrance
  champs: { voie: pretre-spiritualite, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: annule les pénalités et états anormaux En touchant sa cible,

    le prêtre annule les pénalités infligées par les sorts, les malédictions et les capacités spéciales d'autres personnages ou de créatures (douleur, mutilation, poisons, pétrification, etc.).

- id: pretre-spiritualite-marche-des-plans
  sorte: capacite
  nom: Marche des plans
  champs: { voie: pretre-spiritualite, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: déplacement 10 Km par tour
    Durée : [3 + mod. SAG] tours max

    Une fois par jour et pour une durée maximale de [3 + Mod. de SAG] tours, le prétre peut passer dans une dimension entre les plans d'existence où le temps et l'espace sont déformés. Il se déplace dans une sorte de brouillard gris où le paysage défile à toute vitesse. Pour chaque tour de « Marche des Plans », il se déplace en réalité de 10 km. Le lieu de sortie n'est cependant pas très précis et le MJ doit déterminer une position au hasard autour du point visé (à 1d6 km près).

- id: pretre-spiritualite-messie
  sorte: capacite
  nom: Messie
  champs: { voie: pretre-spiritualite, rangVoie: 5, activation: 'Capacité passive, sortilège' }
  description: |-
    Effet : Magie, miracle sur demande

    Une fois par aventure, le prêtre entre directement en contact avec la puissance divine et réalise un miracle. Il s'agit d'un pouvoir extraordinaire que le MJ accorde au joueur et qui permet des actes légendaires comme écarter les eaux, téléporter tout son groupe ou invoquer des nuées mortelles...

- id: pretre-soins
  sorte: voie
  nom: Voie des soins
  etiquettes: [profil, pretre]
  description: |-
    1. Soins légers
    2. Soins modérés
    3. Soins de groupe
    4. Guérison
    5. Rappel à la vie
  effets:
    - { sur: rang, entree: pretre-soins-soins-legers, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: pretre-soins-soins-moderes, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: pretre-soins-soins-de-groupe, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: pretre-soins-guerison, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: pretre-soins-rappel-a-la-vie, valeur: 1, condition: 'rang >= 5' }

- id: pretre-soins-soins-legers
  sorte: capacite
  nom: Soins légers
  champs: { voie: pretre-soins, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: soigne [1d8 + niveau du prêtre] PV ([rang] x par jour)

    Le prêtre peut toucher une cible, qui récupère alors [1d8 + niveau du prêtre] PV perdus. Le prêtre peut utiliser ce sort sur lui-même.

- id: pretre-soins-soins-moderes
  sorte: capacite
  nom: Soins modérés
  champs: { voie: pretre-soins, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: soigne [2d8 + niveau du prêtre] PV ([rang] x par jour)

    Le prêtre peut toucher une cible, qui récupère alors [2d8 + niveau du prêtre] PV perdus. Le prêtre peut utiliser ce sort sur lui-même.

- id: pretre-soins-soins-de-groupe
  sorte: capacite
  nom: Soins de groupe
  champs: { voie: pretre-soins, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: soigne le groupe [1d8 + niveau du prêtre] PV (1x par combat)

    Une fois par combat, le prêtre peut libérer une décharge d'énergie bienfaitrice : tous ses compagnons en vue et lui récupèrent [1d8 + niveau du prêtre] PV perdus.

- id: pretre-soins-guerison
  sorte: capacite
  nom: Guérison
  champs: { voie: pretre-soins, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: soigne PV max et état anormaux

    Une fois par jour, le prêtre peut toucher une cible, qui récupère alors tous ses PV perdus et se trouve guérie des poisons, maladies et affaiblissements de caractéristiques.

- id: pretre-soins-rappel-a-la-vie
  sorte: capacite
  nom: Rappel à la vie
  champs: { voie: pretre-soins, rangVoie: 5, activation: 'Capacité passive, sortilège' }
  description: |-
    Effet :Magie , ressucite pour 1d6 PV Une fois par jour,

    le prêtre peut rappeler à la vie un personnage décédé depuis moins de [Mod. de SAG du prêtre] heures par un rituel de 10 minutes. Il doit connaitre personnellement la personne rappelée et posséder une relique lui appartenant. Le personnage revient à la conscience avec 1d6 PV.

- id: psionique-telekinesie
  sorte: voie
  nom: Voie de la télékinésie
  etiquettes: [profil, psionique]
  description: |-
    1. Manipulation à distance
    2. Champ de protection
    3. Onde de choc
    4. Combat kinétique
    5. Psychoportation
  effets:
    - {
        sur: rang,
        entree: psionique-telekinesie-manipulation-a-distance,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - {
        sur: rang,
        entree: psionique-telekinesie-champ-de-protection,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: psionique-telekinesie-onde-de-choc, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: psionique-telekinesie-combat-kinetique,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: psionique-telekinesie-psychoportation,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: psionique-telekinesie-manipulation-a-distance
  sorte: capacite
  nom: Manipulation à distance
  champs: { voie: psionique-telekinesie, rangVoie: 1, activation: Action limitée }
  description: |-
    Effet : déplace un objet
    portée 10 mètres : DEX = SAG, FOR = CHA, magie[+mod. CHA] DN

    Le psionique peut déplacer ou manipuler un objet à distance à une portée de 20 mètres et le déplacer en l'air de 10 mètres par tour. Le psionique peut manipuler un objet avec l'équivalent d'une DEX égale à sa SAG et d'une FOR égale à son CHA. Il peut attaquer avec une arme manipulée à distance avec son score d'attaque magique et un bonus aux DM égal à son Mod. de CHA. A partir du rang 3, il lui suffit d'une action d'attaque, à partir du rang 5, il lui suffit d'une action de mouvement.

- id: psionique-telekinesie-champ-de-protection
  sorte: capacite
  nom: Champ de protection
  champs: { voie: psionique-telekinesie, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : [+ rang] DEF

    Le psionique déploie autour de lui un champ de force qui repousse efficacement les attaques. Il obtient un bonus en DEF égal au rang atteint dans la Voie. A partir du rang 4, il peut déployer son champ de protection autour d'un allié à moins de 10 mètres de luiau prix d'une action de mouvement à chaque tour.
  effets:
    - {
        sur: attribut,
        attribut: Defense,
        operation: ajouter,
        valeur: 'rang("psionique-telekinesie")',
      }

- id: psionique-telekinesie-onde-de-choc
  sorte: capacite
  nom: Onde de choc
  champs: { voie: psionique-telekinesie, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [2d6 + mod. CHA] DM sur 10 mètres.
    Rang 5 : [3d6 + mod. CHA] DM

    Une fois par combat, le psionique peut produire une vague de force à 360 degrés autour de lui dans un rayon maximum de 10 mètres, moins s'il le souhaite. Toutes les créatures dans la zone d'effet subissent [2d6 + Mod. de CHA] DM et doivent réussir un test de FO difficulté [10 + Mod. de CHA] ou être renversées. Les DM passent à 3d6 au rang 5 de la Voie.

- id: psionique-telekinesie-combat-kinetique
  sorte: capacite
  nom: Combat kinétique
  champs: { voie: psionique-telekinesie, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet: -3 DM subits, contact, distance[+mod CHA] DM

    Le psionique a appris à utiliser son don pendant le combat, en freinant l'impact des attaques adverses et en augmen tant celui des siennes. Il bénéficie d'une réduction des DM de 3 points (RD 3) et il ajoute son Mod. De CHA aux DM de ses propres attaques (au contact ou à distance).
  effets:
    - { sur: attribut, attribut: RD, operation: ajouter, valeur: 3 }

- id: psionique-telekinesie-psychoportation
  sorte: capacite_active
  nom: Psychoportation
  champs: { voie: psionique-telekinesie, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : lévitation, 2d20 aux tests de FOR
    Durée : [5 + mod. CHA] tours

    Le psionique est désormais capable de s'élever lui-même dans les airs et de voler pendant [5 + Mod. de CHA] tours. Sa vitesse maximale est égale à sa vitesse au sol et se maintenir en vol stationnaire estune action gratuite. En outre, grâce à l'application permanente des principes de la télékinésie, le joueur peut désormais lancer deux d20 à chaque fois qu'un test de FOR est demandé au personnage et conserver le meilleur résultat.
  effets:
    - { sur: jet, si: 'caracteristique == "FOR"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: psionique-telepathie
  sorte: voie
  nom: Voie de la télépathie
  etiquettes: [profil, psionique]
  description: |-
    1. Télépathie
    2. Radar mental
    3. Suggestion
    4. Lire les pensées
    5. Domination psy
  effets:
    - { sur: rang, entree: psionique-telepathie-telepathie, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: psionique-telepathie-radar-mental, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: psionique-telepathie-suggestion, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: psionique-telepathie-lire-les-pensees,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - { sur: rang, entree: psionique-telepathie-domination-psy, valeur: 1, condition: 'rang >= 5' }

- id: psionique-telepathie-telepathie
  sorte: capacite
  nom: Télépathie
  champs: { voie: psionique-telepathie, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : communication télépathique
    Durée : [5 + mod. SAG] tours

    Le psionique est capable de communiquer par télépathie avec une créature en vue, dans une langue que tous les deux partagent pendant [5 + Mod. de SAG] tours. A partir du rang 3, le psionique n'a plus besoin de voir sa cible, mais il doit la connaître et la portée maximum est égale à 10 fois sa valeur de SAG en mètres. A partir du rang 5, le psionique accède à une zone de l'esprit plus profonde que les centres du langage et la communication peut avoir lieu avec une créature dont il ne partage pas la langue, et même avec un animal.

- id: psionique-telepathie-radar-mental
  sorte: capacite
  nom: Radar mental
  etiquettes: [test]
  champs:
    {
      voie: psionique-telepathie,
      rangVoie: 2,
      activation: Capacité passive,
      bonusTest: '2 * rang("psionique-telepathie")',
    }
  description: |-
    Effet : +2 par rang aux tests de SAG

    Le psi ressent naturellement la présence de créatures pensantes autour de lui, qu'elles soient animales ou végétales. Il obtient un bonus de +2 par rang dans tous ses tests de SAG lorsqu'il s'agit de détecter un être vivant (tests de surprise) et il ne subit pas de pénalité pour attaquer au contact un être vivant lorsqu'il est aveuglé ou si la créature est invisible. De plus, à partir du rang 4, en présence d'une forme de vie, il est capable d'évaluer si elle est en bonne santé ou non, sans toutefois obtenir un diagnostic plus précis.

- id: psionique-telepathie-suggestion
  sorte: capacite
  nom: Suggestion
  etiquettes: [sort]
  champs:
    {
      voie: psionique-telepathie,
      rangVoie: 3,
      activation: 'Action limitée, sortilège',
      nbDes: 0,
      contre: PV_Max,
    }
  description: |-
    Effet : la cible devient larbin personnel
    Durée : 24 heures

    Une fois par jour, le barde peut suggérer une action à une créature en réussissant un test d'attaque magique avec pour difficulté les PV maximum de celle-ci. En cas de réussite la créature fera tout son possible poursatisfaire sa demande pendant 24 heures. Elle évitera les actions suicidaires (ce qui lui donnerait immédiatement un test d'INT difficulté 10 pour échapper au sort).

- id: psionique-telepathie-lire-les-pensees
  sorte: capacite
  nom: Lire les pensées
  etiquettes: [sort]
  champs:
    {
      voie: psionique-telepathie,
      rangVoie: 4,
      activation: 'Action limitée, sortilège',
      nbDes: 0,
      contre: SAG,
    }
  description: |-
    Effet: sonde les pensées de la cible
    Durée : [1d6 + mod. SAG] tours

    S'il réussit un test d'attaque magique (portée 10 mètres) contre la valeur de SAG d'une créature, le psionique peut savoir à quoi elle est en train de penser pendant [1d6 + Mod. de SAG] tours. Cettecapacité ne permet pas de fouiller dans la mémoire d'un individu pour en tirer des renseignements. Une créature consciente d'être sondée peut faire un test de CHA difficulté [10 + Mod. de SAG du psionique] pour contrôler ses pensées et ne pas révéler ses véritables intentions.

- id: psionique-telepathie-domination-psy
  sorte: capacite
  nom: Domination psy
  champs: { voie: psionique-telepathie, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : test magie vs DEF[15 + mod. carac + NC créature]
    Durée : [1d4 + mod. CHA] minutes

    En réussissant un test d'attaque magique (portée 20 m) contre une DEF égale à [15 + Mod. de Carac. + NC de la créature], le psionique prend contrôle de son esprit pendant [1d4 + Mod. CHA] minutes. Le Mod. de Carac. choisi par la créature est le plus élevé entre INT, SAG ou CHA. Le propre corps du psionique devient inactif. La victime peut tenter de mettre fin au sort avec un test de SAG difficulté [10 + Mod. de CHA du psi] à chaque fois qu'elle subit des DM. Si la créature meurt pendant la domination, le psionique réintègre son corps et subit 1d6 DM. Cette capacité ne permet pas d'affecter les créatures de niveau (NC) supérieur ou égal au personnage.

- id: psionique-attaque-mentale
  sorte: voie
  nom: Voie de l'attaque mentale
  etiquettes: [profil, psionique]
  description: |-
    1. Attaque mentale
    2. Bouclier psi
    3. Attaque étourdissante
    4. Attaque psionique
    5. Ego héroïque
  effets:
    - {
        sur: rang,
        entree: psionique-attaque-mentale-attaque-mentale,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - {
        sur: rang,
        entree: psionique-attaque-mentale-bouclier-psi,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - {
        sur: rang,
        entree: psionique-attaque-mentale-attaque-etourdissante,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - {
        sur: rang,
        entree: psionique-attaque-mentale-attaque-psionique,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: psionique-attaque-mentale-ego-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: psionique-attaque-mentale-attaque-mentale
  sorte: capacite
  nom: Attaque mentale
  champs: { voie: psionique-attaque-mentale, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : [1d6 + mod. CHA] DM
    rang 3 : [2d6 + mod. CHA] DM
    rang 5 : [3d6 + mod. CHA] DM

    Le psionique peut faire un test d'attaque magique contre une cible à une portée maximum de 50 mètres. En cas de succès, il inflige [1d6 + Mod. de CHA] DM. Les DM augmentent à [2d6] à partir du rang 3 et à [3d6] à partir du rang 5. Le psionique peut décider d'infliger des DM temporaires avec une attaque mentale, mais il utilise alors des d4 au lieu de d6 pour déterminer les DM.

- id: psionique-attaque-mentale-bouclier-psi
  sorte: capacite
  nom: Bouclier psi
  champs: { voie: psionique-attaque-mentale, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : +5 Défense et 1/2 DM contre attaque mentale

    Le psionique apprend à lever des barrières infranchissables autour de son esprit. Il augmente sa Défense de +5 contre toutes les attaques mentales (psi ou magiques) et divise par 2 les DM subis par la capacité Attaque mentale.
  effets:
    - { sur: attribut, attribut: DefMagie, operation: ajouter, valeur: '5' }
    - {
        sur: jet,
        cote: cible,
        actions: [attaque-mentale],
        ajout: { variable: demiDM, ajouter: '1' },
      }

- id: psionique-attaque-mentale-attaque-etourdissante
  sorte: capacite
  nom: Attaque étourdissante
  champs: { voie: psionique-attaque-mentale, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : étourdit la cible sur attaque mentale d12

    Le psionique peut choisir d'effectuer son attaque mentale en utilisant un d12 en attaque. En cas de succès, en plus des DM, la cible est Étourdie (pas d'action et -5 en DEF) pendant un tour. Si les créatures de niveau supérieur au psionique sont immunisées à cet effet et celles qui bénéficient d'un bouclier psi peuvent faire un test de CHA difficulté [8 + Mod. de CHA de l'attaquant] pour y résister.

- id: psionique-attaque-mentale-attaque-psionique
  sorte: capacite
  nom: Attaque psionique
  champs: { voie: psionique-attaque-mentale, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : attaque mentale sur (3 + mod. CHA) cibles

    Une fois par combat, le psionique peut projeter son esprit vers un nombre de cibles au maximum égal à [3 + Mod. de CHA] à portée d'attaque mentale. Il effectue une attaque mentale contre chacune d'elles.

- id: psionique-attaque-mentale-ego-heroique
  sorte: capacite
  nom: Ego héroïque
  champs: { voie: psionique-attaque-mentale, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 CHA, 2d20 aux tests de CHA

    Le psionique augmente sa valeur de CHA de +2 et le joueur peut désormais lancer deux d20 à chaque fois qu'un test de CHA est demandé au personnage et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CHA, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "CHA"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: psionique-empathie
  sorte: voie
  nom: Voie de l'empathie
  etiquettes: [profil, psionique]
  description: |-
    1. Perception extra-sensorielle
    2. Défense intuitive
    3. Perception du passé
    4. Vision lointaine
    5. Perception héroïque
  effets:
    - {
        sur: rang,
        entree: psionique-empathie-perception-extra-sensorielle,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - { sur: rang, entree: psionique-empathie-defense-intuitive, valeur: 1, condition: 'rang >= 2' }
    - {
        sur: rang,
        entree: psionique-empathie-perception-du-passe,
        valeur: 1,
        condition: 'rang >= 3',
      }
    - { sur: rang, entree: psionique-empathie-vision-lointaine, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: psionique-empathie-perception-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: psionique-empathie-perception-extra-sensorielle
  sorte: capacite
  nom: Perception extra-sensorielle
  champs: { voie: psionique-empathie, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +1 par rang aux tests de SAG, +1 par rang en Init

    Le psionique ne perçoit plus seulement grâce à ses sens, mais aussi avec son esprit. Il obtient un bonus de +1 par rang à tous ses tests de SAG en rapport avec la perception et en Initiative. Ce bonus ne s'applique pas aux tests requis par les autres capacités de cette Voie.
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 'rang("psionique-empathie")' }
    - { sur: jet, si: 'caracteristique == "SAG"', ajout: { bonus: 'rang("psionique-empathie")' } }

- id: psionique-empathie-defense-intuitive
  sorte: capacite
  nom: Défense intuitive
  champs: { voie: psionique-empathie, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : [+ mod. SAG] Défense

    En combat, le psionique est capable d'anticiper les mouvements de ses adversaires. Il bénéficie d'un bonus de DEF égal à son Mod. de SAG.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 'mod(@SAG)' }

- id: psionique-empathie-perception-du-passe
  sorte: capacite
  nom: Perception du passé
  champs: { voie: psionique-empathie, rangVoie: 3, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : medium

    Le psionique est désormais capable de percevoir les ondes psychiques résiduelles présentes en un lieu. Cela lui permet de déterminer la nature des émotions liées aux événements qui s'y sont déroulés (malheur, douleur, joie, haine, amour, etc.). Le psionique est capable de déterminer le laps de temps depuis lequel s'est déroulé un événement en réussissant un test de SAG difficulté 15. Il obtient un bonus de +5 si l'événement date de moins de 24 heures ou si l'émotion est particulièrement intense (meurtre, torture, etc.).

- id: psionique-empathie-vision-lointaine
  sorte: capacite
  nom: Vision lointaine
  champs: { voie: psionique-empathie, rangVoie: 4, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : vision d'un lieu visité sur test de SAG

    Le psionique a appris à projeter son esprit à de grandes distances. Il peut percevoir avec l'un de ses sens ce qui se passe dans un endroit qu'il a visité depuis peu, quelle que soit la distance. Pour cela, le psionique doit simplement avoir visité l'endroit et réussir un test de SAG difficulté [10 + 1 par jour écoulé depuis la dernière visite].

- id: psionique-empathie-perception-heroique
  sorte: capacite
  nom: Perception héroïque
  champs: { voie: psionique-empathie, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 SAG, 2d20 aux tests de SAG

    Le psionique augmente sa valeur de SAG de +2 et le joueur peut désormais lancer deux d20 à chaque fois qu'un test de SAG est demandé au personnage et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: SAG, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "SAG"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: psionique-envouteur
  sorte: voie
  nom: Voie de l’envoûteur
  etiquettes: [profil, psionique]
  description: |-
    1. Injonction
    2. Sommeil
    3. Confusion
    4. Amitié
    5. Domination
  effets:
    - { sur: rang, entree: psionique-envouteur-injonction, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: psionique-envouteur-sommeil, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: psionique-envouteur-confusion, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: psionique-envouteur-amitie, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: psionique-envouteur-domination, valeur: 1, condition: 'rang >= 5' }

- id: psionique-envouteur-injonction
  sorte: capacite
  nom: Injonction
  champs: { voie: psionique-envouteur, rangVoie: 1, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : donne un ordre à la cible
    Durée : cible immunisée 24h en cas d'échec

    L'ensorceleur donne un ordre simple (mais pas dangereux pour elle) que la victime doit pouvoir comprendre. Il doit réussir un test d'attaque magique opposé avec la cible (contre attaque au contact si la créature n'en a pas) à une portée de 20 mètres. En cas d'échec, la cible doit exécuter l'ordre pendant son prochain tour.

- id: psionique-envouteur-sommeil
  sorte: capacite
  nom: Sommeil
  champs: { voie: psionique-envouteur, rangVoie: 2, activation: 'Action limitée, sortilège' }
  description: |-
    Effet: [1d6 + mod. CHA] cibles tombent de somme
    Réveil sur contact Durée : [5 + mod. CHA] minutes.

    Cible immunisée 24h en cas d'échec [1 d6 + Mod. de CHA] cibles vivantes dans une zone de 10 m de diamètre (portée 20 m) et dont le score max de PV ne dépasse pas le score d'attaque magique de l'ensorceleur* sombrent dans l'inconscience pendant [5 + Mod. de CHA] minutes. Il est possible de les réveiller en les giflant (action d'attaque).

- id: psionique-envouteur-confusion
  sorte: capacite
  nom: Confusion
  etiquettes: [sort]
  champs:
    { voie: psionique-envouteur, rangVoie: 3, activation: 'Action limitée, sortilège', nbDes: 0 }
  description: |-
    Effet : désoriente la cible
    Durée : [3 + mod. CHA] tours.

    Cible immunisée 24h en cas d'échec En réussissant un test d'attaque magique (portée 20 m), l'ensorceleur désoriente sa cible pendant [3 + Mod. de CHA] tours. Chaque tour, lancer 1d6 : 1-3 la victime n'agit pas, 4-6 elle attaque la créature la plus proche (au hasard). Chaque fin de tour, elle fait un test de SAG difficulté [10 + Mod. de CHA] pour mettre fin au sort.

- id: psionique-envouteur-amitie
  sorte: capacite
  nom: Amitié
  etiquettes: [sort]
  champs:
    {
      voie: psionique-envouteur,
      rangVoie: 4,
      activation: 'Action limitée, sortilège',
      nbDes: 0,
      contre: PV_Max,
    }
  description: |-
    Effet: la cible devient un allié
    Durée : renouvelable une fois par jour.

    Cible immunisée 24h en cas d'échec Si l'ensorceleur réussit un test d'attaque magique (portée 10 m) contre le score max de PV d'une cible humanoïde, celle-ci se comporte comme un ami de longue date tant qu'elle n'est pas attaquée. Elle peut résister au sort avec un test de SAG difficulté [12 + Mod. de CHA], renouvelable une fois par jour.

- id: psionique-envouteur-domination
  sorte: capacite
  nom: Domination
  champs: { voie: psionique-envouteur, rangVoie: 5, activation: 'Action limitée, sortilège' }
  description: |-
    Effet : prend le contrôle de la cible
    Durée : [1d4 + mod. CHA minutes].
    Cible immunisée 24h en cas d'échec

    En réussissant un test d'attaque magique (portée 20 m) en opposition contre un test d'attaque magique de la cible (ou d'attaque au contact si la créature n'en a pas), l'ensorceleur prend contrôle de son esprit pendant [1d4 + Mod. CHA] minutes. Son propre corps devient inactif. La victime peut résister au sort avec un test de SAG difficulté [10 + Mod. de CHA] à chaque fois qu'elle subit des DM. Si la créature meurt pendant la domination, l'ensorceleur réintègre son corps et subit 1d6 DM.

- id: rodeur-archer
  sorte: voie
  nom: Voie de l’archer
  etiquettes: [profil, rodeur]
  description: |-
    1. Sens affutés
    2. Tir aveugle
    3. Tir rapide
    4. Flèche de mort
    5. Dans le mille

    Note : dans les données d’origine, les textes de cette voie reprennent ceux du guerrier ; aucune mécanique n’est codée.
  effets:
    - { sur: rang, entree: rodeur-archer-sens-affutes, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: rodeur-archer-tir-aveugle, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: rodeur-archer-tir-rapide, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: rodeur-archer-fleche-de-mort, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: rodeur-archer-dans-le-mille, valeur: 1, condition: 'rang >= 5' }

- id: rodeur-archer-sens-affutes
  sorte: capacite
  nom: Sens affutés
  champs: { voie: rodeur-archer, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: +3 PV rang 1, +6 PV rang 3, +9 PV rang 5.

    En prenant cette capacité, le guerrier gagne 3 PV supplémentaires au rang 1, puis 3 PV de plus au rang 3 de cette Voie et enfin 3 PV au rang 5.

- id: rodeur-archer-tir-aveugle
  sorte: capacite
  nom: Tir aveugle
  champs: { voie: rodeur-archer, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet : +2 DEF , +4 au rang 4.

    Le rodeur a endurci son corps. Il bénéficie d'un bonus de + 2 à la DEF. Ce bonus passe à +4 lorsqu'il atteint le rang 4 de la voie.

- id: rodeur-archer-tir-rapide
  sorte: capacite
  nom: Tir rapide
  champs: { voie: rodeur-archer, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : [1d10 + niveau + mod. CON] PV récupéré 1 fois par combat.

    Le guerrier peut décider de ne pas attaquer lors du tour de combat pour reprendre son souffle. Il récupère alors [1d10 + niveau + Mod. de CON] PV. Attention : cette capacité ne peut être utilisée qu'une fois par combat.

- id: rodeur-archer-fleche-de-mort
  sorte: capacite
  nom: Flèche de mort
  champs: { voie: rodeur-archer, rangVoie: 4, activation: Action illimitée }
  description: |-
    Effet : +5 CON, utime tour à la mort

    Le guerrier reçoit un bonus de +5 à tous ses tests de CON. De plus, lorsqu'il tombe à 0 PV, il peut continuer à agir pendant un ultime tour avant de tomber inconscient.

- id: rodeur-archer-dans-le-mille
  sorte: capacite
  nom: Dans le mille
  champs: { voie: rodeur-archer, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: +2 CON, 2d20 aux tests de CON

    Le guerrier augmente sa valeur de CON de +2 et il peut désormais lancer deux d20 à chaque fois qu'un test de CON lui est demandé et conserver le meilleur résultat.

- id: rodeur-survie
  sorte: voie
  nom: Voie de la survie
  etiquettes: [profil, rodeur]
  description: |-
    1. Endurant
    2. Nature nourricière
    3. Grand pas
    4. Increvable
    5. Constitution héroïque

    Note : dans les données d’origine, les textes de cette voie reprennent ceux du guerrier ; aucune mécanique n’est codée.
  effets:
    - { sur: rang, entree: rodeur-survie-endurant, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: rodeur-survie-nature-nourriciere, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: rodeur-survie-grand-pas, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: rodeur-survie-increvable, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: rodeur-survie-constitution-heroique, valeur: 1, condition: 'rang >= 5' }

- id: rodeur-survie-endurant
  sorte: capacite
  nom: Endurant
  champs: { voie: rodeur-survie, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: donne la li de son bouclier à un allié Le guerrier accorde le Mod. de DEF de son bouclier à un compagnon de son choix qui se trouve juste à côté de lui (il conserve ce bonus pour lui-même aussi). Il peut changer de compagnon à chaque tour durant sa phase d'initiative. C'est une action gratuite.

- id: rodeur-survie-nature-nourriciere
  sorte: capacite
  nom: Nature nourricière
  champs: { voie: rodeur-survie, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : bloque l'attaque adverse sur test de Contact en opposition réussi, au prix d'une action à son tour, le guerrier fait seulement une action d'attaque ou de déplacement. Par la suite, à tout moment avant son prochain tour, le guerrier peut effectuer un test d'attaque au contact en opposition à un test réussi d'attaque au contact ou à distance d'un adversaire. En cas de réussite, l'attaque adverse est bloquée par le bouclier.

- id: rodeur-survie-grand-pas
  sorte: capacite
  nom: Grand pas
  champs: { voie: rodeur-survie, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : absorbe les dégats magiques sur test #R en opposition au prix d'une action à son tour, le guerrier fait seulement une action d'attaque ou de déplacement. Par la suite, à tout moment avant son prochain tour, le guerrier peut effectuer un test d'attaque magique (Mod. de SAG) en opposition à un test d'attaque magique qui le visait. En cas de réussite, le sort est absorbé par le bouclier et n'a aucun effet sur le guerrier.

- id: rodeur-survie-increvable
  sorte: capacite
  nom: Increvable
  champs: { voie: rodeur-survie, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : peut porter une armure de plaque +8 DEF, Le guerrier peut porter une Armure de Plaque complète. Celle-ci lui confère une DEF de +8 et le protège des attaques critiques (vous subissez des DM normaux au lieu des DM doublés).

- id: rodeur-survie-constitution-heroique
  sorte: capacite
  nom: Constitution héroïque
  champs: { voie: rodeur-survie, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : renvoi le sort absorbé par la capacité Le guerrier peut décider de renvoyer un sort qu'il vient d'absorber grâce à sa capacité Absorber un Sort. Au lieu d'être annulé, le sort absorbé le tour précédent est retourné contre son expéditeur : le lanceur du sort subit alors les effets de sa propre attaque !

- id: rodeur-escarmouche
  sorte: voie
  nom: Voie de l’escarmouche
  etiquettes: [profil, rodeur]
  description: |-
    1. Chasseur émérite
    2. Traquenard
    3. Attaque éclair
    4. Repli
    5. Dextérité héroïque

    Note : dans les données d’origine, les textes de cette voie reprennent ceux du guerrier ; aucune mécanique n’est codée.
  effets:
    - { sur: rang, entree: rodeur-escarmouche-chasseur-emerite, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: rodeur-escarmouche-traquenard, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: rodeur-escarmouche-attaque-eclair, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: rodeur-escarmouche-repli, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: rodeur-escarmouche-dexterite-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: rodeur-escarmouche-chasseur-emerite
  sorte: capacite
  nom: Chasseur émérite
  champs: { voie: rodeur-escarmouche, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +3 Init Le guerrier gagne +3 en Initiative.

- id: rodeur-escarmouche-traquenard
  sorte: capacite
  nom: Traquenard
  champs: { voie: rodeur-escarmouche, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet: désarme son adversaire si opposition Contact. Le guerrier réalise une attaque au contact et sa victime doit faire un test d'attaque opposé. Si le guerrier obtient le plus haut score, l'arme de son adversaire tombe au sol (une action de mouvement doit être employée pour la ramasser). S'il le guerrier réussit son test avec au moins 10 points de plus que son adversaire, il empêche celui-ci de récupérer son arme (en posant le pied dessus, en l'envoyant hors de portée, etc.). Cette capacité est évidemment sans effet sur les armes naturelles (griffes, crocs, épine dorsale, etc.). Les adversaires qui utilisent des armes à 2 mains sont plus difficiles à désarmer, infligeant un malus de -5 au test.

- id: rodeur-escarmouche-attaque-eclair
  sorte: capacite
  nom: Attaque éclair
  champs: { voie: rodeur-escarmouche, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet: deux attaques Contact dans le tour, malus -2 Le guerrier peut tenter deux attaques au contact durant ce tour avec un malus de -2.

- id: rodeur-escarmouche-repli
  sorte: capacite
  nom: Repli
  champs: { voie: rodeur-escarmouche, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : attaque Contact contre chaque adversaire au contact Le guerrier peut tenter une attaque au contact contre chaque adversaire engagé au contact avec lui.

- id: rodeur-escarmouche-dexterite-heroique
  sorte: capacite
  nom: Dextérité héroïque
  champs: { voie: rodeur-escarmouche, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : d12 remplace d20 Contact, +2d6 DM Le guerrier peut choisir d'utiliser 1d12 en attaque au contact au lieu du d20 habituel (il ajoute normalement son score d'attaque). Si une telle attaque est réussie, il ajoute + 2d6 aux DM. Cette capacité peut être utilisée avec Attaque Double, Attaque Circulaire ou Attaque parfaite par exemple.

- id: rodeur-compagnon-animal
  sorte: voie
  nom: Voie du compagnon animal
  etiquettes: [profil, rodeur]
  description: |-
    1. Odorat
    2. Surveillance
    3. Combat
    4. Empathie animale
    5. Animal fabuleux

    Note : dans les données d’origine, les textes de cette voie reprennent ceux du guerrier ; aucune mécanique n’est codée.
  effets:
    - { sur: rang, entree: rodeur-compagnon-animal-odorat, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: rodeur-compagnon-animal-surveillance, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: rodeur-compagnon-animal-combat, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: rodeur-compagnon-animal-empathie-animale,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: rodeur-compagnon-animal-animal-fabuleux,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: rodeur-compagnon-animal-odorat
  sorte: capacite
  nom: Odorat
  champs: { voie: rodeur-compagnon-animal, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: +1 Contact avec arme de prédilection Le guerrier choisit une arme de prédilection (par exemple épée longue ou hache à 1 main, arc court, etc.), et gagne +1 en attaque lorsqu'il l'utilise.

- id: rodeur-compagnon-animal-surveillance
  sorte: capacite
  nom: Surveillance
  champs: { voie: rodeur-compagnon-animal, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : critique sur 19-20 Le guerrier inflige des critiques sur 19-20 (18-20 lorsqu'il emploie une rapière ou une Vivelame).

- id: rodeur-compagnon-animal-combat
  sorte: capacite
  nom: Combat
  champs: { voie: rodeur-compagnon-animal, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet: +2 DM avec arme de prédilectior Lorsque le guerrier emploie son arme de prédilection, il gagne un bonus de +2 aux DM.

- id: rodeur-compagnon-animal-empathie-animale
  sorte: capacite
  nom: Empathie animale
  champs: { voie: rodeur-compagnon-animal, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : 2d20 2, +1d6 DM Lancez deux d20 en attaque au contact et gardez le meilleur résultat, ajoutez + 1d6 aux DM.

- id: rodeur-compagnon-animal-animal-fabuleux
  sorte: capacite
  nom: Animal fabuleux
  champs: { voie: rodeur-compagnon-animal, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: +1 attaque Contact si l'adversaire rate son attaque En plus de ses actions normales, une fois par tour, lorsqu'un adversaire rate une attaque de contact contre le guerrier, le joueur obtient une attaque supplémentaire contre cet adversaire.

- id: rodeur-traqueur
  sorte: voie
  nom: Voie du traqueur
  etiquettes: [profil, rodeur]
  description: |-
    1. Pas de loup
    2. Ennemi juré
    3. Embuscade
    4. Second ennemi juré
    5. Perception héroïque

    Note : dans les données d’origine, les textes de cette voie reprennent ceux du guerrier ; aucune mécanique n’est codée.
  effets:
    - { sur: rang, entree: rodeur-traqueur-pas-de-loup, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: rodeur-traqueur-ennemi-jure, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: rodeur-traqueur-embuscade, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: rodeur-traqueur-second-ennemi-jure, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: rodeur-traqueur-perception-heroique, valeur: 1, condition: 'rang >= 5' }

- id: rodeur-traqueur-pas-de-loup
  sorte: capacite
  nom: Pas de loup
  champs: { voie: rodeur-traqueur, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: malus en début de tour convertis en bonus jusqu'au tour suivant Au début de votre tour, choisissez d'appliquer jusqu'à - 1 par rang en attaque, en DEF ou aux DM et obtenez l'équivalent en bonus au choix en attaque, en DEF ou aux DM jusqu'à votre prochain tour.

- id: rodeur-traqueur-ennemi-jure
  sorte: capacite
  nom: Ennemi juré
  champs: { voie: rodeur-traqueur, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: +1 DEF,Contact par allié au contact avec vous Lorsque vous combattez la même créature qu'un allié, vous gagnez +1 en attaque et en DEF par allié au contact avec vous et avec la créature.

- id: rodeur-traqueur-embuscade
  sorte: capacite
  nom: Embuscade
  champs: { voie: rodeur-traqueur, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : sacrifie - 1d4 PV contre +5 FOR ou +5 DEX Le guerrier réussit souvent des exploits physiques hors-norme. Une fois par tour, vous pouvez sacrifier 1d4 PV pour obtenir +5 sur un test de FOR ou de DEX. Vous pouvez annoncer l'utilisation de cette capacité après avoir pris connaissance du résultat du test de caractéristique.

- id: rodeur-traqueur-second-ennemi-jure
  sorte: capacite
  nom: Second ennemi juré
  champs: { voie: rodeur-traqueur, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet: +1 attaque Contact contre tout attaquant si aucun déplacement Le guerrier effectue uniquement une attaque au contact durant ce tour. En contrepartie, il bénéficie d'une attaque supplémentaire contre tout ennemi qui se déplace à son contact. Un adversaire blessé par cette attaque voit son déplacement stoppé.

- id: rodeur-traqueur-perception-heroique
  sorte: capacite
  nom: Perception héroïque
  champs: { voie: rodeur-traqueur, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 FOR, 2d20 aux tests de FOR Le guerrier augmente sa valeur de Force de +2 et il peut désormais lancer deux d20 à chaque fois qu'un test de FOR lui est demandé et conserver le meilleur résultat.

- id: samourai-honneur
  sorte: voie
  nom: Voie de l'honneur
  etiquettes: [profil, samourai]
  description: |-
    1. Chef né
    2. Défi
    3. Honorable
    4. Seuls au monde
    5. Surmonter la douleur
  effets:
    - { sur: rang, entree: samourai-honneur-chef-ne, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: samourai-honneur-defi, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: samourai-honneur-honorable, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: samourai-honneur-seuls-au-monde, valeur: 1, condition: 'rang >= 4' }
    - {
        sur: rang,
        entree: samourai-honneur-surmonter-la-douleur,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: samourai-honneur-chef-ne
  sorte: capacite
  nom: Chef né
  etiquettes: [test]
  champs:
    {
      voie: samourai-honneur,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: 'rang("samourai-honneur")',
    }
  description: |-
    Effet : [+rang] aux tests de CHA d'intimidation, immunisé à la peur

    Le Samouraï est immunisé aux effets de peur (magie, pouvoir de dragon, etc.) De plus, il bénéficie d'un bonus de +1 par rang aux tests de CHA pour donner des ordres ou intimider.

- id: samourai-honneur-defi
  sorte: capacite
  nom: Défi
  champs: { voie: samourai-honneur, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet : [+rang] DM aux dégats sur la cible.
    Durée : jusqu'à la fin du combat.

    Le samouraï défie un ennemi par une action limitée. Il obtient un bonus aux DM égal au rang atteint dans la Voie contre cet adversaire jusqu'à la fin du combat. Le samouraï peut défier un seul adversaire par scène de combat.

- id: samourai-honneur-honorable
  sorte: capacite
  nom: Honorable
  etiquettes: [test]
  champs: { voie: samourai-honneur, rangVoie: 3, activation: Capacité passive, bonusTest: '5' }
  description: |-
    Effet: +5 aux tests de bonne foi ou décision

    Le samouraï a une réputation d'honorabilité sans faille. Il peut mettreen jeu son honneur pour garantir sa parole et la justesse de ses actions. Il bénéficie d'un bonus de +5 à tous les tests où sa bonne foi est en jeu. Il est considéré comme une référence en matière de justice, ce qui lui accorde le même bonus pour rendre justice, apaiser une foule en colère ou infliéchir la décision d'un dirigeant.

- id: samourai-honneur-seuls-au-monde
  sorte: capacite_active
  nom: Seuls au monde
  champs: { voie: samourai-honneur, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet: +5 Defense contre les cibles autres que celle défiée.

    Lorsqu'il a défié un adversaire, le samouraï obtient un bonus de +5 en DEF contre les attaques de tous les autres adversaires, à chaque tour où il attaque uniquement la cible qu'il a défié.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: '5' }

- id: samourai-honneur-surmonter-la-douleur
  sorte: capacite
  nom: Surmonter la douleur
  etiquettes: [test]
  champs: { voie: samourai-honneur, rangVoie: 5, activation: Capacité passive, bonusTest: '5' }
  description: |-
    Effet : +5 aux tests de douleur, immunisé contre Affaibli, + 1 tour +5 Contact Distance + 1d6 DM contre la cible défiée en cas de décès

    Le samouraï obtient un bonus de +5 à tous les tests pour résister à la douleur et il est immunisé à l'état préjudiciable Affaibli . Lorsqu'il arrive à 0 PV, il peut encore agir un tour complet et, s'il a défié un ennemi, il obtient un bonus de +5 en attaque et +1d6 aux DM contre cet adversaire au cours de ce baroud d'honneur.

- id: samourai-dirigeant
  sorte: voie
  nom: Voie du dirigeant
  etiquettes: [profil, samourai]
  description: |-
    1. Éduqué
    2. Homme de cour
    3. Lame de lignée
    4. Moment zen
    5. Homme complet
  effets:
    - { sur: rang, entree: samourai-dirigeant-eduque, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: samourai-dirigeant-homme-de-cour, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: samourai-dirigeant-lame-de-lignee, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: samourai-dirigeant-moment-zen, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: samourai-dirigeant-homme-complet, valeur: 1, condition: 'rang >= 5' }

- id: samourai-dirigeant-eduque
  sorte: capacite
  nom: Éduqué
  etiquettes: [test]
  champs: { voie: samourai-dirigeant, rangVoie: 1, activation: Capacité passive, bonusTest: '5' }
  description: |-
    Effet: +5 connaissances des bannières noblesse, étiquette. Le samouraï bénéficie d'un bonus de +5 pour reconnaître les bannières et les familles nobles et d'un bonus de +5 aux tests d'étiquette et d'interaction avec la noblesse et la haute société.

- id: samourai-dirigeant-homme-de-cour
  sorte: capacite
  nom: Homme de cour
  etiquettes: [test]
  champs: { voie: samourai-dirigeant, rangVoie: 2, activation: Capacité passive, bonusTest: '5' }
  description: |-
    Effet: +5 connaissances des bannières noblesse, étiquette. Le samouraï bénéficie d'un bonus de +5 pour reconnaître les bannières et les familles nobles et d'un bonus de +5 aux tests d'étiquette et d'interaction avec la noblesse et la haute société.

- id: samourai-dirigeant-lame-de-lignee
  sorte: capacite
  nom: Lame de lignée
  champs: { voie: samourai-dirigeant, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet: +1 Contact tous les 3 niveaux.
    Rang 5: + 1 niveau de magie : affutée, fléau ou DM élémentaires

    Le samourai possède un sabre (ou une paire de sabre s'il possède la capacité lames jumelles) qui se transmet dans sa famille depuis des générations et qui symbolise l'honneur des siens. Entre ses mains, cette arme devient magique et lui confère un bonus de +1 en attaque au contact (mais pas aux DM) tous les 3 niveaux: +1 au niveau 3, +2 au niveau 6, +3 au niveau 9, etc.
  effets:
    - {
        sur: jet,
        si: 'arme.attaque == "Contact" et a_etiquette(arme, "sabre")',
        ajout: { bonus: 'floor(@niveau / 3)' },
      }
- id: samourai-dirigeant-moment-zen
  sorte: capacite
  nom: Moment zen
  champs: { voie: samourai-dirigeant, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : 2d6 tours pour prendre 10, 2d6 minutes pour prendre 20 Le samouraï est capable d'atteindre la paix intérieure même dans les moments les plus stressants.

    Désormais, il est capable de prendre 10 (CO Fantasy p. 69), même en situation stressante et il lui faut seulement 2d6 tours (au lieu de 2d6 minutes).

- id: samourai-dirigeant-homme-complet
  sorte: capacite
  nom: Homme complet
  champs: { voie: samourai-dirigeant, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: +1 capacité de rang 1 à 3 profil de base

    Le samouraï possède les moyens et la culture nécessaire pour obtenir une formation dans n'importe quel domaine qui lui sied. Choisissez une capacité de rang 1 à 3 dans n'importe quel profil de base.

- id: samourai-ki
  sorte: voie
  nom: Voie du Ki
  etiquettes: [profil, samourai]
  description: |-
    1. Esprit vide
    2. Main vide
    3. Kiai
    4. Course mortelle
    5. Puissance du ki
  effets:
    - { sur: rang, entree: samourai-ki-esprit-vide, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: samourai-ki-main-vide, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: samourai-ki-kiai, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: samourai-ki-course-mortelle, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: samourai-ki-puissance-du-ki, valeur: 1, condition: 'rang >= 5' }

- id: samourai-ki-esprit-vide
  sorte: capacite
  nom: Esprit vide
  champs: { voie: samourai-ki, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : +3 Init.
    Rang 4: +5 Init

    Le Samourai gagne +3 en Initiative, ce bonus passe à +5 au rang 4 de la Voie.
  effets:
    - {
        sur: attribut,
        attribut: INIT,
        operation: ajouter,
        valeur: 'si(rang("samourai-ki") >= 4, 5, 3)',
      }

- id: samourai-ki-main-vide
  sorte: capacite
  nom: Main vide
  champs: { voie: samourai-ki, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : A mains nues : contact mod. DEX ou FOR au choix,
    rang 1 : [1d4 + mod. FOR] DM létaux
    rang 3 : [1d6 + mod. FOR] DM létaux
    rang 5 : [1d8 + mod. FOR] DM létaux

    Lorsqu'il combat à mains nues, le samouraï peut (s'il le souhaite) utiliser son Mod. de DEX en attaque au contact au lieu de son Mod. de FOR (mais pas aux DM).

- id: samourai-ki-kiai
  sorte: capacite
  nom: Kiai
  champs: { voie: samourai-ki, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet: DM max à (distance/combat) 1x par combat.
    Rang 5 : 2x par combat 1d6 tours plus tard

    Une fois par combat, lorsqu'il a réussi une attaque (à distance ou au contact), le samouraï peut libérer son énergie sous la forme d'un puissant cri issu du ventre. Il obtient les DM maximum.

- id: samourai-ki-course-mortelle
  sorte: capacite
  nom: Course mortelle
  champs: { voie: samourai-ki, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : contact sur chaque cible sur 10 mètres en ligne droite

    Le samouraï parcourt jusqu'à 10 mètres en ligne droite en dépassant autant d'ennemis qu'il le souhaite.

- id: samourai-ki-puissance-du-ki
  sorte: capacite
  nom: Puissance du ki
  champs: { voie: samourai-ki, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : Contact d12 remplace d20, +2d6 DM

    Le Samourai peut choisir d'utiliser 1d12 en attaque au lieu du d20 habituel. Si l'attaque est réussie, il ajoute 2d6 aux DM.

- id: samourai-arc-et-du-cheval
  sorte: voie
  nom: Voie de l'arc et du cheval
  etiquettes: [profil, samourai]
  description: |-
    1. Monture loyale
    2. Tir en mouvement
    3. Tir fatal
    4. Tirs successifs
    5. Perception héroïque
  effets:
    - {
        sur: rang,
        entree: samourai-arc-et-du-cheval-monture-loyale,
        valeur: 1,
        condition: 'rang >= 1',
      }
    - {
        sur: rang,
        entree: samourai-arc-et-du-cheval-tir-en-mouvement,
        valeur: 1,
        condition: 'rang >= 2',
      }
    - { sur: rang, entree: samourai-arc-et-du-cheval-tir-fatal, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: samourai-arc-et-du-cheval-tirs-successifs,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: samourai-arc-et-du-cheval-perception-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: samourai-arc-et-du-cheval-monture-loyale
  sorte: capacite_active
  nom: Monture loyale
  champs: { voie: samourai-arc-et-du-cheval, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: +1 Contact, Disatnce, Défense à cheval.
  effets:
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: '1' }
    - { sur: attribut, attribut: Distance, operation: ajouter, valeur: '1' }
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: '1' }

- id: samourai-arc-et-du-cheval-tir-en-mouvement
  sorte: capacite
  nom: Tir en mouvement
  champs: { voie: samourai-arc-et-du-cheval, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: Distance + mouvement à cheval en une action d'attaque.

- id: samourai-arc-et-du-cheval-tir-fatal
  sorte: capacite
  nom: Tir fatal
  champs: { voie: samourai-arc-et-du-cheval, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet: Distance critique sur [20 - mod. SAG], +1d6 DM aux critiques, au rang 5, +2d6 DM aux critiques.
  effets:
    - {
        sur: jet,
        si: 'arme.attaque == "Distance"',
        ajout: { variable: seuilCritique, ajouter: 'min(0, 20 - mod(@SAG) - @Critique)' },
      }
    - {
        sur: jet,
        si: 'arme.attaque == "Distance"',
        ajout:
          { variable: desCritique, ajouter: 'si(rang("samourai-arc-et-du-cheval") >= 5, 2, 1)' },
      }

- id: samourai-arc-et-du-cheval-tirs-successifs
  sorte: capacite
  nom: Tirs successifs
  champs: { voie: samourai-arc-et-du-cheval, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet: Disatnce [2 + mod. SAG] cibles à 10 mètres sur la trajectoire, inflige des DM en contact (épée) ou distance (arc).

- id: samourai-arc-et-du-cheval-perception-heroique
  sorte: capacite
  nom: Perception héroïque
  champs: { voie: samourai-arc-et-du-cheval, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: +2 SAG, 2d20 aux tests de SAG, garde le meilleur résultat.
  effets:
    - { sur: attribut, attribut: SAG, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "SAG"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: samourai-sabre
  sorte: voie
  nom: Voie du sabre
  etiquettes: [profil, samourai]
  description: |-
    1. Technique du sabre
    2. Frappe du vide
    3. Lames jumelles
    4. Attaque en rotation
    5. Dextérité héroïque
  effets:
    - { sur: rang, entree: samourai-sabre-technique-du-sabre, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: samourai-sabre-frappe-du-vide, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: samourai-sabre-lames-jumelles, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: samourai-sabre-attaque-en-rotation, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: samourai-sabre-dexterite-heroique, valeur: 1, condition: 'rang >= 5' }

- id: samourai-sabre-technique-du-sabre
  sorte: capacite
  nom: Technique du sabre
  champs: { voie: samourai-sabre, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : mod. FOR ou DEX pour Contact [+mod FOR ou +rang] DM.

    Lorsqu'il utilise un sabre, le samouraï peut remplacer son Mod de FOR par son Mod. de DEX en attaque au contact.
  effets:
    - {
        sur: jet,
        si: 'a_etiquette(arme, "sabre")',
        ajout: { bonus: 'max(0, mod(@DEX) - mod(@FOR))' },
      }

- id: samourai-sabre-frappe-du-vide
  sorte: capacite
  nom: Frappe du vide
  champs: { voie: samourai-sabre, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: Contact +2, + 1d6 DM sur première attaque

    Sur sa première attaque au contact lors d'un combat, si son sabre était au fourreau, il obtient un bonus de +2 en attaque et + 1d6 aux DM.

- id: samourai-sabre-lames-jumelles
  sorte: capacite
  nom: Lames jumelles
  champs: { voie: samourai-sabre, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet: double attaque contact -1 si mod. FOR < 2

    Si le samouraï possède un Mod. de FOR au moins égal à +2, il peut utiliser le katana d'une main et le wakizachi de l'autre sans pénalité.

- id: samourai-sabre-attaque-en-rotation
  sorte: capacite
  nom: Attaque en rotation
  champs: { voie: samourai-sabre, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet: Contact contre tous ennemis au contact

    Le samouraï peut tenter une attaque au contact contre chaque adversaire engagé au contact avec lui.

- id: samourai-sabre-dexterite-heroique
  sorte: capacite
  nom: Dextérité héroïque
  champs: { voie: samourai-sabre, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: Le samouraï augmente sa valeur de DEX de +2 et il peut désormais lancer deux d20 à chaque fois qu'un test de DEX lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: DEX, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "DEX"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: voleur-assassin
  sorte: voie
  nom: Voie de l’assassin
  etiquettes: [profil, voleur]
  description: |-
    1. Discrétion
    2. Attaque sournoise
    3. Ombre mouvante
    4. Surprise
    5. Ouverture mortelle
  effets:
    - { sur: rang, entree: voleur-assassin-discretion, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: voleur-assassin-attaque-sournoise, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: voleur-assassin-ombre-mouvante, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: voleur-assassin-surprise, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: voleur-assassin-ouverture-mortelle, valeur: 1, condition: 'rang >= 5' }

- id: voleur-assassin-discretion
  sorte: capacite
  nom: Discrétion
  etiquettes: [test]
  champs:
    {
      voie: voleur-assassin,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '2 * rang("voleur-assassin")',
    }
  description: |-
    Effet : [+2 x rang] DEX en mode furtif.

    Quand il essaie de passer inaperçu, le voleur bénéficie d'un bonus de +2 à son test de DEX pour chaque rang acquis dans cette voie.

- id: voleur-assassin-attaque-sournoise
  sorte: capacite
  nom: Attaque sournoise
  champs: { voie: voleur-assassin, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet: +2d6 DM si attaque par surprise ou dans le dos (+ 1d6 DM / rang 4).

    Quand il attaque un adversaire Surpris ou dans le dos, le Voleur inflige 2d6 de DM supplémentaires (notez que les dés bonus ne sont pas multipliés en cas de critique). Les DM infligés par cette capacité augmentent de +1d6 à chaque fois que le personnage atteint le rang 4 dans une Voie du voleur.

- id: voleur-assassin-ombre-mouvante
  sorte: capacite
  nom: Ombre mouvante
  champs: { voie: voleur-assassin, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : disparait furtivement.

    En réussissant un test de DEX difficulté 10, le voleur peut disparaître dans les ombres à son tour et ne réapparaître qu'au tour suivant durant sa phase d'initiative. Aucun adversaire ne peut l'attaquer pendant qu'il a disparu dans les ombres, mais il peut subir des DM de zone. Le voleur réapparait à une distance maximum de 10 m de sa position initiale, si le voleur a l'initiative, il peut réaliser une attaque sournoise.

- id: voleur-assassin-surprise
  sorte: capacite
  nom: Surprise
  champs: { voie: voleur-assassin, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : Attaque sournoise n'est plus une action limitée.

    Le voleur n'est jamais surpris. Il peut réaliser une Attaque sournoise en utilisant une action d'attaque plutôt qu'une action limitée contre un adversaire Surpris.

- id: voleur-assassin-ouverture-mortelle
  sorte: capacite
  nom: Ouverture mortelle
  champs: { voie: voleur-assassin, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: critique automatique 1x par combat.

    Une fois par combat, le voleur obtient une réussite critique automatique contre la cible de son choix. Il profite donc d'une réussite automatique, des dégats multipliés par 2 révus dans ce cas, et même des do d'attaquesournoise, eux aussi multipliés. * Attaquer de dos: lorsque le voleur attaque la même créature qu'un allié, on considère qu'il peut attaquer celle-ci de dos à 2 conditions. 1. Le voleur et l'allié peuvent se placer de part et d'autre de la cible. 2. La cible n'a pas attaqué le voleur à son dernier tour (dans le cas contraire, on considère qu'elle lui fait face).

- id: voleur-aventurier
  sorte: voie
  nom: Voie de l’aventurier
  etiquettes: [profil, voleur]
  description: |-
    1. Sprint
    2. Provocation
    3. Grâce féline
    4. Feindre la mort
    5. Charisme héroïque
  effets:
    - { sur: rang, entree: voleur-aventurier-sprint, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: voleur-aventurier-provocation, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: voleur-aventurier-grace-feline, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: voleur-aventurier-feindre-la-mort, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: voleur-aventurier-charisme-heroique, valeur: 1, condition: 'rang >= 5' }

- id: voleur-aventurier-sprint
  sorte: capacite
  nom: Sprint
  champs: { voie: voleur-aventurier, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: déplacement gratuit de 20 mètres, 1x par combat.

    Une fois par combat, le voleur peut effectuer un déplacement supplémentaire gratuit de 20 mètres à n'importe quel moment du tour.

- id: voleur-aventurier-provocation
  sorte: capacite
  nom: Provocation
  champs: { voie: voleur-aventurier, rangVoie: 2, activation: Action limitée }
  description: |-
    Effet: force la cible à l'attaquer sur test CHA vs INT, riposte gratuite.

    Le voleur maîtrise l'art de serendre désagréable, voire insupportable. Par un test opposé de CHA contre l'INT de la victime, il peut forcer celle-ci à l'attaquer pendant ce tour. Le voleur peut immédiatementriposter par une attaque gratuite ou, si la cible l'a raté, par une Attaque sournoise !

- id: voleur-aventurier-grace-feline
  sorte: capacite
  nom: Grâce féline
  etiquettes: [test]
  champs:
    { voie: voleur-aventurier, rangVoie: 3, activation: Capacité passive, bonusTest: 'mod(@CHA)' }
  description: |-
    Effet : [+mod CHA] Init, [+mod CHA] DEF [+mod CHA] tests de DEX de déplacement.

    Le voleur possède une démarche et une façon de se déplacer à la fois élégante, féline et souple. Il gagne son Mod. de CHA en Initiative, en DEF et à tous les tests de DEX en rapport avec le déplacement (escalade, saut, course, acrobaties, etc.).
  effets:
    - { sur: attribut, attribut: INIT, operation: ajouter, valeur: 'mod(@CHA)' }
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 'mod(@CHA)' }

- id: voleur-aventurier-feindre-la-mort
  sorte: capacite
  nom: Feindre la mort
  champs: { voie: voleur-aventurier, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : feint la mort, + 1d6 PV +1 mouvement lorsque se relève.

    Une fois par combat, le voleur peut feindre la mort après avoir reçu une blessure (même à 0 PV). Il peut ainsi passer pour mort aussi longtemps qu'il le souhaite et un test d'INT difficulté 20 est nécessaire pour révéler la supercherie. Lorsqu'il décide de se relever, le voleur gagne + 1 d6 PV et il obtient une action de mouvemen supplémentaire en plus des actions normales autorisées à son tour.

- id: voleur-aventurier-charisme-heroique
  sorte: capacite
  nom: Charisme héroïque
  champs: { voie: voleur-aventurier, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: +2 CHA, 2d20 aux tests de CHA.

    Le voleur augmente sa valeur de CHA de +2 et il peut désormais lancer deux d20 à chaque fois qu'un test de CHA lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: CHA, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "CHA"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: voleur-deplacement
  sorte: voie
  nom: Voie du déplacement
  etiquettes: [profil, voleur]
  description: |-
    1. Esquive
    2. Chute
    3. Acrobaties
    4. Esquive de la magie
    5. Dextérité héroïque
  effets:
    - { sur: rang, entree: voleur-deplacement-esquive, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: voleur-deplacement-chute, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: voleur-deplacement-acrobaties, valeur: 1, condition: 'rang >= 3' }
    - {
        sur: rang,
        entree: voleur-deplacement-esquive-de-la-magie,
        valeur: 1,
        condition: 'rang >= 4',
      }
    - {
        sur: rang,
        entree: voleur-deplacement-dexterite-heroique,
        valeur: 1,
        condition: 'rang >= 5',
      }

- id: voleur-deplacement-esquive
  sorte: capacite
  nom: Esquive
  champs: { voie: voleur-deplacement, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet: [rang] DEF d'esquive , [+rang] DEX aux tests.

    Le voleur est très vif et bénéficie d'un bonus de +1 par rang dans cette voie à sa DEF et à tous ses tests de DEX destinés à esquiver.
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: 'rang("voleur-deplacement")' }
    - { sur: jet, si: 'caracteristique == "DEX"', ajout: { bonus: 'rang("voleur-deplacement")' } }

- id: voleur-deplacement-chute
  sorte: capacite
  nom: Chute
  champs: { voie: voleur-deplacement, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet: chutte sur 3 mètres sans dommage.

    Le voleur peut tomber d'une hauteur de 3 m par rang sans se faire mal (rappel : un personnage qui n'a pas cette capacité subit 1d6 points de dégâts tous les 3 m de chute).

- id: voleur-deplacement-acrobaties
  sorte: capacite
  nom: Acrobaties
  champs: { voie: voleur-deplacement, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : surprend son adversaire sur test de DEX.

    Si le voleur réussit un test de DEX difficulté 15, il peut effectuer une acrobatie pour franchir un obstacle ou, s'il est au combat au contact, pour surprendre son adversaire par une cabriole, ce qui lui permet de l'attaquer dans le dos (et d'utiliser l'attaque sournoise).

- id: voleur-deplacement-esquive-de-la-magie
  sorte: capacite
  nom: Esquive de la magie
  champs: { voie: voleur-deplacement, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : 1/2 DM Magie subits ou annulés sur test de DEX vs Magie à chaque fois qu'un sort le prend pour cible (y compris un sort de zone ou l'affectant en plus de la personne visée)

    le voleur peut effectuer un test de DEX en opposition au test d'attaque magique du sort. S'il réussit,il échappe au sort. S'il échoue, tous les effets du sort (puissance, durée, etc.) sont divisés par 2. Au cas où un autre effet diviserait déjà les DM par 2, ils seront au total divisés par 4.

- id: voleur-deplacement-dexterite-heroique
  sorte: capacite
  nom: Dextérité héroïque
  champs: { voie: voleur-deplacement, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : +2 DEX, 2d20 aux tests de DEX.

    Le voleur augmente sa valeur de DEX de +2 et il peut désormais lancer deux d20 à chaque fois qu'un test de DEX lui est demandé et conserver le meilleur résultat.
  effets:
    - { sur: attribut, attribut: DEX, operation: ajouter, valeur: 2 }
    - { sur: jet, si: 'caracteristique == "DEX"', ajout: { variable: avantagesTest, ajouter: '1' } }

- id: voleur-roublard
  sorte: voie
  nom: Voie du roublard
  etiquettes: [profil, voleur]
  description: |-
    1. Doigts agiles
    2. Détecter les pièges
    3. Croc-en-jambe
    4. Attaque paralysante
    5. Attaque en traître
  effets:
    - { sur: rang, entree: voleur-roublard-doigts-agiles, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: voleur-roublard-detecter-les-pieges, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: voleur-roublard-croc-en-jambe, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: voleur-roublard-attaque-paralysante, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: voleur-roublard-attaque-en-traitre, valeur: 1, condition: 'rang >= 5' }

- id: voleur-roublard-doigts-agiles
  sorte: capacite
  nom: Doigts agiles
  etiquettes: [test]
  champs:
    {
      voie: voleur-roublard,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '2 * rang("voleur-roublard")',
    }
  description: |-
    Effet: +2 DEX aux tests de précision.

    Pour chaque Rang acquis dans cette Voie, le voleur reçoit un bonus de +2 pour tous ses tests de DEX liés à la précision : crocheter une serrure, désamorcer un piège, pickpocket...

- id: voleur-roublard-detecter-les-pieges
  sorte: capacite
  nom: Détecter les pièges
  champs: { voie: voleur-roublard, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : détecte les pièges sur tests d'INT.

    En réussissant un test d'INT difficulté 10, le voleur peut détecter (et ensuite contourner sans danger) les pièges (avant qu'ils se déclenchent bien entendu). Les pièges magiques demandent un test d'INT de difficulté 15.

- id: voleur-roublard-croc-en-jambe
  sorte: capacite
  nom: Croc-en-jambe
  champs: { voie: voleur-roublard, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : renverse la cible.

    Lorsqu'il obtient un score de 17 à 20 sur son d20 en attaque au contact, le voleur fait chuter son adversaire en plus de lui infliger des DM normaux. Un score de 19 à 20 est nécessaire pour une créature quadrupède.

- id: voleur-roublard-attaque-paralysante
  sorte: capacite
  nom: Attaque paralysante
  champs: { voie: voleur-roublard, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : 1x par combat: paralyse la cible, elle ne peut encaisser de DM
    Durée : 1d4 tours.

    Une fois par combat, le voleur peut, en réussissant une attaque de contact, paralyser un adversaire de douleur. Ce dernier n'encaisse pas de DM, mais il ne peut plus attaquer ni se déplacer pendant 1d4 tours.

- id: voleur-roublard-attaque-en-traitre
  sorte: capacite
  nom: Attaque en traître
  champs: { voie: voleur-roublard, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: attaque gratuite sur ouverture d'un allié.

    Une fois par tour, lorsqu'un allié réussit à blesser une créature au contact du voleur, celui-ci peut lui porter une attaque normale gratuite en profitant de l'ouverture.

- id: voleur-spadassin
  sorte: voie
  nom: Voie du spadassin
  etiquettes: [profil, voleur]
  description: |-
    1. Attaque en finesse
    2. Esquive fatale
    3. Frappe chirurgicale
    4. Ambidextrie
    5. Botte secrète
  effets:
    - { sur: rang, entree: voleur-spadassin-attaque-en-finesse, valeur: 1, condition: 'rang >= 1' }
    - { sur: rang, entree: voleur-spadassin-esquive-fatale, valeur: 1, condition: 'rang >= 2' }
    - { sur: rang, entree: voleur-spadassin-frappe-chirurgicale, valeur: 1, condition: 'rang >= 3' }
    - { sur: rang, entree: voleur-spadassin-ambidextrie, valeur: 1, condition: 'rang >= 4' }
    - { sur: rang, entree: voleur-spadassin-botte-secrete, valeur: 1, condition: 'rang >= 5' }

- id: voleur-spadassin-attaque-en-finesse
  sorte: capacite
  nom: Attaque en finesse
  champs: { voie: voleur-spadassin, rangVoie: 1, activation: Capacité passive }
  description: |-
    Effet : utilise Distance au contact avec une arme légère. [mod FOR ou mod INT] DM au choix. L

    e voleur peut utiliser son score d'Attaque à distance pour une attaque au contact lorsqu'il utilise une arme légère comme une dague ou une Rapière. S'il le souhaite, il peut dans ce cas remplacer le Mod. de FOR aux DM par son Mod. d'INT.
  effets:
    - {
        sur: jet,
        si: 'arme.attaque == "Contact" et a_etiquette(arme, "legere")',
        ajout: { bonus: 'max(0, @Distance - @Contact)' },
      }
- id: voleur-spadassin-esquive-fatale
  sorte: capacite
  nom: Esquive fatale
  champs: { voie: voleur-spadassin, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : transfert une attaque subit sur un adversaire.

    Une fois par combat, le duelliste peut esquiver une attaque qui devait le toucher et s'arranger pour que celle-ci affecte un autre adversaire à son contact. Comparez le test d'attaque à la DEF de la nouvelle cible pour savoir si celle-ci subit des DM.

- id: voleur-spadassin-frappe-chirurgicale
  sorte: capacite
  nom: Frappe chirurgicale
  champs: { voie: voleur-spadassin, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : critique sur [20 - mod. INT].

    Par sa science de l'escrime (et de la fourberie), le voleur augmente de manière permanente ses chances de faire des coups critiques. Il retranche désormais son Mod. d'INT au score nécessaire pour obtenir un critique en attaque au contact. Par exemple, Alonzo (INT 14/+2) obtient à présent un critique sur 17 ou plus au d20 lorsqu'il emploie la rapière (19 - Mod. d'INT).
  effets:
    - {
        sur: jet,
        si: 'arme.attaque == "Contact"',
        ajout: { variable: seuilCritique, ajouter: '-max(0, mod(@INT))' },
      }

- id: voleur-spadassin-ambidextrie
  sorte: capacite
  nom: Ambidextrie
  champs: { voie: voleur-spadassin, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet: Contact gratuite supplémentaire par tour.

    Le voleur peut à présent utiliser une arme dans chaque main sans pénalité. Avec sa main gauche, il peut effectuer une attaque au contact gratuite supplémentaire à chaque tour. Cette deuxième attaque n'empêche pas l'utilisation d'une capacité limitée, mais elle ne peut pas en être l'origine.

- id: voleur-spadassin-botte-secrete
  sorte: capacite
  nom: Botte secrète
  champs: { voie: voleur-spadassin, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet: Attaque sournoise sur Contact critique.

    Lorsque le voleur obtient un critique sur une attaque au contact, l'attaque devient automatiquement une Attaque sournoise. Les effets de la capacité d'Attaque sournoise s'appliquent en plus des effets normaux du critique.
