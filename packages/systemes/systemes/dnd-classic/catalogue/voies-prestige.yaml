      }

- id: prestige-arquebusier-messager-muet-comme-une-tombe
  sorte: capacite
  nom: Muet comme une tombe
  etiquettes: [test]
  champs:
    {
      voie: prestige-arquebusier-messager,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '5',
    }
  description: |-
    Effet : Le messager sait garder un secret, il bénéficie d’un bonus de +5 pour résister à toute tentative d’extorsion d’information que cela soit par l’intimidation, la torture, la ruse ou la magie…

    Il obtient le même bonus pour résister à tout sort de contrôle mental.

- id: prestige-arquebusier-messager-jusqu-a-bon-port
  sorte: capacite
  nom: Jusqu’à bon port
  etiquettes: [test]
  champs:
    {
      voie: prestige-arquebusier-messager,
      rangVoie: 2,
      activation: Capacité passive,
      bonusTest: '5',
    }
  description: |-
    Effet : Le messager peut voyager deux fois plus longtemps qu’un autre personnage sans fatigue et il bénéficie d’un bonus de +5 aux tests d’équitation.

    Il obtient aussi un bonus de +5 aux tests destinés à détecter les embuscades et les pièges sur son chemin.

- id: prestige-arquebusier-messager-conducteur-de-diligence
  sorte: capacite
  nom: Conducteur de diligence
  etiquettes: [test]
  champs:
    {
      voie: prestige-arquebusier-messager,
      rangVoie: 3,
      activation: Capacité passive,
      bonusTest: '5',
    }
  description: |-
    Effet : L’arquebusier obtient un bonus de +5 à tous les tests pour conduire un attelage, un chariot ou tout autre véhicule tracté par des animaux, cela lui demande une action limitée pour manœuvrer par tour.

    Il obtient aussi un bonus de +5 à tous les tests pour éviter un accident à bord d’un véhicule en mouvement. Il obtient un bonus de +2 en attaque contre toutes les cibles se trouvant au sol ou sur le même véhicule en mouvement.

- id: prestige-arquebusier-messager-sens-du-devoir
  sorte: capacite_active
  nom: Sens du devoir
  champs: { voie: prestige-arquebusier-messager, rangVoie: 4, activation: Capacité passive }
  description: |-
    Effet : Lorsqu’il défend une missive, un colis ou un individu qu’il escorte, le messager obtient un bonus de +2 en DEF et à tous les tests (actions, attaques).
  effets:
    - { sur: attribut, attribut: Defense, operation: ajouter, valeur: '2' }
    - {
        sur: jet,
        actions: [test, exploit, defier-la-mort, blagues-et-cabrioles],
        ajout: { bonus: '2' },
      }
    - { sur: attribut, attribut: Contact, operation: ajouter, valeur: '2' }
    - { sur: attribut, attribut: Distance, operation: ajouter, valeur: '2' }
    - { sur: attribut, attribut: Magie, operation: ajouter, valeur: '2' }

- id: prestige-arquebusier-messager-attaque-en-mouvement
  sorte: capacite
  nom: Attaque en mouvement
  champs: { voie: prestige-arquebusier-messager, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : Lorsqu’il réalise une action limitée, le messager peut utiliser une action de mouvement dans le même tour pour effectuer un déplacement.

- id: prestige-arquebusier-chasseur-de-gros-gibier
  sorte: voie
  nom: Voie du chasseur de gros gibier
  etiquettes: [prestige, arquebusier]
