        valeur: 1,
        condition: 'rang >= 5',
      }

- id: prestige-arquebusier-flibustier-pied-marin
  sorte: capacite
  nom: Pied marin
  etiquettes: [test]
  champs:
    {
      voie: prestige-arquebusier-flibustier,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '5',
    }
  description: |-
    Effet : Le personnage gagne un bonus de +5 sur tous les tests de DEX réalisés sur un bateau ou sur d’autres supports mobiles (ce qui comprend les chariots, les cordages, les ponts de corde).

    Il gagne un bonus de +5 sur tous les tests relatifs à la natation et à la navigation.

- id: prestige-arquebusier-flibustier-coup-de-crosse
  sorte: capacite
  nom: Coup de crosse
  champs: { voie: prestige-arquebusier-flibustier, rangVoie: 2, activation: Capacité passive }
  description: |-
    Effet : Une fois par tour, le personnage peut, au moment de son choix, accomplir une attaque gratuite avec la crosse d’une pétoire qu’il a utilisée précédemment lors du tour pour une attaque à distance.

    Il utilise un d12 pour le test d’attaque et inflige [1d4 + Mod. de FOR] DM.

- id: prestige-arquebusier-flibustier-a-l-abordage
  sorte: capacite
  nom: À l’abordage !
  champs: { voie: prestige-arquebusier-flibustier, rangVoie: 3, activation: Capacité passive }
  description: |-
    Effet : Le personnage sait s’élancer vers ses ennemis et mettre du cœur dans sa première attaque au contact lors d’un combat. Lors de cette première attaque, il obtient un bonus de +5 en attaque et de +1d6 aux DM.

- id: prestige-arquebusier-flibustier-sabre-au-poing
  sorte: capacite
  nom: Sabre au poing
  champs: { voie: prestige-arquebusier-flibustier, rangVoie: 4, activation: Action limitée }
  description: |-
    Effet : À ce tour, le personnage peut tirer avec une arme à poudre d’une main et porter une attaque de contact sans pénalité avec une seconde arme (tenue dans son autre main).

- id: prestige-arquebusier-flibustier-pas-de-quartier
  sorte: capacite
  nom: Pas de quartier
  champs: { voie: prestige-arquebusier-flibustier, rangVoie: 5, activation: Capacité passive }
  description: |-
    Effet : Pour le flibustier, il s’agit de vaincre ou mourir.

    Sa férocité est légendaire : il peut tenter une action d’attaque gratuite contre toute créature à son contact qui utilise une action de mouvement dans le but de s’éloigner de lui. Pour cette attaque, il obtient un bonus de +5 en attaque et de +1d6 aux DM.

- id: prestige-arquebusier-messager
  sorte: voie
  nom: Voie du messager
  etiquettes: [prestige, arquebusier]
  description: |-
    1. Muet comme une tombe
    2. Jusqu’à bon port
    3. Conducteur de diligence
    4. Sens du devoir
    5. Attaque en mouvement
  effets:
