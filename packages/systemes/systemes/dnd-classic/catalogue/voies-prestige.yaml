        valeur: 1,
        condition: 'rang >= 5',
      }

- id: prestige-arquebusier-chasseur-de-gros-gibier-traqueur
  sorte: capacite
  nom: Traqueur
  etiquettes: [test]
  champs:
    {
      voie: prestige-arquebusier-chasseur-de-gros-gibier,
      rangVoie: 1,
      activation: Capacité passive,
      bonusTest: '5',
    }
  description: |-
    Effet : L'arquebusier obtient un bonus de +5 aux tests de SAG pour pister les gros animaux (taille grande et supérieure).

- id: prestige-arquebusier-chasseur-de-gros-gibier-tueur-d-animaux
  sorte: capacite
  nom: Tueur d’animaux
  champs:
    {
      voie: prestige-arquebusier-chasseur-de-gros-gibier,
      rangVoie: 2,
      activation: Capacité passive,
    }
  description: |-
    Effet : L'arquebusier obtient un bonus de +2 en attaque et aux DM lorsqu'il emploie une arme à distance contre les animaux de taille grande ou énorme (ours, tigre, éléphant, etc).

- id: prestige-arquebusier-chasseur-de-gros-gibier-gros-calibre
  sorte: capacite
  nom: Gros calibre
  champs:
    { voie: prestige-arquebusier-chasseur-de-gros-gibier, rangVoie: 3, activation: Action limitée }
  description: |-
    Effet : L'arquebusier a mis au point une variante de très gros calibre du mousquet qui inflige 3d6 DM et nécessite une action limitée pour tirer.

    Si l'arquebusier n’a pas au moins 12 en FOR, il subit un malus de -2 en attaque avec cette arme.

- id: prestige-arquebusier-chasseur-de-gros-gibier-tueur-d-animaux-fantastiques
  sorte: capacite
  nom: Tueur d'animaux fantastiques
  champs:
    {
      voie: prestige-arquebusier-chasseur-de-gros-gibier,
      rangVoie: 4,
      activation: Capacité passive,
    }
  description: |-
    Effet : L'arquebusier obtient un bonus de +2 en attaque et aux DM lorsqu'il emploie une arme à distance contre les monstres non-humanoïdes de taille grande ou énorme (griffon, dragon, ours-hiboux, etc).

- id: prestige-arquebusier-chasseur-de-gros-gibier-expert-en-survie
  sorte: capacite
  nom: Expert en survie
  etiquettes: [test]
  champs:
    {
      voie: prestige-arquebusier-chasseur-de-gros-gibier,
      rangVoie: 5,
      activation: Capacité passive,
      bonusTest: '5',
    }
  description: |-
    Effet : L'arquebusier augmente son score de CON de +2 et obtient un bonus de +5 à tous les tests de survie en nature.
  effets:
    - { sur: attribut, attribut: CON, operation: ajouter, valeur: 2 }

- id: prestige-necromancien-golem-de-chair
  sorte: voie
  nom: Voie du golem de chair
  etiquettes: [prestige, necromancien]
  description: |-
    1. Golem de chair
    2. Résistance et régénération
    3. Balayage
    4. Égratignure
    5. Puissance colossale
  effets:
