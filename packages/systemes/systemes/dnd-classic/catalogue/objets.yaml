# Objets — repris de l'ancienne app : objets proposés par l'inventaire
# (legacy/src/components/(inventaire)/inventaire.tsx, `predefinedItems`) et
# liste « objets » de legacy/public/tabs/data.json (descriptions d'origine).
# Les pièces sont des objets de la catégorie « bourse » : 1 po = 10 pa = 100 pc.

# ─── Objets hors catalogue ───
# Chaque exemplaire porte son nom, sa description et sa catégorie (champs propres).
- id: objet-libre
  sorte: objet
  nom: Objet personnalisé
  description: Objet hors catalogue, nommé et décrit par le joueur.
  libre: true
- id: arme-libre
  sorte: arme
  nom: Arme personnalisée
  description: Arme hors catalogue, nommée par le joueur ; attaque et dés de dégâts réglables.
  libre: true
  champs: { attaque: Contact }
- id: armure-libre
  sorte: armure
  nom: Protection personnalisée
  description: >-
    Armure ou bouclier hors catalogue, nommé par le joueur ; ses bonus sont
    ses effets propres.
  libre: true

