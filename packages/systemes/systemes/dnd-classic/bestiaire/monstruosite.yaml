    - nom: Présence effrayante
      description:
        Chaque créature choisie par la tarrasque dans un rayon de 120 pieds et consciente de
        son existence doit réussir un jet de sauvegarde de Sagesse DC 17 ou être effrayée pendant 1
        minute. Une créature peut répéter le jet de sauvegarde à la fin de chacun de ses tours, avec
        un désavantage si la tarrasque est en ligne de vue, mettant fin à l'effet sur elle-même en
        cas de succès. Si une créature réussit son jet de sauvegarde ou si l'effet prend fin pour
        elle, elle est immunisée contre la Présence effrayante de la tarrasque pendant les 24 heures
        suivantes.
