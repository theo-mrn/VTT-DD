        Constitution DC 11, subissant 18 (4d8) points de dégâts de poison en cas de sauvegarde
        ratée, ou la moitié en cas de sauvegarde réussie. Si les dégâts de poison réduisent la cible
        à 0 point de vie, elle est stable mais empoisonnée pendant 1 heure, même après avoir regagné
        des points de vie, et est paralysée tant qu'elle est empoisonnée de cette façon."
      toucher: 4
- id: remorhaz
  nom: Remorhaz
  entite: personnage
  categorie: Monstruosité
  type: Monstruosité (très grande)
  description: 'Alignement : sans alignement.'
  image: https://assets.yner.fr/bestaire/remorhaz.png
  valeurs:
    niveau: 11
    PV_Max: 195
    Defense: 17
    INIT: 1
    Contact: 11
    Distance: 11
    Magie: 0
    FOR: 24
    DEX: 13
    CON: 21
    INT: 4
    SAG: 10
    CHA: 5
  actions:
    - nom: Morsure
      description:
        "Attaque d'arme de mêlée : +11 pour toucher, portée de 10 pieds, une cible. Touché : 40
        (6d10 + 7) points de dégâts perforants plus 10 (3d6) points de dégâts de feu. Si la cible
        est une créature, elle est agrippée (échappatoire DC 17). Jusqu'à la fin de cette prise, la
        cible est immobilisée et le remorhaz ne peut pas mordre une autre cible."
      toucher: 11
    - nom: Avalez
      description: >-
        Le remorhaz effectue une attaque de morsure contre une créature de taille moyenne ou plus
        petite qu'il agrippe. Si l'attaque touche, la créature subit les dégâts de la morsure et est
        avalée, et l'empoignade prend fin. Pendant qu'elle est avalée, la créature est aveuglée et
        entravée, elle bénéficie d'une couverture totale contre les attaques et autres effets
        extérieurs au remorhaz, et elle subit 21 (6d6) points de dégâts d'acide au début de chacun
        des tours du remorhaz.

        Si le remorhaz subit 30 points de dégâts ou plus en un seul tour de la part d'une créature à
        l'intérieur de lui, il doit réussir un jet de sauvegarde de Constitution DC 15 à la fin de
        ce tour ou régurgiter toutes les créatures avalées, qui tombent à plat dans un espace de 10
        pieds autour du remorhaz. Si le rémorhaz meurt, une créature avalée n'est plus retenue par
        lui et peut s'échapper du cadavre en se déplaçant sur 15 pieds, en sortant à plat ventre.
