        pieds de lui. L'effet peut traverser les barrières, mais il est bloqué par 3 pieds de bois
        ou de terre, 2 pieds de pierre, 2 pouces de métal ou une fine feuille de plomb. Tant que la
        cible est à portée, le double peut continuer à lire ses pensées, tant que sa concentration
        n'est pas rompue (comme s'il se concentrait sur un sort). Pendant qu'il lit dans les pensées
        de la cible, le double a l'avantage aux tests de Sagesse (perspicacité) et de Charisme
        (tromperie, intimidation et persuasion) contre la cible.
