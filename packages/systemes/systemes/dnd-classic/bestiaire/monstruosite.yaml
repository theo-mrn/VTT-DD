# Bestiaire de référence — Monstruosité (39).
# Repris de l'ancienne app (legacy/public/tabs/bestiairy.json) : valeurs imprimées, pas un
# état calculable ; catégories, tailles et alignements traduits (voir docs/ressources.md).

- id: androsphinx
  nom: Androsphinx
  entite: personnage
  categorie: Monstruosité
  type: Monstruosité (grande)
  description: 'Alignement : loyal neutre.'
  image: https://assets.yner.fr/bestaire/androsphinx.png
  valeurs:
    niveau: 17
    PV_Max: 199
    Defense: 17
    INIT: 0
    Contact: 12
    Distance: 12
    Magie: 0
    FOR: 22
    DEX: 10
    CON: 20
    INT: 16
    SAG: 18
    CHA: 23
  actions:
    - nom: Multi-attaques
      description: Le sphinx effectue deux attaques de griffes.
    - nom: Griffe
      description:
        "Attaque d'arme de mêlée : +12 pour toucher, portée de 5 pieds, une cible. Touché : 17
        (2d10 + 6) points de dégâts tranchants."
      toucher: 12
    - nom: Rugissement
      description: >-
        Le sphinx émet un rugissement magique. Chaque fois qu'il rugit avant de terminer un long
        repos, le rugissement est plus fort et l'effet est différent, comme détaillé ci-dessous.
        Chaque créature située à moins de 500 pieds du sphinx et capable d'entendre le rugissement
        doit effectuer un jet de sauvegarde.


        Premier rugissement. Chaque créature qui échoue à un jet de sauvegarde de sagesse DC 18 est
        effrayée pendant 1 minute. Une créature effrayée peut répéter son jet de sauvegarde à la fin
        de chacun de ses tours, mettant fin à l'effet sur elle-même en cas de succès.


        Deuxième rugissement. Chaque créature qui échoue à un jet de sauvegarde de sagesse DC 18 est
        assourdie et effrayée pendant 1 minute. Une créature effrayée est paralysée et peut répéter
        le jet de sauvegarde à la fin de chacun de ses tours, mettant fin à l'effet sur elle-même en
        cas de succès.


        Troisième rugissement. Chaque créature fait un jet de sauvegarde DC 18 de Constitution. En
        cas de sauvegarde ratée, la créature subit 44 (8d10) points de dégâts de tonnerre et est
        mise à terre. En cas de sauvegarde réussie, la créature subit la moitié des dégâts et n'est
        pas mise à terre.
- id: ankheg
  nom: Ankheg
  entite: personnage
  categorie: Monstruosité
  type: Monstruosité (grande)
  description: 'Alignement : sans alignement.'
  image: https://assets.yner.fr/bestaire/ankheg.png
  valeurs:
    niveau: 2
    PV_Max: 39
    Defense: 14
    INIT: 0
    Contact: 5
    Distance: 5
    Magie: 0
    FOR: 17
    DEX: 11
    CON: 13
    INT: 1
    SAG: 13
    CHA: 6
  actions:
    - nom: Morsure
      description:
        "Attaque d'arme de mêlée : +5 pour toucher, portée de 5 pieds, une cible. Touché : 10
        (2d6 + 3) points de dégâts tranchants plus 3 (1d6) points de dégâts acides. Si la cible est
        une créature de grande taille ou plus petite, elle est agrippée (échappatoire DC 13).
        Jusqu'à la fin de cette prise, l'ankheg ne peut mordre que la créature saisie et a
        l'avantage aux jets d'attaque pour le faire."
      toucher: 5
    - nom: Vaporisateur d'acide
      description:
        L'ankheg crache de l'acide sur une ligne de 30 pieds de long et 5 pieds de large, à
        condition qu'aucune créature ne soit agrippée. Chaque créature de cette ligne doit effectuer
        un jet de sauvegarde de Dextérité DC 13, subissant 10 (3d6) points de dégâts d'acide en cas
        de sauvegarde ratée, ou la moitié en cas de sauvegarde réussie.
