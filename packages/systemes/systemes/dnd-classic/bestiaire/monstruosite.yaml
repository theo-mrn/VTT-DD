- id: kraken
  nom: Kraken
  entite: personnage
  categorie: Monstruosité
  type: Monstruosité (gigantesque)
  description: 'Alignement : chaotique mauvais.'
  image: https://assets.yner.fr/bestaire/kraken.png
  valeurs:
    niveau: 23
    PV_Max: 472
    Defense: 18
    INIT: 0
    Contact: 17
    Distance: 17
    Magie: 0
    FOR: 30
    DEX: 11
    CON: 25
    INT: 22
    SAG: 18
    CHA: 20
  actions:
    - nom: Multi-attaques
      description:
        Le kraken effectue trois attaques de tentacules, chacune pouvant être remplacée par une
        utilisation de Fling.
    - nom: Morsure
      description:
        "Attaque d'arme de mêlée : +7 pour toucher, portée de 5 pieds, une cible. Touché : 23
        (3d8 + 10) points de dégâts perforants. Si la cible est une créature Grande ou plus petite
        agrippée par le kraken, cette créature est avalée et l'agrippement prend fin. Pendant
        qu'elle est avalée, la créature est aveuglée et entravée, elle bénéficie d'une couverture
        totale contre les attaques et autres effets extérieurs au kraken, et elle subit 42 (12d6)
        points de dégâts d'acide au début de chacun des tours du kraken. Si le kraken subit 50
        points de dégâts ou plus en un seul tour de la part d'une créature à l'intérieur de lui, il
        doit réussir un jet de sauvegarde de Constitution DC 25 à la fin de ce tour ou régurgiter
        toutes les créatures avalées, qui tombent à plat dans un espace de 10 pieds autour du
        kraken. Si le kraken meurt, une créature avalée n'est plus retenue par lui et peut
        s'échapper du cadavre en se déplaçant sur 15 pieds, en sortant à plat ventre."
      toucher: 7
    - nom: Tentacule
      description:
        "Attaque d'arme de mêlée : +7 pour toucher, portée de 30 pieds, une cible. Touché : 20
        (3d6 + 10) points de dégâts de matraquage, et la cible est agrippée (échappatoire DC 18).
        Jusqu'à la fin de cette prise, la cible est immobilisée. Le kraken possède dix tentacules,
        chacun pouvant saisir une cible."
      toucher: 7
    - nom: Fling
      description:
        Un objet grand ou petit tenu ou une créature agrippée par le kraken est projeté jusqu'à
        60 pieds dans une direction aléatoire et mis à terre. Si une cible projetée heurte une
        surface solide, elle subit 3 (1d6) points de dégâts de matraquage par tranche de 10 pieds de
        distance parcourue. Si la cible est projetée sur une autre créature, celle-ci doit réussir
        un jet de sauvegarde de Dextérité DC 18 ou subir les mêmes dégâts et être mise à terre.
    - nom: Orage
      description: Le kraken crée magiquement trois éclairs, chacun pouvant frapper une cible que le
        kraken peut voir dans un rayon de 120 pieds. La cible doit effectuer un jet de sauvegarde de
        Dextérité DC 23, subissant 22 (4d10) points de dégâts de foudre en cas d'échec, ou la moitié
        en cas de réussite.
