  actions:
    - nom: Morsure
      description:
        "Attaque d'arme de mêlée : +7 pour toucher, portée de 5 pieds, une cible. Touché : 30
        (4d12 + 4) points de dégâts perforants."
      toucher: 7
    - nom: Saut mortel
      description:
        Si la bulette saute d'au moins 15 pieds dans le cadre de son mouvement, elle peut alors
        utiliser cette action pour atterrir sur ses pieds dans un espace contenant une ou plusieurs
        autres créatures. Chacune de ces créatures doit réussir un jet de sauvegarde de Force ou de
        Dextérité DC 16 (au choix de la cible) ou être mise à terre et subir 14 (3d6 + 4) dégâts de
        matraquage plus 14 (3d6 + 4) dégâts d'entaille. Si elle réussit son jet de sauvegarde, la
        créature ne subit que la moitié des dégâts, n'est pas mise à terre et est repoussée de 5
        pieds hors de l'espace de la bulette, dans un espace inoccupé de son choix. Si aucun espace
        inoccupé n'est à portée, la créature tombe à plat ventre dans l'espace de la bulette.
