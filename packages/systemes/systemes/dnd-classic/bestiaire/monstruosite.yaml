- id: behir
  nom: Behir
  entite: personnage
  categorie: Monstruosité
  type: Monstruosité (très grande)
  description: 'Alignement : neutre mauvais.'
  image: https://assets.yner.fr/bestaire/behir.png
  valeurs:
    niveau: 11
    PV_Max: 168
    Defense: 17
    INIT: 3
    Contact: 10
    Distance: 10
    Magie: 0
    FOR: 23
    DEX: 16
    CON: 18
    INT: 7
    SAG: 14
    CHA: 12
  actions:
    - nom: Multi-attaques
      description: "Le behir effectue deux attaques : l'une avec sa morsure et l'autre pour étrangler."
    - nom: Morsure
      description:
        "Attaque d'arme de mêlée : +10 pour toucher, portée de 10 pieds, une cible. Touché : 22
        (3d10 + 6) points de dégâts perforants."
      toucher: 10
    - nom: Constrict
      description:
        "Attaque d'arme de mêlée : +10 pour toucher, portée de 5 pieds, une créature grande ou
        plus petite. Touché : 17 (2d10 + 6) points de dégâts de matraquage plus 17 (2d10 + 6) points
        de dégâts tranchants. La cible est agrippée (échappatoire DC 16) si le behir n'est pas déjà
        en train d'étrangler une créature, et la cible est immobilisée jusqu'à la fin de
        l'agrippement."
      toucher: 10
    - nom: Le souffle de la foudre
      description:
        Le behir exhale une ligne d'éclairs de 20 pieds de long et 5 pieds de large. Chaque
        créature située dans cette ligne doit effectuer un jet de sauvegarde de Dextérité DC 16,
        subissant 66 (12d10) points de dégâts de foudre en cas de sauvegarde ratée, ou la moitié en
        cas de sauvegarde réussie.
    - nom: Avalez
      description: >-
        Le behir effectue une attaque de morsure contre une cible de taille moyenne ou plus petite
        qu'il agrippe. Si l'attaque touche, la cible est également avalée et la prise se termine.
        Pendant qu'elle est avalée, la cible est aveuglée et entravée, elle bénéficie d'une
        couverture totale contre les attaques et autres effets extérieurs au behir, et elle subit 21
        (6d6) points de dégâts d'acide au début de chacun des tours du behir. Un behir ne peut
        avaler qu'une seule créature à la fois.

        Si le behir subit 30 points de dégâts ou plus en un seul tour à cause de la créature avalée,
        il doit réussir un jet de sauvegarde de Constitution DC 14 à la fin de ce tour ou régurgiter
        la créature, qui tombe à plat ventre dans un espace situé à moins de 10 pieds du behir. Si
        le behir meurt, la créature avalée n'est plus retenue par lui et peut s'échapper du cadavre
        en utilisant 15 pieds de mouvement, en sortant à plat ventre.
