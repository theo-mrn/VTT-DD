        La gorgone exhale du gaz pétrifiant dans un cône de 30 pieds. Chaque créature dans
        cette zone doit réussir un jet de sauvegarde de Constitution DC 13. En cas d'échec, la cible
        commence à se transformer en pierre et est immobilisée. La cible entravée doit refaire le
        jet de sauvegarde à la fin de son prochain tour. En cas de réussite, l'effet prend fin sur
        la cible. En cas d'échec, la cible est pétrifiée jusqu'à ce qu'elle soit libérée par le sort
        restauration supérieure ou une autre magie.
