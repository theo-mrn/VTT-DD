      description: >-
        La tarrasque effectue une attaque de morsure contre une créature Grande ou plus petite
        qu'elle agrippe. Si l'attaque touche, la cible subit les dégâts de la morsure, elle est
        avalée et le grappin prend fin. Pendant qu'elle est avalée, la créature est aveuglée et
        entravée, elle bénéficie d'une couverture totale contre les attaques et autres effets
        extérieurs à la tarrasque, et elle subit 56 (16d6) points de dégâts d'acide au début de
        chacun des tours de la tarrasque.

