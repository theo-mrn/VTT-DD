      description: 'La harpie effectue deux attaques : une avec ses griffes et une avec sa massue.'
    - nom: Griffes
      description:
        "Attaque d'arme de mêlée : +3 pour toucher, portée de 5 pieds, une cible. Touché : 6
        (2d4 + 1) points de dégâts tranchants."
      toucher: 3
    - nom: Club
      description:
        "Attaque d'arme de mêlée : +3 pour toucher, portée de 5 pieds, une cible. Touché : 3
        (1d4 + 1) dégâts de matraquage."
      toucher: 3
    - nom: Chant de séduction
      description: >-
        La harpie chante une mélodie magique. Tous les humanoïdes et géants situés à moins de 300
        pieds de la harpie qui peuvent entendre le chant doivent réussir un jet de sauvegarde de
        Sagesse DC 11 ou être charmés jusqu'à la fin du chant. La harpie doit entreprendre une
        action bonus lors de ses tours suivants pour continuer à chanter. Elle peut arrêter de
        chanter à tout moment. Le chant se termine si la harpie est incapable de s'exprimer.

        Lorsqu'elle est charmée par la harpie, la cible est incapable de chanter et ignore les
        chants des autres harpies. Si la cible charmée se trouve à plus de 5 pieds de la harpie,
        elle doit se déplacer à son tour vers la harpie par le chemin le plus direct. Elle n'évite
        pas les attaques d'opportunité, mais avant de se déplacer dans un terrain dommageable, comme
        de la lave ou une fosse, et chaque fois qu'elle subit des dégâts d'une source autre que la
        harpie, une cible peut répéter le jet de sauvegarde. Une créature peut également répéter son
        jet de sauvegarde à la fin de chacun de ses tours. Si le jet de sauvegarde d'une créature
        est réussi, l'effet prend fin sur elle.

        Une cible qui réussit son jet de sauvegarde est immunisée contre le chant de cette harpie
        pour les 24 heures à venir.
