        à l'intérieur d'elle, elle doit réussir un jet de sauvegarde de Constitution DC 20 à la fin
        de ce tour ou régurgiter toutes les créatures avalées, qui tombent à plat dans un espace de
        10 pieds autour de la tarrasque. Si la tarrasque meurt, une créature avalée n'est plus
        retenue par elle et peut s'échapper du cadavre en utilisant 30 pieds de mouvement, en
        sortant à plat ventre.
