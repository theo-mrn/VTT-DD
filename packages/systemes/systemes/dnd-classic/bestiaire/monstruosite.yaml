- id: darkmantle
  nom: Darkmantle
  entite: personnage
  categorie: Monstruosité
  type: Monstruosité (petite)
  description: 'Alignement : sans alignement.'
  image: https://assets.yner.fr/bestaire/darkmantle.png
  valeurs:
    niveau: 0.5
    PV_Max: 22
    Defense: 11
    INIT: 1
    Contact: 4
    Distance: 4
    Magie: 0
    FOR: 16
    DEX: 12
    CON: 13
    INT: 2
    SAG: 10
    CHA: 5
  actions:
    - nom: Béguin
      description: >-
        Attaque d'arme de mêlée : +5 pour toucher, portée de 5 pieds, une créature. Touché : 6 (1d6
        + 3) points de dégâts de matraquage, et le darkmantle s'attache à la cible. Si la cible est
        de taille moyenne ou plus petite et que le darkmantle a l'avantage sur le jet d'attaque, il
        s'attache en engloutissant la tête de la cible, qui est également aveuglée et incapable de
        respirer tant que le darkmantle est attaché de cette façon.

        Tant qu'il est attaché à la cible, le darkmantle ne peut attaquer aucune autre créature que
        la cible, mais il a l'avantage sur ses jets d'attaque. La vitesse du darkmantle devient
        également 0, il ne peut bénéficier d'aucun bonus à sa vitesse, et il se déplace avec la
        cible.

        Une créature peut détacher le darkmantle en réussissant un test de Force DC 13 en tant
        qu'action. A son tour, le darkmantle peut se détacher de la cible en utilisant 5 pieds de
        mouvement.
      toucher: 5
    - nom: Aura de ténèbres
      description:
        Un rayon de 15 pieds de ténèbres magiques s'étend à partir du manteau noir, se déplace
        avec lui et se répand dans les coins. Les ténèbres durent aussi longtemps que le darkmantle
        reste concentré, jusqu'à 10 minutes (comme s'il se concentrait sur un sort). La vision dans
        le noir ne peut pas pénétrer ces ténèbres, et aucune lumière naturelle ne peut les éclairer.
        Si une partie des ténèbres chevauche une zone de lumière créée par un sort de 2e niveau ou
        moins, le sort créant la lumière est dissipé.
