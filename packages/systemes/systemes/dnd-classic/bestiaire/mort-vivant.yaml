  nom: Vampire, forme de chauve-souris
  entite: personnage
  categorie: Mort-vivant
  type: Mort-vivant (moyenne)
  description: 'Alignement : loyal mauvais.'
  image: https://assets.yner.fr/bestaire/vampire-bat.png
  valeurs:
    niveau: 13
    PV_Max: 144
    Defense: 16
    INIT: 4
    Contact: 9
    Distance: 9
    Magie: 0
    FOR: 18
    DEX: 18
    CON: 18
    INT: 17
    SAG: 15
    CHA: 18
  actions:
    - nom: Morsure
      description: "Attaque d'arme de mêlée : +9 pour toucher, portée de 5 pieds, une créature
        consentante, ou une créature qui est agrippée par le vampire, incapacité ou retenue. Touché
        : 7 (1d6 + 4) points de dégâts perforants plus 10 (3d6) points de dégâts nécrotiques. Le
        maximum de points de vie de la cible est réduit d'un montant égal aux dégâts nécrotiques
        subis, et le vampire regagne un nombre de points de vie égal à ce montant. La réduction dure
        jusqu'à ce que la cible termine un long repos. La cible meurt si cet effet réduit son
        maximum de points de vie à 0. Un humanoïde tué de cette façon et enterré dans le sol se
        réveille la nuit suivante en tant qu'engeance vampirique sous le contrôle du vampire."
      toucher: 9
    - nom: Charme
      description: >-
        Le vampire cible un humanoïde qu'il peut voir dans un rayon de 30 pieds. Si la cible peut
        voir le vampire, elle doit réussir un jet de sauvegarde de sagesse DC 17 contre cette magie
        ou être charmée par le vampire. La cible charmée considère le vampire comme un ami de
        confiance dont il faut tenir compte et qu'il faut protéger. Bien que la cible ne soit pas
        sous le contrôle du vampire, elle prend les demandes ou les actions du vampire de la manière
        la plus favorable possible, et elle est une cible consentante pour l'attaque de morsure du
        vampire.

        Chaque fois que le vampire ou ses compagnons font quelque chose de nuisible à la cible,
        celle-ci peut répéter le jet de sauvegarde, mettant fin à l'effet sur elle-même en cas de
        succès. Sinon, l'effet dure 24 heures ou jusqu'à ce que le vampire soit détruit, qu'il se
        trouve sur un plan d'existence différent de celui de la cible ou qu'il entreprenne une
        action bonus pour mettre fin à l'effet.
    - nom: Les enfants de la nuit
      description:
        Le vampire appelle magiquement 2d4 essaims de chauves-souris ou de rats, à condition
        que le soleil ne soit pas levé. En extérieur, le vampire peut appeler 3d6 loups à la place.
        Les créatures appelées arrivent en 1d4 rounds, agissant comme des alliés du vampire et
        obéissant à ses ordres. Les bêtes restent pendant 1 heure, jusqu'à la mort du vampire, ou
        jusqu'à ce que le vampire les rejette par une action bonus.
