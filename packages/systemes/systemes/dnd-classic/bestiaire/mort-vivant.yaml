- id: mummy-lord
  nom: Le seigneur des momies
  entite: personnage
  categorie: Mort-vivant
  type: Mort-vivant (moyenne)
  description: 'Alignement : loyal mauvais.'
  image: https://assets.yner.fr/bestaire/mummy-lord.png
  valeurs:
    niveau: 15
    PV_Max: 97
    Defense: 17
    INIT: 0
    Contact: 9
    Distance: 9
    Magie: 0
    FOR: 18
    DEX: 10
    CON: 17
    INT: 11
    SAG: 18
    CHA: 16
  actions:
    - nom: Multi-attaques
      description:
        La momie peut utiliser son Éblouissement redoutable et effectuer une attaque avec son
        poing pourri.
    - nom: Poing pourri
      description:
        "Attaque d'arme de mêlée : +9 pour toucher, portée de 5 pieds, une cible. Touché : 14
        (3d6 + 4) points de dégâts de matraquage plus 21 (6d6) points de dégâts nécrotiques. Si la
        cible est une créature, elle doit réussir un jet de sauvegarde de Constitution DC 16 ou être
        maudite par la pourriture de la momie. La cible maudite ne peut pas regagner de points de
        vie, et son maximum de points de vie diminue de 10 (3d6) par tranche de 24 heures. Si la
        malédiction réduit le maximum de points de vie de la cible à 0, la cible meurt et son corps
        est réduit en poussière. La malédiction dure jusqu'à ce qu'elle soit levée par le sort de
        levée de malédiction ou une autre magie."
      toucher: 9
    - nom: Éblouissement redoutable
      description:
        Le seigneur momie cible une créature qu'il peut voir dans un rayon de 60 pieds. Si la
        cible peut voir le seigneur momie, elle doit réussir un jet de sauvegarde de Sagesse DC 16
        contre cette magie ou être effrayée jusqu'à la fin du prochain tour de la momie. Si la cible
        rate son jet de sauvegarde de 5 ou plus, elle est également paralysée pour la même durée.
        Une cible qui réussit son jet de sauvegarde est immunisée contre l'Effroyable Regard de
        toutes les momies et de tous les seigneurs momies pour les prochaines 24 heures.
