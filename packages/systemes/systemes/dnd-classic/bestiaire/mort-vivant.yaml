# Bestiaire de référence — Mort-vivant (20).
# Repris de l'ancienne app (legacy/public/tabs/bestiairy.json) : valeurs imprimées, pas un
# état calculable ; catégories, tailles et alignements traduits (voir docs/ressources.md).

- id: ghost
  nom: Fantôme
  entite: personnage
  categorie: Mort-vivant
  type: Mort-vivant (moyenne)
  description: 'Alignement : tout alignement.'
  image: https://assets.yner.fr/bestaire/ghost.png
  valeurs:
    niveau: 4
    PV_Max: 45
    Defense: 11
    INIT: 1
    Contact: 0
    Distance: 0
    Magie: 0
    FOR: 7
    DEX: 13
    CON: 10
    INT: 10
    SAG: 12
    CHA: 17
  actions:
    - nom: Effet de flétrissure
      description:
        "Attaque d'arme de mêlée : +5 pour toucher, portée de 5 pieds, une cible. Touché : 17
        (4d6 + 3) points de dégâts nécrotiques."
      toucher: 5
    - nom: L'éthéré
      description:
        Le fantôme entre dans le plan éthéré à partir du plan matériel, ou vice versa. Il est
        visible sur le plan matériel lorsqu'il se trouve dans la frontière éthérée, et vice versa,
        mais il ne peut ni affecter ni être affecté par quoi que ce soit sur l'autre plan.
    - nom: Visage horrifiant
      description:
        Chaque créature non-morte située à moins de 60 pieds du fantôme et qui peut le voir
        doit réussir un jet de sauvegarde de Sagesse DC 13 ou être effrayée pendant 1 minute. Si la
        sauvegarde échoue de 5 ou plus, la cible vieillit également de 1d4 × 10 ans. Une cible
        effrayée peut répéter son jet de sauvegarde à la fin de chacun de ses tours, mettant fin à
        la condition d'effroi sur elle-même en cas de succès. Si le jet de sauvegarde d'une cible
        est réussi ou si l'effet prend fin pour elle, la cible est immunisée contre le Visage
        horrifiant de ce fantôme pendant les 24 heures suivantes. L'effet de vieillissement peut
        être annulé par un sort de restauration supérieur, mais seulement dans les 24 heures qui
        suivent.
    - nom: Possession
      description: >-
        Un humanoïde que le fantôme peut voir dans un rayon de 5 pieds doit réussir un jet de
        sauvegarde de Charisme DC 13 ou être possédé par le fantôme ; le fantôme disparaît alors, et
        la cible est incapacité et perd le contrôle de son corps. Le fantôme contrôle désormais le
        corps mais ne prive pas la cible de conscience. Le fantôme ne peut être la cible d'aucune
        attaque, d'aucun sort ni d'aucun autre effet, à l'exception de ceux qui transforment les
        morts-vivants, et il conserve son alignement, son Intelligence, sa Sagesse, son Charisme et
        son immunité au charme et à l'effroi. Il utilise les statistiques de la cible possédée, mais
        n'a pas accès à ses connaissances, ses caractéristiques de classe ou ses compétences.

        La possession dure jusqu'à ce que le corps tombe à 0 point de vie, que le fantôme y mette
        fin par une action bonus ou qu'il soit repoussé par un effet tel que le sort dissipation du
        mal et du bien. Lorsque la possession prend fin, le fantôme réapparaît dans un espace
        inoccupé à moins de 5 pieds du corps. La cible est immunisée contre la possession de ce
        fantôme pendant 24 heures après avoir réussi le jet de sauvegarde ou après la fin de la
        possession.
