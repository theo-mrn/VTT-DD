  actions:
    - nom: Multi-attaques
      description: 'Le diable effectue deux attaques : une avec sa barbe et une avec son glaive.'
    - nom: Barbe
      description:
        "Attaque d'arme de mêlée : +5 pour toucher, portée de 5 pieds, une créature. Touché : 6
        (1d8 + 2) points de dégâts perforants, et la cible doit réussir un jet de sauvegarde de
        Constitution DC 12 ou être empoisonnée pendant 1 minute. Tant qu'elle est empoisonnée de
        cette façon, la cible ne peut pas regagner de points de vie. La cible peut répéter le jet de
        sauvegarde à la fin de chacun de ses tours, mettant fin à l'effet sur elle-même en cas de
        succès."
      toucher: 5
    - nom: Glaive
      description:
        "Attaque d'arme de mêlée : +5 pour toucher, portée de 10 pieds, une cible. Touché : 8
        (1d10 + 3) points de dégâts tranchants. Si la cible est une créature autre qu'un mort-vivant
        ou une construction, elle doit réussir un jet de sauvegarde de Constitution DC 12 ou perdre
        5 (1d10) points de vie au début de chacun de ses tours à cause d'une blessure infernale.
        Chaque fois que le démon touche la cible blessée avec cette attaque, les dégâts infligés par
        la blessure augmentent de 5 (1d10). Toute créature peut entreprendre une action pour panser
        la plaie en réussissant un test de sagesse (médecine) DC 12. La blessure se referme
        également si la cible bénéficie d'une guérison magique."
      toucher: 5
