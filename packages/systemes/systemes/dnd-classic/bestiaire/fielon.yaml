        L'équipement qu'elle porte n'est pas transformé. Elle reprend sa forme réelle si elle meurt.
    - nom: L'éthéré
      description:
        La sorcière entre magiquement dans le plan éthéré depuis le plan matériel, ou vice
        versa. Pour ce faire, elle doit avoir une pierre de cœur en sa possession.
    - nom: La hantise du cauchemar
      description:
        Lorsqu'elle se trouve sur le plan éthéré, la sorcière touche magiquement un humanoïde
        endormi sur le plan matériel. Un sort de protection contre le mal et le bien lancé sur la
        cible empêche ce contact, de même qu'un cercle magique. Tant que le contact persiste, la
        cible a des visions épouvantables. Si ces visions durent au moins 1 heure, la cible ne
        bénéficie pas de son repos et son maximum de points de vie est réduit de 5 (1d10). Si cet
        effet réduit le maximum de points de vie de la cible à 0, la cible meurt, et si la cible
        était maléfique, son âme est piégée dans le sac d'âme de la sorcière. La réduction du
        maximum de points de vie de la cible dure jusqu'à ce qu'elle soit supprimée par le sort
        restauration supérieure ou une magie similaire.
