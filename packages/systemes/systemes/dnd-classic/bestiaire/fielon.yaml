      description:
        "Attaque d'arme de mêlée : +5 pour toucher, portée de 5 pieds, une cible. Touché : 6
        (1d6 + 3) points de dégâts tranchants."
      toucher: 5
    - nom: Charme
      description: >-
        Un humanoïde que le démon peut voir dans un rayon de 30 pieds doit réussir un jet de
        sauvegarde de Sagesse DC 15 ou être magiquement charmé pendant 1 jour. La cible charmée
        obéit aux ordres verbaux ou télépathiques du démon. Si la cible est blessée ou reçoit un
        ordre suicidaire, elle peut répéter son jet de sauvegarde, ce qui met fin à l'effet en cas
        de succès. Si la cible réussit son jet de sauvegarde contre l'effet, ou si l'effet sur elle
        prend fin, elle est immunisée contre le charme de ce démon pour les 24 heures suivantes.

        Le démon ne peut charmer qu'une seule cible à la fois. S'il en charme une autre, l'effet sur
        la cible précédente prend fin.
    - nom: Baiser drainant
      description:
        Le démon embrasse une créature charmée par lui ou une créature consentante. La cible
        doit effectuer un jet de sauvegarde de Constitution DC 15 contre cette magie, subissant 32
        (5d10 + 5) points de dégâts psychiques en cas de sauvegarde ratée, ou la moitié en cas de
        sauvegarde réussie. Le maximum de points de vie de la cible est réduit d'un montant égal aux
        dégâts subis. Cette réduction dure jusqu'à ce que la cible termine un long repos. La cible
        meurt si cet effet réduit son maximum de points de vie à 0.
    - nom: L'éthéré
      description: Le démon pénètre magiquement dans le plan éthéré depuis le plan matériel, ou vice versa.
