- id: ice-devil
  nom: Diable de glace
  entite: personnage
  categorie: Fiélon
  type: Fiélon (grande)
  description: 'Alignement : loyal mauvais.'
  image: https://assets.yner.fr/bestaire/ice-devil.png
  valeurs:
    niveau: 14
    PV_Max: 180
    Defense: 18
    INIT: 2
    Contact: 10
    Distance: 10
    Magie: 0
    FOR: 21
    DEX: 14
    CON: 18
    INT: 18
    SAG: 15
    CHA: 18
  actions:
    - nom: Multi-attaques
      description:
        'Le diable effectue trois attaques : une avec sa morsure, une avec ses griffes et une
        avec sa queue.'
    - nom: Morsure
      description:
        "Attaque d'arme de mêlée : +10 pour toucher, portée de 5 pieds, une cible. Touché : 12
        (2d6 + 5) points de dégâts perforants plus 10 (3d6) points de dégâts de froid."
      toucher: 10
    - nom: Griffes
      description:
        "Attaque d'arme de mêlée : +10 pour toucher, portée de 5 pieds, une cible. Touché : 10
        (2d4 + 5) points de dégâts tranchants plus 10 (3d6) points de dégâts de froid."
      toucher: 10
    - nom: Queue
      description:
        "Attaque d'arme de mêlée : +10 pour toucher, portée de 10 pieds, une cible. Touché : 12
        (2d6 + 5) points de dégâts de matraquage plus 10 (3d6) points de dégâts de froid."
      toucher: 10
    - nom: Mur de glace
      description: >-
        Le diable forme magiquement un mur de glace opaque sur une surface solide qu'il peut voir
        dans un rayon de 60 pieds. Le mur a 1 pied d'épaisseur et jusqu'à 30 pieds de long et 10
        pieds de haut, ou c'est un dôme hémisphérique jusqu'à 20 pieds de diamètre.

        Lorsque le mur apparaît, chaque créature se trouvant dans son espace est poussée hors de
        celui-ci par le chemin le plus court. La créature choisit de quel côté du mur elle se
        retrouve, à moins qu'elle ne soit incapable de le faire. La créature fait alors un jet de
        sauvegarde de Dextérité DC 17, subissant 35 (10d6) points de dégâts de froid en cas d'échec,
        ou moitié moins en cas de réussite.

        Le mur dure 1 minute ou jusqu'à ce que le démon soit incapacité ou meure. Le mur peut être
        endommagé et percé ; chaque section de 3 mètres a une CA de 5, 30 points de vie, une
        vulnérabilité aux dégâts de feu et une immunité à l'acide, au froid, à la nécrose, au poison
        et aux dégâts psychiques. Si une section est détruite, elle laisse derrière elle une nappe
        d'air glacial dans l'espace que le mur occupait. Chaque fois qu'une créature finit de se
        déplacer dans l'air glacial au cours d'un tour, volontairement ou non, elle doit effectuer
        un jet de sauvegarde de Constitution DC 17, subissant 17 (5d6) points de dégâts de froid en
        cas d'échec, ou la moitié de ces dégâts en cas de réussite. L'air glacial se dissipe lorsque
        le reste du mur disparaît.
- id: chain-devil
  nom: Diable en chaîne
  entite: personnage
  categorie: Fiélon
  type: Fiélon (moyenne)
  description: 'Alignement : loyal mauvais.'
  image: https://assets.yner.fr/bestaire/chain-devil.png
  valeurs:
    niveau: 8
    PV_Max: 85
    Defense: 16
    INIT: 2
    Contact: 7
    Distance: 7
    Magie: 0
    FOR: 18
    DEX: 15
    CON: 18
    INT: 11
    SAG: 12
    CHA: 14
  actions:
    - nom: Multi-attaques
      description: Le diable effectue deux attaques avec ses chaînes.
    - nom: Chaîne
      description:
        "Attaque d'arme de mêlée : +8 pour toucher, portée de 10 pieds, une cible. Touché : 11
        (2d6 + 4) points de dégâts tranchants. La cible est agrippée (évasion DC 14) si le démon
        n'est pas déjà en train d'agripper une créature. Jusqu'à la fin de cette prise, la cible est
        entravée et subit 7 (2d6) points de dégâts perforants au début de chacun de ses tours."
      toucher: 8
    - nom: Animer des chaînes
      description: >-
        Jusqu'à quatre chaînes que le démon peut voir dans un rayon de 60 pieds autour de lui
        poussent magiquement des barbelures tranchantes et s'animent sous le contrôle du démon, à
        condition que les chaînes ne soient pas portées ou transportées.

        Chaque chaîne animée est un objet doté d'une CA de 20, de 20 points de vie, d'une résistance
        aux dégâts perforants et d'une immunité aux dégâts psychiques et du tonnerre. Lorsque le
        démon utilise l'attaque multiple à son tour, il peut utiliser chaque chaîne animée pour
        effectuer une attaque en chaîne supplémentaire. Une chaîne animée peut agripper une créature
        à elle seule, mais ne peut pas effectuer d'attaque pendant qu'elle est agrippée. Une chaîne
        animée retourne à son état inanimé si elle est réduite à 0 point de vie ou si le démon est
        frappé d'incapacité ou meurt.
