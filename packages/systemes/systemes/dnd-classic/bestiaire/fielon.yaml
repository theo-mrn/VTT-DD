# Bestiaire de référence — Fiélon (23).
# Repris de l'ancienne app (legacy/public/tabs/bestiairy.json) : valeurs imprimées, pas un
# état calculable ; catégories, tailles et alignements traduits (voir docs/ressources.md).

- id: balor
  nom: Balor
  entite: personnage
  categorie: Fiélon
  type: Fiélon (très grande)
  description: 'Alignement : chaotique mauvais.'
  image: https://assets.yner.fr/bestaire/balor.png
  valeurs:
    niveau: 19
    PV_Max: 262
    Defense: 19
    INIT: 2
    Contact: 14
    Distance: 14
    Magie: 0
    FOR: 26
    DEX: 15
    CON: 22
    INT: 20
    SAG: 16
    CHA: 22
  actions:
    - nom: Multi-attaques
      description: 'Le balor effectue deux attaques : une avec son épée longue et une avec son fouet.'
    - nom: Épée longue
      description:
        "Attaque d'arme de mêlée : +14 pour toucher, portée de 10 pieds, une cible. Touché : 21
        (3d8 + 8) points de dégâts tranchants plus 13 (3d8) points de dégâts de foudre. Si le balor
        obtient un coup critique, il lance les dés de dégâts trois fois au lieu de deux."
      toucher: 14
    - nom: Fouet
      description:
        "Attaque d'arme de mêlée : +14 pour toucher, portée de 30 pieds, une cible. Touché : 15
        (2d6 + 8) points de dégâts tranchants plus 10 (3d6) points de dégâts de feu, et la cible
        doit réussir un jet de sauvegarde de Force DC 20 ou être tirée jusqu'à 25 pieds vers le
        balor."
      toucher: 14
    - nom: Téléportation
      description:
        Le balor se téléporte magiquement, avec tout l'équipement qu'il porte, jusqu'à 120
        pieds dans un espace inoccupé qu'il peut voir.
