    - nom: Multi-attaques
      description: Le solaire effectue deux attaques d'épée grise.
    - nom: Épée de guerre
      description:
        "Attaque d'arme de mêlée : +15 pour toucher, portée de 5 pieds, une cible. Touché : 22
        (4d6 + 8) points de dégâts tranchants plus 27 (6d8) points de dégâts radiants."
      toucher: 15
    - nom: Arc long meurtrier
      description:
        "Attaque d'arme à distance : +13 pour toucher, portée 150/600 pieds, une cible. Touché
        : 15 (2d8 + 6) points de dégâts perforants plus 27 (6d8) points de dégâts radiants. Si la
        cible est une créature ayant 190 points de vie ou moins, elle doit réussir un jet de
        sauvegarde de Constitution DC 15 ou mourir."
      toucher: 13
    - nom: L'épée volante
      description:
        Le solaire libère son épée pour qu'elle plane magiquement dans un espace inoccupé à
        moins de 5 pieds de lui. Si le solaire peut voir l'épée, il peut mentalement lui ordonner
        comme action bonus de voler jusqu'à 50 pieds et d'effectuer une attaque contre une cible ou
        de retourner dans ses mains. Si l'épée planante est ciblée par un effet, le solaire est
        considéré comme la tenant. L'épée tombe si le solaire meurt.
    - nom: Toucher de guérison
      description:
        Le solaire touche une autre créature. La cible regagne magiquement 40 (8d8 + 4) points
        de vie et est libérée de toute malédiction, maladie, poison, cécité ou surdité.
