    DEX: 14
    CON: 18
    INT: 5
    SAG: 10
    CHA: 8
  actions:
    - nom: Multi-attaques
      description: L'élémentaire effectue deux attaques de type slam.
    - nom: Chelem
      description:
        "Attaque d'arme de mêlée : +7 pour toucher, portée de 5 pieds, une cible. Touché : 13
        (2d8 + 4) dégâts de matraquage."
      toucher: 7
    - nom: Whelm
      description: >-
        Chaque créature se trouvant dans l'espace de l'élémentaire doit effectuer un jet de
        sauvegarde de Force DC 15. En cas d'échec, la cible subit 13 (2d8 + 4) points de dégâts de
        matraquage. Si elle est Grande ou plus petite, elle est également agrippée (évasion DC 14).
        Jusqu'à la fin de cette prise, la cible est entravée et incapable de respirer, sauf si elle
        peut respirer de l'eau. Si le jet de sauvegarde est réussi, la cible est poussée hors de
        l'espace de l'élémentaire.

        L'élémentaire peut agripper une créature de grande taille ou jusqu'à deux créatures de
        taille moyenne ou inférieure à la fois. Au début de chaque tour de l'élémentaire, chaque
        cible agrippée subit 13 (2d8 + 4) dégâts de matraquage. Une créature située à moins de 5
        pieds de l'élémentaire peut tirer une créature ou un objet hors de lui en effectuant une
        action pour faire un DC 14 de Force et en réussissant.
