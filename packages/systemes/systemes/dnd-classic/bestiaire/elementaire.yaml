- id: djinni
  nom: Djinni
  entite: personnage
  categorie: Élémentaire
  type: Élémentaire (grande)
  description: 'Alignement : chaotique bon.'
  image: https://assets.yner.fr/bestaire/djinni.png
  valeurs:
    niveau: 11
    PV_Max: 161
    Defense: 17
    INIT: 2
    Contact: 9
    Distance: 9
    Magie: 0
    FOR: 21
    DEX: 15
    CON: 22
    INT: 15
    SAG: 16
    CHA: 20
  actions:
    - nom: Multi-attaques
      description: Le djinni effectue trois attaques de cimeterre.
    - nom: Cimeterre
      description:
        "Attaque d'arme de mêlée : +9 pour toucher, portée de 5 pieds, une cible. Touché : 12
        (2d6 + 5) points de dégâts tranchants plus 3 (1d6) points de dégâts de foudre ou de tonnerre
        (au choix du djinni)."
      toucher: 9
    - nom: Créer un tourbillon
      description: >-
        Un cylindre d'air tourbillonnant de 5 pieds de rayon et de 30 pieds de haut se forme
        magiquement sur un point que le djinni peut voir dans un rayon de 120 pieds. Le tourbillon
        dure tant que le djinni reste concentré (comme s'il se concentrait sur un sort). Toute
        créature entrant dans le tourbillon, à l'exception du djinni, doit réussir un jet de
        sauvegarde de Force DC 18 ou être retenue par le tourbillon. Le djinni peut déplacer le
        tourbillon jusqu'à 60 pieds comme action, et les créatures retenues par le tourbillon se
        déplacent avec lui. Le tourbillon prend fin si le djinni le perd de vue.

        Une créature peut utiliser son action pour libérer une créature retenue par le tourbillon, y
        compris elle-même, en réussissant un test de Force DC 18. Si le test est réussi, la créature
        n'est plus retenue et se déplace dans l'espace le plus proche hors du tourbillon.
