- id: air-elemental
  nom: Élémentaire de l'air
  entite: personnage
  categorie: Élémentaire
  type: Élémentaire (grande)
  description: 'Alignement : neutre.'
  image: https://assets.yner.fr/bestaire/air-elemental.png
  valeurs:
    niveau: 5
    PV_Max: 90
    Defense: 15
    INIT: 5
    Contact: 5
    Distance: 5
    Magie: 0
    FOR: 14
    DEX: 20
    CON: 14
    INT: 6
    SAG: 10
    CHA: 6
  actions:
    - nom: Multi-attaques
      description: L'élémentaire effectue deux attaques de type slam.
    - nom: Chelem
      description:
        "Attaque d'arme de mêlée : +8 pour toucher, portée de 5 pieds, une cible. Touché : 14
        (2d8 + 5) points de dégâts de matraquage."
      toucher: 8
    - nom: Tourbillon
      description: >-
        Chaque créature se trouvant dans l'espace de l'élémentaire doit effectuer un jet de
        sauvegarde de Force DC 13. En cas d'échec, la cible subit 15 (3d8 + 2) points de dégâts de
        matraquage et est projetée à 20 pieds de l'élémentaire dans une direction aléatoire et mise
        à terre. Si une cible projetée heurte un objet, comme un mur ou le sol, elle subit 3 (1d6)
        points de dégâts de matraquage par tranche de 3 mètres. Si la cible est lancée sur une autre
        créature, celle-ci doit réussir un jet de sauvegarde de Dextérité DC 13 ou subir les mêmes
        dégâts et être mise à terre.

        Si le jet de sauvegarde est réussi, la cible subit la moitié des dégâts de matraquage et
        n'est pas projetée ou mise à terre.
- id: water-elemental
  nom: Élémentaire de l'eau
