    - nom: Avalez
      description:
        La grenouille effectue une attaque de morsure contre une cible de petite taille ou plus
        petite qu'elle agrippe. Si l'attaque touche, la cible est avalée et le grappin prend fin. La
        cible avalée est aveuglée et entravée, elle bénéficie d'une couverture totale contre les
        attaques et autres effets extérieurs à la grenouille, et elle subit 5 (2d4) points de dégâts
        d'acide au début de chaque tour de la grenouille. La grenouille ne peut avaler qu'une seule
        cible à la fois. Si la grenouille meurt, la créature avalée n'est plus retenue par elle et
        peut s'échapper du cadavre en se déplaçant de 5 pieds, en sortant couchée.
