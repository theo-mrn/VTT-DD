        regagné des points de vie, et est paralysée tant qu'elle est empoisonnée de cette façon."
      toucher: 5
    - nom: Web
      description:
        "Attaque d'arme à distance : +5 pour toucher, portée 30/60 pieds, une créature. Touché
        : La cible est retenue par une toile. Comme action, la cible retenue peut faire un test de
        Force DC 12 et faire éclater la toile en cas de succès. La toile peut également être
        attaquée et détruite (CA 10 ; pv 5 ; vulnérabilité aux dégâts de feu ; immunité aux coups,
        au poison et aux dégâts psychiques)."
      toucher: 5
