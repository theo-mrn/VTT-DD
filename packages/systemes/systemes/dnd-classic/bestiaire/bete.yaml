    PV_Max: 39
    Defense: 11
    INIT: 1
    Contact: 4
    Distance: 4
    Magie: 0
    FOR: 15
    DEX: 13
    CON: 13
    INT: 2
    SAG: 10
    CHA: 3
  actions:
    - nom: Morsure
      description:
        "Attaque d'arme de mêlée : +4 pour toucher, portée de 5 pieds, une cible. Touché : 7
        (1d10 + 2) points de dégâts perforants plus 5 (1d10) points de dégâts de poison, et la cible
        est agrippée (échappatoire DC 13). Jusqu'à la fin de cette prise, la cible est immobilisée
        et le crapaud ne peut pas mordre une autre cible."
      toucher: 4
    - nom: Avalez
      description: >-
        Le crapaud effectue une attaque de morsure contre une cible de taille moyenne ou plus petite
        qu'il agrippe. Si l'attaque touche, la cible est avalée et la prise se termine. La cible
        avalée est aveuglée et entravée, elle bénéficie d'une couverture totale contre les attaques
        et autres effets extérieurs au crapaud, et elle subit 10 (3d6) points de dégâts d'acide au
        début de chaque tour du crapaud. Le crapaud ne peut avaler qu'une seule cible à la fois.

        Si le crapaud meurt, la créature avalée n'est plus retenue par lui et peut s'échapper du
        cadavre en se déplaçant de 5 pieds, en sortant couchée.
