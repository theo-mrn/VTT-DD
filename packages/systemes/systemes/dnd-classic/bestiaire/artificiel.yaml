- id: clay-golem
  nom: Golem d'argile
  entite: personnage
  categorie: Artificiel
  type: Artificiel (grande)
  description: 'Alignement : sans alignement.'
  image: https://assets.yner.fr/bestaire/clay-golem.png
  valeurs:
    niveau: 9
    PV_Max: 133
    Defense: 14
    INIT: -1
    Contact: 9
    Distance: 9
    Magie: 0
    FOR: 20
    DEX: 9
    CON: 18
    INT: 3
    SAG: 8
    CHA: 1
  actions:
    - nom: Multi-attaques
      description: Le golem effectue deux attaques de type slam.
    - nom: Chelem
      description:
        "Attaque d'arme de mêlée : +8 pour toucher, portée de 5 pieds, une cible. Touché : 16
        (2d10 + 5) points de dégâts de matraquage. Si la cible est une créature, elle doit réussir
        un jet de sauvegarde de Constitution DC 15 ou voir son maximum de points de vie réduit d'un
        montant égal aux dégâts subis. La cible meurt si cette attaque réduit son maximum de points
        de vie à 0. La réduction dure jusqu'à ce qu'elle soit supprimée par le sort restauration
        supérieure ou une autre magie."
      toucher: 8
    - nom: Hâte
      description:
        Jusqu'à la fin de son prochain tour, le golem bénéficie magiquement d'un bonus de +2 à
        sa CA, d'un avantage aux jets de sauvegarde de Dextérité et peut utiliser son attaque de
        fronde comme action bonus.
