- id: stone-golem
  nom: Golem de pierre
  entite: personnage
  categorie: Artificiel
  type: Artificiel (grande)
  description: 'Alignement : sans alignement.'
  image: https://assets.yner.fr/bestaire/stone-golem.png
  valeurs:
    niveau: 10
    PV_Max: 178
    Defense: 17
    INIT: -1
    Contact: 10
    Distance: 10
    Magie: 0
    FOR: 22
    DEX: 9
    CON: 20
    INT: 3
    SAG: 11
    CHA: 1
  actions:
    - nom: Multi-attaques
      description: Le golem effectue deux attaques de type slam.
    - nom: Chelem
      description:
        "Attaque d'arme de mêlée : +10 pour toucher, portée de 5 pieds, une cible. Touché : 19
        (3d8 + 6) points de dégâts de matraquage."
      toucher: 10
    - nom: Lenteur
      description:
        Le golem cible une ou plusieurs créatures qu'il peut voir dans un rayon de 10 pieds.
        Chaque cible doit effectuer un jet de sauvegarde de sagesse DC 17 contre cette magie. En cas
        de sauvegarde ratée, la cible ne peut pas utiliser de réactions, sa vitesse est réduite de
        moitié et elle ne peut pas faire plus d'une attaque à son tour. De plus, la cible peut
        effectuer soit une action, soit une action bonus à son tour, mais pas les deux. Ces effets
        durent 1 minute. Une cible peut répéter le jet de sauvegarde à la fin de chacun de ses
        tours, mettant fin à l'effet sur elle-même en cas de succès.
