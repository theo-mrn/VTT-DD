# Bestiaire de référence — Fée (6).
# Repris de l'ancienne app (legacy/public/tabs/bestiairy.json) : valeurs imprimées, pas un
# état calculable ; catégories, tailles et alignements traduits (voir docs/ressources.md).

- id: blink-dog
  nom: Chien esquiveur
  entite: personnage
  categorie: Fée
  type: Fée (moyenne)
  description: 'Alignement : loyal bon.'
  image: https://assets.yner.fr/bestaire/blink-dog.png
  valeurs:
    niveau: 0.25
    PV_Max: 22
    Defense: 13
    INIT: 3
    Contact: 2
    Distance: 2
    Magie: 0
    FOR: 12
    DEX: 17
    CON: 12
    INT: 10
    SAG: 13
    CHA: 11
  actions:
    - nom: Morsure
      description:
        "Attaque d'arme de mêlée : +3 pour toucher, portée de 5 pieds, une cible. Touché : 4
        (1d6 + 1) points de dégâts perforants."
      toucher: 3
    - nom: Téléportation
      description:
        Le chien se téléporte magiquement, avec tout l'équipement qu'il porte, jusqu'à 40 pieds
        dans un espace inoccupé qu'il peut voir. Avant ou après la téléportation, le chien peut
        effectuer une attaque de morsure.
- id: dryad
  nom: Dryade
  entite: personnage
  categorie: Fée
  type: Fée (moyenne)
  description: 'Alignement : neutre.'
  image: https://assets.yner.fr/bestaire/dryad.png
  valeurs:
    niveau: 1
    PV_Max: 22
    Defense: 11
    INIT: 1
    Contact: 2
    Distance: 2
    Magie: 0
    FOR: 10
    DEX: 12
    CON: 11
    INT: 14
    SAG: 15
    CHA: 18
  actions:
    - nom: Club
      description:
        'Arme de mêlée Attaque : +2 pour toucher (+6 pour toucher avec le shillelagh), portée
        de 5 pieds, une cible. Touché : 2 (1 d4) dégâts de matraquage, ou 8 (1d8 + 4) dégâts de
        matraquage avec le shillelagh.'
      toucher: 2
    - nom: Charme de Fey
      description: >-
        La dryade cible un humanoïde ou une bête qu'elle peut voir dans un rayon de 30 pieds autour
        d'elle. Si la cible peut voir la dryade, elle doit réussir un jet de sauvegarde de sagesse
        DC 14 ou être magiquement charmée. La créature charmée considère la dryade comme une amie de
        confiance qu'il faut écouter et protéger. Bien que la cible ne soit pas sous le contrôle de
        la dryade, elle prend les demandes ou les actions de la dryade de la façon la plus favorable
        possible.

        Chaque fois que la dryade ou ses alliés font quelque chose de nuisible à la cible, elle peut
        répéter le jet de sauvegarde, mettant fin à l'effet sur elle-même en cas de succès. Sinon,
        l'effet dure 24 heures ou jusqu'à ce que la dryade meure, se trouve sur un plan d'existence
        différent de celui de la cible ou mette fin à l'effet par une action bonus. Si le jet de
        sauvegarde de la cible est réussi, la cible est immunisée contre le charme feint de la
        dryade pour les 24 heures suivantes.

        La dryade ne peut charmer plus d'un humanoïde et jusqu'à trois bêtes à la fois.
- id: green-hag
  nom: Hag vert
  entite: personnage
  categorie: Fée
  type: Fée (moyenne)
  description: 'Alignement : neutre mauvais.'
  image: https://assets.yner.fr/bestaire/green-hag.png
  valeurs:
    niveau: 3
    PV_Max: 82
    Defense: 17
    INIT: 1
    Contact: 6
    Distance: 6
    Magie: 0
    FOR: 18
    DEX: 12
    CON: 16
    INT: 13
    SAG: 14
    CHA: 14
  actions:
    - nom: Griffes
      description:
        "Attaque d'arme de mêlée : +6 pour toucher, portée de 5 pieds, une cible. Touché : 13
        (2d8 + 4) points de dégâts tranchants."
      toucher: 6
    - nom: Apparence illusoire
      description: >-
        La sorcière se couvre et couvre tout ce qu'elle porte ou transporte d'une illusion magique
        qui la fait ressembler à une autre créature de sa taille générale et de forme humanoïde.
        L'illusion prend fin si la sorcière entreprend une action bonus pour y mettre fin ou si elle
        meurt.

        Les changements provoqués par cet effet ne résistent pas à une inspection physique. Par
        exemple, la sorcière peut sembler avoir une peau lisse, mais quelqu'un qui la toucherait
        sentirait sa chair rugueuse. Sinon, une créature doit entreprendre une action pour inspecter
        visuellement l'illusion et réussir un test d'Intelligence (Investigation) DC 20 pour
        discerner que la sorcière est déguisée.
    - nom: Passage invisible
      description:
        La sorcière devient magiquement invisible jusqu'à ce qu'elle attaque ou lance un sort,
        ou jusqu'à ce que sa concentration prenne fin (comme si elle se concentrait sur un sort).
        Pendant qu'elle est invisible, elle ne laisse aucune trace physique de son passage, de sorte
        qu'on ne peut la suivre que par magie. Tout équipement qu'elle porte est invisible avec
        elle.
