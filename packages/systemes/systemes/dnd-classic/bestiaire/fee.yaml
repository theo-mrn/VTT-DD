        "Attaque d'arme de mêlée : +5 pour toucher, portée de 5 pieds, une cible. Touché : 10
        (2d6 + 3) points de dégâts tranchants."
      toucher: 5
    - nom: Éblouissement mortel
      description:
        La sorcière cible une créature effrayée qu'elle peut voir dans un rayon de 30 pieds
        autour d'elle. Si la cible peut voir la sorcière, elle doit réussir un jet de sauvegarde de
        sagesse DC 11 contre cette magie ou tomber à 0 point de vie.
    - nom: Apparence illusoire
      description: >-
        La sorcière se couvre et couvre tout ce qu'elle porte ou transporte d'une illusion magique
        qui la fait ressembler à une créature laide de sa taille générale et de forme humanoïde.
        L'effet prend fin si la sorcière entreprend une action bonus pour y mettre fin ou si elle
        meurt.

        Les changements provoqués par cet effet ne résistent pas à une inspection physique. Par
        exemple, la sorcière peut sembler ne pas avoir de griffes, mais quelqu'un qui touche sa main
        peut sentir les griffes. Sinon, une créature doit entreprendre une action pour inspecter
        visuellement l'illusion et réussir un test d'Intelligence (Investigation) DC 16 pour
        discerner que la sorcière est déguisée.
