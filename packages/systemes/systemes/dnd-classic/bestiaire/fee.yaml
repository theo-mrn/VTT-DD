  actions:
    - nom: Épée longue
      description:
        "Attaque d'arme de mêlée : +2 au toucher, portée de 5 pieds, une cible. Touché : 1
        point de dégâts tranchants."
      toucher: 2
    - nom: Arc court
      description:
        "Attaque d'arme à distance : +6 pour toucher, portée 40/160 pieds, une cible. Touché :
        1 dégât perforant, et la cible doit réussir un jet de sauvegarde de Constitution DC 10 ou
        être empoisonnée pendant 1 minute. Si le résultat de son jet de sauvegarde est inférieur ou
        égal à 5, la cible empoisonnée tombe inconsciente pour la même durée, ou jusqu'à ce qu'elle
        subisse des dégâts ou qu'une autre créature entreprenne une action pour la réveiller."
      toucher: 6
    - nom: Vue du cœur
      description:
        Le lutin touche une créature et connaît magiquement son état émotionnel actuel. Si la
        cible échoue à un jet de sauvegarde DC 10 de Charisme, le lutin connaît également
        l'alignement de la créature. Les célestes, les démons et les morts-vivants échouent
        automatiquement au jet de sauvegarde.
    - nom: Invisibilité
      description:
        Le lutin devient magiquement invisible jusqu'à ce qu'il attaque ou lance un sort, ou
        jusqu'à la fin de sa concentration (comme s'il se concentrait sur un sort). Tout équipement
        que le lutin porte ou transporte est invisible avec lui.
