- id: treant
  nom: Tréant
  entite: personnage
  categorie: Plante
  type: Plante (très grande)
  description: 'Alignement : chaotique bon.'
  image: https://assets.yner.fr/bestaire/treant.png
  valeurs:
    niveau: 9
    PV_Max: 138
    Defense: 16
    INIT: -1
    Contact: 10
    Distance: 10
    Magie: 0
    FOR: 23
    DEX: 8
    CON: 21
    INT: 12
    SAG: 16
    CHA: 12
  actions:
    - nom: Multi-attaques
      description: Le tréant effectue deux attaques de type slam.
    - nom: Chelem
      description:
        "Attaque d'arme de mêlée : +10 pour toucher, portée de 5 pieds, une cible. Touché : 16
        (3d6 + 6) points de dégâts de matraquage."
      toucher: 10
    - nom: Le rocher
      description:
        "Attaque d'arme à distance : +10 pour toucher, portée 60/180 pieds, une cible. Touché :
        28 (4d10 + 6) points de dégâts de matraquage."
      toucher: 10
    - nom: Animer les arbres
      description:
        Le tréant anime magiquement un ou deux arbres qu'il peut voir dans un rayon de 60 pieds
        autour de lui. Ces arbres ont les mêmes statistiques que le tréant, sauf qu'ils ont des
        scores d'Intelligence et de Charisme de 1, qu'ils ne peuvent pas parler et qu'ils n'ont que
        l'option d'action Cheveux d'argile. Un arbre animé agit comme un allié du tréant. L'arbre
        reste animé pendant 1 jour ou jusqu'à ce qu'il meure, jusqu'à ce que l'écorcheur meure ou se
        trouve à plus de 120 pieds de l'arbre, ou jusqu'à ce que l'écorcheur entreprenne une action
        bonus pour le retransformer en arbre inanimé. L'arbre prend alors racine si possible.
