- id: shambling-mound
  nom: Le tumulus
  entite: personnage
  categorie: Plante
  type: Plante (grande)
  description: 'Alignement : sans alignement.'
  image: https://assets.yner.fr/bestaire/shambling-mound.png
  valeurs:
    niveau: 5
    PV_Max: 136
    Defense: 15
    INIT: -1
    Contact: 7
    Distance: 7
    Magie: 0
    FOR: 18
    DEX: 8
    CON: 16
    INT: 5
    SAG: 10
    CHA: 5
  actions:
    - nom: Multi-attaques
      description:
        Le monticule branlant effectue deux attaques de fronde. Si les deux attaques touchent
        une cible de taille moyenne ou plus petite, la cible est agrippée (DC 14), et le monticule
        informe la cible de son Engloutissement.
    - nom: Chelem
      description:
        "Attaque d'arme de mêlée : +7 pour toucher, portée de 5 pieds, une cible. Touché : 13
        (2d8 + 4) dégâts de matraquage."
      toucher: 7
    - nom: Engloutir
      description:
        Le monticule informe engloutit une créature de taille moyenne ou plus petite qu'il
        agrippe. La cible engloutie est aveuglée, entravée et incapable de respirer, et elle doit
        réussir un jet de sauvegarde de Constitution DC 14 au début de chaque tour du monticule ou
        subir 13 (2d8 + 4) dégâts de matraquage. Si le monticule se déplace, la cible engloutie se
        déplace avec lui. Le monticule ne peut engloutir qu'une seule créature à la fois.
