        et qui en est consciente doit réussir un jet de sauvegarde de Sagesse DC 18 ou être effrayée
        pendant 1 minute. Une créature peut répéter le jet de sauvegarde à la fin de chacun de ses
        tours, mettant fin à l'effet sur elle-même en cas de succès. Si une créature réussit son jet
        de sauvegarde ou si l'effet prend fin pour elle, elle est immunisée contre la Présence
        effrayante du dragon pour les 24 heures suivantes.
    - nom: Armes à haleine
      description: >-
        Le dragon utilise l'une des armes respiratoires suivantes :

        Souffle de feu. Le dragon exhale du feu sur une ligne de 90 pieds de long et 10 pieds de
        large. Chaque créature de cette ligne doit faire un jet de sauvegarde de Dextérité DC 21,
        subissant 56 (16d6) points de dégâts de feu en cas de sauvegarde ratée, ou moitié moins de
        dégâts en cas de sauvegarde réussie.

        Souffle de sommeil. Le dragon exhale un gaz de sommeil dans un cône de 90 pieds. Chaque
        créature dans cette zone doit réussir un jet de sauvegarde de Constitution DC 21 ou tomber
        inconsciente pendant 10 minutes. Cet effet prend fin pour une créature si elle subit des
        dégâts ou si quelqu'un utilise une action pour la réveiller.
    - nom: Changer de forme
      description: >-
        Le dragon se transforme magiquement en un humanoïde ou une bête dont la valeur de défi n'est
        pas supérieure à la sienne, ou reprend sa véritable forme. Il reprend sa forme réelle s'il
        meurt. Tout équipement qu'il porte est absorbé ou porté par sa nouvelle forme (au choix du
        dragon).

        Sous une nouvelle forme, le dragon conserve son alignement, ses points de vie, ses dés de
        réussite, sa capacité à parler, ses compétences, sa résistance légendaire, ses actions de
        repaire et ses scores d'Intelligence, de Sagesse et de Charisme, ainsi que cette action. Ses
        statistiques et capacités sont remplacées par celles de sa nouvelle forme, à l'exception des
        caractéristiques de classe et des actions légendaires de cette forme.
