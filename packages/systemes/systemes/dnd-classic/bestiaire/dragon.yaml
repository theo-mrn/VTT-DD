# Bestiaire de référence — Dragon (43).
# Repris de l'ancienne app (legacy/public/tabs/bestiairy.json) : valeurs imprimées, pas un
# état calculable ; catégories, tailles et alignements traduits (voir docs/ressources.md).

- id: ancient-white-dragon
  nom: Ancien dragon blanc
  entite: personnage
  categorie: Dragon
  type: Dragon (gigantesque)
  description: 'Alignement : chaotique mauvais.'
  image: https://assets.yner.fr/bestaire/ancient-white-dragon.png
  valeurs:
    niveau: 20
    PV_Max: 333
    Defense: 20
    INIT: 0
    Contact: 14
    Distance: 14
    Magie: 0
    FOR: 26
    DEX: 10
    CON: 26
    INT: 10
    SAG: 13
    CHA: 14
  actions:
    - nom: Multi-attaques
      description:
        'Le dragon peut utiliser sa Présence Effrayante. Il effectue ensuite trois attaques :
        une avec sa morsure et deux avec ses griffes.'
    - nom: Morsure
      description:
        "Attaque d'arme de mêlée : +14 pour toucher, portée de 15 pieds, une cible. Touché : 19
        (2d10 + 8) points de dégâts perforants plus 9 (2d8) points de dégâts de froid."
      toucher: 14
    - nom: Griffe
      description:
        "Attaque d'arme de mêlée : +14 pour toucher, portée de 10 pieds, une cible. Touché : 15
        (2d6 + 8) points de dégâts tranchants."
      toucher: 14
    - nom: Queue
      description:
        "Attaque d'arme de mêlée : +14 pour toucher, portée de 20 pieds, une cible. Touché : 17
        (2d8 + 8) points de dégâts de matraquage."
      toucher: 14
    - nom: Présence effrayante
      description:
        Chaque créature au choix du dragon qui se trouve dans un rayon de 120 pieds du dragon
        et qui en est consciente doit réussir un jet de sauvegarde de Sagesse DC 16 ou être effrayée
        pendant 1 minute. Une créature peut répéter le jet de sauvegarde à la fin de chacun de ses
        tours, mettant fin à l'effet sur elle-même en cas de succès. Si une créature réussit son jet
        de sauvegarde ou si l'effet prend fin pour elle, elle est immunisée contre la Présence
        effrayante du dragon pour les 24 heures suivantes.
    - nom: Souffle froid
      description:
        Le dragon exhale un souffle glacé dans un cône de 90 pieds. Chaque créature dans cette
        zone doit faire un jet de sauvegarde de Constitution DC 22, subissant 72 (l6d8) points de
        dégâts de froid en cas de sauvegarde ratée, ou la moitié en cas de sauvegarde réussie.
