        (2d10 + 10) points de dégâts perforants."
      toucher: 17
    - nom: Griffe
      description:
        "Attaque d'arme de mêlée : +17 pour toucher, portée de 10 pieds, une cible. Touché : 17
        (2d6 + 10) points de dégâts tranchants."
      toucher: 17
    - nom: Queue
      description:
        "Attaque d'arme de mêlée : +17 pour toucher, portée de 20 pieds, une cible. Touché : 19
        (2d8 + 10) points de dégâts de matraquage."
      toucher: 17
    - nom: Présence effrayante
      description:
        Chaque créature au choix du dragon qui se trouve dans un rayon de 120 pieds du dragon
        et qui en est consciente doit réussir un jet de sauvegarde de Sagesse DC 21 ou être effrayée
        pendant 1 minute. Une créature peut répéter le jet de sauvegarde à la fin de chacun de ses
        tours, mettant fin à l'effet sur elle-même en cas de succès. Si une créature réussit son jet
        de sauvegarde ou si l'effet prend fin pour elle, elle est immunisée contre la Présence
        effrayante du dragon pour les 24 heures suivantes.
    - nom: Armes à souffle
      description: >-
        Le dragon utilise l'une des armes respiratoires suivantes.

        Souffle froid. Le dragon exhale un souffle glacé dans un cône de 90 pieds. Chaque créature
        dans cette zone doit faire un jet de sauvegarde de Constitution DC 24, subissant 67 (15d8)
        points de dégâts de froid en cas de sauvegarde ratée, ou la moitié en cas de sauvegarde
        réussie.

        Souffle paralysant. Le dragon exhale un gaz paralysant dans un cône de 90 pieds. Chaque
        créature dans cette zone doit réussir un jet de sauvegarde de Constitution DC 24 ou être
        paralysée pendant 1 minute. Une créature peut répéter le jet de sauvegarde à la fin de
        chacun de ses tours, mettant fin à l'effet sur elle-même en cas de réussite.
    - nom: Changer de forme
      description: >-
        Le dragon se transforme magiquement en un humanoïde ou une bête dont la valeur de défi n'est
        pas supérieure à la sienne, ou reprend sa véritable forme. Il reprend sa forme réelle s'il
        meurt. Tout équipement qu'il porte est absorbé ou porté par sa nouvelle forme (au choix du
        dragon).

        Sous une nouvelle forme, le dragon conserve son alignement, ses points de vie, ses dés de
        réussite, sa capacité à parler, ses compétences, sa résistance légendaire, ses actions de
        repaire et ses scores d'Intelligence, de Sagesse et de Charisme, ainsi que cette action. Ses
        statistiques et capacités sont remplacées par celles de sa nouvelle forme, à l'exception des
        caractéristiques de classe et des actions légendaires de cette forme.
