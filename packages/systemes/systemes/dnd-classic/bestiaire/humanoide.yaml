      toucher: 2
    - nom: Leadership
      description: Pendant 1 minute, le chevalier peut prononcer un commandement spécial ou un
        avertissement chaque fois qu'une créature non hostile qu'il peut voir dans un rayon de 30
        pieds fait un jet d'attaque ou un jet de sauvegarde. La créature peut ajouter un d4 à son
        jet à condition qu'elle puisse entendre et comprendre le chevalier. Une créature ne peut
        bénéficier que d'un seul dé de direction à la fois. Cet effet prend fin si le chevalier est
        frappé d'incapacité.
