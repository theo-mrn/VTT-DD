- id: duergar
  nom: Duergar
  entite: personnage
  categorie: Humanoïde
  type: Humanoïde (moyenne)
  description: 'Alignement : loyal mauvais.'
  image: https://www.dnd5eapi.co/api/images/monsters/duergar.png
  valeurs:
    niveau: 1
    PV_Max: 26
    Defense: 16
    INIT: 0
    Contact: 4
    Distance: 4
    Magie: 0
    FOR: 14
    DEX: 11
    CON: 14
    INT: 11
    SAG: 10
    CHA: 9
  actions:
    - nom: Agrandir
      description:
        Pendant 1 minute, le duergar augmente magiquement de taille, ainsi que tout ce qu'il
        porte ou transporte. Lorsqu'il est agrandi, le duergar est Grand, double ses dés de dégâts
        sur les attaques d'armes basées sur la Force (incluses dans les attaques), et effectue les
        tests de Force et les jets de sauvegarde de Force avec avantage. Si le duergar manque de
        place pour devenir Grand, il atteint la taille maximale possible dans l'espace disponible.
    - nom: Choix de la guerre
      description:
        "Attaque d'arme de mêlée : +4 pour toucher, portée de 5 pieds, une cible. Touché : 6
        (1d8 + 2) points de dégâts perforants, ou 11 (2d8 + 2) points de dégâts perforants en cas
        d'agrandissement."
      toucher: 4
    - nom: Javelot
      description: "Attaque en mêlée ou à distance : +4 pour toucher, portée de 5 pieds ou de 30/120
        pieds, une cible. Touché : 5 (1d6 + 2) points de dégâts perforants, ou 9 (2d6 + 2) points de
        dégâts perforants lorsque l'arme est agrandie."
      toucher: 4
    - nom: Invisibilité
      description:
        Le duergar devient magiquement invisible jusqu'à ce qu'il attaque, lance un sort ou
        utilise son Agrandissement, ou jusqu'à ce que sa concentration soit rompue, jusqu'à 1 heure
        (comme s'il se concentrait sur un sort). Tout équipement que le duergar porte ou transporte
        est invisible avec lui.
