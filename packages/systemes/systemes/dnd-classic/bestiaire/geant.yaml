- id: oni
  nom: Oni
  entite: personnage
  categorie: Géant
  type: Géant (grande)
  description: 'Alignement : loyal mauvais.'
  image: https://assets.yner.fr/bestaire/oni.png
  valeurs:
    niveau: 7
    PV_Max: 110
    Defense: 16
    INIT: 0
    Contact: 7
    Distance: 7
    Magie: 0
    FOR: 19
    DEX: 11
    CON: 16
    INT: 14
    SAG: 12
    CHA: 15
  actions:
    - nom: Multi-attaques
      description: L'oni effectue deux attaques, soit avec ses griffes, soit avec son glaive.
    - nom: Griffe (Forme Oni uniquement)
      description:
        "Attaque d'arme de mêlée : +7 pour toucher, portée de 5 pieds, une cible. Touché : 8
        (1d8 + 4) points de dégâts tranchants."
      toucher: 7
    - nom: Glaive
      description:
        "Attaque d'arme de mêlée : +7 pour toucher, portée de 10 pieds, une cible. Touché : 15
        (2d10 + 4) points de dégâts tranchants, ou 9 (1d10 + 4) points de dégâts tranchants en forme
        petite ou moyenne."
      toucher: 7
    - nom: Changer de forme
      description:
        L'oni se transforme magiquement en un humanoïde de petite ou moyenne taille, en un
        grand géant ou reprend sa véritable forme. Hormis sa taille, ses statistiques sont les mêmes
        sous chaque forme. Le seul équipement transformé est son glaive, qui rétrécit pour pouvoir
        être manié sous forme humanoïde. Si l'oni meurt, il reprend sa forme réelle et son glaive
        reprend sa taille normale.
