      description:
        Le géant lance un éclair magique sur un point qu'il peut voir dans un rayon de 500
        pieds. Chaque créature située à moins de 10 pieds de ce point doit effectuer un jet de
        sauvegarde de Dextérité DC 17, subissant 54 (12d8) points de dégâts de foudre en cas de
        sauvegarde ratée, ou la moitié en cas de sauvegarde réussie.
