# Star Wars — Aux confins de l'Empire (Edge of the Empire).
# Porté depuis legacy/starwars-bundle/table.json (le bundle fait foi), legacy/talents-arbres.json
# et les règles de progression codées en dur de legacy/src/lib/rules-engine/ :
# tout est ici en données (coûts, plafonds, pools de dés, combat, initiative, tables).
format: 1
id: star-wars-eote
version: 1.0.0
nom: Star Wars — Aux confins de l'Empire
description: >-
  Système narratif à dés à symboles : les jets combinent des dés de Fortune, Infortune, Aptitude,
  Difficulté, Maîtrise, Défi et Force ; Succès et Échecs, Avantages et Menaces s'annulent. Espèces,
  carrières, spécialisations et arbres de talents, progression à l'expérience, Obligation.

entites:
  - id: personnage
    nom: Personnage
    groupes:
      - { id: caracteristiques, nom: Caractéristiques }
      - { id: seuils, nom: Seuils }
      - { id: defense, nom: Encaissement et Défense }
      - { id: combat, nom: Bonus de combat }
      - { id: equipement, nom: Équipement }
      - { id: progression, nom: Expérience et Obligation }
      - { id: profil, nom: Profil }
    attributs:
      # ─── Caractéristiques ───────────────────────────────────────────────
      # Valeur enregistrée = points achetés à l'XP ; l'espèce ajoute sa valeur de départ.
      - {
          cle: vigueur,
          nom: Vigueur,
          abrege: VIG,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: caracteristiques,
        }
      - {
          cle: agilite,
          nom: Agilité,
          abrege: AGI,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: caracteristiques,
        }
      - {
          cle: intellect,
          nom: Intellect,
          abrege: INT,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: caracteristiques,
        }
      - {
          cle: ruse,
          nom: Ruse,
          abrege: RUS,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: caracteristiques,
        }
      - {
          cle: volonte,
          nom: Volonté,
          abrege: VOL,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: caracteristiques,
        }
      - {
          cle: presence,
          nom: Présence,
          abrege: PRE,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: caracteristiques,
        }

      # ─── Seuils ─────────────────────────────────────────────────────────
      - {
          cle: baseSeuilBlessure,
          nom: Base du seuil de blessure (espèce),
          nature: base,
          defaut: 10,
          groupe: seuils,
          visibilite: mj,
        }
      - {
          cle: baseSeuilStress,
          nom: Base du seuil de stress (espèce),
          nature: base,
          defaut: 10,
          groupe: seuils,
          visibilite: mj,
        }
      - {
          cle: seuilBlessure,
          nom: Seuil de blessure,
          nature: derivee,
          formule: '@baseSeuilBlessure + @vigueur',
          groupe: seuils,
        }
      - {
          cle: seuilStress,
          nom: Seuil de stress,
          nature: derivee,
          formule: '@baseSeuilStress + @volonte',
          groupe: seuils,
        }
      # Non plafonnées : le personnage n'est neutralisé que lorsqu'elles DÉPASSENT le seuil.
      - cle: blessures
        nom: Blessures
        description: Compteur qui monte depuis 0 ; au-delà du seuil, le personnage est neutralisé.
        nature: ressource
        max: '@seuilBlessure'
        plafonnee: false
        initiale: min
        recuperation: min
        groupe: seuils
      - cle: stress
        nom: Stress
        description: Compteur qui monte depuis 0 ; au-delà du seuil, le personnage est neutralisé.
        nature: ressource
        max: '@seuilStress'
        plafonnee: false
        initiale: min
        recuperation: min
        groupe: seuils
      - cle: neutralise
        nom: Neutralisé
        description: Blessures ou stress au-delà de leur seuil (texte « Incapacitation »).
        nature: derivee
        type: booleen
        formule: '@blessures > @seuilBlessure ou @stress > @seuilStress'
        groupe: seuils
      - cle: critiquesSubis
        nom: Blessures critiques subies
        description: >-
          Chaque blessure critique subie ajoute +10 au prochain jet sur la table. Une blessure critique
          se possède par rangs : un rang par fois où elle a été subie.
        nature: derivee
        formule: somme_rangs("blessureCritique")
        groupe: seuils
      - cle: resistanceCritique
        nom: Réduction des blessures critiques subies
        description: Retranchée aux jets de blessure critique subis (talent Résistant).
        nature: derivee
        formule: '0'
        groupe: seuils
        visibilite: mj
      - cle: reductionStress
        nom: Réduction du stress subi
        description: Retranchée au stress subi involontairement, minimum 1 (talent Résolution).
        nature: derivee
        formule: '0'
        groupe: seuils
        visibilite: mj
      - cle: stimpacksDuJour
        nom: Stimpacks reçus aujourd'hui
        description: Chaque stimpack de la journée soigne 1 blessure de moins ; remis à 0 par le repos.
        nature: ressource
        max: '5'
        initiale: min
        recuperation: min
        groupe: seuils

      # ─── Encaissement et Défense ────────────────────────────────────────
      - {
          cle: encaissementArmure,
          nom: Encaissement de l'armure portée,
          nature: derivee,
          formule: '0',
          groupe: defense,
          visibilite: mj,
        }
      - {
          cle: encaissement,
          nom: Encaissement,
          abrege: ENC,
          nature: derivee,
          formule: '@vigueur + @encaissementArmure',
          groupe: defense,
        }
      - {
          cle: defenseMelee,
          nom: Défense au corps à corps,
          nature: derivee,
          formule: '0',
          groupe: defense,
        }
      - {
          cle: defenseDistance,
          nom: Défense à distance,
          nature: derivee,
          formule: '0',
          groupe: defense,
        }
      - cle: couvert
        nom: Couvert
        description: Dés de Difficulté ajoutés aux attaques à distance qui visent le personnage.
        nature: derivee
        formule: '0'
        groupe: defense
      - cle: vulnerabiliteMelee
        nom: Vulnérabilité au corps à corps
        description: Dés de Fortune ajoutés aux attaques de mêlée qui visent le personnage (à terre).
        nature: derivee
        formule: '0'
        groupe: defense
        visibilite: mj
      # Défense active : stress dépensé par une manœuvre, remis à 0 quand elle prend fin
      - cle: pasDeCote
        nom: Pas de côté
        description: >-
          Stress dépensé par la manœuvre Pas de côté : autant d'améliorations de la difficulté des
          attaques à distance reçues jusqu'au round suivant (action « Défense active », 0 pour finir).
        nature: base
        defaut: 0
        min: 0
        groupe: defense
      - cle: postureDefensive
        nom: Posture défensive
        description: >-
          Stress dépensé par la manœuvre Posture défensive : autant d'améliorations de la difficulté
          des attaques de mêlée reçues jusqu'au round suivant (action « Défense active », 0 pour finir).
        nature: base
        defaut: 0
        min: 0
        groupe: defense
      - cle: protection
        nom: Protégé
        description: >-
          Stress dépensé par un allié Protecteur qui garde le personnage : autant d'améliorations de
          la difficulté des attaques reçues jusqu'à son prochain tour (action « Protecteur », 0 pour finir).
        nature: base
        defaut: 0
        min: 0
        groupe: defense

      # ─── Bonus de combat (talents, espèces) ─────────────────────────────
      - cle: bonusDegatsMelee
        nom: Dégâts supplémentaires en Corps à corps et Mêlée
        description: Force sauvage, Rage wookiee.
        nature: derivee
        formule: '0'
        groupe: combat
      - cle: bonusCritique
        nom: Bonus aux blessures critiques infligées
        description: Coups mortels (+10 par rang).
        nature: derivee
        formule: '0'
        groupe: combat

      # ─── Équipement ─────────────────────────────────────────────────────
      - {
          cle: seuilEncombrement,
          nom: Seuil d'encombrement,
          nature: derivee,
          formule: '5 + @vigueur',
          groupe: equipement,
        }
      - cle: encombrement
        nom: Encombrement porté
        description: >-
          Armes et armures équipées (actives), plus tous les objets. Une armure portée compte 3 points
          d'encombrement de moins.
        nature: derivee
        formule: >-
          somme_actifs("arme", "encombrement") + somme("objet", "encombrement")
          + max(0, somme_actifs("armure", "encombrement") - 3 * compte_actifs("armure"))
        groupe: equipement
      - cle: excedentEncombrement
        nom: Excédent d'encombrement
        description: 1 dé d'Infortune par point d'excédent aux tests d'Agilité et de Vigueur.
        nature: derivee
        formule: max(0, @encombrement - @seuilEncombrement)
        groupe: equipement
      - cle: surcharge
        nom: Surchargé
        nature: derivee
        type: booleen
        formule: '@excedentEncombrement > 0'
        groupe: equipement
      - { cle: credits, nom: Crédits, nature: base, defaut: 500, min: 0, groupe: equipement }

      # ─── Expérience et Obligation ───────────────────────────────────────
      - { cle: xpDepart, nom: XP de départ, nature: base, defaut: 110, groupe: progression }
      - {
          cle: xpGagne,
          nom: XP gagnée en jeu,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: progression,
        }
      - cle: obligation
        nom: Obligation
        description: Total des Obligations du personnage (le MJ compare 1d100 au total du groupe).
        nature: derivee
        formule: somme("obligation", "valeur")
        groupe: progression
      - cle: bonusChoixCarriere
        nom: Rangs gratuits de carrière supplémentaires
        description: 'Compétences de carrière supplémentaires à la création (Droïde : +2).'
        nature: derivee
        formule: '0'
        groupe: progression
        visibilite: mj
      - cle: bonusChoixSpecialisation
        nom: Rangs gratuits de spécialisation supplémentaires
        description: 'Compétences de spécialisation supplémentaires à la création (Droïde : +1).'
        nature: derivee
        formule: '0'
        groupe: progression
        visibilite: mj

      # ─── Profil ─────────────────────────────────────────────────────────
      - { cle: nom, nom: Nom, nature: texte, groupe: profil }
      - cle: categorie
        nom: Catégorie
        nature: choix
        options:
          - { valeur: pj, nom: Personnage joueur }
          - { valeur: sbire, nom: Sbire }
          - { valeur: rival, nom: Rival }
          - { valeur: nemesis, nom: Némésis }
        defaut: pj
        groupe: profil
      - cle: inorganique
        nom: Inorganique
        description: Droïde - ni Médecine ni stimpack, se répare avec Mécanique.
        nature: derivee
        type: booleen
        formule: faux
        groupe: profil
      - { cle: motivation, nom: Motivation, nature: texte, groupe: profil }
      - { cle: historique, nom: Historique, nature: texte, multiligne: true, groupe: profil }

  - id: vehicule
    nom: Véhicule
    description: Speeder, chasseur, cargo ou vaisseau capital.
    groupes:
      - { id: caracteristiques, nom: Caractéristiques }
      - { id: defense, nom: Défense et Blindage }
      - { id: structure, nom: Coque et Tension }
      - { id: capacite, nom: Équipage et capacité }
    attributs:
      - { cle: nom, nom: Nom, nature: texte }
      - {
          cle: silhouette,
          nom: Silhouette,
          nature: base,
          defaut: 3,
          min: 0,
          groupe: caracteristiques,
        }
      - { cle: vitesse, nom: Vitesse, nature: base, defaut: 3, min: 0, groupe: caracteristiques }
      - { cle: maniabilite, nom: Maniabilité, nature: base, defaut: 0, groupe: caracteristiques }
      - { cle: defenseAvant, nom: Défense avant, nature: base, defaut: 0, min: 0, groupe: defense }
      - {
          cle: defenseBabord,
          nom: Défense bâbord,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: defense,
        }
      - {
          cle: defenseTribord,
          nom: Défense tribord,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: defense,
        }
      - {
          cle: defenseArriere,
          nom: Défense arrière,
          nature: base,
          defaut: 0,
          min: 0,
          groupe: defense,
        }
      - { cle: blindage, nom: Blindage, nature: base, defaut: 3, min: 0, groupe: defense }
      - {
          cle: seuilCoque,
          nom: Seuil de coque,
          nature: base,
          defaut: 20,
          min: 0,
          groupe: structure,
        }
      - {
          cle: coque,
          nom: Dégâts de coque,
          nature: ressource,
          max: '@seuilCoque',
          initiale: min,
          recuperation: min,
          groupe: structure,
        }
      - {
          cle: seuilTension,
          nom: Seuil de tension,
          nature: base,
          defaut: 15,
          min: 0,
          groupe: structure,
        }
      - {
          cle: tension,
          nom: Tension système,
          nature: ressource,
          max: '@seuilTension',
          initiale: min,
          recuperation: min,
          groupe: structure,
        }
      - {
          cle: critiquesSubis,
          nom: Dommages critiques subis,
          nature: derivee,
          formule: somme_rangs("panneCritique"),
          groupe: structure,
        }
      - { cle: equipage, nom: Équipage, nature: base, defaut: 1, min: 0, groupe: capacite }
      - { cle: passagers, nom: Passagers, nature: base, defaut: 0, min: 0, groupe: capacite }
      - {
          cle: cargaison,
          nom: Cargaison (encombrement),
          nature: base,
          defaut: 0,
          min: 0,
          groupe: capacite,
        }
      - { cle: prix, nom: Prix (crédits), nature: base, defaut: 0, min: 0, groupe: capacite }

sortes:
  - id: espece
    nom: Espèce
    nomPluriel: Espèces
    pour: [personnage]
    maximum: 1
  - id: capacite
    nom: Capacité d'espèce
    nomPluriel: Capacités d'espèce
    description: Variante choisie à la prise d'une espèce (sous-espèce…).
    pour: [personnage]
  - id: carriere
    nom: Carrière
    nomPluriel: Carrières
    pour: [personnage]
    maximum: 1
  - id: specialisation
    nom: Spécialisation
    nomPluriel: Spécialisations
    pour: [personnage]
    champs:
      - { id: carriere, nom: Carrière d'origine, type: entree, sorte: carriere }
  - id: competence
    nom: Compétence
    nomPluriel: Compétences
    pour: [personnage]
    rangs: { max: 5 }
    champs:
      - { id: caracteristique, nom: Caractéristique liée, type: attribut, entite: personnage }
  - id: talent
    nom: Talent
    nomPluriel: Talents
    description: >-
      Obtenu par les nœuds des arbres de spécialisation ; chaque nœud donne un rang. Un talent
      étiqueté « test » se lance avec l'action « Test de talent » (compétence, caractéristique et
      difficulté lues sur le talent).
    pour: [personnage]
    rangs: { max: 10 }
    champs:
      - { id: competence, nom: Compétence testée, type: entree, sorte: competence }
      - { id: caracteristique, nom: Caractéristique testée, type: attribut, entite: personnage }
      - { id: difficulte, nom: Dés de Difficulté, type: formule, defaut: '2' }
  - id: obligation
    nom: Obligation
    nomPluriel: Obligations
    description: Dette ou engagement qui ancre le personnage dans la galaxie (valeur propre à chaque personnage).
    pour: [personnage]
    champs:
      - { id: valeur, nom: Valeur, type: nombre, defaut: 10 }
      - { id: detail, nom: Détail, type: texte, defaut: '' }
      - {
          id: supplement,
          nom: Obligation supplémentaire prise à la création (autant d'XP de départ),
          type: nombre,
          defaut: 0,
        }
  - id: blessureCritique
    nom: Blessure critique
    nomPluriel: Blessures critiques
    description: Un rang par fois où la blessure a été subie.
    pour: [personnage]
    rangs: { max: 10 }
  - id: etat
    nom: État
    nomPluriel: États
    description: Situation temporaire (désorienté, à terre, à couvert…) ; active tant qu'elle dure.
    pour: [personnage]
    activable: true
  - id: arme
    nom: Arme
    nomPluriel: Armes
    pour: [personnage]
    activable: true
    champs:
      - { id: competence, nom: Compétence, type: entree, sorte: competence }
      - { id: degats, nom: Dégâts, type: formule, defaut: '0' }
      - { id: critique, nom: Indice critique, type: nombre, defaut: 4 }
      - { id: portee, nom: Portée, type: texte, defaut: Courte }
      - { id: melee, nom: Arme de corps à corps, type: booleen, defaut: false }
      - { id: precis, nom: Précis (dés de Fortune), type: nombre, defaut: 0 }
      - { id: inexact, nom: Inexact (dés d'Infortune), type: nombre, defaut: 0 }
      - { id: perforant, nom: Perforant (Encaissement ignoré), type: nombre, defaut: 0 }
      - { id: vicieux, nom: Vicieux (+10 par point aux critiques), type: nombre, defaut: 0 }
      - { id: etourdissant, nom: Dégâts étourdissants (en stress), type: booleen, defaut: false }
      - { id: qualites, nom: Qualités, type: entrees, sorte: qualite }
      - { id: detailQualites, nom: Qualités et valeurs, type: texte }
      - { id: encombrement, nom: Encombrement, type: nombre, defaut: 0 }
      - { id: prix, nom: Prix (crédits), type: nombre, defaut: 0 }
      - { id: rarete, nom: Rareté, type: nombre, defaut: 0 }
      - { id: pointsFixation, nom: Points de fixation, type: nombre, defaut: 0 }
      - {
          id: toujoursDisponible,
          nom: Toujours utilisable sans être possédée (mains nues),
          type: booleen,
          defaut: false,
        }
  - id: qualite
    nom: Qualité d'arme
    nomPluriel: Qualités d'arme
    description: Mot-clé de référence ; sa valeur mécanique est portée par l'arme.
    pour: [personnage]
  - id: armure
    nom: Armure
    nomPluriel: Armures
    pour: [personnage]
    activable: true
    champs:
      - { id: defense, nom: Défense, type: nombre, defaut: 0 }
      - { id: encaissement, nom: Encaissement, type: nombre, defaut: 0 }
      - { id: encombrement, nom: Encombrement, type: nombre, defaut: 0 }
      - { id: prix, nom: Prix (crédits), type: nombre, defaut: 0 }
      - { id: rarete, nom: Rareté, type: nombre, defaut: 0 }
  - id: objet
    nom: Objet
    nomPluriel: Équipement
    pour: [personnage]
    champs:
      - { id: encombrement, nom: Encombrement, type: nombre, defaut: 0 }
      - { id: prix, nom: Prix (crédits), type: nombre, defaut: 0 }
      - { id: rarete, nom: Rareté, type: nombre, defaut: 0 }
  - id: accessoire
    nom: Accessoire
    nomPluriel: Accessoires
    description: Modification installée sur une arme ou une armure, qui occupe des points de fixation.
    pour: [personnage]
    champs:
      - { id: pourType, nom: S'installe sur, type: texte }
      - { id: pointsFixation, nom: Points de fixation, type: nombre, defaut: 1 }
      - { id: prix, nom: Prix (crédits), type: nombre, defaut: 0 }
      - { id: rarete, nom: Rareté, type: nombre, defaut: 0 }
  - id: devise
    nom: Devise
    nomPluriel: Devises
    pour: [personnage]
    champs:
      - { id: valeurCredits, nom: Valeur en crédits, type: nombre, defaut: 1 }
      - { id: rarete, nom: Rareté, type: nombre, defaut: 0 }
  - id: portee
    nom: Bande de portée
    nomPluriel: Bandes de portée
    description: Choisie au moment d'une attaque ; fixe la difficulté des tirs.
    pour: [personnage]
    champs:
      - { id: ordre, nom: Rang de la bande (0 = engagé), type: nombre, defaut: 0 }
      - { id: difficulte, nom: Dés de Difficulté d'un tir, type: nombre, defaut: 2 }
  - id: circonstance
    nom: Circonstance
    nomPluriel: Circonstances
    description: >-
      Situation particulière d'un test (pister, forcer une serrure, résister à la peur…), option
      facultative des actions « Test de compétence » et « Test contre un personnage » : certains
      talents et espèces en dépendent.
    pour: [personnage]
  - id: modele
    nom: Modèle de véhicule
    nomPluriel: Modèles de véhicule
    pour: [vehicule]
    maximum: 1
  - id: panneCritique
    nom: Dommage critique de véhicule
    nomPluriel: Dommages critiques de véhicule
    description: Un rang par fois où le dommage a été subi.
    pour: [vehicule]
    rangs: { max: 10 }

# ─── Progression ───────────────────────────────────────────────────────────

monnaies:
  # L'Obligation supplémentaire prise à la création rapporte autant d'XP (+5 ou +10).
  - {
      id: xp,
      nom: Expérience,
      total: '@xpDepart + @xpGagne + somme("obligation", "supplement")',
      pour: [personnage],
    }

achats:
  - id: caracteristique
    nom: Caractéristique
    description: 10 × la nouvelle valeur (espèce comprise), jusqu'à 5, à la création seulement.
    obtient: { type: attribut, entite: personnage, groupe: caracteristiques }
    monnaie: xp
    cout: 10 * (calcule + 1)
    condition: calcule < 5
    moment: creation
  - id: rang-competence
    nom: Rang de compétence
    description: 5 × le rang visé, +5 hors carrière ; rang 2 au plus à la création.
    obtient: { type: rang, sorte: competence }
    monnaie: xp
    cout: 5 * cible + si(marque("carriere"), 0, 5)
    plafond: si(creation, 2, 5)
  - id: specialisation
    nom: Spécialisation
    description: 10 × le nombre de spécialisations après achat, +10 hors de la carrière d'origine.
    obtient: { type: entree, sorte: specialisation }
    monnaie: xp
    cout: 10 * (nombre + 1) + si(marque("carriere"), 0, 10)
  - id: talent
    nom: Talent
    description: Le coût est celui du nœud (5 XP par ligne de l'arbre).
    obtient: { type: noeud }
    monnaie: xp
    cout: '0'

creation:
  - entite: personnage
    etapes:
      - { id: espece, nom: Espèce, type: choisir, sorte: espece }
      - {
          id: carriere,
          nom: Carrière,
          description: Choisir aussi 4 compétences de carrière qui reçoivent un rang gratuit (6 pour un droïde).,
          type: choisir,
          sorte: carriere,
        }
      - {
          id: specialisation,
          nom: Spécialisation,
          description: Choisir aussi 2 de ses compétences qui reçoivent un rang gratuit (3 pour un droïde).,
          type: choisir,
          sorte: specialisation,
        }
      - {
          id: obligation,
          nom: Obligation,
          description: Obligations facultatives et leur valeur (10 par défaut) ; l'Obligation supplémentaire rapporte autant d'XP.,
          type: choisir,
          sorte: obligation,
          min: 0,
          max: 3,
        }
      - id: experience
        nom: Dépense de l'XP de départ
        type: acheter
        achats: [caracteristique, rang-competence, specialisation, talent]
      - {
          id: profil,
          nom: Profil,
          type: saisir,
          attributs: [nom, categorie, motivation, historique, credits],
        }
  - entite: vehicule
    etapes:
      - { id: modele, nom: Modèle, type: choisir, sorte: modele, min: 0, max: 1 }
      - {
          id: identite,
          nom: Identité,
          type: saisir,
          attributs: [nom, equipage, passagers, cargaison, prix],
        }

# ─── Dés à symboles ────────────────────────────────────────────────────────

des:
  symboles:
    - { id: succes, nom: Succès }
    - { id: echec, nom: Échec }
    - { id: avantage, nom: Avantage }
    - { id: menace, nom: Menace }
    - { id: triomphe, nom: Triomphe }
    - { id: desespoir, nom: Désespoir }
    - { id: lumiere, nom: Point du côté lumineux }
    - { id: obscur, nom: Point du côté obscur }
  sortes:
    - id: fortune
      nom: Fortune
      apparence: d6 bleu
      faces: [{}, {}, { succes: 1 }, { succes: 1, avantage: 1 }, { avantage: 2 }, { avantage: 1 }]
    - id: infortune
      nom: Infortune
      apparence: d6 noir
      faces: [{}, {}, { echec: 1 }, { echec: 1 }, { menace: 1 }, { menace: 1 }]
    - id: aptitude
      nom: Aptitude
      apparence: d8 vert
      faces:
        [
          {},
          { succes: 1 },
          { succes: 1 },
          { succes: 2 },
          { avantage: 1 },
          { avantage: 1 },
          { succes: 1, avantage: 1 },
          { avantage: 2 },
        ]
    - id: difficulte
      nom: Difficulté
      apparence: d8 violet
      faces:
        [
          {},
          { echec: 1 },
          { echec: 1 },
          { echec: 2 },
          { menace: 1 },
          { menace: 1 },
          { menace: 2 },
          { echec: 1, menace: 1 },
        ]
    - id: maitrise
      nom: Maîtrise
      apparence: d12 jaune
      faces:
        - {}
        - { succes: 1 }
        - { succes: 1 }
        - { succes: 2 }
        - { succes: 2 }
        - { avantage: 1 }
        - { succes: 1, avantage: 1 }
        - { succes: 1, avantage: 1 }
        - { succes: 1, avantage: 1 }
        - { avantage: 2 }
        - { avantage: 2 }
        - { triomphe: 1 }
    - id: defi
      nom: Défi
      apparence: d12 rouge
      faces:
        - {}
        - { echec: 1 }
        - { echec: 1 }
        - { echec: 2 }
        - { echec: 2 }
        - { menace: 1 }
        - { menace: 1 }
        - { echec: 1, menace: 1 }
        - { echec: 1, menace: 1 }
        - { menace: 2 }
        - { menace: 2 }
        - { desespoir: 1 }
    - id: force
      nom: Force
      apparence: d12 blanc
      faces:
        - { obscur: 1 }
        - { obscur: 1 }
        - { obscur: 1 }
        - { obscur: 1 }
        - { obscur: 1 }
        - { obscur: 1 }
        - { lumiere: 1 }
        - { lumiere: 1 }
        - { lumiere: 2 }
        - { lumiere: 2 }
        - { lumiere: 2 }
        - { lumiere: 2 }
  # Le Triomphe compte aussi comme un Succès, le Désespoir comme un Échec.
  resultats:
    - { cle: succesNets, nom: Succès, formule: 'max(0, succes + triomphe - echec - desespoir)' }
    - { cle: echecsNets, nom: Échecs, formule: 'max(0, echec + desespoir - succes - triomphe)' }
    - { cle: avantagesNets, nom: Avantages, formule: 'max(0, avantage - menace)' }
    - { cle: menacesNettes, nom: Menaces, formule: 'max(0, menace - avantage)' }
    - { cle: triomphes, nom: Triomphes, formule: triomphe }
    - { cle: desespoirs, nom: Désespoirs, formule: desespoir }
    - { cle: coteLumineux, nom: Côté lumineux, formule: lumiere }
    - { cle: coteObscur, nom: Côté obscur, formule: obscur }

# ─── Actions ───────────────────────────────────────────────────────────────
# Pool : max(caractéristique, rang) dés d'Aptitude, dont min(caractéristique, rang) améliorés en Maîtrise.
# Une compétence jamais apprise se teste au rang 0 (paramètre `possedee: false`).
# L'excédent d'encombrement ajoute 1 dé d'Infortune par point aux tests d'Agilité et de Vigueur.
# Les options des talents (paramètres `exige`) ne sont proposées qu'à qui possède le talent ; leur
# coût en stress passe par les conséquences, leur plafond (un point par rang) par les vérifications.

actions:
  - id: test
    nom: Test de compétence
    description: >-
      Test d'une compétence, éventuellement dans une circonstance particulière (pister, forcer une
      serrure, résister à la peur, dans l'obscurité…) dont dépendent certains talents et capacités
      d'espèce. Options de talents : Coup de génie, Concentration intense, Intimidant, Maîtres
      (2 stress : difficulté réduite de 1).
    pour: [personnage]
    parametres:
      - &competence {
          id: competence,
          nom: Compétence,
          type: entree,
          sorte: competence,
          possedee: false,
        }
      - &circonstance {
          id: circonstance,
          nom: Circonstance,
          type: entree,
          sorte: circonstance,
          possedee: false,
          facultatif: true,
        }
      - &difficulte { id: difficulte, nom: Dés de Difficulté, type: nombre, defaut: 2 }
      - &ameliorations {
          id: ameliorationsDifficulte,
          nom: Dés de Difficulté améliorés en Défi,
          type: nombre,
          defaut: 0,
        }
      - &fortune { id: desFortune, nom: Dés de Fortune, type: nombre, defaut: 0 }
      - &infortune { id: desInfortune, nom: Dés d'Infortune, type: nombre, defaut: 0 }
      - &coupDeGenie {
          id: coupDeGenie,
          nom: "Coup de génie : tester avec l'Intellect (une fois par séance)",
          type: booleen,
          exige: possede("coup-de-genie"),
        }
      - &concentration {
          id: concentrationIntense,
          nom: 'Concentration intense (1 stress) : une amélioration du test',
          type: booleen,
          exige: possede("concentration-intense"),
        }
      - &intimidant {
          id: intimidant,
          nom: "Intimidant : stress subi pour réduire d'autant la difficulté (Coercition)",
          type: nombre,
          exige: possede("intimidant"),
        }
      - &maitre
        id: maitre
        nom: 'Maître (2 stress) : difficulté réduite de 1'
        type: booleen
        exige: >-
          possede("maitre-medecin") ou possede("maitre-des-ombres") ou possede("maitre-pirate")
          ou possede("maitre-astronavigateur")
    variables: &variablesTest # Coup de génie : l'Intellect remplace la caractéristique liée
      - cle: carac
        formule: 'si(coupDeGenie, @intellect, valeur(competence.caracteristique))'
      - cle: penaliteCharge
        formule: >-
          si(non coupDeGenie et (competence.caracteristique == "agilite"
          ou competence.caracteristique == "vigueur"), @excedentEncombrement, 0)
      # Maître médecin (Médecine), des ombres (Discrétion, Magouilles), pirate (Informatique),
      # astronavigateur (Astrogation) ; les deux derniers pas en dessous de Facile (vérification).
      - cle: maitreApplicable
        formule: >-
          (competence == "medecine" et possede("maitre-medecin"))
          ou ((competence == "discretion" ou competence == "magouilles") et possede("maitre-des-ombres"))
          ou (competence == "informatique" et possede("maitre-pirate"))
          ou (competence == "astrogation" et possede("maitre-astronavigateur"))
      - { cle: difficulteFinale, formule: 'max(0, difficulte - intimidant - si(maitre, 1, 0))' }
      - cle: stressActeur
        formule: 'intimidant + si(maitre, 2, 0) + si(concentrationIntense, 1, 0)'
    verifications:
      - condition: intimidant >= 0 et intimidant <= rang("intimidant")
        message: 'Intimidant : au plus un point de stress par rang'
      - condition: intimidant == 0 ou competence == "coercition"
        message: Intimidant ne réduit que la difficulté des tests de Coercition
      - condition: non maitre ou maitreApplicable
        message: Aucun talent de Maître ne s'applique à cette compétence
      - condition: >-
          non maitre ou difficulte > 1
          ou non (competence == "informatique" ou competence == "astrogation")
        message: 'Maître pirate, Maître astronavigateur : la difficulté ne descend pas sous Facile'
    jet: &jetTest
      type: symboles
      pool:
        - { de: aptitude, nombre: 'max(carac, competence.rang)' }
        - { de: difficulte, nombre: difficulteFinale }
        - { de: fortune, nombre: desFortune }
        - { de: infortune, nombre: desInfortune + penaliteCharge }
      ameliorations:
        - {
            de: aptitude,
            vers: maitrise,
            nombre: 'min(carac, competence.rang) + si(concentrationIntense, 1, 0)',
          }
        - { de: difficulte, vers: defi, nombre: ameliorationsDifficulte }
      reussite: succesNets >= 1
    consequences:
      - &stressActeur {
          condition: stressActeur >= 1,
          entite: acteur,
          attribut: stress,
          operation: ajouter,
          valeur: stressActeur,
        }

  - id: test-cible
    nom: Test contre un personnage
    description: >-
      Test de compétence qui vise un personnage (le tromper, l'intimider, l'identifier, pirater le
      système qu'il défend…) : ses talents défensifs s'appliquent (Pas né d'hier, Anonyme, Piratage
      défensif) et il peut subir du stress pour améliorer la difficulté d'une Coercition (Intimidant).
    pour: [personnage]
    cible: personnage
    parametres:
      - *competence
      - *circonstance
      - *difficulte
      - *ameliorations
      - *fortune
      - *infortune
      - *coupDeGenie
      - *concentration
      - *intimidant
      - *maitre
      - {
          id: intimidantCible,
          nom: "Intimidant de la cible : stress qu'elle subit pour améliorer la difficulté",
          type: nombre,
          defaut: 0,
        }
    variables: *variablesTest
    verifications:
      - condition: intimidant >= 0 et intimidant <= rang("intimidant")
        message: 'Intimidant : au plus un point de stress par rang'
      - condition: intimidant == 0 ou competence == "coercition"
        message: Intimidant ne réduit que la difficulté des tests de Coercition
      - condition: non maitre ou maitreApplicable
        message: Aucun talent de Maître ne s'applique à cette compétence
      - condition: >-
          non maitre ou difficulte > 1
          ou non (competence == "informatique" ou competence == "astrogation")
        message: 'Maître pirate, Maître astronavigateur : la difficulté ne descend pas sous Facile'
      - condition: intimidantCible >= 0 et intimidantCible <= cible_rang("intimidant")
        message: "Intimidant de la cible : au plus un point de stress par rang d'Intimidant"
      - condition: intimidantCible == 0 ou competence == "coercition"
        message: "L'Intimidant de la cible ne s'oppose qu'aux tests de Coercition"
    jet:
      type: symboles
      pool:
        - { de: aptitude, nombre: 'max(carac, competence.rang)' }
        - { de: difficulte, nombre: difficulteFinale }
        - { de: fortune, nombre: desFortune }
        - { de: infortune, nombre: desInfortune + penaliteCharge }
      ameliorations:
        - {
            de: aptitude,
            vers: maitrise,
            nombre: 'min(carac, competence.rang) + si(concentrationIntense, 1, 0)',
          }
        - { de: difficulte, vers: defi, nombre: ameliorationsDifficulte + intimidantCible }
      reussite: succesNets >= 1
    consequences:
      - *stressActeur
      - {
          condition: intimidantCible >= 1,
          entite: cible,
          attribut: stress,
          operation: ajouter,
          valeur: intimidantCible,
        }

  - id: attaque
    nom: Attaque
    description: >-
      Test de la compétence de l'arme ; la difficulté dépend de la bande de portée (Moyenne en mêlée),
      la Défense de la cible ajoute des dés d'Infortune, son couvert des dés de Difficulté. Touche avec
      au moins 1 Succès net ; dégâts = dégâts de l'arme + Succès nets − Encaissement (moins
      Perforant). Blessure critique si des dégâts passent et que les Avantages atteignent l'indice
      critique, ou sur un Triomphe ; chaque activation au-delà de la première ajoute +10 au jet.
      Options : manœuvres Viser, Esquive de la cible, et les talents de combat de l'attaquant.
    pour: [personnage]
    cible: personnage
    parametres:
      - { id: arme, nom: Arme, type: entree, sorte: arme, possedee: false }
      - { id: portee, nom: Portée, type: entree, sorte: portee, possedee: false }
      - {
          id: difficulteSupplementaire,
          nom: Dés de Difficulté supplémentaires,
          type: nombre,
          defaut: 0,
        }
      - *ameliorations
      - *fortune
      - *infortune
      - { id: visee, nom: 'Manœuvres Viser (0 à 2) : 1 dé de Fortune chacune', type: nombre }
      - {
          id: esquive,
          nom: "Esquive de la cible : stress qu'elle subit pour améliorer la difficulté",
          type: nombre,
        }
      - {
          id: frappeRapide,
          nom: "Frappe rapide : la cible n'a pas encore agi",
          type: booleen,
          exige: possede("frappe-rapide"),
        }
      - {
          id: viseePrecise,
          nom: "Visée précise : stress subi pour réduire d'autant la Défense de la cible",
          type: nombre,
          exige: possede("visee-precise"),
        }
      - {
          id: viseeParfaite,
          nom: 'Visée parfaite : avantages de la visée et une amélioration par rang',
          type: booleen,
          exige: possede("visee-parfaite"),
        }
      - {
          id: attaqueFrenetique,
          nom: "Attaque frénétique : stress subi pour améliorer d'autant l'attaque (contact)",
          type: nombre,
          exige: possede("attaque-frenetique"),
        }
      - *concentration
      - {
          id: tirDePrecision,
          nom: "Tir de précision : bandes de portée ajoutées (difficulté améliorée d'autant)",
          type: nombre,
          exige: possede("tir-de-precision"),
        }
      - {
          id: coupHandicapant,
          nom: 'Coup handicapant : +1 dé de Difficulté',
          type: booleen,
          exige: possede("coup-handicapant"),
        }
      - {
          id: coupEtourdissant,
          nom: 'Coup étourdissant : dégâts infligés en stress (Mêlée)',
          type: booleen,
          exige: possede("coup-etourdissant"),
        }
      - {
          id: pointDePression,
          nom: 'Point de pression : stress au lieu des dégâts (Corps à corps)',
          type: booleen,
          exige: possede("point-de-pression"),
        }
      # Coup ciblé, Leçons d'anatomie, Point faible : 1 point de Destin (hors fiche)
      - {
          id: degatsDestin,
          nom: 'Point de Destin : dégâts égaux à une caractéristique',
          type: entree,
          sorte: talent,
          etiquette: degats-destin,
          facultatif: true,
        }
    variables:
      # Arme possédée, ou utilisable par tous (mains nues)
      - { cle: armeDisponible, formule: possede(arme) ou arme.toujoursDisponible }
      # Caractéristique des compétences de combat : Vigueur au contact, Agilité sinon
      - cle: caracArme
        formule: 'si(arme.competence == "melee" ou arme.competence == "corps-a-corps", "vigueur", "agilite")'
      - { cle: carac, formule: valeur(caracArme) }
      - { cle: rangArme, formule: rang(arme.competence) }
      - {
          cle: auContact,
          formule: arme.competence == "melee" ou arme.competence == "corps-a-corps",
        }
      # Bras puissant (armes de jet) s'y ajoute, comme Tir de précision
      - cle: porteeMax
        formule: >-
          si(arme.melee ou arme.portee == "Engagée", 0, si(arme.portee == "Courte", 1,
          si(arme.portee == "Moyenne", 2, si(arme.portee == "Longue", 3, 4)))) + tirDePrecision
      - cle: aPortee
        formule: portee.ordre <= porteeMax et non (portee == "engage" et arme.competence == "artillerie")
      - cle: difficulte
        formule: >-
          si(arme.melee, 2, portee.difficulte + @cible.couvert
          + si(portee == "engage" et arme.competence == "distance-lourde", 1, 0))
          + difficulteSupplementaire + si(coupHandicapant, 1, 0)
      # Visée précise réduit la Défense de la cible
      - cle: defenseCible
        formule: 'max(0, si(arme.melee, @cible.defenseMelee, @cible.defenseDistance) - viseePrecise)'
      - cle: stressActeur
        formule: 'viseePrecise + attaqueFrenetique + si(concentrationIntense, 1, 0)'
    verifications:
      - condition: armeDisponible
        message: "Arme non possédée (seules les armes toujours disponibles, comme les mains nues, s'en passent)"
      - condition: aPortee
        message: Cible hors de portée de l'arme
      - condition: visee >= 0 et visee <= 2
        message: 'Viser : deux manœuvres au plus'
      - condition: esquive >= 0 et esquive <= cible_rang("esquive")
        message: "Esquive : la cible subit au plus un point de stress par rang d'Esquive"
      - condition: viseePrecise >= 0 et viseePrecise <= rang("visee-precise")
        message: 'Visée précise : au plus un point de stress par rang'
      - condition: attaqueFrenetique >= 0 et attaqueFrenetique <= rang("attaque-frenetique")
        message: 'Attaque frénétique : au plus un point de stress par rang'
      - condition: attaqueFrenetique == 0 ou auContact
        message: 'Attaque frénétique : tests de Mêlée ou de Corps à corps seulement'
      - condition: tirDePrecision >= 0 et tirDePrecision <= rang("tir-de-precision")
        message: 'Tir de précision : au plus une bande de portée par rang'
      - condition: tirDePrecision == 0 ou (non arme.melee et non a_etiquette(arme, "jet"))
        message: 'Tir de précision : attaques à distance, hors armes de jet'
      - condition: non coupEtourdissant ou arme.competence == "melee"
        message: 'Coup étourdissant : tests de Mêlée seulement'
      - condition: non pointDePression ou arme.competence == "corps-a-corps"
        message: 'Point de pression : tests de Corps à corps seulement'
    jet:
      type: symboles
      pool:
        - { de: aptitude, nombre: 'max(carac, rangArme)' }
        - { de: difficulte, nombre: difficulte }
        - de: fortune
          nombre: >-
            desFortune + arme.precis + si(arme.melee, @cible.vulnerabiliteMelee, 0) + visee
            + si(viseeParfaite, 1, 0) + si(frappeRapide, rang("frappe-rapide"), 0)
        # Toutes les compétences de combat sont d'Agilité ou de Vigueur : l'excédent s'applique
        - {
            de: infortune,
            nombre: desInfortune + defenseCible + arme.inexact + @excedentEncombrement,
          }
      ameliorations:
        - de: aptitude
          vers: maitrise
          nombre: >-
            min(carac, rangArme) + attaqueFrenetique + si(concentrationIntense, 1, 0)
            + si(viseeParfaite, rang("visee-parfaite"), 0)
        # Esquive de la cible, Protecteur d'un allié, Tir de précision (Pas de côté et Posture
        # défensive sont des effets des talents de la cible)
        - {
            de: difficulte,
            vers: defi,
            nombre: ameliorationsDifficulte + esquive + @cible.protection + tirDePrecision,
          }
      reussite: succesNets >= 1
    apres:
      # Force sauvage, Rage wookiee, Précision mortelle, Bout portant, Barrage, point de Destin
      - cle: degatsTalents
        formule: >-
          si(arme.melee, @bonusDegatsMelee, 0)
          + si(marquee(arme.competence, "precisionMortelle"), rangArme, 0)
          + si((arme.competence == "distance-legere" ou arme.competence == "distance-lourde")
          et portee.ordre <= 1, rang("bout-portant"), 0)
          + si((arme.competence == "distance-lourde" ou arme.competence == "artillerie")
          et portee.ordre >= 3, rang("barrage"), 0)
          + si(degatsDestin == "", 0, valeur(degatsDestin.caracteristique))
      - { cle: degatsBruts, formule: arme.degats + succesNets + degatsTalents }
      # Point de pression ignore l'Encaissement
      - cle: encaissementCible
        formule: 'si(pointDePression, 0, max(0, @cible.encaissement - arme.perforant))'
      - { cle: degatsSubis, formule: 'si(reussi, max(0, degatsBruts - encaissementCible), 0)' }
      - { cle: enStress, formule: arme.etourdissant ou coupEtourdissant ou pointDePression }
      # Résolution : 1 stress de moins par rang, minimum 1 ; Point de pression : + rangs en Médecine
      - cle: stressInflige
        formule: >-
          si(enStress et degatsSubis >= 1, max(1, degatsSubis
          + si(pointDePression, rang("medecine"), 0) - @cible.reductionStress), 0)
      - cle: activationsCritique
        formule: >-
          si(non enStress et degatsSubis >= 1,
          triomphes + floor(avantagesNets / max(1, arme.critique)), 0)
      - { cle: critiqueDeclenche, formule: activationsCritique >= 1 }
    consequences:
      - {
          condition: reussi et non enStress,
          entite: cible,
          attribut: blessures,
          operation: ajouter,
          valeur: degatsSubis,
        }
      - {
          condition: reussi et enStress,
          entite: cible,
          attribut: stress,
          operation: ajouter,
          valeur: stressInflige,
        }
      - *stressActeur
      # Esquive : stress volontaire, subi que l'attaque touche ou non
      - {
          condition: esquive >= 1,
          entite: cible,
          attribut: stress,
          operation: ajouter,
          valeur: esquive,
        }
    tables:
      - table: blessures-critiques
        condition: critiqueDeclenche
        modificateur: >-
          10 * @cible.critiquesSubis + 10 * arme.vicieux + @bonusCritique
          + 10 * max(0, activationsCritique - 1) - @cible.resistanceCritique

  - id: initiative
    nom: Initiative
    description: >-
      Test de Sang-froid (rencontre préparée) ou de Vigilance (surprise), sans dé de Difficulté.
      Réaction rapide : stress subi pour autant de dés de Fortune.
    pour: [personnage]
    parametres:
      - {
          id: competence,
          nom: Sang-froid ou Vigilance,
          type: entree,
          sorte: competence,
          etiquette: initiative,
          possedee: false,
        }
      - *fortune
      - *infortune
      - {
          id: reactionRapide,
          nom: 'Réaction rapide : stress subi pour autant de dés de Fortune',
          type: nombre,
          exige: possede("reaction-rapide"),
        }
    variables:
      - { cle: carac, formule: valeur(competence.caracteristique) }
    verifications:
      - condition: reactionRapide >= 0 et reactionRapide <= rang("reaction-rapide")
        message: 'Réaction rapide : au plus un point de stress par rang'
    jet:
      type: symboles
      pool:
        - { de: aptitude, nombre: 'max(carac, competence.rang)' }
        - { de: fortune, nombre: desFortune + reactionRapide }
        - { de: infortune, nombre: desInfortune }
      ameliorations:
        - { de: aptitude, vers: maitrise, nombre: 'min(carac, competence.rang)' }
    consequences:
      - {
          condition: reactionRapide >= 1,
          entite: acteur,
          attribut: stress,
          operation: ajouter,
          valeur: reactionRapide,
        }

  - id: soins
    nom: Soins
    description: >-
      Test de Médecine (Mécanique pour réparer un droïde), une fois par rencontre : Facile si les
      blessures de la cible ne dépassent pas la moitié de son seuil, Moyen au-delà, Difficile si elles
      dépassent le seuil (+2 dés pour se soigner soi-même). Chaque Succès net soigne 1 blessure
      (Chirurgien : +1 par rang), chaque Avantage net 1 point de stress. Maître médecin : 2 stress
      pour réduire la difficulté de 1.
    pour: [personnage]
    cible: personnage
    parametres:
      - {
          id: competence,
          nom: Médecine ou Mécanique,
          type: entree,
          sorte: competence,
          etiquette: soins,
          possedee: false,
        }
      - {
          id: difficulteSupplementaire,
          nom: Dés de Difficulté supplémentaires,
          type: nombre,
          defaut: 0,
        }
      - *ameliorations
      - *fortune
      - *infortune
      - {
          id: maitre,
          nom: 'Maître médecin (2 stress) : difficulté réduite de 1',
          type: booleen,
          exige: possede("maitre-medecin"),
        }
    variables:
      - { cle: carac, formule: valeur(competence.caracteristique) }
      - cle: penaliteCharge
        formule: >-
          si(competence.caracteristique == "agilite" ou competence.caracteristique == "vigueur",
          @excedentEncombrement, 0)
      - cle: difficulteFinale
        formule: >-
          max(0, si(@cible.blessures > @cible.seuilBlessure, 3,
          si(2 * @cible.blessures > @cible.seuilBlessure, 2, 1)) + difficulteSupplementaire
          - si(maitre, 1, 0))
      - { cle: concentrationIntense, formule: faux }
      - { cle: stressActeur, formule: 'si(maitre, 2, 0)' }
      - cle: soinAdapte
        formule: 'si(@cible.inorganique, competence == "mecanique", competence == "medecine")'
    verifications:
      - condition: non maitre ou competence == "medecine"
        message: 'Maître médecin : tests de Médecine seulement'
    jet: *jetTest
    apres:
      - cle: blessuresSoignees
        formule: >-
          si(reussi et soinAdapte, min(@cible.blessures,
          succesNets + si(competence == "medecine", rang("chirurgien"), 0)), 0)
      - cle: stressSoigne
        formule: 'si(reussi et soinAdapte, min(@cible.stress, avantagesNets), 0)'
    consequences:
      - {
          condition: blessuresSoignees >= 1,
          entite: cible,
          attribut: blessures,
          operation: retirer,
          valeur: blessuresSoignees,
        }
      - {
          condition: stressSoigne >= 1,
          entite: cible,
          attribut: stress,
          operation: retirer,
          valeur: stressSoigne,
        }
      - *stressActeur

  - id: stimpack
    nom: Stimpack
    description: >-
      Injection sans jet : soigne 5 blessures, 1 de moins par stimpack déjà reçu par la cible dans la
      journée. Sans effet sur un droïde.
    pour: [personnage]
    cible: personnage
    exige: possede("stimpack")
    jet: { type: symboles, pool: [] }
    apres:
      - cle: blessuresSoignees
        formule: 'si(@cible.inorganique, 0, min(@cible.blessures, max(0, 5 - @cible.stimpacksDuJour)))'
    consequences:
      - {
          condition: blessuresSoignees >= 1,
          entite: cible,
          attribut: blessures,
          operation: retirer,
          valeur: blessuresSoignees,
        }
      - {
          condition: non @cible.inorganique,
          entite: cible,
          attribut: stimpacksDuJour,
          operation: ajouter,
          valeur: 1,
        }

  - id: recuperation
    nom: Récupération de stress
    description: >-
      En fin de rencontre, test Simple (sans dé de Difficulté) de Discipline ou de Sang-froid : chaque
      Succès net fait récupérer 1 point de stress (Récupération rapide : +1 par rang).
    pour: [personnage]
    parametres:
      - {
          id: competence,
          nom: Discipline ou Sang-froid,
          type: entree,
          sorte: competence,
          etiquette: recuperation,
          possedee: false,
        }
      - *fortune
      - *infortune
    variables:
      - { cle: carac, formule: valeur(competence.caracteristique) }
      - cle: penaliteCharge
        formule: >-
          si(competence.caracteristique == "agilite" ou competence.caracteristique == "vigueur",
          @excedentEncombrement, 0)
      - { cle: difficulteFinale, formule: '0' }
      - { cle: ameliorationsDifficulte, formule: '0' }
      - { cle: concentrationIntense, formule: faux }
    jet: *jetTest
    apres:
      - { cle: stressRecupere, formule: 'min(@stress, succesNets + rang("recuperation-rapide"))' }
    consequences:
      - {
          condition: stressRecupere >= 1,
          entite: acteur,
          attribut: stress,
          operation: retirer,
          valeur: stressRecupere,
        }

  - id: talent
    nom: Test de talent
    description: >-
      Test prévu par un talent actif (Rhétorique inspirante, Système D, Tête dure…) : compétence,
      caractéristique et difficulté sont lues sur le talent ; ses effets restent décrits par le talent.
      Tête dure améliorée ramène le stress à 1 sous le seuil ; les talents « suprêmes » font de
      Rhétorique inspirante et de Tirade cinglante une manœuvre pour 1 stress.
    pour: [personnage]
    parametres:
      - { id: talent, nom: Talent, type: entree, sorte: talent, etiquette: test }
      - *ameliorations
      - *fortune
      - *infortune
      - {
          id: enManoeuvre,
          nom: 'Talent suprême (1 stress) : en tant que manœuvre',
          type: booleen,
          exige: possede("rhetorique-inspirante-supreme") ou possede("tirade-cinglante-supreme"),
        }
    variables:
      - { cle: carac, formule: valeur(talent.caracteristique) }
      - { cle: rangCompetence, formule: rang(talent.competence) }
      - cle: penaliteCharge
        formule: >-
          si(talent.caracteristique == "agilite" ou talent.caracteristique == "vigueur",
          @excedentEncombrement, 0)
    verifications:
      - condition: >-
          non enManoeuvre
          ou (talent == "rhetorique-inspirante" et possede("rhetorique-inspirante-supreme"))
          ou (talent == "tirade-cinglante" et possede("tirade-cinglante-supreme"))
        message: Aucun talent suprême ne permet d'effectuer ce talent en manœuvre
      - condition: talent != "tete-dure-amelioree" ou @stress > @seuilStress
        message: 'Tête dure améliorée : seulement neutralisé par un stress au-delà du seuil'
    jet:
      type: symboles
      pool:
        - { de: aptitude, nombre: 'max(carac, rangCompetence)' }
        - { de: difficulte, nombre: talent.difficulte }
        - { de: fortune, nombre: desFortune }
        - { de: infortune, nombre: desInfortune + penaliteCharge }
      ameliorations:
        - { de: aptitude, vers: maitrise, nombre: 'min(carac, rangCompetence)' }
        - { de: difficulte, vers: defi, nombre: ameliorationsDifficulte }
      reussite: succesNets >= 1
    consequences:
      - { condition: enManoeuvre, entite: acteur, attribut: stress, operation: ajouter, valeur: 1 }
      - {
          condition: reussi et talent == "tete-dure-amelioree",
          entite: acteur,
          attribut: stress,
          operation: fixer,
          valeur: '@seuilStress - 1',
        }

  - id: defense-active
    nom: Défense active
    description: >-
      Manœuvre Pas de côté ou Posture défensive, une fois par round : subit un nombre de points de
      stress (au plus ses rangs) et améliore d'autant la difficulté des attaques à distance (Pas de
      côté) ou de mêlée (Posture défensive) qui le visent jusqu'au round suivant. Avec 0 point de
      stress, la manœuvre prend fin.
    pour: [personnage]
    parametres:
      - { id: talent, nom: Talent, type: entree, sorte: talent, etiquette: defense-active }
      - &stressSubi { id: stressSubi, nom: Points de stress subis, type: nombre, defaut: 1 }
    verifications:
      - condition: stressSubi >= 0 et stressSubi <= talent.rang
        message: Au plus un point de stress par rang du talent
    jet: { type: symboles, pool: [] }
    consequences:
      - &stressSubiActeur {
          condition: stressSubi >= 1,
          entite: acteur,
          attribut: stress,
          operation: ajouter,
          valeur: stressSubi,
        }
      - {
          condition: talent == "pas-de-cote",
          entite: acteur,
          attribut: pasDeCote,
          operation: fixer,
          valeur: stressSubi,
        }
      - {
          condition: talent == "posture-defensive",
          entite: acteur,
          attribut: postureDefensive,
          operation: fixer,
          valeur: stressSubi,
        }

  - id: protecteur
    nom: Protecteur
    description: >-
      Manœuvre Protecteur, une fois par round, pour garder un personnage engagé : subit un nombre de
      points de stress (au plus ses rangs) ; jusqu'au début de son prochain tour, la difficulté des
      attaques qui visent ce personnage est améliorée d'autant. Avec 0 point de stress, la garde prend fin.
    pour: [personnage]
    cible: personnage
    exige: possede("protecteur")
    parametres:
      - *stressSubi
    verifications:
      - condition: stressSubi >= 0 et stressSubi <= rang("protecteur")
        message: 'Protecteur : au plus un point de stress par rang'
    jet: { type: symboles, pool: [] }
    consequences:
      - *stressSubiActeur
      - { entite: cible, attribut: protection, operation: fixer, valeur: stressSubi }

  - id: second-souffle
    nom: Second souffle
    description: >-
      Incident, une fois par rencontre : récupère un nombre de points de stress égal à ses rangs.
    pour: [personnage]
    exige: possede("second-souffle")
    jet: { type: symboles, pool: [] }
    apres:
      - { cle: stressRecupere, formule: 'min(@stress, rang("second-souffle"))' }
    consequences:
      - &stressRecupere {
          condition: stressRecupere >= 1,
          entite: acteur,
          attribut: stress,
          operation: retirer,
          valeur: stressRecupere,
        }

  - id: presence-intense
    nom: Présence intense
    description: >-
      Dépense 1 point de Destin (suivi hors fiche) pour récupérer un nombre de points de stress égal
      à sa Présence.
    pour: [personnage]
    exige: possede("presence-intense")
    jet: { type: symboles, pool: [] }
    apres:
      - { cle: stressRecupere, formule: 'min(@stress, @presence)' }
    consequences:
      - *stressRecupere

# Ordre décroissant des Succès nets, puis des Avantages nets.
initiative:
  action: initiative
  tri: [succesNets, avantagesNets]
