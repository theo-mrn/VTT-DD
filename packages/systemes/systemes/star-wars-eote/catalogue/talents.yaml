    VO : Wheel and Deal.

- id: mauvais-moteur
  sorte: talent
  nom: Mauvais moteur
  etiquettes: [actif, test]
  description: |-
    Une fois par séance, action Mauvais moteur : test de Mécanique Difficile pour provoquer la panne spontanée d'un appareil ciblé.

    VO : Bad Motivator.
  champs: { competence: mecanique, caracteristique: intellect, difficulte: '3' }

- id: medecin-ne
  sorte: talent
  nom: Médecin né
  etiquettes: [actif]
  description: |-
    Une fois par séance, peut relancer un test de Médecine.

    VO : Natural Doctor.

- id: negociateur-ne
  sorte: talent
  nom: Négociateur né
  etiquettes: [actif]
  description: |-
