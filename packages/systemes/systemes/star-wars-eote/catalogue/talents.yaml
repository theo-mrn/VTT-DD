    VO : Deadly Accuracy.
  choix:
    - id: competences
      nom: Compétence de combat choisie (une par rang)
      nombre: rang("precision-mortelle")
      parmi:
        sorte: competence
        entrees: [artillerie, corps-a-corps, melee, distance-legere, distance-lourde]
      donne: { type: marque, marque: precisionMortelle }

