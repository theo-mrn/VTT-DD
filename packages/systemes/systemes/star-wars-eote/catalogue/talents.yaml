  sorte: talent
  nom: Leçons d'anatomie
  etiquettes: [actif]
  description: |-
    Après une attaque réussie, peut dépenser 1 point de Destin pour ajouter à une touche des dégâts égaux à son Intellect.

    VO : Anatomy Lessons.

- id: maitre-astronavigateur
  sorte: talent
  nom: Maître astronavigateur
  etiquettes: [actif]
  description: |-
    Une fois par round, subit 2 points de stress pour réduire de 1 la difficulté du prochain test d'Astrogation (minimum Facile).

    VO : Master Starhopper.

- id: maitre-des-armures
  sorte: talent
  nom: Maître des armures
  etiquettes: [passif]
  description: |-
    En portant une armure, augmente de 1 sa valeur d'Encaissement totale.

    VO : Armor Master.
  effets:
    - {
        sur: attribut,
        attribut: encaissement,
        operation: ajouter,
        valeur: 1,
        condition: 'compte_actifs("armure") >= 1',
      }

- id: maitre-des-armures-ameliore
  sorte: talent
  nom: Maître des armures amélioré
  etiquettes: [passif]
  description: |-
    En portant une armure d'Encaissement 2 ou plus, augmente sa Défense de 1.

    VO : Improved Armor Master.
  effets:
    - {
        sur: attribut,
        attribut: defenseMelee,
        operation: ajouter,
        valeur: 1,
        condition: '@encaissementArmure >= 2',
      }
    - {
        sur: attribut,
        attribut: defenseDistance,
        operation: ajouter,
        valeur: 1,
        condition: '@encaissementArmure >= 2',
      }

- id: maitre-des-ombres
  sorte: talent
