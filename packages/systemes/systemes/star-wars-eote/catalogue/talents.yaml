# Talents (138) : obtenus par les nœuds des arbres, chaque nœud donne un rang.
# Seuls les effets exprimables en données sont codés ; le reste est décrit. Les effets de jet lisent
# la compétence testée (`competence`) ou la circonstance d'un « Test en situation » (`circonstance`) ;
# les talents étiquetés « test » se lancent avec l'action « Test de talent » (champs du talent) ;
# les dégâts et critiques passent par les attributs bonusDegatsMelee / bonusCritique ou l'action « attaque ».
- id: agile
  sorte: talent
  nom: Agile
  etiquettes: [passif]
  description: |-
    Ne subit pas les pénalités habituelles de déplacement en terrain difficile.

    VO : Swift.

- id: anonyme
  sorte: talent
  nom: Anonyme
  etiquettes: [passif]
  description: |-
    Améliore une fois par rang la difficulté des tests visant à identifier le personnage.

    VO : Indistinguishable.

- id: aptitude-technique
  sorte: talent
  nom: Aptitude technique
  etiquettes: [passif]
  description: |-
    Réduit de 25 % par rang le temps nécessaire aux tâches informatiques.

    VO : Technical Aptitude.

- id: arc-boute
  sorte: talent
  nom: Arc-bouté
  etiquettes: [actif]
  description: |-
    Manœuvre Arc-bouté : retire 1 dé d'Infortune par rang de sa prochaine action (uniquement ceux dus aux conditions environnementales).

    VO : Brace.

- id: as-du-manche
  sorte: talent
  nom: As du manche
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang de tous les tests de Pilotage (planétaire) et (spatial).

    VO : Skilled Jockey.
  effets:
    - {
        sur: jet,
        si: 'competence == "pilotage-planetaire" ou competence == "pilotage-spatial"',
        ajout: { retirer: infortune, nombre: rang },
      }

- id: assurance
  sorte: talent
  nom: Assurance
  etiquettes: [passif]
  description: |-
    Peut réduire de 1 par rang la difficulté des tests de Discipline pour résister à la peur.

    VO : Confidence.
  effets:
    - {
        sur: jet,
        si: 'circonstance == "peur" et competence == "discipline"',
        ajout: { retirer: difficulte, nombre: rang },
      }

- id: attaque-frenetique
  sorte: talent
  nom: Attaque frénétique
  etiquettes: [actif]
  description: |-
    Lors d'un test de Mêlée ou de Corps à corps, subit un nombre de points de stress (au plus ses rangs) pour améliorer l'attaque d'autant.

    VO : Frenzied Attack.

- id: attitude-convaincante
  sorte: talent
  nom: Attitude convaincante
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang des tests de Tromperie ou de Magouilles.

    VO : Convincing Demeanor.
  effets:
    - {
        sur: jet,
        si: 'competence == "tromperie" ou competence == "magouilles"',
        ajout: { retirer: infortune, nombre: rang },
      }

- id: autorite
  sorte: talent
  nom: Autorité
  etiquettes: [passif]
  description: |-
    Ajoute 1 dé de Fortune par rang aux tests de Commandement. Les cibles affectées ajoutent 1 dé de Fortune à leurs tests de Discipline pendant 24 heures.

    VO : Command.
  effets:
    - { sur: jet, si: competence == "commandement", ajout: { de: fortune, nombre: rang } }

- id: bagarreur-ne
  sorte: talent
  nom: Bagarreur né
  etiquettes: [actif]
  description: |-
    Une fois par séance, peut relancer un test de Corps à corps ou de Mêlée.

    VO : Natural Brawler.

- id: baroudeur
  sorte: talent
  nom: Baroudeur
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang des tests pour traverser un terrain ou gérer les effets de l'environnement. Les voyages terrestres prennent deux fois moins de temps.

    VO : Outdoorsman.
  effets:
    - { sur: jet, si: 'circonstance == "terrain"', ajout: { retirer: infortune, nombre: rang } }

- id: baroudeur-ne
  sorte: talent
  nom: Baroudeur né
  etiquettes: [actif]
  description: |-
    Une fois par séance, peut relancer un test de Résistance ou de Survie.

    VO : Natural Outdoorsman.

- id: barrage
  sorte: talent
  nom: Barrage
  etiquettes: [passif]
  description: |-
    Ajoute 1 dégât par rang à une touche d'une attaque réussie en Distance (armes lourdes) ou en Artillerie à portée longue ou extrême.

    VO : Barrage.

- id: beau-parleur
  sorte: talent
  nom: Beau parleur
  etiquettes: [actif]
  description: |-
    À l'acquisition, choisir Charme, Coercition, Tromperie ou Négociation. Lors d'un test de cette compétence, peut dépenser un Avantage pour gagner des Triomphes supplémentaires égaux à ses rangs.

    VO : Smooth Talker.

- id: bidouilleur
  sorte: talent
  nom: Bidouilleur
  etiquettes: [passif]
  description: |-
    Peut ajouter 1 point de fixation supplémentaire à un nombre d'objets égal à ses rangs (une seule fois par objet).

    VO : Tinkerer.

- id: bidouilleur-ne
  sorte: talent
  nom: Bidouilleur né
  etiquettes: [actif]
  description: |-
    Une fois par séance, peut relancer un test de Mécanique.

    VO : Natural Tinkerer.

- id: bout-portant
  sorte: talent
  nom: Bout portant
  etiquettes: [passif]
  description: |-
    Ajoute 1 dégât par rang à une touche d'une attaque réussie en Distance (armes légères ou lourdes) à portée courte ou engagée.

    VO : Point Blank.

- id: bras-puissant
  sorte: talent
  nom: Bras puissant
  etiquettes: [passif]
  description: |-
    Les armes de jet sont traitées comme ayant une bande de portée de plus.

    VO : Strong Arm.

- id: cache-secrete
  sorte: talent
  nom: Cache secrète
  etiquettes: [passif]
  description: |-
    Dispose dans ses véhicules ou son équipement d'une cache pouvant contenir des objets d'un encombrement total égal à ses rangs.

    VO : Hidden Storage.

- id: cartographe-galactique
  sorte: talent
  nom: Cartographe galactique
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang des tests d'Astrogation, qui prennent deux fois moins de temps.

    VO : Galaxy Mapper.
  effets:
    - { sur: jet, si: 'competence == "astrogation"', ajout: { retirer: infortune, nombre: rang } }

- id: casseur-de-codes
  sorte: talent
  nom: Casseur de codes
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang des tests pour casser un code ou déchiffrer des communications, et réduit leur difficulté de 1.

    VO : Codebreaker.
  effets:
    - {
        sur: jet,
        si: 'circonstance == "dechiffrement"',
        ajout: { retirer: infortune, nombre: rang },
      }
    - { sur: jet, si: 'circonstance == "dechiffrement"', ajout: { retirer: difficulte, nombre: 1 } }

- id: ceinture-utilitaire
  sorte: talent
  nom: Ceinture utilitaire
  etiquettes: [actif]
  description: |-
    Dépense 1 point de Destin pour l'incident Ceinture utilitaire : sort de sa ceinture ou de sa sacoche un objet ou une arme jusque-là non mentionné (avec restrictions).

    VO : Utility Belt.

- id: chargeur-de-rechange
  sorte: talent
  nom: Chargeur de rechange
  etiquettes: [passif]
  description: |-
    Ne peut pas tomber à court de munitions à cause d'une Menace (les armes à Munitions limitées s'épuisent normalement).

    VO : Spare Clip.

- id: charmeur-ne
  sorte: talent
  nom: Charmeur né
  etiquettes: [actif]
  description: |-
    Une fois par séance, peut relancer un test de Charme ou de Tromperie.

    VO : Natural Charmer.

- id: chasseur
  sorte: talent
  nom: Chasseur
  etiquettes: [passif]
  description: |-
    Ajoute 1 dé de Fortune par rang à tous les tests impliquant des bêtes ou des animaux (tests de combat compris). Ajoute +10 par rang aux Blessures critiques infligées aux bêtes et animaux.

    VO : Hunter.
  effets:
    - { sur: jet, si: 'circonstance == "betes"', ajout: { de: fortune, nombre: rang } }

- id: chasseur-ne
  sorte: talent
  nom: Chasseur né
  etiquettes: [actif]
  description: |-
    Une fois par séance, peut relancer un test de Perception ou de Vigilance.

    VO : Natural Hunter.

- id: chercheur
  sorte: talent
  nom: Chercheur
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang de tous les tests de Connaissance. Les recherches prennent deux fois moins de temps.

    VO : Researcher.
  effets:
    - {
        sur: jet,
        si: 'competence == "connaissance-noyau" ou competence == "connaissance-education" ou competence == "connaissance-traditions" ou competence == "connaissance-bordure" ou competence == "connaissance-pegre" ou competence == "connaissance-xenologie"',
        ajout: { retirer: infortune, nombre: rang },
      }

- id: chirurgien
  sorte: talent
  nom: Chirurgien
  etiquettes: [passif]
  description: |-
    Lors d'un test de Médecine pour soigner des blessures, la cible en récupère 1 de plus par rang.

    VO : Surgeon.

- id: cible-insaisissable
  sorte: talent
  nom: Cible insaisissable
  etiquettes: [passif]
  description: |-
    Le véhicule ou le vaisseau piloté compte comme ayant une silhouette de moins lorsqu'il est attaqué.

    VO : Tricky Target.

- id: commandant-de-terrain
  sorte: talent
  nom: Commandant de terrain
  etiquettes: [actif, test]
  description: |-
    Action Commandant de terrain : test de Commandement Moyen. Un nombre d'alliés égal à sa Présence peut subir 1 point de stress pour effectuer immédiatement une manœuvre gratuite.

    VO : Field Commander.
  champs: { competence: commandement, caracteristique: presence, difficulte: '2' }

- id: commandant-de-terrain-ameliore
  sorte: talent
  nom: Commandant de terrain amélioré
  etiquettes: [passif]
  description: |-
    Commandant de terrain affecte un nombre d'alliés égal au double de sa Présence, et un Triomphe peut leur permettre de subir 1 point de stress pour effectuer une action gratuite.

    VO : Improved Field Commander.

- id: concentration-intense
  sorte: talent
  nom: Concentration intense
  etiquettes: [actif]
  description: |-
    Manœuvre Concentration intense : subit 1 point de stress et améliore une fois l'aptitude du prochain test de compétence.

    VO : Intense Focus.

- id: conduite-defensive
  sorte: talent
  nom: Conduite défensive
  etiquettes: [passif]
  description: |-
    Augmente de 1 par rang la Défense du véhicule ou du vaisseau piloté.

    VO : Defensive Driving.

- id: connaitre-quelqu-un
  sorte: talent
  nom: Connaître quelqu'un
  etiquettes: [actif]
  description: |-
    Une fois par séance, pour acheter un objet légal, réduit sa rareté de 1 par rang.

    VO : Know Somebody.

- id: contacts-au-marche-noir
  sorte: talent
  nom: Contacts au marché noir
  etiquettes: [actif]
  description: |-
    Pour acheter des biens illégaux, réduit la rareté de 1 par rang, chaque réduction augmentant le prix de 50 % du prix de base.

    VO : Black Market Contacts.

- id: contournement-de-securite
  sorte: talent
  nom: Contournement de sécurité
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang des tests pour désactiver un dispositif de sécurité ou ouvrir une porte verrouillée.

    VO : Bypass Security.
  effets:
    - { sur: jet, si: 'circonstance == "securite"', ajout: { retirer: infortune, nombre: rang } }

- id: coup-cible
  sorte: talent
  nom: Coup ciblé
  etiquettes: [actif]
  description: |-
    Après une attaque réussie, peut dépenser 1 point de Destin pour ajouter à une touche des dégâts égaux à son Agilité.

    VO : Targeted Blow.

- id: coup-de-genie
  sorte: talent
  nom: Coup de génie
  etiquettes: [actif]
  description: |-
    Une fois par séance, effectue un test de compétence avec l'Intellect au lieu de la caractéristique liée.

    VO : Stroke of Genius.

- id: coup-etourdissant
  sorte: talent
  nom: Coup étourdissant
  etiquettes: [actif]
  description: |-
    Lors des tests de Mêlée, peut infliger les dégâts sous forme de stress plutôt que de blessures (l'Encaissement s'applique).

    VO : Stunning Blow.

- id: coup-etourdissant-ameliore
  sorte: talent
  nom: Coup étourdissant amélioré
  etiquettes: [passif]
  description: |-
    En infligeant des dégâts de stress en Mêlée ou en Corps à corps, peut dépenser des Avantages pour faire chanceler la cible 1 round par Avantage.

    VO : Improved Stunning Blow.

- id: coup-handicapant
  sorte: talent
  nom: Coup handicapant
  etiquettes: [actif]
  description: |-
    Augmente de 1 la difficulté du prochain test de combat. S'il inflige des dégâts, la cible subit 1 point de stress à chaque déplacement jusqu'à la fin de la rencontre.

    VO : Crippling Blow.

- id: coups-mortels
  sorte: talent
  nom: Coups mortels
  etiquettes: [passif]
  description: |-
    Ajoute +10 par rang aux Blessures critiques infligées aux adversaires.

    VO : Lethal Blows.
  effets:
    - { sur: attribut, attribut: bonusCritique, operation: ajouter, valeur: 10 * rang }

- id: courage-heroique
  sorte: talent
  nom: Courage héroïque
  etiquettes: [actif]
  description: |-
    Peut dépenser 1 point de Destin pour ignorer les effets des Blessures critiques sur les tests de Vigueur ou d'Agilité jusqu'à la fin de la rencontre.

    VO : Heroic Fortitude.

- id: cran
  sorte: talent
  nom: Cran
  etiquettes: [passif]
  description: |-
    Gagne +1 en seuil de stress par rang.

    VO : Grit.
  effets:
    - { sur: attribut, attribut: seuilStress, operation: ajouter, valeur: rang }

- id: debout
  sorte: talent
  nom: Debout !
  etiquettes: [actif]
  description: |-
    Une fois par round, peut se relever (assis ou à terre) en tant qu'incident.

    VO : Jump Up.

- id: debrouillard
  sorte: talent
  nom: Débrouillard
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang des tests de Sens de la rue ou de Connaissance (Pègre).

    VO : Street Smarts.
  effets:
    - {
        sur: jet,
        si: 'competence == "sens-de-la-rue" ou competence == "connaissance-pegre"',
        ajout: { retirer: infortune, nombre: rang },
      }

- id: degainer-rapide
  sorte: talent
  nom: Dégainer rapide
  etiquettes: [actif]
  description: |-
    Une fois par round, dégaine ou range une arme ou un objet accessible en tant qu'incident.

    VO : Quick Draw.

- id: deni-plausible
  sorte: talent
  nom: Déni plausible
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang de tous les tests de Coercition et de Tromperie.

    VO : Plausible Deniability.
  effets:
    - {
        sur: jet,
        si: 'competence == "coercition" ou competence == "tromperie"',
        ajout: { retirer: infortune, nombre: rang },
      }

- id: desorientation
  sorte: talent
  nom: Désorientation
  etiquettes: [passif]
  description: |-
    Après avoir touché avec un test de combat, peut dépenser 2 Avantages pour désorienter la cible pendant un nombre de rounds égal à ses rangs.

    VO : Disorient.

- id: devouement
  sorte: talent
  nom: Dévouement
  etiquettes: [passif]
  description: |-
    Gagne +1 dans une caractéristique au choix, sans pouvoir dépasser 6.

    VO : Dedication.
  choixAttributs:
    - id: rang-1
      nom: 'Dévouement (1er rang) : +1 à une caractéristique'
      nombre: 1
      parmi: { groupe: caracteristiques }
      valeur: 1
    - id: rang-2
      nom: 'Dévouement (2e rang) : +1 à une caractéristique'
      nombre: 1
      parmi: { groupe: caracteristiques }
      valeur: si(rang >= 2, 1, 0)
    - id: rang-3
      nom: 'Dévouement (3e rang) : +1 à une caractéristique'
      nombre: 1
      parmi: { groupe: caracteristiques }
      valeur: si(rang >= 3, 1, 0)
    - id: rang-4
      nom: 'Dévouement (4e rang) : +1 à une caractéristique'
      nombre: 1
      parmi: { groupe: caracteristiques }
      valeur: si(rang >= 4, 1, 0)
  effets:
    - { sur: attribut, attribut: vigueur, operation: maximum, valeur: 6 }
    - { sur: attribut, attribut: agilite, operation: maximum, valeur: 6 }
    - { sur: attribut, attribut: intellect, operation: maximum, valeur: 6 }
    - { sur: attribut, attribut: ruse, operation: maximum, valeur: 6 }
    - { sur: attribut, attribut: volonte, operation: maximum, valeur: 6 }
    - { sur: attribut, attribut: presence, operation: maximum, valeur: 6 }

- id: en-plein-dans-le-mille
  sorte: talent
  nom: En plein dans le mille
  etiquettes: [passif]
  description: |-
    Dépense 1 point de Destin pour ajouter à une touche d'une attaque réussie avec une arme de vaisseau ou de véhicule des dégâts égaux à la moitié de son Agilité (arrondie au supérieur).

    VO : Dead to Rights.

- id: en-plein-dans-le-mille-ameliore
  sorte: talent
  nom: En plein dans le mille amélioré
  etiquettes: [passif]
  description: |-
    Dépense 1 point de Destin pour ajouter à une touche d'une attaque réussie avec une arme de vaisseau ou de véhicule des dégâts égaux à son Agilité.

    VO : Improved Dead to Rights.

- id: en-selle
  sorte: talent
  nom: En selle !
  etiquettes: [actif]
  description: |-
    Une fois par round, peut monter sur un véhicule ou une bête, en descendre, ou rejoindre un cockpit ou un poste de tir en tant qu'incident.

    VO : Let's Ride.

- id: endurant
  sorte: talent
  nom: Endurant
  etiquettes: [passif]
  description: |-
    Gagne +1 en Encaissement par rang.

    VO : Enduring.
  effets:
    - { sur: attribut, attribut: encaissement, operation: ajouter, valeur: rang }

- id: endurci
  sorte: talent
  nom: Endurci
  etiquettes: [passif]
  description: |-
    Gagne +2 en seuil de blessure par rang.

    VO : Toughened.
  effets:
    - { sur: attribut, attribut: seuilBlessure, operation: ajouter, valeur: 2 * rang }

- id: erudit-ne
  sorte: talent
  nom: Érudit né
  etiquettes: [actif]
  description: |-
    Une fois par séance, peut relancer un test de Connaissance.

    VO : Natural Scholar.

- id: erudit-respecte
  sorte: talent
  nom: Érudit respecté
  etiquettes: [passif]
  description: |-
    Peut réduire d'un niveau par rang la difficulté des tests d'interaction avec les institutions du savoir.

    VO : Respected Scholar.
  effets:
    - {
        sur: jet,
        si: 'circonstance == "institutions-savoir"',
        ajout: { retirer: difficulte, nombre: rang },
      }

- id: esquive
  sorte: talent
  nom: Esquive
  etiquettes: [actif]
  description: |-
    Ciblé par un test de combat, peut effectuer l'incident Esquive : subit un nombre de points de stress (au plus ses rangs) et améliore d'autant la difficulté du test.

    VO : Dodge.

- id: evasion-brillante
  sorte: talent
  nom: Évasion brillante
  etiquettes: [actif]
  description: |-
    Une fois par rencontre, action Évasion brillante : test opposé de Pilotage (planétaire ou spatial) contre un adversaire pour l'empêcher d'attaquer pendant un nombre de rounds égal à son Agilité.

    VO : Brilliant Evasion.

- id: filou-ne
  sorte: talent
  nom: Filou né
  etiquettes: [actif]
  description: |-
    Une fois par séance, peut relancer un test de Magouilles ou de Discrétion.

    VO : Natural Rogue.

- id: fondu-de-mecanique
  sorte: talent
  nom: Fondu de mécanique
  etiquettes: [passif]
  description: |-
    Retire 1 dé d'Infortune par rang des tests de Mécanique. Le coût en crédits des modifications d'accessoires est divisé par deux.

    VO : Gearhead.
  effets:
    - { sur: jet, si: 'competence == "mecanique"', ajout: { retirer: infortune, nombre: rang } }

- id: force-sauvage
  sorte: talent
  nom: Force sauvage
  etiquettes: [passif]
  description: |-
    Ajoute 1 dégât par rang à une touche des attaques réussies en Corps à corps ou en Mêlée.

    VO : Feral Strength.
  effets:
    - { sur: attribut, attribut: bonusDegatsMelee, operation: ajouter, valeur: rang }

- id: forteresse-mentale
  sorte: talent
  nom: Forteresse mentale
  etiquettes: [actif]
  description: |-
    Dépense 1 point de Destin pour ignorer les effets des Blessures critiques sur les tests d'Intellect ou de Ruse jusqu'à la fin de la rencontre.

    VO : Mental Fortress.

- id: fourrageur
  sorte: talent
  nom: Fourrageur
  etiquettes: [passif]
  description: |-
    Retire jusqu'à 2 dés d'Infortune des tests pour trouver nourriture, eau ou abri. Les tests de Survie pour fourrager prennent deux fois moins de temps.

    VO : Forager.
  effets:
    - { sur: jet, si: 'circonstance == "ressources"', ajout: { retirer: infortune, nombre: 2 } }

- id: frappe-rapide
  sorte: talent
  nom: Frappe rapide
  etiquettes: [passif]
  description: |-
    Ajoute 1 dé de Fortune par rang aux tests de combat contre les cibles qui n'ont pas encore agi pendant la rencontre.

    VO : Quick Strike.

- id: gros-bras-ne
  sorte: talent
  nom: Gros bras né
  etiquettes: [passif]
  description: |-
    Une fois par séance, peut relancer un test de Coercition ou de Sens de la rue.

    VO : Natural Enforcer.

- id: injection-de-stimulant
  sorte: talent
  nom: Injection de stimulant
  etiquettes: [actif, test]
  description: |-
    Action Injection de stimulant : test de Médecine Moyen. En cas de réussite, un allié engagé augmente une caractéristique de 1 jusqu'à la fin de la rencontre et subit 4 points de stress.

    VO : Stim Application.
  champs: { competence: medecine, caracteristique: intellect, difficulte: '2' }

- id: injection-de-stimulant-amelioree
  sorte: talent
  nom: Injection de stimulant améliorée
  etiquettes: [actif]
  description: |-
    En effectuant Injection de stimulant, peut porter la difficulté à Difficile : la cible ne subit alors que 1 point de stress.

    VO : Improved Stim Application.

- id: injection-de-stimulant-supreme
  sorte: talent
  nom: Injection de stimulant suprême
  etiquettes: [actif]
  description: |-
    En effectuant Injection de stimulant, peut dépenser pour augmenter de 1 une caractéristique supplémentaire.

    VO : Supreme Stim Application.

- id: intimidant
  sorte: talent
  nom: Intimidant
  etiquettes: [actif]
  description: |-
    Peut subir un nombre de points de stress (au plus ses rangs) pour réduire d'autant la difficulté de ses tests de Coercition, ou améliorer d'autant celle des tests de Coercition qui le visent.

    VO : Intimidating.

- id: inventeur
  sorte: talent
  nom: Inventeur
  etiquettes: [passif]
  description: |-
    En construisant un objet ou en modifiant un accessoire, ajoute 1 dé de Fortune ou retire 1 dé d'Infortune par rang.

    VO : Inventor.
  effets:
    - { sur: jet, si: 'circonstance == "fabrication"', ajout: { de: fortune, nombre: rang } }

