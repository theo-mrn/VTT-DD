    VO : Natural Pilot.

- id: piratage-defensif
  sorte: talent
  nom: Piratage défensif
  etiquettes: [passif]
  description: |-
    En défendant un système informatique, ajoute 1 dé d'Infortune par rang aux tests des adversaires.

    VO : Defensive Slicing.

- id: piratage-defensif-ameliore
  sorte: talent
  nom: Piratage défensif amélioré
  etiquettes: [passif]
  description: |-
    Le Piratage défensif améliore désormais la difficulté des adversaires une fois par rang, au lieu de ses effets habituels.

    VO : Improved Defensive Slicing.

- id: pirate-habile
  sorte: talent
  nom: Pirate habile
  etiquettes: [actif]
  description: |-
    Lors d'un test d'Informatique, peut dépenser un Avantage pour effectuer les tests suivants dans ce système en tant que manœuvres.

    VO : Skilled Slicer.

- id: pisteur-expert
  sorte: talent
  nom: Pisteur expert
  etiquettes: [passif]
  description: |-
