    VO : Master of Shadows.

- id: maitre-marchand
  sorte: talent
  nom: Maître marchand
  etiquettes: [actif]
  description: |-
    En achetant ou vendant des biens, ou en réglant ou contractant de l'Obligation, peut subir 2 points de stress pour vendre 25 % plus cher, acheter 25 % moins cher, rembourser 1 point d'Obligation de plus ou en contracter 1 de moins.

    VO : Master Merchant.

- id: maitre-medecin
  sorte: talent
  nom: Maître médecin
  etiquettes: [actif]
  description: |-
    Une fois par round, subit 2 points de stress pour réduire de 1 la difficulté d'un test de Médecine.

    VO : Master Doctor.

- id: maitre-pilote
  sorte: talent
  nom: Maître pilote
  etiquettes: [passif]
  description: |-
    Une fois par round aux commandes d'un vaisseau, peut subir 2 points de stress pour effectuer une action en tant que manœuvre.

    VO : Master Pilot.

- id: maitre-pirate
  sorte: talent
  nom: Maître pirate
  etiquettes: [actif]
  description: |-
    Une fois par round, incident Maître pirate : subit 2 points de stress pour réduire de 1 la difficulté d'un test d'Informatique ou de piratage (minimum Facile).

    VO : Master Slicer.

- id: marchandage
  sorte: talent
  nom: Marchandage
  etiquettes: [passif]
