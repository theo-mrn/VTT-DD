# Types d'Obligation du livre de base. La valeur (10 par défaut) est propre à chaque personnage :
# elle se saisit sur la possession (champ « valeur »). Le total est l'attribut dérivé « obligation ».
- {
    id: dependance,
    sorte: obligation,
    nom: Dépendance,
    description: 'Addiction à une substance, un jeu ou une sensation.',
  }
