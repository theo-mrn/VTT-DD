  nom: Armure mandalorienne en Beskar
  description: Armure complète forgée en Beskar, symbole du peuple mandalorien. Confère une Encaissement exceptionnel et résiste aux lames de sabre laser (annule les dégâts d'une attaque au sabre laser au corps-à-corps une fois par round). Transmission traditionnellement réservée aux clans mandaloriens.
  champs: { defense: 2, encaissement: 3, encombrement: 4, prix: 45000, rarete: 9 }
