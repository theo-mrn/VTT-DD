# Armures : Défense et Encaissement appliqués quand elles sont équipées (sorte activable).
- id: combinaison-de-combat
  sorte: armure
  nom: Combinaison de combat
  description: Combat Jumpsuit — légère et discrète.
  champs: { defense: 0, encaissement: 1, encombrement: 2, prix: 1000, rarete: 3 }
  effets:
    - {
        sur: attribut,
        attribut: defenseMelee,
        operation: ajouter,
        valeur: source.defense,
        famille: armure,
      }
    - {
        sur: attribut,
        attribut: defenseDistance,
        operation: ajouter,
        valeur: source.defense,
        famille: armure,
      }
    - {
        sur: attribut,
        attribut: encaissement,
        operation: ajouter,
        valeur: source.encaissement,
        famille: armure,
      }

