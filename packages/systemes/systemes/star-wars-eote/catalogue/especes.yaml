  nom: Wookiee
  description: |-
    Colosses de plus de deux mètres réputés pour leur force, leur intelligence et leur fureur au combat. Originaires de Kashyyyk, sens inné de la mécanique, code d'honneur strict (dette de vie). Comprennent le Basic mais ne peuvent parler que le Shyriiwook.

