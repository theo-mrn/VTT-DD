# Espèces (100) : caractéristiques de départ, seuils de base, XP de départ,
# rangs gratuits et choix. Les capacités narratives sont dans la description.
- id: bothan
  sorte: espece
  nom: Bothan
  description: |-
    Courtiers en information de la galaxie, réputés pour leur vaste réseau d'espionnage (spynet). Sens très aiguisés, fourrure qui ondule pour communiquer et exprimer leurs émotions.

    Capacités :
    - **Fréquentation des bas-fonds** : 1 rang gratuit dans la compétence Sens de la rue (maximum rang 2 à la création).
    - **Attitude convaincante** : 1 rang gratuit dans le talent Attitude convaincante.
  effets:
    - { sur: attribut, attribut: vigueur, operation: ajouter, valeur: 1 }
    - { sur: attribut, attribut: agilite, operation: ajouter, valeur: 2 }
    - { sur: attribut, attribut: intellect, operation: ajouter, valeur: 2 }
    - { sur: attribut, attribut: ruse, operation: ajouter, valeur: 3 }
    - { sur: attribut, attribut: volonte, operation: ajouter, valeur: 2 }
    - { sur: attribut, attribut: presence, operation: ajouter, valeur: 2 }
    - { sur: attribut, attribut: baseSeuilBlessure, operation: fixer, valeur: 10 }
    - { sur: attribut, attribut: baseSeuilStress, operation: fixer, valeur: 10 }
    - { sur: attribut, attribut: xpDepart, operation: fixer, valeur: 100 }
    - { sur: rang, entree: sens-de-la-rue, valeur: 1 }
    - { sur: rang, entree: attitude-convaincante, valeur: 1 }

- id: droide
  sorte: espece
  nom: Droïde
  description: |-
    Construits pour obéir (sécurité, médecine, réparations, pilotage), certains droïdes ont développé une conscience et une personnalité uniques. Classés en 5 catégories, de la science pure au travail manuel lourd.

    Capacités :
    - **Besoins biologiques & Implants** : N'a pas besoin de manger, dormir ou respirer ; immunisé contre les toxines et poisons. Limite d'implants cybernétiques de 6 (au lieu du score de Vigueur).
    - **Compétences de départ accrues** : Après le choix de carrière : 1 rang dans 6 des 8 compétences de carrière (au lieu de 4). Après la première spécialisation : 1 rang dans 3 compétences de spécialisation (au lieu de 2).
    - **Inorganique** : Ne bénéficie pas des cuves de bacta, stimpacks ou jets de Médecine — se répare au repos ou via des tests de Mécanique (mêmes difficultés que les soins organiques). Les patchs de réparation d'urgence remplacent les stimpacks. 1 rang gratuit dans le talent Endurant.
    - **Être mécanique** : Ne peut pas être sensible à la Force, ni acquérir une valeur de Force ou utiliser des pouvoirs de la Force. En contrepartie, immunisé contre tous les pouvoirs de la Force altérant l'esprit.
  effets:
    - { sur: attribut, attribut: vigueur, operation: ajouter, valeur: 1 }
    - { sur: attribut, attribut: agilite, operation: ajouter, valeur: 1 }
    - { sur: attribut, attribut: intellect, operation: ajouter, valeur: 1 }
    - { sur: attribut, attribut: ruse, operation: ajouter, valeur: 1 }
    - { sur: attribut, attribut: volonte, operation: ajouter, valeur: 1 }
    - { sur: attribut, attribut: presence, operation: ajouter, valeur: 1 }
    - { sur: attribut, attribut: baseSeuilBlessure, operation: fixer, valeur: 10 }
    - { sur: attribut, attribut: baseSeuilStress, operation: fixer, valeur: 10 }
    - { sur: attribut, attribut: xpDepart, operation: fixer, valeur: 175 }
    - { sur: rang, entree: endurant, valeur: 1 }

- id: gand
  sorte: espece
  nom: Gand
  description: |-
    Espèce insectoïde mystérieuse à la culture fermée et religieuse, connue pour ses « trouveurs » (findsmen), pisteurs d'élite aux méthodes rituelles. Exosquelette de chitine dense, trois doigts par main.

    Capacités :
    - **Discipline** : 1 rang gratuit dans la compétence Discipline (maximum rang 2 à la création).
    - **Respirateurs d'ammoniac** : Choisir une sous-espèce à la création : Gand sans poumons (n'a pas besoin de respirer, immunisé contre l'asphyxie mais subit les blessures du vide spatial) OU Gand avec poumons (respire de l'ammoniac, commence avec un respirateur, l'oxygène est une atmosphère dangereuse de niveau 8 — en contrepartie +10 XP de départ).
  effets:
    - { sur: attribut, attribut: vigueur, operation: ajouter, valeur: 2 }
    - { sur: attribut, attribut: agilite, operation: ajouter, valeur: 2 }
    - { sur: attribut, attribut: intellect, operation: ajouter, valeur: 2 }
    - { sur: attribut, attribut: ruse, operation: ajouter, valeur: 2 }
    - { sur: attribut, attribut: volonte, operation: ajouter, valeur: 3 }
    - { sur: attribut, attribut: presence, operation: ajouter, valeur: 1 }
    - { sur: attribut, attribut: baseSeuilBlessure, operation: fixer, valeur: 10 }
    - { sur: attribut, attribut: baseSeuilStress, operation: fixer, valeur: 10 }
    - { sur: attribut, attribut: xpDepart, operation: fixer, valeur: 100 }
    - { sur: rang, entree: discipline, valeur: 1 }
  choix:
    - id: sous-espece
      nom: "Respirateurs d'ammoniac : sous-espèce"
      nombre: 1
      parmi: { sorte: capacite, entrees: [gand-sans-poumons, gand-avec-poumons] }
      donne: { type: possession }

