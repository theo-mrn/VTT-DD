- id: lannik
  sorte: espece
  nom: Lannik
  description: |-
    Petite espèce humanoïde à la longue histoire guerrière, les Lannik sont de féroces guerriers aux compétences aiguisées, malgré leur taille réduite. Leur peau varie du rouge foncé à l'orange, en passant par le violet et le bleu foncé, et leurs oreilles larges et pointues captent les sons lointains. Leur culture valorise fortement le service militaire obligatoire et une intrépidité naturelle leur permettant de garder les idées claires dans les situations les plus dangereuses.

    Capacités :
