  nom: Sith au sang pur
  description: |-
    Race ancienne d'humanoïdes à la peau rouge à marron, ornée d'appendices sur les joues et/ou le menton. Leur société de castes rigide comprenait esclaves, ingénieurs, guerriers Massassi et magiciens Kissai, et pratiquait des rites sacrificiels avant l'arrivée des Jedi Renégats. Naturellement gauchers, un trait qui inspira la création du Lanvarok. L'espèce s'éteignit lors du conflit contre Exar Kun, qui draina l'énergie vitale des Massassi pour préserver son propre esprit.

