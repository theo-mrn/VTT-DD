- id: zeltron
  sorte: espece
  nom: Zeltron
  description: |-
    Espèce presque-humaine à la carnation rose foncée due à une réaction épidermique aux radiations de leur soleil, les Zeltrons produisent de puissantes phéromones qu'ils peuvent projeter comme défense, et possèdent un don d'empathie développé les rendant extrêmement sensibles aux émotions d'autrui. Peuple pacifique et sociable, connu pour son hospitalité et sa propension aux célébrations, il ne se montre combatif que contre ceux qui menacent sa joie de vivre.

    Capacités :
