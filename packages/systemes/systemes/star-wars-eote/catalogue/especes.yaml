- id: miraluka
  sorte: espece
  nom: Miraluka
  description: |-
    Les Miralukas sont aveugles de naissance et ne peuvent "voir" que grâce à un lien très étroit avec la Force. Là où les humains ont des yeux, ils ne présentent qu'une zone vide s'étendant sur le front, qu'ils dissimulent généralement sous des voiles, bandeaux ou masques. Ayant dû abandonner leur planète natale en raison de catastrophes géologiques récurrentes, ils se sont installés sur Alpheridies. Leur sensibilité exceptionnelle à la Force les a naturellement attirés vers les ordres Jedi et Sith.

