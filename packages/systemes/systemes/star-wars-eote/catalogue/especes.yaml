- id: trandoshan
  sorte: espece
  nom: Trandoshan
  description: |-
    Humanoïdes reptiliens belliqueux au sang froid, réputés pour leur haine féroce envers les Wookiees. Immenses griffes, vision infrarouge, écailles qui changent de couleur à la mue. Société articulée autour de la traque et de la divinité Scorekeeper.

    Capacités :
    - **Perception** : 1 rang gratuit dans la compétence Perception (maximum rang 2 à la création).
    - **Régénération** : Lors d'une récupération d'au moins une blessure par repos naturel ou cuve de bacta, soigne 1 blessure additionnelle (ne s'applique pas aux stimpacks ou premiers soins). Peut faire repousser un membre perdu (au moins un mois pour qu'il soit fonctionnel).
    - **Griffes** : Lors d'un test de corps à corps (Corps à corps) infligeant des dégâts : +1 dégât et profil de coup critique de 3 (Indice critique 3).
