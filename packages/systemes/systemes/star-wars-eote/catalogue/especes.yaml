- id: mirialan
  sorte: espece
  nom: Mirialan
  description: |-
    Les Mirialans présentent une peau brune ou verdâtre marquée de tatouages distinctifs racontant leur histoire personnelle. Espèce particulièrement croyante, dotée d'une connexion profonde à la Force, ils estiment que chaque individu traverse une période fondatrice agissant comme un voyage initiatique. Leurs tatouages, portés sur les mains et le crâne, symbolisent les épreuves surmontées. Luminara Unduli et Barriss Offee, toutes deux Jedi, comptent parmi leurs figures notables.

    Capacités :
