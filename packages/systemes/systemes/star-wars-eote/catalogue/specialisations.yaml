# Spécialisations : ouvrent leur arbre de talents, marquent « carriere » 4 compétences ;
# 2 rangs gratuits pour la première spécialisation (3 pour un droïde : @bonusChoixSpecialisation).
- id: assassin
  sorte: specialisation
  nom: Assassin
  description: "VO : Assassin. Ouvre l'arbre de talents « Assassin » ; ses quatre compétences deviennent de carrière."
  champs: { carriere: chasseur-de-primes }
  effets:
    - { sur: marque, marque: carriere, entrees: [melee, distance-lourde, magouilles, discretion] }
  choix:
    - id: rangs-de-depart
      nom: Rangs gratuits de spécialisation (première spécialisation, création)
      nombre: 2 + @bonusChoixSpecialisation
      parmi: { sorte: competence, entrees: [melee, distance-lourde, magouilles, discretion] }
      donne: { type: rang, valeur: 1 }

