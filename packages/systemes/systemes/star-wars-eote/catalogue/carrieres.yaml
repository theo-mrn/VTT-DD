# Carrières : marquent « carriere » leurs 8 compétences et leurs 3 spécialisations ;
# 4 rangs gratuits dans les compétences de carrière à la création.
- id: chasseur-de-primes
  sorte: carriere
  nom: Chasseur de primes
  description: 'VO : Bounty Hunter. Compétences de carrière et spécialisations de la carrière (marque « carriere »).'
  effets:
    - sur: marque
      marque: carriere
      entrees:
        - athletisme
        - corps-a-corps
        - perception
        - pilotage-planetaire
        - pilotage-spatial
        - distance-lourde
        - sens-de-la-rue
        - vigilance
        - assassin
        - bricoleur
        - survivaliste
  choix:
    - id: rangs-de-depart
      nom: Rangs gratuits de carrière (création)
      nombre: 4
      parmi:
        sorte: competence
        entrees:
          - athletisme
          - corps-a-corps
          - perception
          - pilotage-planetaire
          - pilotage-spatial
          - distance-lourde
          - sens-de-la-rue
          - vigilance
      donne: { type: rang, valeur: 1 }

