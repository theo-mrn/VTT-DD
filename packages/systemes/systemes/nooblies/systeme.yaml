# Nooblies Chroniques : D&D classique, dont il reprend tout (règles, combat, catalogue, voies,
# présentation), avec son propre tirage des caractéristiques. Décision du 2026-10-09 : tout ce
# qui peut l'être vient de D&D classique ; seules les différences sont déclarées ici.
format: 1
id: nooblies
version: 2.0.0
nom: Nooblies Chroniques
description: >-
  D&D classique avec le tirage de Nooblies : six caractéristiques à 1d15 + 5
  (3 paires / 3 impaires, somme des modificateurs = 6), voies de capacités,
  races et profils de D&D classique.

herite:
  de: dnd-classic

creation:
  - entite: personnage
    etapes:
      - id: caracteristiques
        description: >-
          1d15 + 5 par caractéristique, dans l'ordre, relancés tant qu'il n'y a pas
          exactement 3 valeurs paires et une somme des modificateurs de +6. Les
          modificateurs raciaux s'appliquent ensuite (effets de la race).
        formule: 1d15 + 5
