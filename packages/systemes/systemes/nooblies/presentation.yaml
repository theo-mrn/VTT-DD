# Présentation Nooblies Chroniques : même habillage que D&D classique,
# dont Nooblies reprend la structure (caractéristiques, combat, vitalité).

format: 1
systeme: nooblies

theme:
  couleurs:
    fond: '#141110'
    fondProfond: '#0a0807'
    carte: '#1c1614'
    canevas: '#0c0908'
    bordure: '#28211c'
    texte: '#e3dad4'
    texteSecondaire: '#7a706a'
    accent: '#c2956a'
    accentSurvol: '#d0ad8b'
  fond:
    type: image
    source: 'https://assets.yner.fr/Map/Village/Illustrations/Bustling_Village_il02_D_Static.webp'

images:
  humain: https://assets.yner.fr/images/races/Humain.webp
  elfe: https://assets.yner.fr/images/races/Elfe.webp
  elfe-noir: https://assets.yner.fr/images/races/Elfenoir.jpg
  nain: https://assets.yner.fr/images/races/Nain.webp
  orque: https://assets.yner.fr/images/races/Orc.webp
  halfelin: https://assets.yner.fr/images/races/Halfelin.webp
  minotaure: https://assets.yner.fr/images/races/Minotaure.webp
  drakonide: https://assets.yner.fr/images/races/Drakonide.webp
  barbare: https://assets.yner.fr/images/profiles/barbare.jpg
  barde: https://assets.yner.fr/images/profiles/Barde.jpg
  chevalier: https://assets.yner.fr/images/profiles/chevalier.jpg
  druide: https://assets.yner.fr/images/profiles/druide.webp
  ensorceleur: https://assets.yner.fr/images/profiles/ensorceleur.jpg
  guerrier: https://assets.yner.fr/images/profiles/guerrier.webp
  magicien: https://assets.yner.fr/images/profiles/magicien.webp
  moine: https://assets.yner.fr/images/profiles/moine.jpg
  pretre: https://assets.yner.fr/images/profiles/pretre.jpg
  rodeur: https://assets.yner.fr/images/profiles/rodeur.webp
  voleur: https://assets.yner.fr/images/profiles/voleur.webp

des:
  sortes:
    d6: { couleur: '#c2956a', forme: d6 }
    d12: { couleur: '#c2956a', forme: d12 }
    d20: { couleur: '#d0ad8b', forme: d20 }
  # Lanceur de dés : ordre et groupes des attributs qui déclarent `jet` dans les règles
  jets:
    - { titre: Caractéristiques, attributs: [FOR, DEX, CON, SAG, INT, CHA] }
    - { titre: Attaques et initiative, attributs: [Contact, Distance, Magie, INIT] }

ressources:
  PV: { sens: descendant, couleur: '#dc2626' }

fiches:
  personnage:
    widgets:
      # Bandeau : race, profil, puis niveau, dé de vie et initiative
      - {
          type: details,
          titre: Profil,
          sortes: [race, profil],
          attributs: [niveau, facesDeVie, INIT],
        }
      - { type: attributs, titre: Caractéristiques, groupe: caracteristiques, colonnes: 6 }
      - { type: ressources, titre: Vitalité, attributs: [PV] }
      - { type: attributs, titre: Combat, groupe: combat, colonnes: 5 }
      - {
          type: attributs,
          titre: Dé de vie,
          attributs: [facesDeVie, jetDeVie, PV_Max],
          colonnes: 3,
        }
      - { type: competences, titre: Capacités, sortes: [capacite] }
      - { type: inventaire, titre: Inventaire, sortes: [objet] }
      - { type: bonus, titre: Bonus }

# Icônes des objets de l'inventaire.
iconesObjets:
  - { sorte: objet, icone: sac }

# Ressources consultables : panneau Ressources de la table et page Ressources de l'accueil
# (docs/ressources.md). Pas de marché : le système n'a pas de catalogue d'équipement.
references:
  capacites:
    sections:
      - { titre: Races, sorte: race }
      - { titre: Profils, sorte: profil }
      - { titre: Capacités raciales, sorte: capacite }
  # Modèles de PNJ de la campagne (le système n'a pas de bestiaire de référence)
  bestiaire:
    statistiques:
      personnage:
        - { titre: Combat, attributs: [niveau, PV_Max, Defense, INIT] }
        - { titre: Attaques, attributs: [Contact, Distance, Magie] }
        - { titre: Caractéristiques, attributs: [FOR, DEX, CON, INT, SAG, CHA] }
  images:
    collections:
      - { titre: Personnages, dossiers: [Assets] }
      - { titre: Cartes, dossiers: [Map, Cartes] }
      - { titre: Photos, dossiers: [Photos] }
  # Objets à poser sur la carte (outil Objets, I) : dossiers de la bibliothèque d'actifs
  objets:
    categories:
      - { titre: Mobilier, dossiers: [objets/fourniture, items/furniture, items/decorations] }
      - { titre: Campement, dossiers: [objets/camps, objets/travel] }
      - { titre: Ferme, dossiers: [objets/farm] }
      - { titre: Marché, dossiers: [objets/marché] }
      - { titre: Conteneurs, dossiers: [items/chest, items/bag, items/barrel, items/containers] }
      - { titre: Nature, dossiers: [objets/water, items/arbre, items/fire, items/feu] }
      - { titre: Trésors, dossiers: [items/gem, items/keys] }
      - { titre: Potions, dossiers: [items/potions] }
      - { titre: Armes, dossiers: [items/arme] }
      - { titre: Armures, dossiers: [items/armure] }
      - { titre: Livres, dossiers: [items/book] }
      - { titre: Architecture, dossiers: [items/stairs, items/ladder] }
      - { titre: Véhicules, dossiers: [items/vehicles] }
      - { titre: Équipement, dossiers: [items/equipment] }
      - { titre: Macabre, dossiers: [items/dark] }
      - { titre: Divers, dossiers: [items/misc] }

# Combat (docs/combat.md § 12) : groupes du menu d'attaque
combat:
  groupes:
    - { titre: Attaques, actions: [attaque, coup-de-corne] }
