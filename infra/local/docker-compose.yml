# Infrastructure de développement local : `pnpm infra:up`
# Remplace l'émulateur Firebase. Ports publiés sur 127.0.0.1 uniquement.
name: vtt

# Images épinglées par version + digest (index multi-architecture : arm64 pour
# les Mac Apple Silicon, amd64 ailleurs). Renovate propose les mises à jour.

services:
  postgres:
    # PostgreSQL 17 + PostGIS 3.5, comme la prod. imresamu/postgis est la
    # déclinaison multi-architecture de l'image officielle postgis/postgis
    # (publiée par un de ses mainteneurs) : l'officielle n'existe qu'en amd64
    # et ne tourne pas nativement sur les Mac Apple Silicon.
    image: imresamu/postgis:17-3.5@sha256:35fe7dceda62bfe7d2965b0ba78d915ff9f901b5e0466d633ecc58421b5b5210
    environment:
      POSTGRES_USER: vtt
      POSTGRES_PASSWORD: vtt
      POSTGRES_DB: vtt
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c wal_level=logical
      -c log_min_duration_statement=250
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vtt -d vtt']
      interval: 5s
      retries: 10

  nats:
    image: nats:2.11.17-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports: ['127.0.0.1:4222:4222', '127.0.0.1:8222:8222']
    volumes: [nats-data:/data]

  valkey:
    image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'allkeys-lru',
        '--maxmemory',
        '256mb',
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes: [valkey-data:/data]

  # ── Optionnels : `pnpm dev -- --mails --observabilite` ou `--tout` ──

  mailpit:
    # Capture les e-mails livrés par Kourrier (AWS SES en cluster) : http://localhost:8025
    profiles: [mails]
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

  kourrier:
    # Service d'envoi d'e-mails, le même qu'en cluster : identity lui envoie un nom de
    # template et ses données (KOURRIER_URL), il rend infra/mails/templates/ et livre à
    # Mailpit. Les templates sont relus à chaque envoi : une modification est visible
    # au mail suivant, sans redémarrage. API : http://localhost:8090
    profiles: [mails]
    image: ghcr.io/theo-mrn/kourrier:sha-6dbf57e
    depends_on: [mailpit, valkey]
    environment:
      KOURRIER_LOG_FORMAT: text
      KOURRIER_TENANTS_FILE: /etc/kourrier/tenants.yaml
      # Base 1 de Valkey : la base 0 appartient aux services
      KOURRIER_REDIS_ADDR: valkey:6379
      KOURRIER_REDIS_DB: '1'
      KOURRIER_STORAGE_PROVIDER: filesystem
      KOURRIER_STORAGE_DIR: /templates
      KOURRIER_TEMPLATES_CACHE_TTL: 0s
      KOURRIER_TEMPLATES_DEFAULT_LOCALE: fr
      KOURRIER_MAILER_PROVIDER: smtp
      KOURRIER_MAILER_SMTP_HOST: mailpit
      KOURRIER_MAILER_SMTP_PORT: '1025'
      KOURRIER_RATE_LIMIT_PER_SECOND: '0'
    ports: ['127.0.0.1:8090:8080']
    volumes:
      - ../mails/templates:/templates:ro
      - ../mails/dev-tenants.yaml:/etc/kourrier/tenants.yaml:ro

  lgtm:
    # Collecteur OTLP + Grafana, Loki, Tempo, Prometheus en un conteneur
    # Grafana : http://localhost:3300 (admin/admin)
    profiles: [observabilite]
    image: grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
    ports: ['127.0.0.1:3300:3000', '127.0.0.1:4317:4317', '127.0.0.1:4318:4318']

volumes:
  pg-data:
  nats-data:
  valkey-data:
