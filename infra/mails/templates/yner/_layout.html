{{define "layout"}}<!doctype html>
<html lang="{{block "lang" .}}fr{{end}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}YNER{{end}}</title>
</head>
<body style="margin:0;padding:0;background:#f5f1ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;color:#222;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f1ec;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:8px;padding:32px;">
          <tr>
            <td style="font-size:16px;">
              {{template "content" .}}
            </td>
          </tr>
        </table>
        <p style="font-size:12px;color:#8a7f74;margin-top:24px;">YNER · table de jeu de rôle virtuelle · <a href="https://www.yner.fr" style="color:#8a7f74;">yner.fr</a></p>
      </td>
    </tr>
  </table>
</body>
</html>{{end}}
