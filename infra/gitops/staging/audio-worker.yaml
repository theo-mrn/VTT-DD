# Worker audio : analyse ffmpeg des envois et purge des fichiers (docs/audio.md § 3.4).
# Mis à jour par la CI (release.yml) : ne modifier que les valeurs hors image
image:
  repository: ghcr.io/theo-mrn/vtt-audio-worker
  digest: 'sha256:d2f4cd4c06f90f39d348a167d44ca47e0ee101c2ed6fb97f0a5647f617cc95a7'
  tag: 'main'
# Un réplica, deux jobs à la fois (WORKER_CONCURRENCY) ; plusieurs réplicas resteraient sûrs
# (SKIP LOCKED), mais ffmpeg est gourmand : on scale la concurrence avant les pods
replicaCount: 1
autoscaling:
  enabled: false
pdb:
  enabled: false
env:
  NODE_ENV: production
  LOG_LEVEL: info
  # Traces et métriques OTLP vers Alloy (docs/observabilite.md)
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.monitoring.svc:4318
  REDIS_URL: redis://default:$(REDIS_PASSWORD)@valkey-staging.messaging.svc:6379
  # Bus d'événements : relais d'outbox et consommateur campaign.deleted (NATS JetStream)
  NATS_URL: nats://vtt-staging:$(NATS_PASSWORD)@nats.messaging.svc:4222
  # Sondes /healthz et /readyz sur le port du conteneur
  WORKER_PORT: '3000'
  WORKER_CONCURRENCY: '2'
  AUDIO_LOUDNESS_TARGET_LUFS: '-16'
  R2_REGION: auto
  # Inutilisés par le worker mais exigés par la configuration commune du paquet
  JWT_ISSUER: https://api.staging.yner.fr/v1/auth
  JWT_AUDIENCE: vtt-api
secretEnv:
  NATS_PASSWORD: {secret: messaging-credentials, key: NATS_PASSWORD}
  REDIS_PASSWORD: {secret: messaging-credentials, key: REDIS_PASSWORD}
# Même secret que le service : DATABASE_URL, DATABASE_DIRECT_URL (LISTEN audio_jobs), S3_*
envFromSecrets:
  - name: audio-secrets
# /tmp : fichiers en cours de traitement (original, transcodage)
tmpSizeLimit: 1Gi
resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: '2', memory: 1Gi}
probes:
  liveness: /healthz
  readiness: /readyz
ingress:
  enabled: false
# Aucune requête entrante (sondes du kubelet exceptées)
networkPolicy:
  enabled: true
  allowFrom: []
migrations:
  enabled: false
