# Mis à jour par la CI (release.yml) : ne modifier que les valeurs hors image
image:
  repository: ghcr.io/theo-mrn/vtt-campaign
  digest: ''
  tag: 'main'
replicaCount: 2
env:
  NODE_ENV: production
  LOG_LEVEL: info
  REDIS_URL: redis://default:$(REDIS_PASSWORD)@valkey-staging.messaging.svc:6379
  # Bus d'événements : le relais d'outbox y publie (NATS JetStream, namespace messaging)
  NATS_URL: nats://vtt-staging:$(NATS_PASSWORD)@nats.messaging.svc:4222
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
  # Doivent correspondre exactement à la configuration de la gateway
  JWT_ISSUER: https://api.staging.yner.fr/v1/auth
  JWT_AUDIENCE: vtt-api
  JWKS_URL: http://identity.vtt-staging.svc/.well-known/jwks.json
  # Routes internes de character (engagement, initiative, durées) et profils d'identity
  CHARACTER_URL: http://character.vtt-staging.svc
  IDENTITY_URL: http://identity.vtt-staging.svc
  # Liens d'invitation <APP_URL>/join/<code>
  APP_URL: https://staging.yner.fr
  # Images des campagnes : même bucket qu'identity (dossier campaigns/). La signature des URL
  # d'envoi se calcule sur place : aucun flux réseau vers le stockage depuis le pod.
  S3_REGION: auto
  # Fichiers orphelins de ses dossiers (docs/nettoyage.md § Fichiers) : chaque autre service qui
  # garde des adresses de fichiers (même INTERNAL_API_SECRET partout) ; essai tant que les
  # journaux n'ont pas été vérifiés, puis « on »
  STORAGE_REFERENCE_URLS: http://character.vtt-staging.svc,http://identity.vtt-staging.svc,http://dice.vtt-staging.svc
  ORPHAN_SWEEP: dry-run
# Mots de passe du compte NATS STAGING et de valkey-staging (secret messaging-credentials),
# substitués dans NATS_URL et REDIS_URL : voir « Déploiement » dans docs/bus.md
secretEnv:
  NATS_PASSWORD: { secret: messaging-credentials, key: NATS_PASSWORD }
  REDIS_PASSWORD: { secret: messaging-credentials, key: REDIS_PASSWORD }
# Secret campaign-secrets (SOPS) : DATABASE_URL (rôle campaign_svc), INTERNAL_API_SECRET
# (même valeur que character), S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
# S3_PUBLIC_URL (mêmes valeurs qu'identity)
# + DATABASE_DIRECT_URL (même rôle) vers vtt-pg-rw.data.svc en direct : le LISTEN du relais
#   d'outbox ne traverse pas PgBouncer (sans elle : DATABASE_URL, réveil par le poll de 5 s)
envFromSecrets:
  - name: campaign-secrets
probes:
  liveness: /healthz
  readiness: /readyz
# Pas d'ingress : campaign n'est joignable que par la gateway (et character en interne)
ingress:
  enabled: false
networkPolicy:
  enabled: true
  allowFrom:
    # audio demande le rôle de l'appelant (/internal, secret partagé)
    - podSelector: { matchLabels: { app.kubernetes.io/name: audio } }
    - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
    # character demande les droits des campagnes (/internal, secret partagé)
    - podSelector: { matchLabels: { app.kubernetes.io/name: character } }
    # dice demande le rôle de l'appelant (/internal) et le détail d'une campagne
    - podSelector: { matchLabels: { app.kubernetes.io/name: dice } }
    # identity demande quels fichiers ses tables référencent (/internal/storage)
    - podSelector: { matchLabels: { app.kubernetes.io/name: identity } }
migrations:
  enabled: true
  image:
    repository: ghcr.io/theo-mrn/vtt-campaign-migrations
    digest: ''
    tag: 'main'
  schema: campaign
  # Secret généré par CloudNativePG pour le rôle campaign_owner
  secretName: pg-campaign-owner
