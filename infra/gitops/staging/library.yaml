# Mis à jour par la CI (release.yml) : ne modifier que les valeurs hors image
image:
  repository: ghcr.io/theo-mrn/vtt-library
  digest: 'sha256:92feb45a6686e1943cbe841d7f4bfeb1be814dd6b42562b3cf64da47efe08cf6'
  tag: 'main'
# Une réplique (mémoire du cluster), sans budget de disruption qui bloquerait le drainage d'un nœud
replicaCount: 1
deploymentLabels:
  sablier.enable: 'true'
  sablier.group: vtt-staging
pdb:
  enabled: false
env:
  NODE_ENV: production
  LOG_LEVEL: info
  # Traces et métriques OTLP vers Alloy (docs/observabilite.md)
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.monitoring.svc:4318
  REDIS_URL: redis://default:$(REDIS_PASSWORD)@valkey-staging.messaging.svc:6379
  # Doivent correspondre exactement à la configuration de la gateway
  JWT_ISSUER: https://api.staging.yner.fr/v1/auth
  JWT_AUDIENCE: vtt-api
  JWKS_URL: http://identity.vtt-staging.svc/.well-known/jwks.json
# Mot de passe de valkey-staging (secret messaging-credentials), substitué dans REDIS_URL
secretEnv:
  REDIS_PASSWORD: {secret: messaging-credentials, key: REDIS_PASSWORD}
# Secret library-secrets (seal-library.sh) : DATABASE_URL (rôle library_svc)
envFromSecrets:
  - name: library-secrets
probes:
  liveness: /healthz
  readiness: /readyz
# Pas d'ingress : library n'est joignable que par la gateway
ingress:
  enabled: false
networkPolicy:
  enabled: true
  allowFrom:
    - podSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
migrations:
  enabled: true
  image:
    repository: ghcr.io/theo-mrn/vtt-library-migrations
    digest: 'sha256:ef886e26a0754d75dc43dc04e7f680dfa7f6a86751bf63af5d75bf51b54bb348'
    tag: 'main'
  schema: library
  # Secret du rôle library_owner (seal-library.sh)
  secretName: pg-library-owner
