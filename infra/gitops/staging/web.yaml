image:
  repository: ghcr.io/theo-mrn/vtt-web
  digest: 'sha256:ad80020f9fd99e3821defa2b37b30ea9d25275ec964d9b6bea04f900d9569f31'
  tag: 'main'
# Staging : une réplique (mémoire du cluster), sans budget de disruption qui bloquerait
# le drainage d'un nœud
replicaCount: 1
pdb:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 768Mi}
env:
  NODE_ENV: production
# Pas de secret : le front ne parle qu'à la gateway (/v1, même origine)
probes:
  liveness: /healthz
  readiness: /healthz
writablePaths:
  - /app/frontend/.next/cache
ingress:
  enabled: true
  host: staging.yner.fr
  # API et temps réel sur le même hôte, envoyés par Traefik à la gateway : le serveur Next ne
  # relaie pas l'upgrade WebSocket de ses réécritures, et les cookies restent sur la même origine
  extraPaths:
    - {path: /v1, service: gateway}
  # Bouncer CrowdSec : hote expose publiquement. Traefik interroge le bouncer
  # a chaque requete (forwardAuth) et renvoie 403 si l'IP porte une decision.
  middlewares:
    - crowdsec-crowdsec-appsec@kubernetescrd
