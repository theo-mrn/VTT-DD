image:
  repository: ghcr.io/theo-mrn/vtt-web
  digest: 'sha256:2696bca9b5b0b956a9c344f22c28a382c7636ecce157fca6d9c6f97853bcf5a5'
  tag: 'main'
# Staging : une réplique (mémoire du cluster), sans budget de disruption qui bloquerait
# le drainage d'un nœud
replicaCount: 1
deploymentLabels:
  sablier.enable: 'true'
  sablier.group: vtt-staging
pdb:
  enabled: false
resources:
  requests: {cpu: 25m, memory: 256Mi}
  limits: {memory: 768Mi}
env:
  NODE_ENV: production
# Pas de secret : le front ne parle qu'à la gateway (/v1, même origine)
probes:
  liveness: /healthz
  readiness: /healthz
writablePaths:
  - /app/frontend/.next/cache
ingress:
  enabled: true
  host: staging.yner.fr
  # API et temps réel sur le même hôte, envoyés par Traefik à la gateway : le serveur Next ne
  # relaie pas l'upgrade WebSocket de ses réécritures, et les cookies restent sur la même origine
  extraPaths:
    - {path: /v1, service: gateway}
  # Bouncer CrowdSec : hote expose publiquement. Traefik interroge le bouncer
  # a chaque requete (forwardAuth) et renvoie 403 si l'IP porte une decision.
  middlewares:
    - vtt-staging-sablier-web@kubernetescrd
# DESACTIVE : le WAF renvoyait 403 sur la navigation normale du site.
# Le CRS est generique et reagit aux payloads applicatifs riches de VTT
# (JSON de map, contenu de chat). A reprendre en analysant d'abord
# quelles regles se declenchent, avant de rebrancher.
# - crowdsec-crowdsec-appsec@kubernetescrd
