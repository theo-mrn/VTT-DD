# Mis à jour par la CI (release.yml) : ne modifier que les valeurs hors image
image:
  repository: ghcr.io/theo-mrn/vtt-billing
  digest: 'sha256:d5e936d5e34e28ae426286665b33f0f10d54c5a0d725e3324ab7d89bf4df135e'
  tag: 'main'
# Staging : une réplique (mémoire du cluster), sans budget de disruption qui bloquerait
# le drainage d'un nœud
replicaCount: 1
pdb:
  enabled: false
env:
  NODE_ENV: production
  LOG_LEVEL: info
  # Traces et métriques OTLP vers Alloy (docs/observabilite.md)
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.monitoring.svc:4318
  REDIS_URL: redis://default:$(REDIS_PASSWORD)@valkey-staging.messaging.svc:6379
  # Doivent correspondre exactement à la configuration de la gateway
  JWT_ISSUER: https://api.staging.yner.fr/v1/auth
  JWT_AUDIENCE: vtt-api
  JWKS_URL: http://identity.vtt-staging.svc/.well-known/jwks.json
  # Retours de Stripe Checkout (/paiement/succes, /paiement/annule) et du portail
  APP_URL: https://staging.yner.fr
  # E-mails de paiement envoyés par Kourrier (namespace kourrier), avec la clé
  # KOURRIER_API_KEY du secret ci-dessous. Templates : infra/mails/templates/yner/.
  KOURRIER_URL: http://kourrier.kourrier.svc:8080
  # Bus d'événements : droits publiés pour dice et identity (billing.entitlements_changed)
  NATS_URL: nats://vtt-staging:$(NATS_PASSWORD)@nats.messaging.svc:4222
# Mots de passe du compte NATS STAGING et de valkey-staging (secret messaging-credentials),
# substitués dans NATS_URL et REDIS_URL :
# voir « Déploiement » dans docs/bus.md
secretEnv:
  NATS_PASSWORD: {secret: messaging-credentials, key: NATS_PASSWORD}
  REDIS_PASSWORD: {secret: messaging-credentials, key: REDIS_PASSWORD}
# Secret billing-secrets (SOPS) :
#   DATABASE_URL             rôle billing_svc
#   KOURRIER_API_KEY         kr_… du tenant yner (même clé qu'identity)
#   STRIPE_SECRET_KEY        rk_live_… (clé restreinte) : le staging encaisse en live (2026-10-06)
#   DATABASE_DIRECT_URL      même rôle vers vtt-pg-rw.data.svc en direct (LISTEN du relais
#                            d'outbox, hors PgBouncer ; sans elle : réveil par le poll de 5 s)
#   STRIPE_WEBHOOK_SECRET    whsec_… de l'endpoint https://api.staging.yner.fr/v1/billing/webhook
# Prix : `catalog:sync --apply` avec la même clé ; événements de l'endpoint : docs/paiement.md
envFromSecrets:
  - name: billing-secrets
probes:
  liveness: /healthz
  readiness: /readyz
# Pas d'ingress : billing n'est joignable que par la gateway (webhook Stripe compris)
ingress:
  enabled: false
networkPolicy:
  enabled: true
  allowFrom:
    - podSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
  # Sortie HTTPS (443) vers api.stripe.com : déjà ouverte par le chart (Internet
  # public hors plages privées ; une NetworkPolicy ne filtre pas par nom de domaine).
  # Kourrier : envoi des e-mails (la NetworkPolicy du namespace kourrier autorise
  # billing en retour, dans argocd_registry)
  extraEgress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kourrier}}}]
      ports: [{port: 8080}]
migrations:
  enabled: true
  image:
    repository: ghcr.io/theo-mrn/vtt-billing-migrations
    digest: 'sha256:c176005740a0993872800e746f7a6611079a8bf2b3960091ddc063360ddb119b'
    tag: 'main'
  schema: billing
  # Secret généré par CloudNativePG pour le rôle billing_owner
  secretName: pg-billing-owner
