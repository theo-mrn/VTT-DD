# Mis à jour par la CI (release.yml) : ne modifier que les valeurs hors image
image:
  repository: ghcr.io/theo-mrn/vtt-dice
  digest: 'sha256:dc2695b5a2f76664e26cb379dbc59b60ee45513cf025eb1af7e8a9848cbce531'
  tag: 'main'
# Staging : une réplique (mémoire du cluster), sans budget de disruption qui bloquerait
# le drainage d'un nœud
replicaCount: 1
pdb:
  enabled: false
env:
  NODE_ENV: production
  LOG_LEVEL: info
  # Traces et métriques OTLP vers Alloy (docs/observabilite.md)
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.monitoring.svc:4318
  REDIS_URL: redis://default:$(REDIS_PASSWORD)@valkey-staging.messaging.svc:6379
  # Bus d'événements : le relais d'outbox y publie (NATS JetStream, namespace messaging)
  NATS_URL: nats://vtt-staging:$(NATS_PASSWORD)@nats.messaging.svc:4222
  # Doivent correspondre exactement à la configuration de la gateway
  JWT_ISSUER: https://api.staging.yner.fr/v1/auth
  JWT_AUDIENCE: vtt-api
  JWKS_URL: http://identity.vtt-staging.svc/.well-known/jwks.json
  # Rôle de l'appelant, système et personnage incarné (campaign), fiche des personnages
  # (character), noms et avatars des lanceurs sans personnage (identity)
  CAMPAIGN_URL: http://campaign.vtt-staging.svc
  CHARACTER_URL: http://character.vtt-staging.svc
  IDENTITY_URL: http://identity.vtt-staging.svc
  # Jets par minute : par IP, et par utilisateur (compté en base)
  RATE_LIMIT_ROLLS_MAX: '120'
  RATE_LIMIT_ROLLS_PER_USER: '60'
# Mots de passe du compte NATS STAGING et de valkey-staging (secret messaging-credentials),
# substitués dans NATS_URL et REDIS_URL : voir « Déploiement » dans docs/bus.md
secretEnv:
  NATS_PASSWORD: {secret: messaging-credentials, key: NATS_PASSWORD}
  REDIS_PASSWORD: {secret: messaging-credentials, key: REDIS_PASSWORD}
# Secret dice-secrets (SOPS) : DATABASE_URL (rôle dice_svc), INTERNAL_API_SECRET (même valeur
# que campaign et character)
# + DATABASE_DIRECT_URL (même rôle) vers vtt-pg-rw.data.svc en direct : le LISTEN du relais
#   d'outbox ne traverse pas PgBouncer (sans elle : DATABASE_URL, réveil par le poll de 5 s)
envFromSecrets:
  - name: dice-secrets
probes:
  liveness: /healthz
  readiness: /readyz
# Pas d'ingress : dice n'est joignable que par la gateway (et character en interne)
ingress:
  enabled: false
networkPolicy:
  enabled: true
  allowFrom:
    - podSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
    # Bot de dés Discord : jetons délégués et appels au nom du joueur (docs/discord.md)
    - podSelector: {matchLabels: {app.kubernetes.io/name: discord}}
    # character transmet les jets d'action (/internal/rolls, secret partagé)
    - podSelector: {matchLabels: {app.kubernetes.io/name: character}}
    # campaign et identity demandent quels fichiers ses tables référencent
    - podSelector: {matchLabels: {app.kubernetes.io/name: campaign}}
    - podSelector: {matchLabels: {app.kubernetes.io/name: identity}}
migrations:
  enabled: true
  image:
    repository: ghcr.io/theo-mrn/vtt-dice-migrations
    digest: 'sha256:8fc5eee8341bffe636e81f3329b4aaba25d4885b5dd4eefbbd73b4574757d7c3'
    tag: 'main'
  schema: dice
  # Secret généré par CloudNativePG pour le rôle dice_owner
  secretName: pg-dice-owner
