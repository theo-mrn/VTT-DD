image:
  repository: ghcr.io/theo-mrn/vtt-web
  digest: 'sha256:3fadb4f57b26e38479bfb01a6c9303557b690b22953db959546cbf7e9066caa4'
  tag: 'main'
# Prod (comme le staging pour l'instant) : une réplique (mémoire du cluster), sans budget de disruption qui bloquerait
# le drainage d'un nœud
replicaCount: 1
pdb:
  enabled: false
resources:
  requests: {cpu: 25m, memory: 256Mi}
  limits: {memory: 768Mi}
env:
  NODE_ENV: production
# Pas de secret : le front ne parle qu'à la gateway (/v1, même origine)
probes:
  liveness: /healthz
  readiness: /healthz
writablePaths:
  - /app/frontend/.next/cache
ingress:
  enabled: true
  host: app.yner.fr
  # Uniquement par le tunnel Cloudflare (argocd_registry, docs/decisions/entree-tunnel-cloudflare.md).
  # Accès direct coupé le 2026-10-18 : par l'IP du master, cet hôte répond 404, ce qui empêche de
  # contourner Cloudflare. Retour arrière : direct: true AVANT de remettre le DNS sur l'IP.
  tunnel: true
  direct: false
  # API et temps réel sur le même hôte, envoyés par Traefik à la gateway : le serveur Next ne
  # relaie pas l'upgrade WebSocket de ses réécritures, et les cookies restent sur la même origine
  extraPaths:
    - {path: /v1, service: gateway}
  # Bouncer CrowdSec : hote expose publiquement. Traefik interroge le bouncer
  # a chaque requete (forwardAuth) et renvoie 403 si l'IP porte une decision.
  middlewares:
    - crowdsec-crowdsec-appsec@kubernetescrd
