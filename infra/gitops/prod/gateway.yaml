# Mis à jour par la CI (release.yml) : ne modifier que les valeurs hors image
image:
  repository: ghcr.io/theo-mrn/vtt-gateway
  digest: ''
  tag: 'main'
replicaCount: 2
env:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGINS: https://yner.fr
  REDIS_URL: redis://valkey.messaging.svc:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
  JWT_ISSUER: https://api.yner.fr/v1/auth
  JWT_AUDIENCE: vtt-api
  JWKS_URL: http://identity.vtt-prod.svc/.well-known/jwks.json
  UPSTREAM_IDENTITY_URL: http://identity.vtt-prod.svc
  UPSTREAM_CHARACTER_URL: http://character.vtt-prod.svc
  UPSTREAM_CAMPAIGN_URL: http://campaign.vtt-prod.svc
  UPSTREAM_DICE_URL: http://dice.vtt-prod.svc
  # Paiements Stripe ; /v1/billing/webhook passe sans jeton (signature vérifiée par billing)
  UPSTREAM_BILLING_URL: http://billing.vtt-prod.svc
  # Temps réel : WebSocket Socket.IO (/v1/realtime/socket.io), jeton vérifié par realtime
  UPSTREAM_REALTIME_URL: http://realtime.vtt-prod.svc
  # Journal d'historique : timeline d'une campagne, vérification de la chaîne de hash
  UPSTREAM_HISTORY_URL: http://history.vtt-prod.svc
ingress:
  enabled: true
  # Connexions WebSocket longues (realtime)
  websocket: true
  host: api.yner.fr
networkPolicy:
  enabled: true
autoscaling:
  enabled: true
