# Mis à jour par la CI (release.yml) : ne modifier que les valeurs hors image
image:
  repository: ghcr.io/theo-mrn/vtt-character
  digest: ''
  tag: 'main'
replicaCount: 2
env:
  NODE_ENV: production
  LOG_LEVEL: info
  REDIS_URL: redis://valkey.messaging.svc:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4318
  # Doivent correspondre exactement à la configuration de la gateway
  JWT_ISSUER: https://api.yner.fr/v1/auth
  JWT_AUDIENCE: vtt-api
  JWKS_URL: http://identity.vtt-prod.svc/.well-known/jwks.json
# Secret character-secrets (SOPS) : DATABASE_URL (rôle characters_svc)
envFromSecrets:
  - name: character-secrets
probes:
  liveness: /healthz
  readiness: /readyz
# Pas d'ingress : character n'est joignable que par la gateway
ingress:
  enabled: false
networkPolicy:
  enabled: true
  allowFrom:
    - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
migrations:
  enabled: true
  image:
    repository: ghcr.io/theo-mrn/vtt-character-migrations
    digest: ''
    tag: 'main'
  # Schéma « characters » : CHARACTER est un mot réservé SQL
  schema: characters
  # Secret généré par CloudNativePG pour le rôle characters_owner
  secretName: pg-characters-owner
