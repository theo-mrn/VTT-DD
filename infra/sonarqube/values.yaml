# Chart officiel sonarqube (infra/argocd/sonarqube.yaml), édition Community Build.
# Secrets à créer avant la première synchronisation : voir docs/ci.md (« SonarQube »).
community:
  enabled: true
  buildNumber: '26.9.0.129388'

# Sonde de santé du chart : sans ce code, le pod n'est jamais prêt
monitoringPasscodeSecretName: sonarqube-monitoring
monitoringPasscodeSecretKey: passcode

# Base externe : le cluster CloudNativePG du namespace (infra/cluster/sonarqube/postgres.yaml)
jdbcOverwrite:
  enabled: true
  jdbcUrl: jdbc:postgresql://sonarqube-pg-rw.sonarqube.svc:5432/sonarqube
  jdbcUsername: sonarqube
  jdbcSecretName: sonarqube-pg-app
  jdbcSecretPasswordKey: password

# Elasticsearch embarqué : vm.max_map_count ≥ 524288 est posé sur le nœud (docs/ci.md), pas
# par un conteneur d'init privilégié
initSysctl:
  enabled: false

persistence:
  enabled: true
  size: 10Gi

resources:
  requests: { cpu: 500m, memory: 3Gi }
  limits: { cpu: '2', memory: 4Gi }

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
  hosts:
    - name: sonar.yner.fr
      path: /
      pathType: Prefix
  tls:
    - secretName: sonarqube-tls
      hosts: [sonar.yner.fr]

tests:
  enabled: false
