# Base de SonarQube : un petit cluster CloudNativePG à part, hors de vtt-pg (les données de
# l'app ne partagent rien avec l'outillage). Une instance : l'historique des analyses se
# reconstruit en relançant la CI, pas besoin de réplicas ni de sauvegarde.
# Secret créé par l'opérateur : sonarqube-pg-app (username, password), lu par le chart.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarqube-pg
  namespace: sonarqube
spec:
  instances: 1
  # PostgreSQL 17.11 (image standard de CloudNativePG), épinglée par digest
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-bookworm@sha256:61207ab4e051645dcb9901e1ec9358b01e4adb45624cb4425be1eab27eac6508
  bootstrap:
    initdb:
      database: sonarqube
      owner: sonarqube
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
