# SonarQube Community Build (analyse du code de la CI) et sa base. « baseline » : l'image
# SonarQube tourne sans root, mais son Elasticsearch embarqué n'est pas vérifié « restricted ».
apiVersion: v1
kind: Namespace
metadata:
  name: sonarqube
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    # Jamais supprimé par Argo CD : il emporterait la base et l'historique des analyses
    argocd.argoproj.io/sync-options: Prune=false
