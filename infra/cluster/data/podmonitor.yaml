# Métriques de la base (exporteur CloudNativePG, port metrics 9187) et de PgBouncer (9127),
# lues par Prometheus. kube-prometheus-stack ne surveille que les PodMonitor étiquetées
# release=kube-prometheus-stack : celle générée par CNPG (enablePodMonitor) ne l'était pas.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vtt-pg-metrics
  namespace: data
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: vtt-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vtt-pg-pooler
  namespace: data
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/poolerName: vtt-pg-pooler
  podMetricsEndpoints:
    - port: metrics
