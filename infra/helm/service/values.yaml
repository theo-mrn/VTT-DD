# Valeurs par défaut ; chaque service les surcharge dans infra/gitops/<env>/<service>.yaml
nameOverride: ''

image:
  repository: ghcr.io/theo-mrn/vtt-gateway
  # Toujours déployé par digest (immuable, signé) ; le tag n'est qu'indicatif
  digest: ''
  tag: 'latest'
  pullPolicy: IfNotPresent

replicaCount: 2
containerPort: 3000

env: {}
# Secrets (générés par SOPS/Sealed Secrets ou par CloudNativePG)
envFromSecrets: []
#  - name: gateway-secrets
# Variables lues une à une dans un Secret, déclarées avant `env` : une valeur de `env` peut les
# reprendre avec $(NOM) (substitution Kubernetes), ex. un mot de passe dans une URL
secretEnv: {}
#  NATS_PASSWORD: { secret: messaging-credentials, key: NATS_PASSWORD }

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: traefik
  host: ''
  path: /
  # Résolveur ACME de Traefik (certificats Let's Encrypt)
  certResolver: letsencrypt
  # Autres chemins du même hôte vers un service du namespace : [{ path: /v1, service: gateway }]
  extraPaths: []
  # true pour realtime (WebSocket) : désactive le timeout de lecture côté Traefik
  websocket: false

networkPolicy:
  enabled: true
  # Namespaces de Traefik (entrée publique) et de Prometheus (métriques)
  ingressNamespace: traefik
  monitoringNamespace: monitoring
  # Ports sortants supplémentaires vers Internet (ex. 587 pour le SMTP)
  extraEgressPorts: []
  # Namespaces autorisés à appeler ce service (en plus de l'ingress)
  allowFrom: []
  #  - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }

# Migrations Liquibase (hook Argo CD PreSync), pour les services qui ont une base
migrations:
  enabled: false
  image:
    repository: ''
    digest: ''
    tag: 'main'
  # Endpoint en écriture du cluster CloudNativePG
  jdbcUrl: 'jdbc:postgresql://vtt-pg-rw.data.svc:5432/vtt'
  schema: ''
  # Secret CNPG du rôle <schéma>_owner (clés username / password)
  secretName: ''

# Tâches planifiées (remplacent les crons Vercel) : appellent une route du service
# avec Authorization: Bearer $CRON_SECRET, via le Service interne.
cronJobs: {}
#  session-reminder:
#    schedule: '0 8 * * *'
#    path: /api/session-reminder
# Image utilisée par les CronJob ci-dessus
cronImage: 'curlimages/curl:8.11.1'

# Taille de /tmp (emptyDir) : 64Mi par défaut ; le worker audio y traite ses fichiers
tmpSizeLimit: 64Mi

# Chemins inscriptibles en plus de /tmp (le système de fichiers racine est en lecture seule)
writablePaths: []
#  - /app/frontend/.next/cache

probes:
  liveness: /healthz
  readiness: /readyz

# Temps laissé à Traefik pour retirer le pod avant l'arrêt (cf. start() dans @vtt/platform)
terminationGracePeriodSeconds: 30

serviceMonitor:
  enabled: false
