{{- if .Values.ingress.enabled }}
# Certificat Let's Encrypt par le résolveur ACME de Traefik (challenge HTTP-01 sur l'entrypoint
# web) : pas de cert-manager sur le cluster, pas de Secret TLS à gérer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "svc.name" . }}
  labels: {{- include "svc.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ .Values.ingress.certResolver }}
    {{- with .Values.ingress.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* Chemins confiés à un autre service du namespace (ex. /v1 → gateway) */}}
          {{- range .Values.ingress.extraPaths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .service }}
                port: { name: http }
          {{- end }}
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "svc.name" . }}
                port: { name: http }
{{- end }}
