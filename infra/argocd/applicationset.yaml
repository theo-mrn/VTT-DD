# Une Application Argo CD par (environnement × service), générée depuis les
# fichiers infra/gitops/<env>/<service>.yaml. La CI ne touche jamais le
# cluster : elle met à jour le digest dans ces fichiers, Argo CD synchronise.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vtt-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - git:
        repoURL: https://github.com/theo-mrn/VTT-DD.git
        revision: main
        files:
          - path: infra/gitops/*/*.yaml
  template:
    metadata:
      name: 'vtt-{{ index .path.segments 2 }}-{{ .path.filenameNormalized | trimSuffix ".yaml" }}'
    spec:
      project: vtt
      sources:
        - repoURL: https://github.com/theo-mrn/VTT-DD.git
          targetRevision: main
          path: infra/helm/service
          helm:
            releaseName: '{{ .path.filenameNormalized | trimSuffix ".yaml" }}'
            valueFiles:
              - '$values/{{ .path.path }}/{{ .path.filename }}'
        - repoURL: https://github.com/theo-mrn/VTT-DD.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: 'vtt-{{ index .path.segments 2 }}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 5
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
