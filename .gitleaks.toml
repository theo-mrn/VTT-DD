# Règles par défaut de gitleaks, plus des exceptions. Gitleaks 8.24 (celui de la CI) ne lit que
# la forme [allowlist] : une seule liste, chaque entrée suffit (chemins OU lignes).
[extend]
useDefault = true

[allowlist]
description = "Faux positifs connus"
# Secrets scellés (Sealed Secrets) : valeurs chiffrées, lisibles par le seul cluster
paths = ['''infra/cluster/secrets/staging/[^/]+\.yaml$''']
regexTarget = "line"
regexes = [
  # Secrets factices des tests (« secret-… »)
  '''=\s*['"]secret[-_a-zA-Z0-9]*['"]''',
  '''['"]secret-interne-de-test-[0-9a-f]+['"]''',
  # Clé publique d'une application Discord (signature des interactions) : publique par nature
  '''^\s*DISCORD_PUBLIC_KEY:\s*'[0-9a-f]{64}'\s*$''',
]
