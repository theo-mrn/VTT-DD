# Règles par défaut de gitleaks, plus une exception : les secrets factices des tests
# (« secret-… »), seulement dans les fichiers de test
[extend]
useDefault = true

[[allowlists]]
description = "Secrets factices des tests"
condition = "AND"
paths = ['''\.test\.tsx?$''', '''(^|/)src/test/''']
regexTarget = "line"
regexes = ['''=\s*['"]secret[-_a-zA-Z0-9]*['"]''']

# Gitleaks 8.24 (celui de la CI) ne lit que la forme [allowlist] ; les [[allowlists]] sont plus récentes
[allowlist]
description = "Secrets scellés (Sealed Secrets) : valeurs chiffrées, lisibles par le seul cluster"
paths = ['''infra/cluster/secrets/staging/[^/]+\.yaml$''']
